  test_steps: 5

  # 2026-07-26: 0 -> 2000. The holdout was a conveyor belt, not a ruler:
  # holdout_capacity 2000 with ~159 new rows/iter turns the set over COMPLETELY
  # every ~13 iterations, so any test_* comparison spanning longer compares two
  # different measuring sticks. That is the mechanism behind audit G4/J2 and
  # behind best-model tracking being dead since iter 286 (it adopted the worse
  # of two rulers ~0.3 nats apart). Freezing at 2000 makes successive test_*
  # readings comparable to each other.
  #
  # KNOWN COST: a frozen holdout AGES. The replay window turns over ~daily, so
  # the frozen rows drift out of distribution and the train/holdout gap widens
  # for reasons that are not overfitting. Accepted trade — the gap's TREND stays
  # useful even though its ABSOLUTE value stops being interpretable. Kill rule
  # (ledger): gap widening >0.5 nats within 30 iters means re-freeze
  # periodically instead. Read at trial construction, so a revert needs a
  # restart. NOT yet persisted across restarts — each restart re-freezes a new
  # set, which is still far better than every 13 iterations.
  freeze_holdout_at: 2000
  reset_holdout_on_drift: false
  # DELETED drift_threshold: 0.0 independently disables the branch ([tune/trainable.py] needs
  #   >0.0) and reset_holdout_on_drift is false too; consumer default matches
  #   ([tune/trial_config.py] .get(...,0.0)). Resolves unchanged at 0.0
  drift_sample_size: 128

  # Binary dimensions: keep pinned during small-model search.
  search_smolgen: false
  search_nla: false
  search_optimizer: false
  # DELETED search_optimizer_choices: read at [tune/harness.py] but only under the
  #   search_optimizer gate, which is false -- and the value is inert even if that gate opens:
  #   cosmos_fast is not in the allowed set ['nadamw','adamw','muon','aurora','soap'], so it filters
  #   to empty and BOTH ['cosmos_fast'] and the argparse default None return that same allowed list.
  #   DRIFT: resolves to None

  # Expanded PB2 search: opponent_strength stagnated at ~18.7 for 80+ iters
  # with only lr + w_wdl searched. Open up more dimensions to break plateau.
  #
  # Only pb2_bounds_* keys present here are searched; everything else is pinned.
  pb2_bounds_lr: [0.00003, 0.00003]  # 2026-07-26: repinned 0.0003 -> 3e-5 with train.lr for the boot512 restart.
  # WARNING — THIS KEY OVERRIDES `train.lr`, IT DOES NOT BOUND IT.
  # _build_mutation_param_space (tune/harness.py) does
  #     param_space = {**base_config}; param_space[name] = tune.uniform(*bounds)
  # so a degenerate [x, x] range REPLACES the flattened train.lr with x for
  # every new trial. On 2026-07-26 the boot512 restart was launched with
  # train.lr 3e-5 and the trial still came up at lr=0.0003 from this line;
  # only the warm-start guard (trainable_init.guard_warm_start_lr) caught it.
  # Change both together, always. Prior: 2026-07-02 re-pinned at 0.0003
  # (flat-LR revert; scheduler bounds hotpatch on resume).
