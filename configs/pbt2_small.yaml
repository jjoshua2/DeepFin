  eval_sf_nodes: 500
  eval_mcts_simulations: 32
  holdout_fraction: 0.02
  holdout_capacity: 2000
  test_steps: 5
  # ============================================================================
  # ADDED (5 keys) -- THE ERA-FORGETTING PROBE PAIR (PR #315, MERGED 2026-08-03).
  # ============================================================================
  # chess_anti_engine/eval/era_probe.py. All 5 are in config_yaml.py's TUNE allowlist on
  # origin/main (lines 261-262). This is the leading indicator the 07-31 run did not have:
  # the -48.6 Elo slide happened behind flat columns, and the forgetting hinge (decay onset
  # tracking each set's window-EXIT iteration) is the signal that WAS there.
  #
  # ⚑ ARMING ORDER, AND IT IS NOT THE BRIEF'S ORDER. The brief says "restart onto this code,
  # only THEN add the 5 keys". That is right about the VALIDATOR (an unknown key rejects the
  # whole live reload of a RUNNING process) and wrong about the EFFECT: era_probe_path /
  # _inwindow_path / _rows are CONSTRUCTION-ONLY (trainable_init._init_era_probes runs once
  # per trial process; trainable_config_ops classifies them as construction-only on purpose,
  # because a probe added by a live edit yields a column whose early rows are nan and whose
  # later rows are a different measurement, with nothing marking the seam). Adding them AFTER
  # the restart therefore arms NOTHING until the restart after that. The correct order is:
  #   1. build both sets with scripts/build_era_probe_set.py (BEFORE start -- see below)
  #   2. put these 5 keys in the yaml
  #   3. restart onto merged origin/main, which defines them, so startup validation passes
  # This is safe to get wrong in one direction only: load_probe_set NEVER RAISES. A missing
  # or malformed set prints a reason and costs the run nothing but the column
  # (trainable_init.py:719-721). So a bad path degrades to "no probe", never to a crash.
  #
  # BUILD BOTH LEGS FROM THE PRE-PAUSE WINDOW, BEFORE THE RESTART:
  #   PYTHONPATH=. python3 scripts/build_era_probe_set.py \
  #     --shard-dir runs/pbt2_small/tune/<trial>/replay_shards \
  #     --oldest 40 --rows 2048 --label era --out data/era_probe/era_20260804.npz
  #   PYTHONPATH=. python3 scripts/build_era_probe_set.py \
  #     --shard-dir runs/pbt2_small/tune/<trial>/replay_shards \
  #     --newest 40 --rows 2048 --label inwindow --out data/era_probe/inwindow_20260804.npz
  # ⚑ UNDER FRESH-WINDOW REGENERATION THE "inwindow" LEG'S NAME LIES ON DAY 1. A fresh window
  # has no shards at restart, so the newest-40 cut necessarily comes from the OLD lineage and
  # is out-of-window from iteration 1. It is then the MOST-RECENTLY-EXITED leg, not an
  # in-window leg, and probe_gap_* measures decay ORDERING by age rather than the in-window
  # vs out-of-window contrast the column name promises. See open_decisions.md decision 4.
  # ⚑ Only probe_gap_*'s TREND is interpretable, never its LEVEL. probe_era_* reads in-window
  # memorisation until those shards exit; the hinge is the TURN at window-exit, and pre-exit
  # is baseline, not signal.
  # ⚑ Shard indices COLLIDE across lineages -- never join probe provenance by basename.
  # The set FREEZES after generation (same convention as build_audit_set.py). Re-cutting the
  # ERA leg mid-run silently re-rules a column whose header was fixed on row 1.
  # Named CONCRETELY, not left at "". "" is the OFF value, and an OFF probe is
  # indistinguishable from a forgotten one. Naming the paths makes the startup line an
  # observation that can FAIL: `[probe] era set loaded: path=... rows=... digest=...` on
  # success, `[probe] era: no probe set at <p>` if the build step was skipped.
  era_probe_path: /home/josh/projects/chess/data/era_probe/era_20260804.npz
  era_probe_inwindow_path: /home/josh/projects/chess/data/era_probe/inwindow_20260804.npz
  era_probe_rows: 2048          # construction-only, like the two paths above
  era_probe_interval: 1         # LIVE-RELOADABLE; <= 0 disables scoring (sets stay loaded,
