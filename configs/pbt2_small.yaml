  lr: 0.00003       # PRIOR 0.0003 — 2026-07-02: REVERTED 0.0001→0.0003 — flat-lower-LR verdict: UNREADABLE (throughput triple landed the same day, perfect confound) and the known-good anchors (49.6/51.5/72.4 @ckpt457) were earned at 0.0003 sqrt_release; return-to-known-good bundle. PB2-pinned: changing needs the experiment_state JSON edit + restart (see memory/ledger). Base LR; Aurora matrix params use matrix_lr_multiplier.
  batch_size: 512   # Aurora/arc-split run matches offline probe batch size; fits VRAM on 5090.
  train_steps: 800  # Raised for 2M buffer; window_fraction gives ~781 steps at full size.
  train_window_fraction: 0.04  # Train on 4% of active replay cap; slow replay growth limits extra reuse while refilling.
  # 2026-07-27: 2.5 -> 5.0, PAIRED with the replay-loader fix below. THE BET:
  # the loop is gradient-STARVED, not unstable. Whole trial to iter 123 =
  # 6,253 optimizer steps / 3.2M samples = 0.53% of a 600M AlphaZero-scale
  # budget, and the GPU computed gradients for 3.0% of wall clock. Steps are
  # EXACTLY views-capped (trainer_steps_done x 512 / replay_positions_ingested
  # = 2.502-2.552 on every row), so this key, not the loader, is what sets
  # gradient volume -- the loader fix only makes each step ~3.9x cheaper
  # (2920 -> ~756 ms) so this raise costs LESS wall clock than 2.5 did:
  # ~88 steps/iter in ~66s, vs 44 steps in 129s. DOUBLE the gradient at HALF
  # the training wall clock.
  # WHY 5.0 AND NOT HIGHER. The loader could now feed ~15 views, and an earlier
  # draft of this line set 7.5 on the argument that our value/policy targets are
  # GROUND TRUTH from a fixed external SF (never stale, so the reuse ceiling is
  # OVERFITTING rather than target staleness). That argument is right about the
  # mechanism and wrong about the conclusion: it identifies overfitting as the
  # binding constraint and then ignores it. AlphaZero ~1, KataGo ~4 -- those are
  # empirical ceilings from loops that demonstrably work. Going 2x past KataGo
  # on the FIRST attempt, on a loop already believed broken, would add a failure
  # mode we would then have to disentangle from the one we are chasing.
  # 5.0 is a FLOOR, not a target: this key is live-tunable, so it can be raised
  # by yaml edit with no restart once the train/holdout gap has been watched for
  # a day. The loader keys below get only this one shot -- they are
  # construction-time.
  # KILL: train/holdout policy gap widens past ~0.30 (live 0.13-0.18), or the
  # frozen test_wdl_loss rises >0.026 (4 sigma) over 3 consecutive iterations.
  # LIVE-TUNABLE -- revert is a yaml edit, no restart.
  train_views_per_ingested_position: 5.0  # 2026-07-24 (renamed + denominator FIXED): trained-samples per position ACTUALLY INGESTED into the replay buffer (AZ ~1, KataGo ~4). Was train_views_per_position, which divided by matching_positions (current-model games only) while 4.5-6.5x more positions were ingested -- so 2.5 there produced only ~0.46 TRUE views and over half of all data was never trained on. Verify with the train_views_actual metric. Makes train_window_fraction INERT except as the ingest-drought floor. Live-tunable.
  # With ~10k new positions/iter and buffer growing by 2500/iter, each position
  # survives ~50 iters in the buffer and gets trained ~5 times before eviction.
  # DELETED no_amp: TWO consumers, and the deleted value False is the fallback on both.
  #   [run.py] derives use_amp = not no_amp from the argparse value (store_true, default False);
  #   [scripts/train_bootstrap.py] reads the yaml key directly, use_amp=not flat.get("no_amp",
  #   False), on the same flatten_run_config_defaults path as bootstrap_dir above. use_amp stays
  #   True either way -- unlike lr_T0/lr_T_mult, whose bootstrap fallbacks differ and are RETAINED
  # 2026-07-30: 0.10 -> 0.0 (audit M8 arm C, OPERATOR DECISION — delete the knob
  # rather than compensate it; arm B, the 1/(1-p) rescale, is deliberately NOT run).
  # Rationale: never shown to earn its keep, and it created a systematic train/serve
  # gap — 46.9% of TRAINING rows had >=1 of the 6 classical feature groups zeroed with
  # no survivor rescale, while 0% of inference rows did, and the 112 LC0 planes are
  # never dropped. So it shifted the LC0-vs-features balance between train and play.
  # ⚠ NOT live-reloadable and it LOOKS like it is: this key IS in config_yaml.py's
  # live allowlist (so a live edit is accepted and does NOT reject the reload) but is
  # NOT in TRAINER_WEIGHT_KEYS, and self.feature_dropout_p is assigned only in
  # Trainer.__init__ (trainer.py:1757). Construction-time => needs a RESTART, and a
  # --resume restores the trial config for construction-time keys, so the restart
  # alone is not proof. VERIFY on the first new progress.csv row: the reported
  # feature_dropout_p (trainable_report.py:1317) must read 0.0, not 0.10.
  # Guardrail (no success criterion by design — this is removal of an unjustified
  # knob, not a bet on a gain): value_regret --max-positions 0 paired vs the
  # pre-restart dump worse by >2cp with the CI excluding 0 => restore 0.10.
  # Revert is NOT instant (construction-time => another restart). Snapshot:
  # data/salvage/pre_restart_20260730 (iter 368 / ckpt_000367).
  # Ledger: "feature dropout has no 1/(1-p) rescale (audit M8)".
  feature_dropout_p: 0.0
  # DELETED resid_channel_dropout: 0.0 = off ([model/transformer.py] needs >0); consumer default
  #   matches ([train/trainer.py] _f(...,0.0))
  # DELETED resid_channel_balance_weight: 0.0 = off ([model/transformer.py]); consumer default
  #   matches ([train/trainer.py] _f(...,0.0))
  zclip_z_thresh: 2.0  # was 2.5; tighten top grad tail during flat-loss plateau (Apr 20). The "median grad norm 1.81, max 3.65" that used to be quoted here is stale by 2.3x — see zclip_max_norm below for the current measurement.
  zclip_alpha: 0.97
  zclip_clip_factor: 1.0
  # was 1.0; raised because raw grad norms median ~2.2 meant every step was
  # hard-clipped, dampening effective LR by ~55%. Z-score clipping still
  # handles outliers.
  # RE-MEASURED 2026-07-26 (233 TB samples, steps 56000-58320): median 4.244,
  # p95 4.941, p99 5.213, max 5.538, 3.43% of samples ABOVE 5.0. Clip rate
  # 5.15% (adaptive 4.29%, hard 1.29%), mean applied shrink 0.9969. Still a
  # tail guard, but DRIFTING UP: 250-step bucket means went 3.996 -> 4.816 over
  # 2320 steps (~11h). The old "hard cap 5.0 inert" claim is false.
  # PRE-COMMITTED WATCH (rl_loop_audit I11, mirrored as GRAD_NORM_MEDIAN_WATCH
  # in train/trainer.py): if the windowed MEDIAN grad norm exceeds 4.75
  # (hard-clip rate ~10%), this cap has stopped being a tail guard and must be
  # re-set. Watch the per-iteration `grad_norm_median` / `grad_hard_clip_rate`
  # columns in progress.csv; the trainer also logs a warning when it trips.
  #
  # THE WATCH FIRED, AND THE CAP WAS RAISED 5.0 -> 6.5 (2026-07-27 ~08:00,
  # graceful restart at iter ~122). Ledger: "PRE-REGISTERED (2026-07-27) --
  # raise zclip_max_norm 5.0 -> 6.5". Pre-change baseline at iter 121:
  # grad_norm_median 5.536, p95 6.78, HARD-clip rate 0.953. NOTE 6.5 is BELOW
  # that p95 -- it was chosen when p95 read 6.17, four hours earlier -- so
  # expect ~5-10% hard-clip on the first row, not ~5%, and a re-bind horizon of
  # ~16h at the measured +0.012/iter, not two days. Kept at 6.5 anyway: with
  # #272 live the next move is a yaml edit, so a too-small first step is cheap. The adaptive
  # z-score clipper was firing on only ~5% of steps -- correct outlier
  # behaviour -- so this FIXED cap, not zclip's adaptive logic, was doing
  # essentially all of the clipping. A cap that binds on 89% of steps is a
  # step-size controller, not a tail guard.
  #
  # WHY 6.5: it sits just above the measured p95 (6.17-6.20), so it clips ~5%
  # of steps -- the rate the adaptive clipper is tuned for, and the smallest
  # change that restores the intended division of labour. The historically
  # inert ratio was cap/median ~2.1 (the 384x12 net ran cap 5.0 at median 2.4
  # with a 0.000 hard-clip rate), which would put the cap near 11 today. 6.5 is
  # deliberately the conservative end. KNOWN COST: at the measured +0.012/iter
  # (iters 105-121, t=+3.86) 6.5 re-binds in ~16h -- which is now a yaml edit,
  # not a restart.
  #
  # SHAPE -- read this before fitting anything to this series. Two earlier
  # revisions of this comment were BOTH wrong, in opposite directions:
  #   (1) "linear drift +0.0086/iter" -- one line fitted across a level shift.
  #   (2) "a STEP at iter 96, not a drift" -- right about iters 81-99, WRONG
  #       about the trial. That window is a plateau partway up a longer ramp.
  # Full TB reconstruction across all three surviving lineages:
  #   384x12 @3e-4  06-21..07-11  median 2.36-2.50  FLAT for 20 days
  #   512x16 @3e-4  07-11..07-25  median 3.12-3.70  flat-with-a-U
  #   512x16 @3e-5  07-26..now    median 4.08->5.54 RAMP, +0.0079/iter t=6.6
  # and the ramp is ACCELERATING: +0.0120/iter (t=3.86) over iters 105-121.
  # This series needs >=40 rows before any slope claim -- a plateau inside a
  # ramp is the default appearance of a noisy rising series, and reading one as
  # evidence against the ramp is the mistake that was made here twice.
  # Today's value is a SUM: +1.3 instantaneous at the 512x16 swap, +0.4
  # instantaneous at the boot512 restart, +1.25 continuous inside this trial.
  # The "~2.2" this comment used to quote is a 384x12 number -- stale by
  # LINEAGE, not by drift; that net never drifted at all.
  # TB step counters RESET at every lineage change (5fac4 ended at 132810;
  # both 512x16 trials restart at exactly 56000). Do NOT splice the series.
  #
  # LIKELY CAUSE, correlational and NOT established: the 10x LR cut. The one
  # clean natural experiment in the record is the flat-lower-LR run
  # (07-01..07-03) where matrix LR moved 6e-3 -> 2e-3 and back with nothing
  # else changing: median grad norm went 2.49 -> 4.64 -> 2.75, tracking LR
  # INVERSELY and recovering fully on revert. This trial runs at 10x lower base
  # LR (3e-5) than either predecessor. So a high clip rate reads as "LR too
  # high" but every measurement here points the other way. This does NOT
  # explain the ramp, since LR has been constant throughout it.
  #
  # RULED OUT as causes: parameter growth (||theta|| +0.09% over 2824 steps);
  # any single loss head (across the iter-96 shift every train head moved
  # <0.5%, |d|<=0.34, while grad norm moved +4.0%, d=4.04); restarts (the two
  # inside this trial, including the six-PR deploy, each move the median <0.08
  # across the gap); and a replay-window drain -- the window is pinned at its
  # 1.5M cap every iteration, so the drain pre-registered as the suspected
  # cause DOES NOT EXIST.
  #
  # NO MEASURABLE DAMAGE so far, and the ruler is sensitive enough for that to
  # mean something: across a grad-norm shift of +1.74 sd (iters 89-95 vs
  # 96-101) the FROZEN holdout's test_wdl_loss moved +0.0000 (0.8401 both
  # sides, sd 0.0079, n=13).
  #
  # `grad_hard_clip_rate` is bit-identical to `grad_clip_rate` -- ONE
  # observation, not two -- and while the median sits near the cap it is a
  # hypersensitive readout of small location shifts (+4% in location -> +17
  # points of clip rate). Do not read a moving clip rate as independent
  # evidence.
  #
  # This key is LIVE-RELOADABLE as of PR #272 (Trainer.set_grad_clip_max_norm,
  # pushed each iteration from trainable.py), so further changes are a yaml
  # edit that takes effect on the next optimizer step and reverts just as fast.
  # The 5.0 -> 6.5 change itself still needed a restart: the process predated
  # #272. REVERT to 5.0 by yaml edit if the ledger's kill rule fires (frozen
  # test_wdl_loss +>0.032 over 3 consecutive iters, any NaN, or
  # grad_norm_median >10). The ramp CONTINUING is a pre-committed NON-kill.
  # SCOPE (changed 2026-07-27): the cap and the adaptive EMA are computed over
  # the ADAMW PARAMS ONLY. The Aurora group's update is the polar factor of the
  # gradient (scale-invariant: max|polar(cG)-polar(G)| = 1.6e-07 at c=0.90,
  # 0.0 at c=0.50), so a norm clip is EXACTLY INERT for it and including it
  # only inflated the quantity the clip decides on. Measured on
  # checkpoint_000122 over 8 real batches: ||g|| aurora 3.648, adamw 12.137,
  # global 12.673 -- the AdamW group carries 91.7% of the global norm^2 on
  # 71.4% of the params, and global = adamw x 1.044.
  # EXPECT A ONE-OFF ~4.4% STEP DOWN in `grad_norm_median` / `grad_norm_mean` /
  # `grad_norm_p95` at the deploy iteration. That is the MEASUREMENT changing,
  # NOT the run. RESTATED FOR THE LIVE 6.5 CAP (this block was written against
  # 5.0, before #273 landed 6.5): an AdamW-only 6.5 binds where the global norm
  # would be ~6.79, i.e. the cap gets slightly LOOSER, not tighter.
  # ⚠ THE "near-zero effect today" CLAUSE THAT STOOD HERE IS STALE -- it read
  # "`grad_hard_clip_rate` has been 0.000 since iter 126, so the fixed arm is
  # not binding at all". That was true when written (126-131 are all 0.000) and
  # the sf_p0 restore at iter 132 falsified it the same day: the fixed arm went
  # 0.000 -> 0.176 -> 0.255 -> 0.385 -> 0.430 and is ~0.26 at iter 137. So on
  # today's numbers this deploy is NOT inert -- a ~4.4% looser effective cap
  # applied to a ~26%-binding arm is a real change to the update.
  # It is also probably transient: the elevated tail is the low-coverage
  # masked-mean artifact (p95 13.20 -> 7.42 over iters 133-137 as sf_p0
  # coverage grows), so the rate should fall back toward 0.000 on its own.
  # RULE AT DEPLOY: re-measure `grad_hard_clip_rate` on the 3 iterations
  # immediately before the restart and state it. Do not carry forward either
  # the old 0.000 or today's 0.26 -- both are era-specific.
  # The adaptive z-score arm carries spike protection regardless (rate 0.087,
  # unchanged across the 5.0->6.5 move).
  # Do NOT read the step-down as the drift reversing -- compare only within one
  # scope era; the ledger's per-STEP drift baseline (+0.00044/step) was measured
  # in the GLOBAL scope and must not be spliced across this deploy. New
  # columns `grad_norm_aurora` / `grad_norm_adamw` make the split readable
  # per-iteration instead of via an offline probe.
  zclip_max_norm: 6.5

  w_policy: 1.0             # Pinned: anchor for all other weights
  w_soft: 1.0               # Conservative soft-policy auxiliary weight while testing plateau behavior.
  w_future: 0.01            # Keep a tiny auxiliary weight; low-risk compared with full disable.
  w_wdl: 1.0                # Keep WDL pressure balanced with main policy during target-mix test.
  w_sf_move: 0.02           # Slightly strengthen SF-policy auxiliary signal without dominating policy.
  # 2026-07-27 RESTORED, with selfplay.record_sf_p0_{policy,regret} above.
  # Both were live in June at these values (PR #78) and both lived ONLY as
  # uncommitted working-tree edits, so both reverted to their code defaults of
  # 0.0 (train/trainer.py:1033-1034) and the teacher has been OFF since.
  # Sweep 2026-07-27: of every w_* weight and every record_* flag the code reads,
  # these four were the ONLY ones absent from this file. Not drift — one feature.
  # w_sf_own      soft-CE teacher: SF's move distribution for the net's OWN
  #               position, into policy_own (the head MCTS actually reads).
  #               Teaches everywhere uniformly. June value 0.1 (~10% grad share).
  # w_sf_own_regret  minimises E_p[normalized cp-loss vs SF best] under the net's
  #               own prior, so it AUTO-WEIGHTS by position importance (flat
  #               positions -> tiny regret -> tiny gradient). June value 0.7,
  #               chosen for a ~7% grad share = on par with w_sf_own, i.e. a
  #               decisive test rather than a timid one.
  # BOTH are masked to has_sf_p0 / has_sf_p0_regret rows, so they are inert
  # until the recording above phases into the window — safe to set now.
  # 0.7 was calibrated on the OLD 46M net (m_sf_own_regret ~= 0.079 @ ckpt233);
  # the 63M net's realized share is unmeasured. RECALIBRATE once coverage >=20%
  # (task #38). Both are TRAINER_WEIGHT_KEYS => live-reloadable; the KILL is a
  # yaml edit to 0.0 with no restart.
  w_sf_own: 0.1
  w_sf_own_regret: 0.7
  w_sf_eval: 0.10           # Pinned: top-5 median from Run 4
  w_categorical: 0.30       # Run 26 default.
  w_volatility: 0.10        # Pinned: top-5 median from Run 4
  w_sf_volatility: 0.05
  w_moves_left: 0.02
  sf_wdl_frac: 0.50         # Fraction of WDL target blended from SF labels when available.
  sf_wdl_frac_floor: 0.45   # 2026-07-02 value-ranking exp (BT4 43cp vs our 75.9 on same probe): raise truth-anchor floor 0.35->0.45, cut self-echo below. Live-reload. Revert pair: 0.35/0.35.
  search_wdl_frac: 0.20     # 2026-07-02 value-ranking exp (rung 1): 0.35->0.20. STALE PREMISE (Codex review): the original rationale — fast-ply rows carry a ~pure net-eval echo at 35% — no longer holds after record_fast_ply_value was reverted to false the same day; with fast rows gone, every remaining row's search_wdl is a genuine MCTS-averaged root WDL, so 0.20 now under-weights legitimate own-search signal (not just self-echo). Re-examine at the rung-1 read: if value ranking regressed, 0.35 may be the better mix now. Yardstick: value_regret vs the 70-76cp band + BT4=43.0 ref. Live-reload. Revert pair: 0.35/0.35.
  use_adjusted_wdl_target: false  # Opt-in only; regret adjustment applies to the game-outcome fraction, not missing SF/search fallbacks.
  # DELETED adjusted_wdl_regret_source: downstream of use_adjusted_wdl_target: false -- the
  #   [train/losses.py] gate never opens; consumer default matches ([train/trainer.py]
  #   .get(...,'sum'))
  # DELETED adjusted_wdl_regret_scale: downstream of use_adjusted_wdl_target: false
  #   ([train/losses.py]); consumer default matches ([train/trainer.py] _f(...,1.0))
  # DELETED adjusted_wdl_regret_cap: downstream of use_adjusted_wdl_target: false
  #   ([train/losses.py]); consumer default matches ([train/trainer.py] _f(...,0.0))
  # ⚑ BOTH knobs shape ONLY the auxiliary `sf_eval` head's row mask. They do
  # NOT touch the WDL value target: its SF component is weighted by
  # `sf_available * keep` (`losses.py`), which carries neither term. Verified
  # bit-identical `wdl_ce` under both settings (2026-08-03 train/data audit C1,
  # pinned by tests/test_sf_wdl_conf_knobs_are_aux_only.py). Names kept as-is
  # because the live-yaml validator rejects unknown keys -- a rename is a
  # restart-gated change, not a live one.
  sf_wdl_conf_power: 1.0    # sf_eval row mask: scale by (1-draw_prob)^power. NOT the value blend.
  sf_wdl_draw_scale: 0.55   # sf_eval row mask: rescale game-drawn rows. NOT the value blend.
  sf_wdl_floor_at_regret: 0.10  # Regret value at which SF WDL fraction hits the floor.
  # DELETED sf_wdl_temperature: 1.0 is the IDENTITY -- [train/losses.py] skips the p^(1/T)
  #   softening at exactly 1.0; consumer default matches ([train/trainer.py] _f(...,1.0))
  # DELETED sf_search_dampen_sf_low: 0.0 = off ([train/losses.py] multiplies by it); consumer
  #   default matches ([train/trainer.py] _f(...,0.0))
  # DELETED sf_search_dampen_sf_high: 0.0 = off ([train/losses.py] multiplies by it); consumer
  #   default matches ([train/trainer.py] _f(...,0.0))

  accum_steps: 1    # More gradient steps per iteration; effective batch = 256.
  # 2026-07-26 (PR #247): refuse a warm start whose configured lr exceeds the
  # donor checkpoint's stored peak_lr by more than this. 0 disables. Requires
  # code from #247 -- an unknown key rejects the WHOLE live reload.
  warm_start_lr_max_ratio: 2.0
  warmup_steps: 72   # Run 26 default.
  lr_eta_min: 0.00001
  # ⚑ RETAINED, do not delete lr_T0: a SECOND consumer reads this key straight off the yaml
  #   flat dict. [scripts/train_bootstrap.py] does lr_T0=int(flat.get("lr_T0", 2000)) and never
  #   forwards lr_schedule, so Trainer's OWN default lr_schedule="cosine" ([train/trainer.py])
  #   applies there and CosineAnnealingWarmRestarts is the branch that actually runs -- the
  #   sqrt_release below never reaches it. Deleting the key therefore changes bootstrap training
  #   from a flat 3e-5 to a warm-restart cosine (T_0 999999 -> 2000; restarts at 2000/6000/14000;
  #   LR at step 1000 3.000e-05 -> 2.000e-05, bottoming at lr_eta_min 1e-5), with NO config edit
  #   required: the script's own docstring names this file as its usage. Inert on the TRAINING
  #   path only, where lr_schedule: sqrt_release takes the elif ([train/trainer.py]).
  lr_T0: 999999        # Ignored while lr_schedule=sqrt_release; kept for cosine fallback.
  # ⚑ RETAINED, do not delete lr_T_mult: same second consumer, same mechanism --
  #   [scripts/train_bootstrap.py] reads lr_T_mult=int(flat.get("lr_T_mult", 2)), so deleting
