  #
  # WHY IT MAY BE ARMED AT ALL: both gate-blocking PRs merged 2026-08-03 -- #323 (the upload
  # compactor was writing None for opponent_wdl_regret_limit on 447/447 shards, so the
  # PID-confound KILL leg was structurally unable to fire) and #324 (per-axis readout).
  # STILL OWED AT FIRST FIRE, from the brief:
  #   (1) confound NaN -> finite on the first post-restart ingested rows. #323's deploy
  #       observable: compacted-shard rate UP ~15.7%, mean shard size DOWN ~17%. An UNCHANGED
  #       rate means the difficulty key is not splitting -- re-check before trusting the
  #       confound column at all.
  #   (2) judge the readout by `n_confound >= 3` in its OUTPUT, NEVER by the exit code (an
  #       exit code is an OR over axes). Per-axis codes: 5 = confound unmeasured,
  #       6 = identity unevaluated, 7 = re-derivation refuses. The re-derivation is
  #       STRUCTURALLY refused on today's data (phase band [0.18, 0.66] vs a 0.06 tolerance);
  #       OfflineReference constants resolve only via ingest-time attribution POST-restart.
  #       Do not wait on a re-run.
  #   (3) the 11 probe_* columns rotate progress.csv, so the readout's 40-row precondition
  #       restarts (~7.4h). EXPECTED, not a defect.
  # SHADOW-MODE READOUT: watch `gate_would_demote`, NOT `gate_decision` (== 1 covers four
  # different situations). Reason codes: 5 demote_regression, 6 shadow_would_demote,
  # 7 hold_expired, 8 demote_step, 9 shadow_would_demote_step.
  #
  # NOT enforce, on purpose: under a sustained break `enforce` holds only 55-66% of
  # iterations (a hold puts the fleet on one sha, cur_games goes to 0, the gate reads NOT_RUN
  # and releases) -- fail-open, and not what "hold the published model" sounds like. Wave-3
  # K2/K3 also leave cur/prev attribution noisier than designed, so cur/prev-dependent legs
  # are DEGRADED until K2 is decided. Moving to enforce is a separate ledger entry.
  gate_mode: shadow          # 0=off 1=shadow 2=enforce, reported as gate_mode_code
  # The 7 siblings below are set to promotion_gate.py's own defaults, EXPLICITLY. They are
  # written out rather than omitted so the realized gate config is in the file rather than in
  # a dataclass -- the pin-to-realized rule. Changing any of them moves the alarm's operating
  # point and needs a ledger line.
  gate_window_iters: 24      # window se 9.3 Elo; per-iteration se is 45.6 Elo MEASURED
  gate_min_iters: 8          # COLD-window latency only; from a steady 24-row window a
                             # -50/iter break trips at median 20 iters, -100/iter at 12
  gate_min_games_per_side: 15
  gate_demote_delta_elo: -25.0   # catches a sustained -50 Elo/iter at 92.5% power in one
                                 # window; at -45 only 23.9%. It does NOT catch the 2026-06
                                 # warm-start class (-6.7 Elo/iter) at ANY reachable window.
  gate_demote_step_elo: -125.0   # the SECOND leg, on THIS iteration's own sample, OR-ed into
                                 # demote only. It exists because the window leg is a FIRST
                                 # DIFFERENCE: a one-shot level break of ANY magnitude gives
                                 # elo_hi = (M/K)(t-1) > 0 -- M cancels, so a -1,000,000 Elo
                                 # step reads +29,754. Raising K or lowering alpha cannot help.
  gate_alpha: 0.05
  gate_max_hold_iters: 12    # also the anchor's max age; an older anchor is refused
  # -- The full gate annotation record, ported VERBATIM from main's copy
  # -- (block kept in sync with chess_anti_engine/tune/promotion_gate.py;
  # -- tests/test_promotion_gate.py pins its quoted numbers):
  # ⚑ RETIRED -- see chess_anti_engine/tune/promotion_gate.py. This block used
  # to give the realized split as "n_cur ~= 197 / n_prev ~= 38 (prev share
  # 16.3%), measured from 418 processed shard .zattrs over iters 164-219". That
  # was a TIMESTAMP PROXY for the model_sha256 partition the gate actually uses,
  # on the lineage the 2026-08-04 fresh boot replaced. The gate's own
  # per-iteration counters over 96 post-boot iterations read n_cur 50.3 /
  # n_prev 46.4, prev share 48.0%. Do not size anything off 197/38 either.
  #
  # What it can resolve, so nobody reads it as a ratchet: per-iteration
  # standard error 45.6 Elo MEASURED, against a loop that gains ~0.02
  # Elo/iteration. That spread is PURE BINOMIAL NOISE -- standardized
  # residuals sit at 1.011 where 1.0 is independent binomial, so there is no
  # anchor-drift variance in it. (An earlier revision of this comment said
  # "41.5 predicted from binomial alone", implying excess variance. That
  # comparison used 1/mean(n); the honest per-window figure is 61.1 Elo, so
  # 45.6 is BELOW binomial, not above.)
  #
  # ⚑ 45.6 and every power figure below it were measured on the PRE-08-04
  # lineage at n_cur ~197 / n_prev ~38. The realized shape is now 50.3/46.4,
  # whose independent-binomial factor is 15% larger, so 45.6 is an OPTIMISTIC
  # figure and the power numbers with it. It owes a re-measurement on this
  # lineage; the direction moves "no gate can ratchet at 0.02 Elo/iteration"
  # further from the line, not closer, which is why nothing is gated on it.
  # See promotion_gate.py's module docstring.
  #
  # At the default 24-iteration window (~4.5 h) the window se is 9.3 Elo and
  # the shipped demote line is -45 -> -25. QUOTE THE LINE WITH THE CLAIM:
  # a sustained -50 Elo/iteration break is caught at 92.5% power in one window
  # AT -25, and at only 23.9% at -45. It does NOT catch the 2026-06
  # warm-start class (-6.7 Elo/iteration) at any reachable window or line
  # (worst-case power 0.29%). It is a regression alarm, not a selection step;
  # no affordable measurement can select on 0.02 Elo. The slow-bleed job stays
  # with scripts/daily_gate_ratchet.sh's cumulative vs-frozen-anchor series.
  #
  # TIME TO TRIP: an earlier revision of this comment said "a -100/-200 break
  # trips inside the 8-iteration floor (~1.5 h)". EIGHT IS THE COLD-WINDOW
  # NUMBER -- the latency from an EMPTY window, which production never has.
  # From a steady-state 24-row window the 23 healthy pre-break rows sit in the
  # mean until they age out. Measured, 400 seeds/row:
  #   -50/iter  median 20 (p90 26) | -100/iter median 12 (p90 15)
  #   -200/iter median  8 (p90 10) | -300/iter median  6 (p90  8)
  # So -100 costs a median ~2.4 h in production, not 1.5.
  #
  # AND A SINGLE-ITERATION STEP OF ANY MAGNITUDE CANNOT MOVE THAT RULE. The
  # anchored delta is a FIRST DIFFERENCE (cur minus prev, both re-measured
  # every iteration), so a level shift of -M Elo -- a bad merge, a broken loss
  # term, a mis-set LR -- appears in exactly ONE sample. For a window of K
  # deltas with one -M and the rest 0: mean = -M/K, se = M/K exactly, so
  # elo_hi = (M/K)(t-1), which is POSITIVE for every t>1 and M CANCELS. At
  # K=24/alpha=0.05 a -1,000,000 Elo one-shot reads elo_hi = +29,754. Raising
  # K, lowering alpha or moving the line cannot help.
  # That is what gate_demote_step_elo is for: a SECOND leg on THIS iteration's
  # own sample, evaluated before the min_iters window check, OR-ed into demote
  # only (it can never create a promote). It ships at -125 on the same
  # false-brake budget as the window line: at most 0.04% spurious holds.
  #
  # ⚑ RETIRED 2026-08-11 (PR #395). This block used to read "0.02-1.31 spurious
  # holds per 8000 null iterations across the admissible arm shapes. It catches
  # a step of about -195 Elo at 50% power and -249 at 90% ... one anchored
  # sample carries 42-64 Elo of binomial noise." Every one of those numbers is
  # the PRE-08-04 197/38 lineage, and the first is the exact claim PR #395
  # RETRACTS: re-derived at the realized 50/46 composition, the range across
  # ADMISSIBLE shapes is 0.0013% to 0.106% -- up to 8.5 spurious holds per
  # 8000, not 1.31 -- because gate_min_games_per_side: 15 admits a 15/15 shape
  # that is 2.6x OUTSIDE the 0.04% budget. Current figures:
  #   realized 50/46: se 48.8 Elo, 0.0013%, 50% power -205, 90% -268
  #   worst admitted 15/15: se 87.5 Elo, 0.1063% (MC), 50% -269, 90% -381
  #   operating cost over the 96 realized shapes: 0.0023% mean, 0.0241% worst
  # It still does NOT catch a -100 step -- one anchored sample now carries
  # 49-88 Elo of binomial noise, so the retired 42-64 was optimistic too.
  # The full derivation, both instruments and the min_games_per_side: 25
  # remedy are in promotion_gate.py's "WHAT THE STEP LEG COSTS AND WHAT IT
  # BUYS". ⚑ Do not requote -195/-249 or the 0.02-1.31 range.
  #
  # SHADOW-MODE READOUT: watch gate_would_demote, not gate_decision.
  # gate_decision == 1 covers FOUR situations (nothing fired; shadow suppressed
  # a window demote; shadow suppressed a step demote; the hold cap yielded).
  # gate_would_demote is 1.0 exactly when the demote rule fired, whatever the
  # mode did with it. gate_reason_code still says which leg:
