  #
  # ⚑ THIS IS A FIRST RUN, NOT A RE-ENABLE. The gate path has never executed in production.
  # Treat every leg as unproven and read the full first-fire checklist before trusting a
  # column: scratchpad/code_audit_20260803/GATE_AUDIT.md, section "VERIFY ON FIRST FIRE"
  # (condensed into first_row_checks.md rows G1-G8).
  #
  # WHY IT MAY BE ARMED AT ALL: both gate-blocking PRs merged 2026-08-03 -- #323 (the upload
  # compactor was writing None for opponent_wdl_regret_limit on 447/447 shards, so the
  # PID-confound KILL leg was structurally unable to fire) and #324 (per-axis readout).
  # STILL OWED AT FIRST FIRE, from the brief:
  #   (1) confound NaN -> finite on the first post-restart ingested rows. #323's deploy
  #       observable: compacted-shard rate UP ~15.7%, mean shard size DOWN ~17%. An UNCHANGED
  #       rate means the difficulty key is not splitting -- re-check before trusting the
  #       confound column at all.
  #   (2) judge the readout by `n_confound >= 3` in its OUTPUT, NEVER by the exit code (an
  #       exit code is an OR over axes). Per-axis codes: 5 = confound unmeasured,
  #       6 = identity unevaluated, 7 = re-derivation refuses. The re-derivation is
  #       STRUCTURALLY refused on today's data (phase band [0.18, 0.66] vs a 0.06 tolerance);
  #       OfflineReference constants resolve only via ingest-time attribution POST-restart.
  #       Do not wait on a re-run.
  #   (3) the 11 probe_* columns rotate progress.csv, so the readout's 40-row precondition
  #       restarts (~7.4h). EXPECTED, not a defect.
  # SHADOW-MODE READOUT: watch `gate_would_demote`, NOT `gate_decision` (== 1 covers four
  # different situations). Reason codes: 5 demote_regression, 6 shadow_would_demote,
  # 7 hold_expired, 8 demote_step, 9 shadow_would_demote_step.
  #
  # NOT enforce, on purpose: under a sustained break `enforce` holds only 55-66% of
  # iterations (a hold puts the fleet on one sha, cur_games goes to 0, the gate reads NOT_RUN
  # and releases) -- fail-open, and not what "hold the published model" sounds like. Wave-3
  # K2/K3 also leave cur/prev attribution noisier than designed, so cur/prev-dependent legs
  # are DEGRADED until K2 is decided. Moving to enforce is a separate ledger entry.
  gate_mode: shadow          # 0=off 1=shadow 2=enforce, reported as gate_mode_code
  # The 7 siblings below are set to promotion_gate.py's own defaults, EXPLICITLY. They are
  # written out rather than omitted so the realized gate config is in the file rather than in
  # a dataclass -- the pin-to-realized rule. Changing any of them moves the alarm's operating
  # point and needs a ledger line.
  gate_window_iters: 24      # window se 9.3 Elo; per-iteration se is 45.6 Elo MEASURED
  gate_min_iters: 8          # COLD-window latency only; from a steady 24-row window a
                             # -50/iter break trips at median 20 iters, -100/iter at 12
  gate_min_games_per_side: 15
  gate_demote_delta_elo: -25.0   # catches a sustained -50 Elo/iter at 92.5% power in one
                                 # window; at -45 only 23.9%. It does NOT catch the 2026-06
                                 # warm-start class (-6.7 Elo/iter) at ANY reachable window.
  gate_demote_step_elo: -125.0   # the SECOND leg, on THIS iteration's own sample, OR-ed into
                                 # demote only. It exists because the window leg is a FIRST
                                 # DIFFERENCE: a one-shot level break of ANY magnitude gives
                                 # elo_hi = (M/K)(t-1) > 0 -- M cancels, so a -1,000,000 Elo
                                 # step reads +29,754. Raising K or lowering alpha cannot help.
  gate_alpha: 0.05
  gate_max_hold_iters: 12    # also the anchor's max age; an older anchor is refused
