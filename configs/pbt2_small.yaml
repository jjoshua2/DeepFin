  # bt4heads bundle, promoted 2026-08-15 (ledger 4528f08f1). Blend the
  # categorical head into the selfplay value/search signal at the ratio arm B
  # was measured with. Paired with train.w_categorical / rebuild_categorical_target.
  categorical_blend_frac: 0.69
  categorical_search_blend_frac: 0.31
  games_per_iter: 440
  # DELETED games_per_iter_start: read ONLY inside the ramp branch of
  #   [tune/trainable_metrics.py] -- _games_per_iter_for_iteration returns games_per_iter
  #   unconditionally while ramp_iters <= 0 -- and games_per_iter_ramp_iters is deleted on the
  #   next line, so nothing reads it. DRIFT: resolves to the argparse default 0
  #   (--games-per-iter-start, [run.py]), NOT the 440 this file shipped and NOT games_per_iter:
  #   the defensive fallback config.get("games_per_iter_start", config.get("games_per_iter",1))
