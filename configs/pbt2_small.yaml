# ============================================================================
#
# A dead key is not always a deletable key: deleting a line does not remove behaviour,
# it substitutes the dataclass default. These were checked and kept.
#
# temperature* (10 keys)
#     inert in effect (all starts and endgames are 0.0 so temperature_for_ply returns 0.0 on
#     every branch) but NOT deletable: without the lines, temperature defaults to 1.0,
#     temperature_endgame to 0.6 and temperature_decay_moves to 60 -- deletion turns
#     stochastic play ON.
#
# mcts_start_simulations
#     inert only because it EQUALS mcts_simulations. progressive_mcts is not settable from
#     yaml and defaults True, so deleting the line drops start sims to the dataclass default
#     50.
#
# replay_window_growth / replay_window_growth_frac
#     inert only because the window is pinned at replay_window_max. On a fresh-window restart
#     they are live from iteration 1, and deleting them gives 10000 / None instead of 20000 /
#     1.0.
#
# random_start_plies
#     unreachable only because opening_book_prob is 1.0. Keeping it means the deletion is not
#     conditional on another key not moving.
#
# diff_focus_* (5 keys)
#     unpublished and equal to DiffFocusConfig's defaults, so deleting them changes nothing --
#     but keeping them pinned is the self-invalidating tripwire rl_loop_audit A7 relies on,
#     and deleting them would NOT disable diff-focus (H2: it is the source of the whole
#     replay-priority spread, CV 0.94).
