  # DELETED games_per_iter_ramp_iters: 0 = no ramp -- [tune/trainable_metrics.py]
  #   (_games_per_iter_for_iteration) takes its `ramp_iters <= 0` early return, which is the
  #   branch that leaves games_per_iter_start above unread. Consumer default matches
  #   ([tune/trial_config.py] .get(...,0)) and so does the argparse default of
  #   --games-per-iter-ramp-iters ([run.py]). Resolves unchanged at 0. Deleted in 67191f995;
  #   main keeps it, on the same defence-in-depth argument recorded above.
  selfplay_fraction: 0.8
  record_fast_ply_value: false
  record_sf_p0_policy: true
  record_sf_p0_regret: true
  selfplay_batch: 384
  slot_oversubscribe: 2.0
  max_plies: 450
  history_rep_fix: true
  selfplay_resume_inflight_games: true
  # ⚑ PIN (all 10 temperature* lines). They are INERT in effect -- every start and endgame
  # is 0.0, so temperature_for_ply returns 0.0 on every branch -- and they are the single
  # most dangerous deletion in this file: without them `temperature` defaults to 1.0,
  # `temperature_endgame` to 0.6 and `temperature_decay_moves` to 60. DELETING THESE LINES
  # TURNS STOCHASTIC PLAY ON. Production selfplay is fully deterministic past move 15
  # (all temperatures 0.0) and that is load-bearing. NOTE: gumbel_scale does NOT decay to 0
  # -- it goes 1.0 -> gumbel_scale_after 0.5 across moves 12..15 and stays at 0.5 for the
  # rest of the game, so ROOT NOISE IS ON ALL GAME. (Corrected 2026-08-09; the old "decays
