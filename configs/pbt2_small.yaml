  gumbel_vloss_weight: 1
  # 2026-08-09 search-authority bundle. BOTH knobs move together on purpose: they
  # MULTIPLY on the top-1 flip condition, and measured one-at-a-time they do NOT add
  # (ledger Amendment 11). c_scale 0.025 -> 0.1 is a REVERT of an unreviewed regression
  # (ed9de8ee9); 0.1 is the library optimum measured at 256 sims (gumbel.py:56-66),
  # and 0.025 had cut sigma 10.6 -> 2.65. policy_temp 1.5 is the softening arm.
  gumbel_c_scale: 0.1
  gumbel_policy_temp: 1.5
  # sigma_target decoupled from sigma_play. sigma = c_scale*(c_visit + max_visit); the
  # 256-sim survivor accrues max_visit 56 (schedule 1,3,7,15,30) and a 50-sim search
  # accrues 5, so cap 5 gives the STORED target a 50-sim sigma while PLAY keeps the full
  # 256-sim search. Play is untouched -> the measured +271 Elo search gain is retained.
  # ⚠ NOT the fix: priced 2026-08-11 on the target-quality axis and it came out NEUTRAL
  # (better_in 0.777 vs 0.770, inside noise). Carried as hygiene -- it removes a real
  # coupling of the target to the played sim budget. Do not call it the fix in a readout.
  gumbel_target_max_visit_cap: 5
  # Untempered prior in the STORED target only; candidate selection stays tempered.
  # ⚠ Also NEUTRAL (better_in 0.785 vs 0.770) and it did NOT pass its own offline screen
  # (top1 +0.393 [-0.699, +1.485]). First key to drop if the readout is inconclusive.
  gumbel_target_untempered_prior: true
  gumbel_scale: 1.0
  gumbel_scale_after: 0.5
  gumbel_scale_decay_start_move: 12
  gumbel_scale_decay_moves: 3
  curriculum_gumbel_scale: 1.0
  curriculum_gumbel_scale_after: 0.5
  curriculum_gumbel_scale_decay_start_move: 12
  curriculum_gumbel_scale_decay_moves: 3
  # PIN (both). Provably INERT in every Gumbel search (PLAY_PATH_AUDIT F2: worker.py never
  # resolves them from the reco, and network_turn.py reads them only on the PUCT branch,
  # which `mcts: gumbel` makes unreachable) -- yet `realized_gumbel()` prints them as
  # realized config. NEVER SWEEP THEM. Kept because the values equal the worker dataclass
  # defaults, so the line is a tripwire: if a future PR wires them, the yaml already says
  # what production ran.
  fpu_reduction: 1.2
  fpu_at_root: 1.0
  sf_policy_temp: 0.012
  # 2026-08-05 arm A (ledger: cp-rank deploy prereg, PR #355): rank SF policy label
  # candidates by raw effective cp instead of the saturating w+0.5d squash. cp_temp
  # 16.2 calibrated offline to ~1.18 nats mean label entropy (screen 08-04). wdl mode
  # keeps sf_policy_temp; cp mode uses sf_policy_cp_temp — the pair is mode-selected.
  sf_policy_score_mode: cp
  sf_policy_cp_temp: 16.2
  sf_policy_label_smooth: 0.01
  sf_wdl_use_cp_logistic: true
  sf_wdl_cp_slope: 0.006
  sf_wdl_cp_draw_width: 120.0
  soft_policy_temp: 2.0
