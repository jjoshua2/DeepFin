  # AND THE ANCHORED DELTA CARRIES A CONTROLLER TERM. An earlier revision of
  # this comment inherited the module's claim that both arms face the same
  # opponent, so the controller's movement would subtract out of the anchored
  # difference. IT DOES NOT. Model and
  # difficulty ship in the SAME recommended_worker manifest and are applied
  # together, so a shard tagged with the previous sha was also played one PID
  # step behind on wdl_regret/sf_nodes -- old-model-at-new-difficulty is not an
  # observable state. The offset's SIGN OPPOSES the model change (the PID eases
