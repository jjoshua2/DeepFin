model:
  kind: transformer
  # ── bt4heads, PROMOTED 2026-08-15 after arm B read +13.9 Elo [+5.7, +22.1]
  # over arm A at iter 100, n=4800 (ledger 4528f08f1). These three plus the
  # four training keys below are ONE BUNDLE — the arena measured the bundle,
  # not any single lever, so do not revert them piecemeal expecting the
  # attribution to hold. ⚑ policy_embedding_mode read NULL on its own in
  # Tier-13 (ledger 7400c3a76); it rides along because it was in the arm that
  # was measured, not because it is independently justified.
  aux_policy_head_dim: 128
  categorical_head_coupled: true
  policy_embedding_mode: linear
  embed_dim: 512
  num_layers: 16
  num_heads: 16
  ffn_mult: 1.5
  ffn_mult_by_layer: [1.5, 1.5, 1.5, 1.5, 1.5, 1.555556, 1.65, 1.772222, 1.894444, 1.666667, 1.638889,
  1.905556, 1.783333, 1.794444, 1.744444, 1.5]
  use_smolgen: true
  smolgen_mode: per_layer
  smolgen_bias_scale: layer_head
  smolgen_bias_norm: center_rms
  smolgen_relation_basis: true
  smolgen_relation_norm: none
  smolgen_relation_coeff_norm: none
  smolgen_relation_scale: none
  # DELETED use_nla: the NLA attention variant is off; consumer default matches
  #   ([model/__init__.py] .get('use_nla',False)) and its search flag tune.search_nla is off too
  input_pos_encoding: arc_adapter
  qkv_projection: split
  use_deepnorm: true
  policy_encoding: lc0_1858
  input_history_encoding: lc0_root_legacy_meta
  input_extra_features: v2_threats
  gradient_checkpointing: false

