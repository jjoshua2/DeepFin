  playout_cap_fraction: 0.25  # 25% get full sims, 75% get fast
  fast_simulations: 32
  gumbel_topk: 16
  gumbel_scale: 0.75     # Full selfplay root Gumbel noise scale before decay. mctx default is 1.0; final action temp stays 0.
  gumbel_scale_after: 0.0
  gumbel_scale_decay_start_move: 12
  gumbel_scale_decay_moves: 3
  curriculum_gumbel_scale: 0.25  # Full SF-curriculum root Gumbel noise; weaker than selfplay to keep labels less noisy.
  curriculum_gumbel_scale_after: 0.0
  curriculum_gumbel_scale_decay_start_move: 12
  curriculum_gumbel_scale_decay_moves: 3
  fpu_reduction: 1.2    # LC0/KataGo FPU for non-root nodes
  fpu_at_root: 1.0      # FPU for legacy PUCT root; current Gumbel path uses gumbel_scale root noise.

  sf_policy_temp: 0.012      # 2026-05-23: keep SF-policy sharpness after softening the underlying cp->WDL scores.
  sf_policy_label_smooth: 0.01  # 2026-05-27: multipv=40 covers most good moves; keep only light legal-tail smoothing.
  sf_wdl_use_cp_logistic: true   # Replace SF's UCI_ShowWDL (72% one-hot) with own logistic on cp score.
  sf_wdl_cp_slope: 0.0060        # 2026-05-23: move toward replay-fit slope (~0.0045-0.0055) while staying conservative.
  sf_wdl_cp_draw_width: 120.0    # Half-width of draw zone in cp; moved toward current-regret replay fit (~130-145).
  soft_policy_temp: 3.0     # Temperature for soft policy target (LC0 uses 3, was hardcoded 2)

  syzygy_path: /home/josh/projects/chess/data/syzygy_3-4-5:/home/josh/projects/chess/data/syzygy_6
  # Ordinary high-volume Stockfish curriculum searches stay on local SSD TBs.
  # Non-adjudicated <=6-piece play-through roots temporarily switch to
  # syzygy_path above so Stockfish can use E-drive DTZ for conversion play.
  stockfish_syzygy_path: /home/josh/projects/chess/data/syzygy_3-4-5
  # End games at the first TB-eligible position and use the TB-proven result
  # as the outcome. Skips MCTS compute on the endgame tail (~25% of replay
  # positions are in <=7-man range — see the piece-count audit).
  syzygy_adjudicate: true
  # Fraction of games that actually adjudicate. 0.99 leaves 1% playing
  # through the endgame so the NN keeps generating endgame samples with
  # its own labels — guards against losing endgame skill entirely.
  syzygy_adjudicate_fraction: 0.99
  # Override NN wdl logits at MCTS leaves when TB-eligible (UCI-style
  # in-tree probing). Pins Q to TB truth for endgame leaves.
  syzygy_in_search: true
  # Override policy targets with DTZ-optimal moves at TB-eligible positions.
  # Disabled 2026-04-25: redundant with syzygy_in_search (MCTS already gets
  # TB-correct moves at eligible leaves) + syzygy_adjudicate (games end at
  # the TB position, so the rare past-TB tail isn't worth the post-game
  # rescore path. The path also corrupted ~0.09% of policy_targets when
  # combined with the 1-legal-move shortcut in run_network_turn (forced
  # plies were pushed but produced no record, so the syzygy replay's
  # sample_idx counter overshot the records list, stamping K+P-endgame
  # overrides on unrelated records). finalize.py was fixed to align by
  # ply_index, but the simpler answer is to leave the path off.
  syzygy_rescore_policy: false

  # Stockfish WDL confidence required to adjudicate max_plies timeouts as decisive.
  timeout_adjudication_threshold: 0.99

  diff_focus_enabled: true
  diff_focus_q_weight: 4.8   # Pinned: top-5 median from Run 4
  diff_focus_pol_scale: 3.8   # Pinned: top-5 median from Run 4
  diff_focus_slope: 4.0       # Pinned: top-5 median from Run 4
  diff_focus_min: 0.09        # Pinned: top-5 median from Run 4

  categorical_bins: 32
  hlgauss_sigma: 0.04
  record_lc0_root_input: true  # Store alternate LC0-root x in new shards for later LC0-input fine-tune tests.

train:
  optimizer: aurora
  matrix_optimizer_scope: mlp_out  # Aurora on FFN + attention output; Q/K/V stay AdamW.
  matrix_lr_multiplier: 20
  matrix_weight_decay: 0
  aux_weight_decay: 0.0001
  aurora_uw_floor: 0.0
  aurora_pp_iterations: 3
  aurora_pp_beta: 0.25
  aurora_polar_steps: 8
  aurora_polar_method: polar_express
  aurora_polar_dtype: fp16
  aurora_polar_safety: 1.01
  lr: 0.0003        # 2026-07-02: REVERTED 0.0001→0.0003 — flat-lower-LR verdict: UNREADABLE (throughput triple landed the same day, perfect confound) and the known-good anchors (49.6/51.5/72.4 @ckpt457) were earned at 0.0003 sqrt_release; return-to-known-good bundle. PB2-pinned: changing needs the experiment_state JSON edit + restart (see memory/ledger). Base LR; Aurora matrix params use matrix_lr_multiplier.
  batch_size: 512   # Aurora/arc-split run matches offline probe batch size; fits VRAM on 5090.
  train_steps: 800  # Raised for 2M buffer; window_fraction gives ~781 steps at full size.
  train_window_fraction: 0.04  # Train on 4% of active replay cap; slow replay growth limits extra reuse while refilling.
  train_views_per_position: 2.5  # 2026-07-01 (PR #91): hold trained-samples/ingested-position at 2.5 (AZ ~1, KataGo ~4); steps scale with ingest so the two knobs above can't drift the reuse ratio. Makes train_window_fraction INERT except as the ingest-drought floor. Live-tunable; verify train_steps_used tracks ingest. Kill: drop to 2.0 or 0 (window mode) if test/train gap widens.
  # With ~10k new positions/iter and buffer growing by 2500/iter, each position
  # survives ~50 iters in the buffer and gets trained ~5 times before eviction.
  no_amp: false
  feature_dropout_p: 0.10  # Fixed at 0.10 (not searched).
  resid_channel_dropout: 0.0  # Keep channel spreading on the explicit balance regularizer; dropout cost more eval loss offline.
  resid_channel_balance_weight: 0.0  # Disabled: offline sidecar .001/.003 did not improve loss or WDL.
  zclip_z_thresh: 2.0  # was 2.5; tighten top grad tail during flat-loss plateau (Apr 20). Last-100 median grad norm 1.81, max 3.65 — hard cap 5.0 inert, z-clip ~1% → ~5-8% of steps at 2.0.
  zclip_alpha: 0.97
  zclip_clip_factor: 1.0
  zclip_max_norm: 5.0  # was 1.0; raised because raw grad norms median ~2.2 meant every step was hard-clipped, dampening effective LR by ~55%. Z-score clipping still handles outliers.

  w_policy: 1.0             # Pinned: anchor for all other weights
  w_soft: 1.0               # Conservative soft-policy auxiliary weight while testing plateau behavior.
  w_future: 0.01            # Keep a tiny auxiliary weight; low-risk compared with full disable.
  w_wdl: 1.0                # Keep WDL pressure balanced with main policy during target-mix test.
  w_sf_move: 0.02           # Slightly strengthen SF-policy auxiliary signal without dominating policy.
  w_sf_eval: 0.10           # Pinned: top-5 median from Run 4
  w_categorical: 0.30       # Run 26 default.
  w_volatility: 0.10        # Pinned: top-5 median from Run 4
  w_sf_volatility: 0.05
  w_moves_left: 0.02
  sf_wdl_frac: 0.50         # Fraction of WDL target blended from SF labels when available.
  sf_wdl_frac_floor: 0.45   # 2026-07-02 value-ranking exp (BT4 43cp vs our 75.9 on same probe): raise truth-anchor floor 0.35->0.45, cut self-echo below. Live-reload. Revert pair: 0.35/0.35.
  search_wdl_frac: 0.20     # 2026-07-02 value-ranking exp (rung 1): 0.35->0.20. STALE PREMISE (Codex review): the original rationale — fast-ply rows carry a ~pure net-eval echo at 35% — no longer holds after record_fast_ply_value was reverted to false the same day; with fast rows gone, every remaining row's search_wdl is a genuine MCTS-averaged root WDL, so 0.20 now under-weights legitimate own-search signal (not just self-echo). Re-examine at the rung-1 read: if value ranking regressed, 0.35 may be the better mix now. Yardstick: value_regret vs the 70-76cp band + BT4=43.0 ref. Live-reload. Revert pair: 0.35/0.35.
  use_adjusted_wdl_target: false  # Opt-in only; regret adjustment applies to the game-outcome fraction, not missing SF/search fallbacks.
  adjusted_wdl_regret_source: sum  # sum|d95|d98|max|h4|h6|h12|h24|h50; d95/d98 are per network record, h* are ply windows.
  adjusted_wdl_regret_scale: 1.0   # For sum/fp16 suffixes, prefer a smaller scale, discounted/horizon source, or positive cap.
  adjusted_wdl_regret_cap: 0.0     # Q-units; 0 disables cap and can saturate suffix-sum targets.
  sf_wdl_conf_power: 1.0    # Confidence damping: scale SF-WDL by (1-draw_prob)^power.
  sf_wdl_draw_scale: 0.55   # Pinned low-to-mid based on the healthier late-run settings.
  sf_wdl_floor_at_regret: 0.10  # Regret value at which SF WDL fraction hits the floor.
  sf_wdl_temperature: 1.0   # Keep training-time labels unchanged; tune softness in stored cp->WDL formula instead.
  sf_search_dampen_sf_low: 0.0  # Trust objective SF-low labels when search says winning; final outcomes can reflect curriculum weakness.
  sf_search_dampen_sf_high: 0.0  # Damping (0..1) on SF target when SF says STM winning but search says STM losing. Live-tunable.

  accum_steps: 1    # More gradient steps per iteration; effective batch = 256.
  warmup_steps: 72   # Run 26 default.
  lr_eta_min: 0.00001
  lr_T0: 999999        # Ignored while lr_schedule=sqrt_release; kept for cosine fallback.
  lr_T_mult: 1
  lr_schedule: sqrt_release
  lr_release_cycle_steps: 0
  lr_release_start_frac: 0.80
  lr_release_min_scale: 0.1   # 2026-07-02: 1.0→0.1 restored (sqrt_release decays to 0.1x again) — flat-LR experiment reverted with the lr key above.
  lr_release_shape: sqrt
  use_compile: true    # 2026-04-27: re-enabled with max-autotune. The earlier "compile destroys trainer" diagnosis turned out to be a prefix bug, not a compile-backward bug — saving under compile created `_orig_mod.`-prefixed checkpoints, then a later unwrapped load silently dropped all 192 keys (no warning) leaving the trainer fresh-init. Workers running max-autotune have been stable through trial f2f58 (raw_wr 0.81/0.59/0.57 across iters 1-3). Both bugs in the chain are now fixed: Trainer.save() strips the prefix, and load_state_dict_tolerant raises on <50% load.
  compile_mode: max-autotune
  log_level: INFO    # Keep dispatcher/train stats without per-search DEBUG gumbel-profile log overhead.
  swa_start: -1  # Disabled: SWA averaging hurts early training. Enable after model stabilizes.
  swa_freq: 50

puzzle_epd: null
puzzle_interval: 0     # Disabled — too slow for many parallel trials

tune:
  min_replay_size: 0  # Tune path trains when replay >= batch_size; keep 0 for no extra floor

  # Disk usage controls
  # NOTE: PB2/PBT needs older checkpoints to be available for cloning/exploit.
  # Keeping too few checkpoints can cause missing-checkpoint restore errors.
  tune_num_to_keep: 6               # keep last 6 checkpoints per trial (disk space)
  tune_keep_last_experiments: 2     # keep last 2 experiments under work_dir/tune

  tune_scheduler: gpbt_pl
  gpbt_inertia_weight: 1.0
  gpbt_winner_weight: 1.0
  gpbt_quantile_fraction: 0.25
  gpbt_resample_probability: 0.20
  num_samples: 1
  max_concurrent_trials: 1
  cpus_per_trial: 1
  gpus_per_trial: 1.0
  distributed_workers_per_trial: 4  # Shared broker needs more producers to keep the single GPU queue fed.
  distributed_worker_sf_workers: 8  # 2026-07-18: SMT32 retune; production-shaped A/B +38.2% games/s vs 4/w. sf_nice keeps SF from preempting search/dispatch.
  distributed_worker_min_games_per_batch: 200  # Bigger forwards: better GPU util + lower per-gumbel overhead
  distributed_worker_max_games_per_batch: 512
  distributed_worker_username: josh
  distributed_worker_password: chess_worker_2026
  distributed_worker_use_compile: true   # Worker compile (max-autotune) has been stable for many iters of training. Was briefly disabled 2026-04-27 to test whether compile was producing wrong outputs after a bad salvage; it wasn't — actual root cause was a corrupted pid_state.json in the iter 403 pool I'd manually built (had iter 408-era values rather than iter 403's).
  distributed_worker_compile_mode: reduce-overhead  # 2026-07-14: max-autotune's GPU benchmarking hung the compile twice on the flaky WSL bridge (never reached first inference in 20+ min). reduce-overhead compiles in ~1-2min from cache (no autotune benchmark), uses cudagraphs (good for small-batch selfplay), and makes wedge-restarts fast. Revert to max-autotune once the bridge is stable if a throughput readout justifies it.
  distributed_worker_inference_fp8: false  # FP8 quantized inference (RTX 5090 native)
  distributed_worker_threaded: true   # 2026-04-29: enable threaded selfplay so the new dispatcher actually engages. Bench at N=16 producers showed 36k leaves/s vs ~7k for the prior path (5x). Old comment "AOT threading slower in prod" referred to the AOT-compiled threading path; this is the compiled+dispatcher path which is structurally different.
  distributed_worker_selfplay_threads: 32
  distributed_worker_threaded_dispatcher: true   # 2-slot async pipeline (2026-04-29 refactor): +5.9x over ThreadedBatchEvaluator at N=16 producers, parity tests at 1e-5 vs DirectGPUEvaluator. Was false based on 2026-04-28 A/B which used a pre-refactor sync dispatcher AND a bench with main-thread compile that broke cudagraph TLS — both fixed.
  distributed_worker_dispatcher_batch_wait_ms: 5.0  # 2026-07-02 sweep WINNER: 2ms 59 pos/batch & 3.5k pos/s, 5ms 129 & 5.0k (+43%), 8ms 83 & 3.8k (overshoot — latency-bound pipeline). Restart-gated.
  distributed_worker_dispatcher_max_batch: 1190
  distributed_worker_dispatcher_target_batch: 680  # Live producers underfill 340; 680 has been the best current steady compromise.
  # distributed_worker_aot_dir: data/aot_models  # Auto-detected by _worker_inference_args when threaded=true
  distributed_inference_broker_enabled: true
  distributed_inference_shared_broker: false
  distributed_inference_batch_wait_ms: 20.0  # 2026-07-02 POC B: hard CAP for adaptive mode (was fixed 5.0 = sweep winner; if adaptive_idle_ms reverts to 0, set this back to 5.0)
  distributed_inference_adaptive_idle_ms: 2.0  # 2026-07-16: 4.0 arm KILLED by offline trace sim (scripts/sim_gather_policy.py): +14ms mean latency, zero rows/s gain — batches already gather all 16 slots; over-waiting just delays them. Sim says idle 1-2ms is within ~2% of the clairvoyant oracle. Restart-gated.
  distributed_inference_max_batch_per_slot: 1190
  distributed_inference_slots_per_worker: 4
  distributed_inference_use_compile: true
  distributed_inference_compile_mode: reduce-overhead  # 2026-07-14: see distributed_worker_compile_mode — the BROKER's max-autotune first-inference compile is what hung. reduce-overhead avoids the autotune GPU benchmarking that deadlocked on the flaky bridge.
  distributed_inference_aot_dir: data/aot_models_512  # 2026-07-15 RETRY on fresh bridge (driver 610.74 + reboot): packages ==eager, verified. Prior kill was a bridge-wedge side effect, not a perf/quality failure — watch recover_stall cadence; if clockwork ~100-min wedges return, blank this key + restart. History: 07-15 KILLED (reverted): AOT enabled (07-14 22:36) turned the sporadic WSL dxg host-bridge wedge into a CLOCKWORK ~100-min wedge/recover loop (9 recoveries 07-15, zero healthy stretches vs a 6.5h healthy stretch pre-AOT) — ~90% downtime, no training progress. Loading/replaying 14 AOT cudagraph packages at startup reliably trips the flaky bridge (same class as the max-autotune compile-hang variant). Blank = pure reduce-overhead known-good. Packages kept in data/aot_models_512 for the match/UCI path. See docs/experiment_ledger.md.
  distributed_pause_selfplay_during_training: false  # Compile done; overlap for speed
  # 2026-04-29: enable shard prefetch + 1-iter-lagged async test eval. Both
  # overlap iter-boundary work onto the prior iter's selfplay phase. Saves
  # ~80-150s/iter (zarr decode) + ~30-50s/iter (test eval). Snapshot in
  # async_eval reuses trainer's compile mode so shared inductor cache hits.
  distributed_prefetch_shards: true
  distributed_async_test_eval: true
  distributed_async_test_eval_timeout_s: 120.0
  distributed_worker_shared_cache_dir: /home/josh/projects/chess/runs/pbt2_small/server/worker_cache
  distributed_min_workers_per_trial: 1
  distributed_max_worker_delta_per_rebalance: 1
  distributed_wait_timeout_seconds: 720  # 2026-05-19: 600->720 to give current-model selfplay more time after lowering stale backlog target.
  distributed_prev_model_max_fraction: 0.60  # 2026-05-19: raise 50%->60% to reduce alternating stale-discard timeout rows while keeping most data current-model.
  distributed_stale_pause_target_games: 1870  # 2026-05-28: scale with 3520 games/iter target.
  distributed_min_games_fraction: 0.90  # 2026-05-28: wait for 90% of target games before timing out.
  distributed_server_port: 45453
  distributed_server_host: 0.0.0.0
  distributed_server_public_url: http://192.168.1.212:45453
  distributed_server_root_override: /home/josh/projects/chess/runs/pbt2_small/server
  tune_replay_root_override: /home/josh/projects/chess/runs/pbt2_small/replay

  # Disk-backed replay buffer: keeps ~1 GB per trial instead of ~10 GB
  shuffle_buffer_size: 25000  # In-memory shuffle buffer (run26 value)
  shuffle_refresh_interval: 1
  shuffle_refresh_shards: 5
  shard_size: 2000            # Samples per on-disk shard (~1 MB compressed)
  # On PB2 exploit (cross-trial restore), replace most recent local bad data and
  # import only latest-generation shards from strong sibling trials.
  exploit_replay_refresh_enabled: true   # Flush old data + copy donor data on exploit
  exploit_replay_skip_newest: 0
  exploit_replay_donor_shards: -1          # -1 = copy ALL donor shards; 0 = disabled; N = last N shards
  exploit_replay_share_top_enabled: true
  exploit_replay_top_k_trials: 3
  exploit_replay_top_within_best_frac: 0.05
  exploit_replay_top_min_metric: 0.0
  exploit_replay_max_unseen_iters_per_source: 1
  exploit_replay_share_fraction: 0.5
  exploit_replay_local_keep_recent_fraction: 0.0   # Flush ALL old data on exploit
  exploit_replay_local_keep_older_fraction: 0.0    # Flush ALL old data on exploit

  # PB2: exploit+explore every X iterations (was 20).
  pb2_perturbation_interval: 8

  tune_metric: opponent_strength_ema
  tune_mode: max

  # Net gating: DISABLED — gate was using 1-sim (raw policy) while selfplay
  # uses 64-sim MCTS, causing systematic rejection of every training step.
  # The model was frozen at iter 2-3 weights with no learning happening.
  # TODO: re-enable once gate uses same sim count as selfplay, or compare
  # new model vs old model instead of new model vs Stockfish.
  gate_games: 0           # 0 = disabled
  gate_threshold: 0.50
  gate_interval: 1
  gate_mcts_sims: 1

  # For eval: run fixed-strength eval games to get a cleaner metric than train_loss.
  # Disabled by default to keep the small-model run fast.
  eval_games: 0
  eval_sf_nodes: 500
  eval_mcts_simulations: 32

  holdout_fraction: 0.02
  holdout_capacity: 2000
  test_steps: 5

  freeze_holdout_at: 0
  reset_holdout_on_drift: false
  drift_threshold: 0.0
  drift_sample_size: 128

  # Binary dimensions: keep pinned during small-model search.
  search_smolgen: false
  search_nla: false
  search_optimizer: false
  search_optimizer_choices: [cosmos_fast]

  # Expanded PB2 search: opponent_strength stagnated at ~18.7 for 80+ iters
  # with only lr + w_wdl searched. Open up more dimensions to break plateau.
  #
  # Only pb2_bounds_* keys present here are searched; everything else is pinned.
  pb2_bounds_lr: [0.0003, 0.0003]  # 2026-07-02: re-pinned at 0.0003 (flat-LR revert; scheduler bounds hotpatch on resume)
