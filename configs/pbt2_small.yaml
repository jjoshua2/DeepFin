  #   `# DELETED` note is not a guard, so both keys stay, as games_per_iter_start does above.
  lr_T_mult: 1
  lr_schedule: sqrt_release
  lr_release_cycle_steps: 0
  lr_release_start_frac: 0.80
  lr_release_min_scale: 0.1   # 2026-07-02: 1.0→0.1 restored (sqrt_release decays to 0.1x again) — flat-LR experiment reverted with the lr key above.
  lr_release_shape: sqrt
  use_compile: true    # 2026-04-27: re-enabled with max-autotune. The earlier "compile destroys trainer" diagnosis turned out to be a prefix bug, not a compile-backward bug — saving under compile created `_orig_mod.`-prefixed checkpoints, then a later unwrapped load silently dropped all 192 keys (no warning) leaving the trainer fresh-init. Workers running max-autotune have been stable through trial f2f58 (raw_wr 0.81/0.59/0.57 across iters 1-3). Both bugs in the chain are now fixed: Trainer.save() strips the prefix, and load_state_dict_tolerant raises on <50% load.
  compile_mode: max-autotune
  log_level: INFO    # Keep dispatcher/train stats without per-search DEBUG gumbel-profile log overhead.
  swa_start: -1  # Disabled: SWA averaging hurts early training. Enable after model stabilizes.
  swa_freq: 50

puzzle_epd: null
