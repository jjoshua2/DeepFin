  # ============================================================================
  # ADDED (8 keys) -- THE ANCHORED PROMOTION GATE, ARMED IN SHADOW MODE.
  # ============================================================================
  # chess_anti_engine/tune/promotion_gate.py. All 8 keys are in config_yaml.py's TUNE
  # allowlist on origin/main (lines 274-276) and are read ONCE at construction by
  # gate_config_from_dict straight from the config dict -- they are deliberately absent from
