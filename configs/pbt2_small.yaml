  tune_metric: opponent_strength_ema
  tune_mode: max

  # Net gating. The 1-sim vs-Stockfish gate these three keys configured is
  # REMOVED, not disabled: it scored raw policy against a PID-controlled
  # opponent whose 0.50 setpoint equals gate_threshold (so the statistic was
  # pinned to the bar by the controller, not by the model), and rejection
  # restored the weights while the optimizer kept stepping. That is what froze
  # the model at iter 2-3 in 2026-03. gate_games at anything but 0 now RAISES
  # at startup -- "just turn it back on" is not reachable.
  #
  # The replacement is chess_anti_engine/tune/promotion_gate.py: an ANCHORED
  # comparison of the current published net against the previous one, using the
  # vs-SF games the loop already ingests, acting on what is PUBLISHED to the
  # fleet rather than on the training weights. Its knobs are gate_mode /
  # gate_window_iters / gate_min_iters / gate_min_games_per_side /
  # gate_demote_delta_elo / gate_demote_step_elo / gate_alpha /
  # gate_max_hold_iters, all defaulted OFF
  # in code. They are deliberately NOT listed here yet: adding a key to the
  # live yaml before the running process is on code that defines it makes the
  # validator reject the WHOLE reload. Add them at the next restart.
  #
  # AND THE SHADOW READOUT DOES NOT NEED THEM. decide() fills the
  # per-iteration sample BEFORE the gate_mode: off check, so all four
  # gate_sample_* columns are populated at the shipped default. Setting
  # gate_mode: shadow adds only the rolling-window aggregates -- which the
  # readout must NOT be keyed to, they overlap ~95% row-to-row -- and re-arms
  # a ~252 MB export copy every iteration. So the readout runs with no yaml
  # key, no restart-required key, no copy and nothing to revert. Run it with
  #   PYTHONPATH=. python3 scripts/gate_shadow_readout.py <trial>/progress.csv
  # (exit 0 promote / 1 hold / 2 kill / 3 the gate never ran / 4 no such file;
  # a window shorter than the pre-registered 40 iterations holds, never
  # promotes) -- that script is
  # the ledger's deciding rule and the code under test, not a second copy.
  #
  # NOTE distributed_prev_model_max_fraction: 0.60 below is a CEILING THAT
  # NEVER BINDS -- distributed_stale_games is 0 on every recent iteration, and
  # a binding cap would have to discard prev shards into stale_*. The realized
  # split, measured from 418 processed shard .zattrs over iters 164-219, is
  # n_cur ~= 197 / n_prev ~= 38 (prev share 16.3%). Anything sized off the 0.60
  # is wrong, and on the wrong side of the split.
  #
  # What it can resolve, so nobody reads it as a ratchet: per-iteration
  # standard error 45.6 Elo MEASURED, against a loop that gains ~0.02
  # Elo/iteration. That spread is PURE BINOMIAL NOISE -- standardized
  # residuals sit at 1.011 where 1.0 is independent binomial, so there is no
  # anchor-drift variance in it. (An earlier revision of this comment said
  # "41.5 predicted from binomial alone", implying excess variance. That
  # comparison used 1/mean(n); the honest per-window figure is 61.1 Elo, so
  # 45.6 is BELOW binomial, not above.)
  #
  # At the default 24-iteration window (~4.5 h) the window se is 9.3 Elo and
  # the shipped demote line is -45 -> -25. QUOTE THE LINE WITH THE CLAIM:
  # a sustained -50 Elo/iteration break is caught at 92.5% power in one window
  # AT -25, and at only 23.9% at -45. It does NOT catch the 2026-06
  # warm-start class (-6.7 Elo/iteration) at any reachable window or line
  # (worst-case power 0.29%). It is a regression alarm, not a selection step;
  # no affordable measurement can select on 0.02 Elo. The slow-bleed job stays
  # with scripts/daily_gate_ratchet.sh's cumulative vs-frozen-anchor series.
  #
  # TIME TO TRIP: an earlier revision of this comment said "a -100/-200 break
  # trips inside the 8-iteration floor (~1.5 h)". EIGHT IS THE COLD-WINDOW
  # NUMBER -- the latency from an EMPTY window, which production never has.
  # From a steady-state 24-row window the 23 healthy pre-break rows sit in the
  # mean until they age out. Measured, 400 seeds/row:
  #   -50/iter  median 20 (p90 26) | -100/iter median 12 (p90 15)
  #   -200/iter median  8 (p90 10) | -300/iter median  6 (p90  8)
  # So -100 costs a median ~2.4 h in production, not 1.5.
  #
  # AND A SINGLE-ITERATION STEP OF ANY MAGNITUDE CANNOT MOVE THAT RULE. The
  # anchored delta is a FIRST DIFFERENCE (cur minus prev, both re-measured
  # every iteration), so a level shift of -M Elo -- a bad merge, a broken loss
  # term, a mis-set LR -- appears in exactly ONE sample. For a window of K
  # deltas with one -M and the rest 0: mean = -M/K, se = M/K exactly, so
  # elo_hi = (M/K)(t-1), which is POSITIVE for every t>1 and M CANCELS. At
  # K=24/alpha=0.05 a -1,000,000 Elo one-shot reads elo_hi = +29,754. Raising
  # K, lowering alpha or moving the line cannot help.
  # That is what gate_demote_step_elo is for: a SECOND leg on THIS iteration's
  # own sample, evaluated before the min_iters window check, OR-ed into demote
  # only (it can never create a promote). It ships at -125 on the same
  # false-brake budget as the window line: 0.02-1.31 spurious holds per 8000
  # null iterations across the admissible arm shapes. It catches a step of
  # about -195 Elo at 50% power and -249 at 90%, and it does NOT catch a -100
  # step -- one anchored sample carries 42-64 Elo of binomial noise.
  #
  # SHADOW-MODE READOUT: watch gate_would_demote, not gate_decision.
  # gate_decision == 1 covers FOUR situations (nothing fired; shadow suppressed
  # a window demote; shadow suppressed a step demote; the hold cap yielded).
  # gate_would_demote is 1.0 exactly when the demote rule fired, whatever the
  # mode did with it. gate_reason_code still says which leg:
  # 5 demote_regression, 6 shadow_would_demote, 7 hold_expired, 8 demote_step,
  # 9 shadow_would_demote_step.
  #
  # AND THE ANCHORED DELTA CARRIES A CONTROLLER TERM. An earlier revision of
  # this comment inherited the module's claim that both arms face the same
  # opponent, so the controller's movement would subtract out of the anchored
  # difference. IT DOES NOT. Model and
  # difficulty ship in the SAME recommended_worker manifest and are applied
  # together, so a shard tagged with the previous sha was also played one PID
  # step behind on wdl_regret/sf_nodes -- old-model-at-new-difficulty is not an
  # observable state. The offset's SIGN OPPOSES the model change (the PID eases
  # the opponent when the net weakens), so it MASKS regressions. Measured on
  # this trial's progress.csv: corr(pid_raw_winrate_t, pid_regret_delta_{t+1})
  # = -0.303 (n=42), and the implied offset has median |4.96| Elo, p90 20.9,
  # with 5.9% of healthy iterations exceeding the whole -25 line. The -4.33 Elo
  # offline bound was measured UNCONDITIONALLY on a healthy loop and does NOT
  # apply during a break. gate_sample_confound_elo reports the predicted term
  # next to gate_sample_delta_elo so this is falsifiable from production data.
  #
  # AND IF YOU EVER SET gate_mode: enforce, know that the brake is PARTIAL:
  # a hold puts the fleet on one sha, so cur_games goes to 0 and the gate
  # observes zero rows that evict real samples from its own window. It then
  # reads NOT_RUN and releases. Measured: 55-66% of iterations held under a
  # sustained break, never 100%. That is fail-open, not unsafe, but it is not
  # what "hold the published model" sounds like.
  gate_games: 0           # DEAD KEY: must stay 0
  gate_threshold: 0.50    # DEAD KEY: inert
  gate_interval: 1        # DEAD KEY: inert
  gate_mcts_sims: 1       # DEAD KEY: inert

  # For eval: run fixed-strength eval games to get a cleaner metric than train_loss.
  # Disabled by default to keep the small-model run fast.
  eval_games: 0
  eval_sf_nodes: 500
  eval_mcts_simulations: 32

  holdout_fraction: 0.02
  holdout_capacity: 2000
  # INERT since the deterministic holdout eval (audit G14): the eval is a full
  # pass over the frozen set, so the batch count is holdout rows / batch_size
  # (2000 / 512 = 4, the last one ragged at 464) and nothing reads this value.
