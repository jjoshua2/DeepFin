  # dir names lie: syzygy_3-4-5 also holds all 365 six-man WDL files, so SF
  # has probed 6-man WDL in search all along — this change only adds 6-man
  # DTZ (root ranking + 50-move-exact conversion), which lives in syzygy_6.
  stockfish_syzygy_path: /home/josh/projects/chess/data/syzygy_3-4-5:/home/josh/projects/chess/data/syzygy_6
  syzygy_adjudicate: true
  syzygy_adjudicate_fraction: 0.99
  syzygy_in_search: true
  syzygy_rescore_policy: false
  timeout_adjudication_threshold: 0.99
  # PIN (all 5). The KEYS are decorative -- the worker never builds a DiffFocusConfig from
  # the published reco, so selfplay runs the dataclass defaults, which these lines now equal.
  # ⚑ DELETING THEM WOULD NOT DISABLE DIFF-FOCUS. The FEATURE is live as sampling pressure
  # (audit H2: the entire replay-priority spread, CV 0.94, top decile 31.5% of mass); the
  # "0.005% of gradient" figure was gradient SHARE only. These lines are the self-
  # invalidating tripwire rl_loop_audit A7 relies on. Deciding the FEATURE is its own
  # readout, not a config-rebuild decision.
  diff_focus_enabled: true
  diff_focus_q_weight: 6.0
  diff_focus_pol_scale: 3.5
  diff_focus_slope: 3.0
  diff_focus_min: 0.025
  # ⚑ THE ONE CHANGE HERE WITH A MEASURED DEFECT BEHIND IT (tasks #171/#173). The
  # iter-736 search change moved `difficulty`'s absolute scale with no key edited and no
  # value out of range, and the fixed thresholds above went with it:
  #   keep_prob_mean      0.800  -> 0.958
  #   keep_limited_frac   0.3786 -> 0.1088
  #   priority_std        1.236  -> 7.389
  #   grad_hard_clip_rate 0.0    -> 0.824   (onset iter 782)
  # Normalising by a running reference quantile makes the keep/priority gates mean the
  # same thing across a search change. norm_slope REPLACES diff_focus_slope (different
  # units) -- diff_focus_pol_scale is deliberately LEFT at 3.5, because also applying the
  # runbook's pol_scale -> 0.45 point calibration would double-correct.
  diff_focus_norm_enabled: true
  # The five below are pinned EQUAL to the code defaults (selfplay/config.py:138-159,
  # trial_config.py:320-325) rather than omitted. An absent key is not "off", it is the
  # realized default, and this file is the only place the realized value is readable.
  # ⚑ The five keys above are NOT read by the distributed worker -- it takes
  # DiffFocusConfig() defaults and they are pinned equal to them as config
  # honesty (tests/test_reco_coverage.py). The six below ARE plumbed through
  # build_recommended_worker -> worker -> DiffFocusConfig, so they are real
  # knobs. Task #171: `difficulty` is unnormalized, so diff_focus_slope/_min are
  # fixed thresholds on a quantity whose scale belongs to the SEARCH config. The
  # 2026-08-09 bundle moved KL ~11.7x and saturated the clamp (keep_rate 0.803
  # -> 0.956) with no key changed and no value out of range. When enabled,
  # `difficulty` is divided by a running reference quantile first and
  # diff_focus_norm_slope REPLACES diff_focus_slope (different units).
  # DEFAULT OFF and bit-identical. Do not enable without the ledger entry's
  # readout: it changes which plies are recorded and how they are sampled.
  diff_focus_norm_window: 8192
  # ⚑ PER ESTIMATOR, and one estimator is built per SelfplayState -- i.e. per
  # selfplay THREAD, not per worker. At --selfplay-threads 32 on 4 workers that
  # is 128 x 1024 = 131,072 policy-bearing plies of warm-up per restart (~8.7%
  # of a 1.5M-row window), and each estimator sees 1/32 of its worker's ply rate
  # so it also takes 32x the wall clock. Warm-up rows are recorded on the
  # UNNORMALIZED branch: diff_focus_slope 3.0 against the moved KL scale, and an
  # unclipped `priority`. Measured 2026-08-12 on the live replay window: ~160k of
  # 1,498,168 rows written unarmed across the two restart transients it held,
  # priorities to 17.59 against a clip of 8.0, each not clear until ~37 min in.
  # progress.csv shows the same: diff_focus_priority_max above the clip for
  # iters 1-8 after one restart and 1-23 after the previous one.
  # diff_focus_norm_shared below removes the 32x; do not "fix" this by shrinking
  # the warm-up, which only buys a noisier reference quantile.
  diff_focus_norm_warmup: 1024
  diff_focus_norm_quantile: 0.5
  # 1.62 reproduces the mean realized keep_rate of the whole healthy era (iters 1-735 of
  # trial 379f6, mean 0.8156) -- NOT the 0.8029 of iters 560-735, which is the bottom of
  # a 700-iteration drift that is itself an artifact of this same unnormalized scale.
  diff_focus_norm_slope: 1.62
  diff_focus_norm_clip: 8.0
  # One estimator per WORKER, shared by all its selfplay threads, instead of one
  # per thread. Changes no arithmetic on the armed path -- only how many
  # estimators exist and therefore how fast one arms. DEFAULT OFF = today's
  # per-thread behaviour, bit-identical. Restart-only (the thread count is fixed
  # when the session's threads launch). Enabling it is a data-affecting change:
  # it moves the post-restart transient's rows from raw units onto the normalized
  # branch, so it needs its own ledger entry and readout.
  diff_focus_norm_shared: false

  # PIN (both). Unpublished, pinned equal to the worker dataclass defaults; tripwire value
  # only. Deleting them is neutral today and stops being neutral the day they are wired.
  categorical_bins: 32
  hlgauss_sigma: 0.04
  record_lc0_root_input: true

train:
  optimizer: aurora
  matrix_optimizer_scope: mlp_out
  matrix_lr_multiplier: 20
  # PIN. Numerically ~0.35% total shrink over 58k steps, but rl_loop_audit I13 showed this
  # was a BROKEN control surface for 7+ weeks (Optimizer.load_state_dict overwrote it from
  # the checkpoint every resume) and PR #260 fixed it by pinning the yaml to the realized
  # 1e-4. Deleting the line re-opens the resume-overwrite trap. Changing the VALUE is now a
  # real training change and needs its own ledger entry.
  matrix_weight_decay: 0.0001
  aux_weight_decay: 0.0001
  aurora_uw_floor: 0.0
  aurora_pp_iterations: 3
  aurora_pp_beta: 0.25
  # RESOLVED 2026-08-04 (ledger bf9585789): A8 v2 ABORTED -- SHIP 8. The re-based
  # instrument-gate leg FAILED and the rig's own offline derivation refuted the re-base
  # premise (this momentum regime matches ckpt478's: 12.369 vs #327's 12.07). NO outcome
  # metric was ever read, so 12 has no verdict behind it; the null (PE-8 significant-
  # subspace ratio 1.0000, ledger 210f6810a) remains pre-declared plausible. The setting
  # provably DEPLOYS (binary leg 4/4 runs), so a future A8 needs only a sound confirming
  # leg -- derived offline on ONE shared momentum, not a cross-run column (the live square
  # sv_ratio column has 22x per-chunk spread; arm and control momenta diverge after step 1).
  # See open_decisions.md decision 2.
  aurora_polar_steps: 8
  aurora_polar_method: polar_express
  aurora_polar_dtype: fp16
  # PIN. LOAD-BEARING at 1.01 under the CURRENT (Frobenius) normalization: s < sigma_max is
  # a measured CLIFF (1.0001 -> 0/16 non-finite; 1.1 -> 16/16 NaN). The interaction rule from
  # addendum II: Frobenius normalization => safety 1.00 is free; tight sigma_max
  # normalization => safety 1.01 is load-bearing; never both.
  aurora_polar_safety: 1.01
  lr: 3.0e-05
  batch_size: 512
  # PIN (both). Never read -- 0 of 478 iterations hit the ingest-drought fallback -- but they
  # ARE the documented drought floor and runaway cap for the views-targeting budget. On the
  # fresh-window regeneration, ingest droughts are exactly the regime that becomes reachable.
  train_steps: 800
  train_window_fraction: 0.04
  # PRE-REGISTERED 5.0 -> 4.3 (ledger 22891e8cc, 2026-08-02).
  #   Hypothesis: views/row is at or just above its optimum; 4.3 is inside the same flat
  #   basin (offline L-wide ladder: 4.33/4.80/5.27 within 0.0007 nats, far below the seed
  #   floor) and matches KataGo's proven ~4 rather than our own noisy argmin.
  #   ⚑ THE ENTRY DECLARES ITSELF UNREADABLE: 4.3-vs-5.0 is below the rig's own seed floor.
  #   This is a change made on PRIOR, not on evidence. There is no success test.
  #   DECIDING YARDSTICK IS A GUARD, NOT A SUCCESS TEST: realized `train_views_actual` must
  #   land in [4.0, 4.6] on the first 5 new iterations
  #     grep -h train_views_actual runs/pbt2_small/tune/*/progress.csv
  #   KILL: realized views outside [4.0, 4.6], OR `policy_loss` worse by >0.02 nats vs the
  #   pre-change 5-iteration mean -> revert to 5.0 (live-tunable, no restart).
  #   Target 4.3 NOT 4.0: 4.0 sits on the plateau's edge and realized views drift from the
  #   configured knob (live realized 5.013 against a configured 5.0).
  train_views_per_ingested_position: 4.3
  # DELETED no_amp: TWO consumers, and the deleted value False is the fallback on both.
  #   [run.py] derives use_amp = not no_amp from the argparse value (store_true, default False);
  #   [scripts/train_bootstrap.py] reads the yaml key directly, use_amp=not flat.get("no_amp",
  #   False), on the same flatten_run_config_defaults path as bootstrap_dir above. use_amp stays
  #   True either way -- unlike lr_T0/lr_T_mult below, whose bootstrap fallbacks DIFFER
  # PIN + OWED OBSERVABLE. Already 0.0 in the live yaml since 2026-07-30 (audit M8 arm C),
  # so this package changes NOTHING here -- but the change has never been PROVEN in effect:
  # the key is construction-time (assigned only in Trainer.__init__, trainer.py:1757) while
  # sitting in config_yaml.py's LIVE allowlist, so a live edit is accepted and does nothing,
  # and a --resume restores the trial config for construction-time keys. VERIFY on the first
  # new progress.csv row: reported `feature_dropout_p` (trainable_report.py:1435) reads 0.0,
  # not 0.10. Guardrail (no success criterion by design): value_regret --max-positions 0
  # paired vs the pre-restart dump worse by >2cp with the CI excluding 0 => restore 0.10.
  feature_dropout_p: 0.0
  # DELETED resid_channel_dropout: 0.0 = off ([model/transformer.py] needs >0); consumer default
  #   matches ([train/trainer.py] _f(...,0.0))
  # DELETED resid_channel_balance_weight: 0.0 = off ([model/transformer.py]); consumer default
  #   matches ([train/trainer.py] _f(...,0.0))
  zclip_z_thresh: 2.0
  zclip_alpha: 0.97
  zclip_clip_factor: 1.0
  zclip_max_norm: 6.5
  w_policy: 1.0
  w_soft: 1.0
  w_future: 0.01
  w_wdl: 1.0
  w_sf_move: 0.05   # bt4heads bundle 2026-08-15 (was 0.0)
  w_sf_own: 0.0
  # ⚑ SF POLICY SUPERVISION ARM, launched 2026-08-17 at iteration 191.
  # Prereg + calibration: docs/experiment_ledger.md (2026-08-17). Weights set by
  # EQUAL ~10% gradient-norm share each (joint ~21%), measured per COVERED row on
  # the live replay window -- NOT by an optimum sweep; the A:F ratio is UNMEASURED.
  # ⚑⚑ DO NOT RETUNE THESE MID-RUN. A weight MAGNITUDE change does not move the
  # holdout ruler id, so it re-opens the best-model freeze. Changing them needs a
  # restart. Same applies to use_adjusted_wdl_target / adjusted_wdl_regret_* /
  # wdl_terminal_outcome_* -- live-pushable and NOT ruler-covered.
  # ⚑ F-ONLY ARM, 2026-08-18 at iteration ~297 (prereg ledger 5a220c395). Arm A OFF.
  # A+F was NULL on policy quality (n=4000 paired deep-SF audit: raw E[regret]
  # +0.23 cp [-0.72, +1.17]). That null cannot separate "F does nothing" from
  # "F works and A opposes it", and A is the measured radial sharpener
  # (G_logtemp +0.027 weighted) with ~69% of its signal from the FABRICATED
  # regret tail, while F is the flattener (-0.031) with genuine-SF membership.
  # ⚑ 0.7 -> 0.0 is a MEMBERSHIP change, so eval_ruler_id MOVES and the
  # best-model freeze re-opens correctly -- unlike a magnitude retune.
  w_sf_own_regret: 0.0   # arm A: OFF (was 0.7 from 2026-08-17 iter 191)
  w_sf_policy_floor: 0.8   # arm F: SF-approved-move probability floor + collar
  sf_policy_floor_delta_cp: 20.0
  sf_policy_floor_tau: 0.15
  sf_policy_floor_tau_top1: 0.15
  # sf_policy_floor_tau_played: deliberately ABSENT so it stays DERIVED from the
  # trial's gumbel_topk (1/16 = 0.0625). Pinning it would silently stop tracking
  # a gumbel_topk change.
  w_sf_eval: 0.0
  w_categorical: 1.0   # bt4heads bundle 2026-08-15 (was 0.0) — the head is now TRAINED
  rebuild_categorical_target: true   # bt4heads bundle 2026-08-15
  w_volatility: 0.1
  w_sf_volatility: 0.05
  w_moves_left: 0.02
  # FLIP sf_wdl_frac: 0.5 -> 0.45
  #   PIN TO REALIZED. _dynamic_sf_wdl_weight interpolates from this at regret 0.70 down to
  #   sf_wdl_frac_floor at regret 0.10; realized wdl_regret has never reached 0.10 (max 0.0984) so
  #   sf_wdl_frac reads 0.45 on 478/478 rows. rl_loop_audit I5 + the A5 rule ('pin a dead key to the
  #   realized value the same day'). SIDE EFFECT, STATED: this also removes the cliff where one PID
  #   ease-step past the 0.10 knee would silently start raising the SF share mid-run.
  #   ⚑ THIS IS BRIEF BLOCKER #5, CLOSED BY PINNING. The measured max wdl_regret 0.0984 sits
  #   ONE PID ease-step below the 0.10 knee; past it the value target changes with no metric
  #   watching the distance. With frac == floor == 0.45 the interpolation is the constant
  #   0.45 and the knee cannot fire. The yaml's 0.50 NEVER RAN in 478/478 iterations.
  sf_wdl_frac: 0.69
  # PIN. The FLOOR is the live knob and it is what 478/478 rows actually realized. Realized
  # blend at iter 478 = 0.35 outcome / 0.45 SF / 0.20 search. The SF component is
  # LOAD-BEARING: zeroing it crashed winrate 0.64 -> 0.40.
  sf_wdl_frac_floor: 0.69
  search_wdl_frac: 0.31
  use_adjusted_wdl_target: false
  # DELETED adjusted_wdl_regret_source: downstream of use_adjusted_wdl_target: false -- the
  #   [train/losses.py] gate never opens; consumer default matches ([train/trainer.py]
  #   .get(...,'sum'))
  # DELETED adjusted_wdl_regret_scale: downstream of use_adjusted_wdl_target: false
  #   ([train/losses.py]); consumer default matches ([train/trainer.py] _f(...,1.0))
  # DELETED adjusted_wdl_regret_cap: downstream of use_adjusted_wdl_target: false
  #   ([train/losses.py]); consumer default matches ([train/trainer.py] _f(...,0.0))
  sf_wdl_conf_power: 1.0
  sf_wdl_draw_scale: 0.55
  sf_wdl_floor_at_regret: 0.1
  # DELETED sf_wdl_temperature: 1.0 is the IDENTITY -- [train/losses.py] skips the p^(1/T)
  #   softening at exactly 1.0; consumer default matches ([train/trainer.py] _f(...,1.0)).
  #   [scripts/value_optimism.py] names this key too, but only in _REALIZED_FROM_PROGRESS and
  #   _NEUTRAL_BLEND_KNOBS: it reads the REALIZED value out of progress.csv and never off the
  #   yaml flat dict, so absence here is invisible to it. Contrast the two sf_search_dampen_*
  #   keys below, which that same script REQUIRES to be present in the config
  # ⚑ RETAINED, do not delete sf_search_dampen_sf_low: a SECOND consumer REQUIRES THE KEY TO
  #   BE PRESENT, and it is not a `.get(key, default)` any name-shaped scan can see.
  #   [scripts/value_optimism.py] lists this key in the module-level constant tuple
  #   _CROSSCHECK_YAML_VS_PARAMS and reaches it through a LOOP VARIABLE in
  #   resolve_blend_knobs, which raises SystemExit("... is absent from the config; it must be
  #   present to be checked") on the flat dict built by flatten_run_config_defaults(--config)
  #   -- before any model or data work, so deleting the key breaks that script at startup.
  #   The requirement is deliberate, not incidental: the function's docstring refuses to let
  #   an absent key fall back to the neutral value. RESTORED to this yaml on 2026-08-10 in
  #   534b6397d, after the 08-04 minimal-core bundle (67191f995) had deleted both on the
  #   reasoning "0.0 = off" -- true about their VALUE and irrelevant to their PRESENCE, which
  #   left the value-optimism ruler exiting at startup rather than merely defaulted.
  #   Inert on the TRAINING path only (0.0 = off, [train/losses.py] multiplies by it;
  #   consumer default matches, [train/trainer.py] _f(...,0.0))
  # ⚑ RETAINED, do not delete sf_search_dampen_sf_high: same second consumer, same mechanism --
  #   [scripts/value_optimism.py] requires this key's presence via _CROSSCHECK_YAML_VS_PARAMS and
  #   resolve_blend_knobs raises SystemExit without it. Inert on the training path
  #   ([train/losses.py] multiplies by it; consumer default matches [train/trainer.py]
  #   _f(...,0.0)), and never reached there. A PRESENCE CHECK IS NOT A VALUE READ, and a
  #   `# DELETED` note is not a guard, so both dampen keys stay -- restored together in
  #   534b6397d and not to be re-deleted
  sf_search_dampen_sf_low: 0.0
  sf_search_dampen_sf_high: 0.0
  accum_steps: 1
  warm_start_lr_max_ratio: 2.0
  # FLIP 72 -> 1000 (2026-08-05 boot-hygiene package, diagnosis D3): iteration 1 of a fresh
  # boot runs ~800 optimizer steps (views-targeting over the seeded window) and 72 covered
  # 9% of them — the rest ran at full LR, 95% unclipped, before the zclip EMA had history.
  # 1000 spans the whole first-iteration blast plus slack. Deploy proof: opt_lr_mean well
  # below peak through iteration 1. Negligible effect at steady state (~88 steps/iter).
  warmup_steps: 1000
  lr_eta_min: 1.0e-05
  # DELETED lr_T0: inert on the TRAINING path only. lr_schedule: sqrt_release below takes the
  #   elif, so [train/trainer.py]'s CosineAnnealingWarmRestarts branch -- the only reader of
  #   T_0 -- never runs, and trainer_kwargs_from_config's own default is never used either.
  #   ⚑ NOT inert for the SECOND consumer: [scripts/train_bootstrap.py] reads this key straight
  #   off the yaml flat dict as int(flat.get("lr_T0", 2000)) and never forwards lr_schedule, so
  #   Trainer's OWN default "cosine" applies there and the cosine branch IS the one that runs.
  #   DRIFT, bootstrap only: resolves to 2000, not the 999999 this file used to ship (restarts
  #   at 2000/6000/14000 instead of never). ⚑ THE LIVE BRANCH AND main DISAGREE HERE: main
  #   RETAINS lr_T0/lr_T_mult for exactly that second consumer; the live yaml deleted them in
  #   67191f995 and re-affirmed the deletion in 534b6397d on the narrower training-path
  #   argument. Re-add both keys before pointing scripts/train_bootstrap.py at this config.
  # DELETED lr_T_mult: same second consumer, same mechanism -- [scripts/train_bootstrap.py]
  #   reads int(flat.get("lr_T_mult", 2)) off the yaml flat dict, so DRIFT, bootstrap only:
  #   resolves to 2, not the 1 this file used to ship. Inert on the TRAINING path, where the
  #   cosine branch in [train/trainer.py] is unreachable at lr_schedule: sqrt_release. Deleted
  #   in 67191f995, re-affirmed 534b6397d; main RETAINS it
  lr_schedule: sqrt_release
  lr_release_cycle_steps: 0
  lr_release_start_frac: 0.8
  lr_release_min_scale: 0.1
  lr_release_shape: sqrt
  use_compile: true
  compile_mode: max-autotune
  log_level: INFO
  # PIN (both). SWA/EMA publishing is DEAD for restart v1 -- H2 fails its pre-registered rule
  # and FE proved EMA and rehearsal do not compose (ledger 757db3635 / f7194ad40). Keep
  # swa_start at -1: export_swa publishes the AVERAGED net when swa_start >= 0, it is
  # CONSTRUCTION-ONLY (a live edit is silently inert), and with SWA on, gates and rulers score
  # the RAW net while workers play the average (J10). swa_freq is meaningless at -1 but is
  # exactly the line arm H would flip, so it stays as the pinned twin.
  swa_start: -1
  swa_freq: 50

tune:
  # DELETED min_replay_size: DEAD KEY - it has exactly two surfaces and neither is a reader:
  #   the [utils/config_yaml.py] passthrough allowlist, and the argparse flag
  #   --min-replay-size ([run.py]), which materialises the key at default=0 and is never
  #   read back. INERT because that argparse default (0) IS the deleted value, so the
  #   resolved flat config is identical with the key absent.
  # TWO CLOCKS (audit C4): Ray's RunConfig retention is read once by the driver
  # at launch; the trial's own _prune_trial_checkpoints re-reads this every
  # iteration. A live edit moves the trial-side pruner ONLY -- the two then
  # disagree until run.py is re-run. See driver_dual_clock_config_keys().
  tune_num_to_keep: 6
  tune_keep_last_experiments: 2
  tune_scheduler: gpbt_pl
  # DELETED gpbt_inertia_weight: cross-trial exploit weight ([tune/harness.py]). Dead at
  #   num_samples: 1 -- Ray's PopulationBasedTraining._quantiles() returns ([],[]) for a single trial,
  #   so the lower quantile is always empty and no exploit ever runs. Resolves unchanged at 1.0
  # DELETED gpbt_winner_weight: cross-trial only ([tune/harness.py]); dead at num_samples: 1
  #   (empty lower quantile). Resolves unchanged at 1.0
  # DELETED gpbt_quantile_fraction: cross-trial only ([tune/harness.py]); read only inside the
  #   len(trials)>1 branch, so dead at num_samples: 1. Resolves unchanged at 0.25
  # DELETED gpbt_resample_probability: cross-trial only ([tune/harness.py]); its only reader is
  #   GPBTPairwiseScheduler._get_new_config ([tune/gpbt.py]), reached only for a trial in the LOWER
  #   QUANTILE -- and PopulationBasedTraining._quantiles() returns ([],[]) whenever
  #   len(trials)<=1, which gpbt.py does not override (it subclasses PopulationBasedTraining and
  #   defines only _get_new_config). Read on the INSTALLED Ray -- 2.53.0 in this branch's env,
  #   not the 2.54.0 main's copy of this note names, and the branch is present in both.
  #   Unconditionally dead at num_samples: 1. DRIFT:
  #   resolves to the argparse default 0.05, not 0.20 -- re-add before raising num_samples above 1
  num_samples: 1
  max_concurrent_trials: 1
  # LAUNCH-FIXED (audit C2): read once into tune.Tuner's resource spec. Neither
  # a live reload nor a trial restart applies an edit -- only re-running run.py.
  cpus_per_trial: 1
  gpus_per_trial: 1.0
  distributed_workers_per_trial: 4
  distributed_worker_sf_workers: 8
  distributed_worker_min_games_per_batch: 200
  distributed_worker_max_games_per_batch: 512
  # ⚑ DO NOT EDIT THE USERNAME ON A LIVE RUN. It is in _WORKER_LAUNCH_CONFIG_KEYS
  # (distributed_runtime.py), which _ensure_distributed_workers hashes EVERY
  # iteration, so an edit RELAUNCHES THE WHOLE FLEET within one iteration -- with
  # a username the server has never provisioned, because the auth setup below
  # only ever creates a user on the FIRST run against a given server root. The
  # result is every worker up, authenticating, and getting 401. Change it only
  # between runs, and create the user with manage_users.py first.
  distributed_worker_username: josh
  # ⚑ REMOVED: distributed_worker_password. This file is TRACKED IN A PUBLIC
  # REPOSITORY, so the value that was here is DISCLOSED and stays disclosed in
  # the git history. The credential now comes from $CAE_WORKER_PASSWORD (or the
  # variable named by distributed_worker_password_env, which wins over it, or
  # the gitignored .secrets/worker_password) -- see server/secrets.py. Startup
  # REFUSES if none is set; there is no empty-password fallback, because an
  # empty one would provision a real login on a 0.0.0.0 listener rather than
  # fail. Rotation itself is a separate, operator-gated step (task #161).
  # The provisioning it feeds is FIRST-PROVISIONING-ONLY (audit C3):
  # _prepare_distributed_worker_auth gates BOTH the upsert_user call and the
  # .password file write on `not user_existed`, so against an existing server
  # root -- every run after the first -- changing the secret in the environment
  # changes nothing on the server. Deliberate: an admin rotation via
  # manage_users.py must not be clobbered by a stale launch environment, and the
  # password file stays symmetric with the user record so a worker can never be
  # handed a secret the server does not have. TO ROTATE, USE manage_users.py.
  # Passwords set that way must be >= 8 characters; existing shorter ones keep
  # authenticating (docs/operations.md, "The worker credential").
  distributed_worker_use_compile: true   # Worker compile (max-autotune) has been stable for many iters of training. Was briefly disabled 2026-04-27 to test whether compile was producing wrong outputs after a bad salvage; it wasn't — actual root cause was a corrupted pid_state.json in the iter 403 pool I'd manually built (had iter 408-era values rather than iter 403's).
