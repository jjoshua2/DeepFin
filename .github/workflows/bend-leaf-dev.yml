name: Bend leaf source integrity
on:
  push:
    branches: [feat/bend-owned-leaf-evaluation-dev]
    paths: ['.github/workflows/bend-leaf-dev.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/upload-artifact@v4
        with:
          name: bend-leaf-fragments
          path: .github/leaf-fragment*.txt
          include-hidden-files: true
          retention-days: 2
