name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR branch).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      # CPU torch first so the dev install doesn't pull the large CUDA wheel.
      - name: Install CPU torch
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      # The suite hard-requires its deps (no optional-dep skips), so [dev] pulls
      # in every extra; this also builds the C extensions (encoding + mcts).
      - name: Install package + dev deps
        run: pip install -e ".[dev]"
      # GPU-only tests skip on the CPU runner; `slow` stress tests are excluded
      # from the default run per pyproject's marker.
      #
      # ⚑ CAE_TEST_THREADS=auto lifts `tests/conftest.py`'s 2-thread cap. That cap
      # exists to stop a local test run stealing cores from LIVE TRAINING, which
      # is a condition no CI runner is ever in — and this job has a 30-minute
      # timeout, so capping torch here would buy nothing and spend headroom.
      - name: Run tests
        env:
          CAE_TEST_THREADS: auto
        run: python -m pytest -m "not slow"

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CPU torch
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install package + dev deps
        run: pip install -e ".[dev]"
      # ruff is per-file and deterministic, so it gates the whole repo.
      - name: ruff (whole repo)
        run: ruff check chess_anti_engine scripts tests
      # The repo is kept at zero basedpyright findings with NO baseline, so the
      # type gate runs on the whole repo (scope from pyrightconfig.json) — a
      # changed-files gate lets pre-existing errors hide until an unrelated PR
      # touches the file. (vulture/skylos are subset-sensitive and their exit
      # codes fold in advisory circular-dependency notes, so they stay the local
      # scripts/lint.sh gate rather than a CI blocker. pylint was removed
      # 2026-07-02 — its checks migrated to ruff + basedpyright.)
      - name: basedpyright (whole repo)
        run: basedpyright
