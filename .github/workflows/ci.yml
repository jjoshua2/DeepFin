name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR branch).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"
          cache: pip
      # Resolve the dev pin against the CPU index in the same transaction.
      # The suite hard-requires its deps (no optional-dep skips), so [dev] pulls
      # in every extra; this also builds the C extensions (encoding + mcts).
      - name: Install package + dev deps
        run: |
          pip install -e ".[dev]" --extra-index-url https://download.pytorch.org/whl/cpu
          python -c "import torch; print(torch.__version__); assert torch.version.cuda is None, 'CI requires the CPU wheel'"
      # GPU-only tests skip on the CPU runner; `slow` stress tests are excluded
      # from the default run per pyproject's marker.
      #
      # ⚑ CAE_TEST_THREADS=auto lifts `tests/conftest.py`'s 2-thread cap. That cap
      # exists to stop a local test run stealing cores from LIVE TRAINING, which
      # is a condition no CI runner is ever in — and this job has a 30-minute
      # timeout, so capping torch here would buy nothing and spend headroom.
      # CAE_EXPECT_SLIDER_BACKEND pins which slider arm this leg built. A
      # portable build defines no __BMI2__, so the CBoard extensions select the
      # magic backend — correct and expected here; the pext leg below covers the
      # other arm. Pinning it means "CI tested the sliders" can never quietly
      # become "CI tested whichever sliders the runner happened to produce".
      - name: Run tests
        env:
          CAE_TEST_THREADS: auto
          CAE_EXPECT_SLIDER_BACKEND: magic
        run: python -m pytest -m "not slow"

  # ⚑ WHY THIS LEG EXISTS. The two slider backends are chosen by the
  # PREPROCESSOR, so each build contains exactly one of them and the other is
  # never compiled, let alone run. Each build does verify its own tables
  # exhaustively against the same ray walker at import, which gives
  # PEXT-vs-magic equivalence by transitivity — but only for builds that
  # actually happen, and the job above builds the magic arm every single time.
  # Without this leg the PEXT arm — the one the production host runs — has ZERO
  # CI coverage, and the transitivity argument is about a build no CI machine
  # ever performs.
  pext-sliders:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"
          cache: pip
      # ⚑ FAIL, never skip. A skip here would silently restore the exact hole
      # this job closes, and read green while doing it. GitHub's ubuntu runners
      # (Intel Skylake+ / AMD EPYC Zen 3) have had BMI2 throughout; if that ever
      # stops being true, a red job is the correct and only honest signal.
      - name: Require BMI2 on the runner
        run: |
          grep -qw bmi2 /proc/cpuinfo || {
            echo "::error::runner CPU lacks BMI2; the PEXT slider arm cannot be built or run here"
            exit 1
          }
      # -mbmi2 rather than -march=native, deliberately: native would also define
      # a __znverN__/__bdverN__ family macro, and the gate in
      # _slider_attacks_impl.h excludes the families where PEXT is microcoded —
      # so on an EPYC Rome runner a native build would select MAGIC and this leg
      # would silently duplicate the job above. Asking for the feature and not
      # the family makes the arm deterministic across runner hardware.
      - name: Install package + dev deps (BMI2 / PEXT slider arm)
        env:
          CFLAGS: "-mbmi2"
        run: |
          pip install -e ".[dev]" --extra-index-url https://download.pytorch.org/whl/cpu
          python -c "import torch; print(torch.__version__); assert torch.version.cuda is None, 'CI requires the CPU wheel'"
      # CAE_EXPECT_SLIDER_BACKEND turns "we intended to build PEXT" into an
      # assertion that we did. Without it a flag that stopped taking effect
      # would leave this leg green and meaningless.
      - name: Slider, perft and CBoard suites on the PEXT build
        env:
          CAE_TEST_THREADS: auto
          CAE_EXPECT_SLIDER_BACKEND: pext
        run: |
          python -m pytest -m "not slow" \
            tests/test_slider_tables.py \
            tests/test_perft.py \
            tests/test_cboard_move_parity.py \
            tests/test_cboard_terminal.py \
            tests/test_check_resolver.py \
            tests/test_fastq_see.py \
            tests/test_fastq_search.py \
            tests/test_qsearch_dag_parity.py \
            tests/test_nnue_position_dag.py \
            tests/test_fuzz_smoke.py \
            tests/test_c_extension_freshness.py

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"
          cache: pip
      - name: Install package + dev deps
        run: |
          pip install -e ".[dev]" --extra-index-url https://download.pytorch.org/whl/cpu
          python -c "import torch; print(torch.__version__); assert torch.version.cuda is None, 'CI requires the CPU wheel'"
      # ruff is per-file and deterministic, so it gates the whole repo.
      - name: ruff (whole repo)
        run: ruff check chess_anti_engine scripts tests
      # The repo is kept at zero basedpyright findings with NO baseline, so the
      # type gate runs on the whole repo (scope from pyrightconfig.json) — a
      # changed-files gate lets pre-existing errors hide until an unrelated PR
      # touches the file. (vulture/skylos are subset-sensitive and their exit
      # codes fold in advisory circular-dependency notes, so they stay the local
      # scripts/lint.sh gate rather than a CI blocker. pylint was removed
      # 2026-07-02 — its checks migrated to ruff + basedpyright.)
      - name: basedpyright (whole repo)
        run: basedpyright
