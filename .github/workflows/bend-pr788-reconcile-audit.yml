name: Inspect Bend draw stack conflict
on:
  push:
    branches: [fix/bend-pr788-reconcile-audit-20260921]
    paths: [.github/workflows/bend-pr788-reconcile-audit.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 4322cca38702e76421c73adb7a87f301c2f279e2
          fetch-depth: 0
          persist-credentials: false
      - name: Bank exact parent sources and inspect merge conflicts
        run: |
          git fetch --no-tags https://github.com/jjoshua2/DeepFin.git 474dc5f1f53cae6461a2a6d6c1a20d6fda385dbf
          mkdir -p /tmp/bend-draw-reconcile
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          out = Path('/tmp/bend-draw-reconcile')
          head = '4322cca38702e76421c73adb7a87f301c2f279e2'
          base = '474dc5f1f53cae6461a2a6d6c1a20d6fda385dbf'
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          result = subprocess.run(['git', 'merge-tree', '--write-tree', '--messages', head, base], text=True, capture_output=True, check=False)
          assert result.returncode in (0, 1), result.stderr
          (out / 'merge.txt').write_text(result.stdout + '\nSTDERR\n' + result.stderr)
          tree = result.stdout.splitlines()[0]
          report = {'head': head, 'base': base, 'merge_base': git('merge-base', head, base), 'merge_clean': result.returncode == 0, 'provisional_tree': tree}
          (out / 'summary.json').write_text(json.dumps(report, indent=2) + '\n')
          (out / 'merge.patch').write_bytes(subprocess.check_output(['git', 'diff', '--binary', head, tree]))
          for ref, sha in [('refs/audit/draw', head), ('refs/audit/parent', base)]:
              subprocess.run(['git', 'update-ref', ref, sha], check=True)
          subprocess.run(['git', 'bundle', 'create', str(out / 'review.bundle'), 'refs/audit/draw', 'refs/audit/parent'], check=True)
          print(json.dumps(report, indent=2))
          print(result.stdout)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bend-pr788-reconcile-source
          path: /tmp/bend-draw-reconcile/
          retention-days: 7
