name: Bend-owned history encoding confirmation
on:
  push:
    branches: [feat/bend-owned-encoding-dev]
    paths: ['.github/workflows/bend-owned-encoding-dev.yml']
permissions:
  contents: write
jobs:
  confirm:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify exact local source and apply integration patch
        run: |
          echo '38d901c60554bba06cd6f007b4af326ce8716b1e9f7da745068e70cda5f1b41e  .github/encoding-existing.patch' | sha256sum -c -
          git apply --check .github/encoding-existing.patch
          git apply .github/encoding-existing.patch
          python - <<'PY'
          from pathlib import Path
          import hashlib
          expected = {
              'HistoryEncoding.bend': '56d0d32f04a426b4aefc995d7fd3d4dbb11b2cdafca9f9af699f5014c632af75',
              'EncodingDiagnostic.bend': '6a25508a9ea0224180a8b41894d6823f2642eff36b5f8196aff405a8fbf7fb9c',
              'verify_encoding.py': '57b4f4c02f744364d9b463820d57c56d16dd222dd74c3603853680d9ecd73184',
          }
          for name, sha in expected.items():
              assert hashlib.sha256((Path('native/bend_engine/standalone') / name).read_bytes()).hexdigest() == sha, name
          PY
          git diff --check
      - name: External oracle dependencies only
        run: |
          python -m pip install 'python-chess==1.999' 'numpy==2.2.6' 'ruff==0.15.20' 'basedpyright==1.39.9'
      - name: Build the unchanged C reference outside the candidate runtime
        run: |
          python - <<'PY'
          import ast, subprocess, sysconfig
          from pathlib import Path
          import numpy
          module = ast.parse(Path('setup.py').read_text())
          macros = next(ast.literal_eval(n.value) for n in module.body
                        if isinstance(n, ast.AnnAssign) and isinstance(n.target, ast.Name)
                        and n.target.id == '_CBOARD_FAST_SLIDER_MACROS')
          command = ['cc', '-shared', '-fPIC', '-O1', '-I' + sysconfig.get_paths()['include'],
                     '-I' + numpy.get_include(), *[f'-D{k}={v}' for k, v in macros],
                     'chess_anti_engine/encoding/_lc0_ext.c', '-pthread', '-lm', '-o',
                     'chess_anti_engine/encoding/_lc0_ext' + sysconfig.get_config_var('EXT_SUFFIX')]
          subprocess.run(command, check=True)
          PY
      - name: Static checks with the actual reference extension available
        run: |
          ruff check native/bend_engine/standalone/verify_encoding.py
          basedpyright native/bend_engine/standalone/verify_encoding.py
          bun test native/bend_engine/standalone/verify_compiler.test.js
      - name: Build with the manifest-pinned current U64 compiler
        run: |
          bash native/bend_engine/standalone/build.sh /tmp/bend-owned-encoding
          mkdir -p artifacts
          cp /tmp/bend-owned-encoding/build.txt artifacts/bend-encoding-build.txt
      - name: Generic bitwise encoding and unchanged rule and engine checks
        run: |
          python -m native.bend_engine.standalone.verify_encoding --require-c --report artifacts/bend-encoding-generic.json --command /tmp/bend-owned-encoding/deepfin-bend --threads 1
          python -m native.bend_engine.standalone.verify_rules --report artifacts/bend-rules-generic.json --command /tmp/bend-owned-encoding/deepfin-bend --threads 1
          python native/bend_engine/standalone/verify.py --report artifacts/bend-original-generic.json --command /tmp/bend-owned-encoding/deepfin-bend --threads 1
      - name: Portable native and UBSan encoding and inherited regressions
        run: |
          for mode in portable native ubsan; do
            case "$mode" in
              portable) flags=(-DBEND_U64_PORTABLE) ;;
              native) flags=(-march=native) ;;
              ubsan) flags=(-fsanitize=undefined -fno-sanitize-recover=all) ;;
            esac
            clang -std=c11 -O1 -ffp-contract=off -Werror=shift-count-overflow "${flags[@]}" /tmp/bend-owned-encoding/engine.c -pthread -lm -o "/tmp/bend-owned-encoding/$mode"
            python -m native.bend_engine.standalone.verify_encoding --require-c --report "artifacts/bend-encoding-$mode.json" --command "/tmp/bend-owned-encoding/$mode" --threads 1
            python -m native.bend_engine.standalone.verify_rules --report "artifacts/bend-rules-$mode.json" --command "/tmp/bend-owned-encoding/$mode" --threads 1
            python native/bend_engine/standalone/verify.py --report "artifacts/bend-original-$mode.json" --command "/tmp/bend-owned-encoding/$mode" --threads 1
          done
      - name: Repeat all suites with only one static executable in the runtime
        run: |
          clang -std=c11 -O1 -ffp-contract=off -Werror=shift-count-overflow -static /tmp/bend-owned-encoding/engine.c -pthread -lm -o /tmp/bend-owned-encoding/static
          if readelf -l /tmp/bend-owned-encoding/static | grep -q INTERP; then echo 'dynamic interpreter remains'; exit 1; fi
          runtime="$(mktemp -d /tmp/bend-encoding-runtime.XXXXXX)"
          cp /tmp/bend-owned-encoding/static "$runtime/deepfin-bend"
          test "$(find "$runtime" -mindepth 1 | wc -l)" = 1
          python -m native.bend_engine.standalone.verify_encoding --require-c --report artifacts/bend-encoding-isolated.json --command sudo chroot "$runtime" /deepfin-bend --threads 1
          python -m native.bend_engine.standalone.verify_rules --report artifacts/bend-rules-isolated.json --command sudo chroot "$runtime" /deepfin-bend --threads 1
          python native/bend_engine/standalone/verify.py --report artifacts/bend-original-isolated.json --command sudo chroot "$runtime" /deepfin-bend --threads 1
          {
            file "$runtime/deepfin-bend"
            find "$runtime" -mindepth 1 -printf '%P\n'
            sha256sum "$runtime/deepfin-bend" /tmp/bend-owned-encoding/engine.c
            printf 'Only the static executable is inside this runtime; both Python and C oracles run outside.\n'
          } > artifacts/bend-encoding-isolation.txt
          python - <<'PY'
          import json
          from pathlib import Path
          reports = [json.loads(Path(f'artifacts/bend-encoding-{mode}.json').read_text())
                     for mode in ('generic', 'portable', 'native', 'ubsan', 'isolated')]
          assert all(r['status'] == 'passed' and r['tensor_comparisons_python'] == 505
                     and r['tensor_comparisons_c'] == 501 and r['c_clock_range_skips'] == 4 for r in reports)
          assert {r['ordered_tensor_sha256'] for r in reports} == {'cb7a7e6688a73c5bfbf734769cd6c5f1d3a04609167bf019a4cbfa79d5eb6bbf'}
          PY
      - name: Publish only the clean tested feature tree
        run: |
          git fetch --no-tags --depth=1 origin a3a2333e13fb9176bd31a3dbb3c8d5e18284d36a
          git read-tree a3a2333e13fb9176bd31a3dbb3c8d5e18284d36a
          git add native/bend_engine/standalone/HistoryEncoding.bend native/bend_engine/standalone/EncodingDiagnostic.bend native/bend_engine/standalone/Protocol.bend native/bend_engine/standalone/main.bend native/bend_engine/standalone/verify_encoding.py native/bend_engine/standalone/README.md docs/experiments/README.md docs/experiments/2026-09-20-bend-history-encoding.md
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          commit="$(git commit-tree "$(git write-tree)" -p a3a2333e13fb9176bd31a3dbb3c8d5e18284d36a -m 'Encode the 112-plane neural history block directly in Bend')"
          git push origin "$commit":refs/heads/feat/bend-owned-history-encoding
          printf '%s\n' "$commit" > artifacts/bend-encoding-commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bend-owned-encoding-confirmation
          path: |
            artifacts/bend-encoding-*
            artifacts/bend-rules-*
            artifacts/bend-original-*
          retention-days: 30
