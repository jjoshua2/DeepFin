name: Isolated FIFO scheduler work
on:
  push:
    branches: [work/bend-fifo-scheduler-20260923]
    paths: ['.github/workflows/fifo-scheduler-work.yml', '.fifo-payload-*.b64']
permissions:
  contents: write
  actions: read
concurrency:
  group: fifo-scheduler-qualification
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      BASE: bb1847d2d7f3c4e8b94e5dfb9f64bfc87e0c3390
      FEATURE: feat/bend-fifo-cohort-20260923
      BEND_NO_TELEMETRY: '1'
      CAE_TEST_THREADS: '2'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      MAX_JOBS: '1'
      CUDA_VISIBLE_DEVICES: ''
      PYTHONUNBUFFERED: '1'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact source transport and prepare isolated parent checkout
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin "$BASE"
          git worktree add --detach "$RUNNER_TEMP/fifo-work" "$BASE"
          python3 - <<'PY'
          import base64, hashlib, os, pathlib, subprocess, zlib, json
          text = ''.join(pathlib.Path('.fifo-payload-'+str(i)+'.b64').read_text().strip() for i in (1,2))
          # Correct known text-transport transcription only; the exact decoded hash is mandatory.
          text = text.replace('W5EacWWb','W5EacWb').replace('xz6Fo2f','xz6bFo2f')
          raw = zlib.decompress(base64.b64decode(text, validate=True))
          assert hashlib.sha256(raw).hexdigest() == 'fe8af64694c80a12d5d80175de9fda361615bc7daedc5549e49f3835a2b7b068'
          work = pathlib.Path(os.environ['RUNNER_TEMP'])/'fifo-work'
          patch = pathlib.Path(os.environ['RUNNER_TEMP'])/'fifo.patch'
          patch.write_bytes(raw)
          subprocess.run(['git','-C',str(work),'apply','--check',str(patch)],check=True)
          subprocess.run(['git','-C',str(work),'apply','--index',str(patch)],check=True)
          paths = subprocess.check_output(['git','-C',str(work),'diff','--cached','--name-only'],text=True).splitlines()
          assert len(paths) == 12
          assert not any(p.startswith('.github/') for p in paths)
          manifest = {name:hashlib.sha256((work/name).read_bytes()).hexdigest() for name in paths}
          (pathlib.Path(os.environ['RUNNER_TEMP'])/'fifo-paths.json').write_text(json.dumps(paths))
          (pathlib.Path(os.environ['RUNNER_TEMP'])/'fifo-sources.json').write_text(json.dumps(manifest,indent=2)+'\n')
          subprocess.run(['git','-C',str(work),'diff','--cached','--check'],check=True)
          print('Prepared exact 12-path candidate on',os.environ['BASE'])
          PY
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: astral-sh/setup-uv@v6
        with:
          version: 0.12.10
      - name: Locked CPU environment and exact retained parent C
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/fifo-work"
          uv sync --locked --extra dev --extra cpu
          bash native/bend_engine/install_ci_bend.sh
          python3 - <<'PY'
          import gzip, hashlib, io, json, pathlib, subprocess, zipfile
          blob = subprocess.check_output(['gh','api','repos/jjoshua2/DeepFin/actions/artifacts/10775514198/zip'])
          assert hashlib.sha256(blob).hexdigest() == 'ad81e37c2499280a8b4497fdfa8fc5134a386198f2756754f3e0dbcb6eafc713'
          z = zipfile.ZipFile(io.BytesIO(blob))
          candidates = [n for n in z.namelist() if n.endswith('runner.c.gz')]
          assert len(candidates) == 1
          raw = gzip.decompress(z.read(candidates[0]))
          assert hashlib.sha256(raw).hexdigest() == 'fcb787241c29f10c0fa33fbd8983f9630d3ab52914c109de2449b52a93251a24'
          dest = pathlib.Path('artifacts/fifo-input'); dest.mkdir(parents=True)
          (dest/'parent.c').write_bytes(raw)
          print('Verified exact parent coordinator C')
          PY
      - name: Explicit static and focused Python regression contracts
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/fifo-work"
          . .venv/bin/activate
          ruff check native/bend_engine/multi_root/verify_fifo.py tests/test_bend_fifo_scheduler.py
          basedpyright native/bend_engine/multi_root/verify_fifo.py tests/test_bend_fifo_scheduler.py
          bash -n native/bend_engine/multi_root/qualify_fifo.sh
          python -m pytest -q tests/test_bend_fifo_scheduler.py tests/test_bend_multi_root.py tests/test_bend_async_cohort.py tests/test_bend_cohort_deadlines.py tests/test_neural_work.py --junitxml=artifacts/fifo-python.xml
      - name: Actual coordinator equivalence, controls, deadlines and mutations
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/fifo-work"
          . .venv/bin/activate
          BUN=bun CC=clang-18 CXX=clang++-18 bash native/bend_engine/multi_root/qualify_fifo.sh build/bend_toolchain/sources/aaeb9bc91ff0ff0b3f58dba6a9744c6607e167ae artifacts/fifo-input/parent.c artifacts/fifo-qualified
      - name: Whole-repository lint
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/fifo-work"
          . .venv/bin/activate
          ./scripts/lint.sh
      - name: Preserve verified source and completed readout on a clean feature branch
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/fifo-work"
          python3 - <<'PY'
          import hashlib, json, os, pathlib, shutil, subprocess, xml.etree.ElementTree as ET
          temp=pathlib.Path(os.environ['RUNNER_TEMP'])
          paths=json.loads((temp/'fifo-paths.json').read_text())
          manifest=json.loads((temp/'fifo-sources.json').read_text())
          for name,expected in manifest.items():
              assert hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest()==expected,name
          out=pathlib.Path('artifacts/fifo-qualified')
          summary=json.loads((out/'summary.json').read_text())
          assert summary['status']=='passed' and summary['scheduler_equivalence_pairs']==120
          matrix=json.loads((out/'matrix/matrix.json').read_text())
          assert matrix['status']=='passed' and matrix['all_final_tree_bits_match_serial'] is True
          tests=ET.parse('artifacts/fifo-python.xml').getroot()
          cases=list(tests.iter('testcase'))
          assert cases and not any(list(tests.iter(k)) for k in ('failure','error','skipped'))
          evidence=pathlib.Path('docs/experiments/evidence/fifo-cohort-integration')
          assert not evidence.exists(); evidence.mkdir(parents=True)
          reports={str(p.relative_to(out)):json.loads(p.read_text()) for p in out.rglob('*.json')}
          (evidence/'reports.json').write_text(json.dumps(reports,indent=2)+'\n')
          (evidence/'source.json').write_text(json.dumps(manifest,indent=2)+'\n')
          summary.update({'python_tests_passed':len(cases),'workflow_run':int(os.environ['GITHUB_RUN_ID']), 'base_commit':os.environ['BASE']})
          (evidence/'summary.json').write_text(json.dumps(summary,indent=2)+'\n')
          paths.extend(str(p) for p in evidence.iterdir())
          doc=pathlib.Path('docs/experiments/2026-09-23-fifo-cohort-integration.md')
          text='\n\n## Completed hosted qualification\n\nRun: https://github.com/jjoshua2/DeepFin/actions/runs/'+os.environ['GITHUB_RUN_ID']+'\n\n'
          text+=f'All stages passed. {len(cases)} focused Python cases passed without skips; explicit static checks and whole-repository Ruff/Basedpyright/Vulture passed. '
          text+='The unchanged async matrix passed all ten batch/width configurations in both modes, with two UBSan configurations and four held-control configurations. Existing deadline controls and compiled timer/compaction checks passed. '
          text+='120 additional parent/FIFO pairs matched chronological events, report root order, complete final tree fields and every non-time work field; only the six preregistered time/rate values were excluded. '
          text+='The adapter passed 120 scenarios / 840 rows per normal and UBSan build, and the compiled reversed-requeue mutation was rejected.\n\n'
          text+='Compact reports and exact source hashes are retained in evidence/fifo-cohort-integration/. Modes reuse fixtures, not independent games. No real model, GPU, end-to-end performance, Elo, formal proof, independent review, merge or deployment is claimed. Self-review only.\n'
          doc.write_text(doc.read_text().replace('Pending execution. No full coordinator equivalence result yet.','The completed qualification below supersedes pending execution.')+text)
          subprocess.run(['git','add','--',*paths],check=True)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          actual=subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          assert sorted(actual)==sorted(paths),(actual,paths)
          for name,expected in manifest.items():
              if name.endswith(('.bend','.py','.sh')):
                  assert hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest()==expected,name
          subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          tree=subprocess.check_output(['git','write-tree'],text=True).strip()
          commit=subprocess.check_output(['git','commit-tree',tree,'-p',os.environ['BASE'],'-m','native: use owning FIFO in bounded cohort scheduling'],text=True).strip()
          subprocess.run(['git','push','--force-with-lease=refs/heads/'+os.environ['FEATURE']+':','origin',commit+':refs/heads/'+os.environ['FEATURE']],check=True)
          (out/'feature.txt').write_text(commit+'\n')
          print('PUBLISHED_QUALIFIED_FEATURE',commit)
          PY
      - name: Collect compact reports and generated-source diagnostics
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/fifo-artifact"
          cp .fifo-payload-*.b64 "$RUNNER_TEMP/fifo-artifact/"
          python3 - <<'PY'
          import gzip, os, pathlib, shutil
          temp=pathlib.Path(os.environ['RUNNER_TEMP']); dest=temp/'fifo-artifact'; work=temp/'fifo-work'
          for name in ('fifo.patch','fifo-paths.json','fifo-sources.json'):
              p=temp/name
              if p.exists(): shutil.copyfile(p,dest/name)
          out=work/'artifacts/fifo-qualified'
          if out.exists():
              for p in out.rglob('*'):
                  if p.is_file() and (p.suffix in ('.json','.txt','.log') or p.name=='runner.c'):
                      target=dest/'qualification'/p.relative_to(out); target.parent.mkdir(parents=True,exist_ok=True)
                      if p.name=='runner.c': target.with_suffix('.c.gz').write_bytes(gzip.compress(p.read_bytes()))
                      else: shutil.copyfile(p,target)
          p=work/'artifacts/fifo-python.xml'
          if p.exists(): shutil.copyfile(p,dest/p.name)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fifo-coordinator-qualification
          path: ${{ runner.temp }}/fifo-artifact
          include-hidden-files: true
          retention-days: 30
