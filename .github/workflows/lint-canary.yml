name: lint-canary

# Weekly non-blocking run of the lint gate on the LATEST tool releases
# (the PR gate uses the exact pins in pyproject dev extras). When this run
# goes red, a tool or stub update is about to break the gate — upgrade local,
# fix whatever it flags, and bump the pins in one commit, on your schedule
# instead of mid-PR.
on:
  schedule:
    - cron: "17 6 * * 1"  # Mondays 06:17 UTC
  workflow_dispatch:

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          activate-environment: true
      - name: Install package + dev deps
        run: |
          uv sync --locked --extra dev --extra cpu
          python -c "import torch; print(torch.__version__); assert torch.version.cuda is None, 'CI requires the CPU wheel'"
      # Override the pins with latest — this is the whole point of the canary.
      - name: Upgrade lint tools + numpy to latest
        run: uv pip install --python .venv/bin/python -U ruff basedpyright vulture numpy
      - name: Tool versions
        run: |
          ruff --version
          basedpyright --version
          python -c "import numpy; print('numpy', numpy.__version__)"
      - name: Static validation (latest tools)
        run: python scripts/validate.py lint --require-cpu-wheel
