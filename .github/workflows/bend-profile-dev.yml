name: Bend scalar branch confirmation
on:
  push:
    branches: [feat/bend-perft-profile]
    paths: ['.github/workflows/bend-profile-dev.yml']
permissions:
  contents: write
jobs:
  confirm:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Apply and hash-check the locally tested scalar changes
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          p = Path('native/bend_engine/legal_probe/Chess.bend')
          s = p.read_text()
          needle = 'def color(+b: Board, turn: U32) -> U64:'
          helper = '''# Keep U64 selection scalar. Generic Bool.pick boxes both U64 alternatives
          # on the pinned compiler, then immediately unboxes the chosen value.
          # This monomorphic match preserves the same eager inputs without heap boxes.
          def select_u64(condition: Bool, yes: U64, no: U64) -> U64:
            match condition:
              case True{}: yes
              case False{}: no

          '''
          assert s.count(needle) == 1
          s = s.replace(needle, helper + needle).replace('Bool.pick(U64, ', 'select_u64(')
          needle = '# Transit safety is checked with the old king square vacated.'
          helper = '''# Construct only the retained branch; a generic eager pick allocates a cons
          # even for rejected moves and shares/drops the accumulator unnecessarily.
          def retain_move(reject: Bool, m: Ply, acc: List<&2, Ply>) -> List<&2, Ply>:
            match reject:
              case True{}: acc
              case False{}: Con{m, acc}

          '''
          assert s.count(needle) == 1
          s = s.replace(needle, helper + needle)
          s = s.replace('def filter_after(m: Ply, +acc:', 'def filter_after(m: Ply, acc:')
          s = s.replace('Bool.pick(List<&2, Ply>, check, acc, Con{m, acc})', 'retain_move(check, m, acc)')
          s = s.replace('def castle_finish(m: Ply, start_check: Bool, +acc:', 'def castle_finish(m: Ply, start_check: Bool, acc:')
          s = s.replace('Bool.pick(List<&2, Ply>, Bool.or(start_check, transit_check), acc, Con{m, acc})', 'retain_move(Bool.or(start_check, transit_check), m, acc)')
          p.write_text(s)
          p = Path('native/bend_engine/legal_probe/README.md')
          s = p.read_text() + '''

          ## Scalar branches and opt-in allocation counters

          The hot core uses a typed `select_u64` match instead of generic `Bool.pick`:
          on the pinned compiler this keeps the two U32 limbs scalar rather than boxing
          both alternatives. `retain_move` constructs a list node only when retained,
          without sharing the accumulator with an unused list alternative. These are
          representation changes, not changes to move legality or ordering.

          The opt-in counter diagnostic is separate from ordinary timing and CI:

          ```sh
          python -m native.bend_engine.legal_probe.profile_allocations \\
            --report artifacts/bend-allocations.json
          ```

          It supports `--baseline-chess` exactly like the benchmark. Counts cover only
          the post-warmup traversal and include runtime heap requests, reference-wrapper
          creation/increments and destructor entries. These are instrumented runtime
          function calls, NOT OS allocations, peak bytes, or time shares. Instrumented
          timing is intentionally omitted; use `benchmark.py` for performance. Generated
          C is modified only in a disposable directory; missing or ambiguous anchors
          fail closed. The compiler pin and normal executable source remain unchanged.

          See [the scalar-branch record](../../../docs/experiments/2026-09-18-bend-scalar-branches.md)
          for the controlled old/new comparison and limitations.
          '''
          p.write_text(s)
          p = Path('docs/experiments/README.md')
          s = p.read_text(); i = s.index('| [Bend perft native baseline]')
          s = s[:i] + '| [Bend scalar branches](2026-09-18-bend-scalar-branches.md) | Profile-guided scalar U64/list selection; allocation mechanism and paired perft confirmation, no production adoption |\n' + s[i:]
          p.write_text(s)
          expected = {
            'native/bend_engine/legal_probe/Chess.bend': '3c60db6c73a215e09043e63dff41d93643c77edb7f66237e47fa851362b181f9',
            'native/bend_engine/legal_probe/profile_allocations.py': '26205a8cf5c40ef914313bfbc8fa87a7a7638498357b7f3f1b103c59e6a1897b',
            'tests/test_bend_allocation_profile.py': 'ddda26b57c7590aa6bf3a10072129938a0907c1858650fcf09642dedb0963fdf',
            'docs/experiments/2026-09-18-bend-scalar-branches.md': '5868c9bba1e1b8df85941a437c81c375ef187bd8121bb4868855170207b42245',
            'native/bend_engine/legal_probe/README.md': 'c8d2cab0ea656096bc831d9dbe99948af1d7d983d858b810deebda5d81ace2c7',
            'docs/experiments/README.md': '612b29bc0dffe41e474b26cb00ae97196e1fe6ec33322027a43cd03322ad39cc',
          }
          for name, sha in expected.items():
            actual = hashlib.sha256(Path(name).read_bytes()).hexdigest()
            assert actual == sha, (name, actual, sha)
          PY
          git diff --check
      - name: Install isolated compiler and validation tools
        run: |
          bash native/bend_engine/bitboard_probe/install_toolchain.sh
          python -m pip install 'python-chess==1.999' 'pytest==9.1.1' 'ruff==0.15.20' 'basedpyright==1.39.9'
      - name: Focused lint and cheap contracts
        run: |
          ruff check native/bend_engine/legal_probe/profile_allocations.py tests/test_bend_allocation_profile.py
          basedpyright native/bend_engine/legal_probe/profile_allocations.py tests/test_bend_allocation_profile.py
          mkdir -p /tmp/profile-parser-tests
          cp tests/test_bend_legal_probe.py tests/test_bend_u64_report.py tests/test_bend_perft_benchmark.py tests/test_bend_allocation_profile.py /tmp/profile-parser-tests/
          PYTHONPATH="$PWD" python -m pytest -q /tmp/profile-parser-tests --confcutdir=/tmp/profile-parser-tests
      - name: Four-mode correctness with independent oracle
        run: |
          python -m native.bend_engine.legal_probe.run_probe --python-chess --report artifacts/bend-scalar-correctness.json
      - name: Measure allocation mechanism separately from timing
        run: |
          git fetch --no-tags --depth=1 origin 6b4533e6736fb75ecb43a4cc2dd4ab883fc54ce2
          git show 6b4533e6736fb75ecb43a4cc2dd4ab883fc54ce2:native/bend_engine/legal_probe/Chess.bend > /tmp/Chess.before.bend
          python -m native.bend_engine.legal_probe.profile_allocations --baseline-chess /tmp/Chess.before.bend --report artifacts/bend-scalar-allocations.json
      - name: Paired uninstrumented same-core perft confirmation
        run: |
          python -m native.bend_engine.legal_probe.benchmark --baseline-chess /tmp/Chess.before.bend --samples 3 --report artifacts/bend-scalar-timing.json
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('artifacts/bend-scalar-timing.json').read_text())
          for case in report['results']:
            old = case['summary']['bend_baseline']['median_seconds']
            new = case['summary']['bend']['median_seconds']
            print(case['case'], 'old/new speed ratio:', old / new)
            assert new <= 0.90 * old, 'candidate failed predeclared improvement screen'
          PY
      - name: Publish clean tested feature branch without rewriting earlier work
        run: |
          git rm .github/workflows/bend-profile-dev.yml
          git add native/bend_engine/legal_probe/Chess.bend native/bend_engine/legal_probe/profile_allocations.py tests/test_bend_allocation_profile.py native/bend_engine/legal_probe/README.md docs/experiments/README.md docs/experiments/2026-09-18-bend-scalar-branches.md
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          commit="$(git commit-tree "$(git write-tree)" -p 6b4533e6736fb75ecb43a4cc2dd4ab883fc54ce2 -m 'Keep Bend bitboard selections scalar and avoid unused list branches')"
          git push origin "$commit":refs/heads/feat/bend-scalar-branches-reviewed
          printf '%s\n' "$commit" > artifacts/bend-scalar-commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bend-scalar-confirmation
          path: artifacts/bend-scalar-*
          retention-days: 30
