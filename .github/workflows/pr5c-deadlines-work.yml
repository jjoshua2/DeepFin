name: PR5c cohort deadline workspace
on:
  push:
    branches: [work/pr5c-cohort-deadlines-20260923]
permissions:
  contents: read
jobs:
  transport:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Preserve transferred bytes without executing source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir /tmp/pr5c-transfer
          gh api repos/jjoshua2/DeepFin/git/blobs/1820a7d1a61d870b74ab784b06c01eee09a7124e > /tmp/pr5c-transfer/blob.json
      - uses: actions/upload-artifact@v4
        with:
          name: deepfin-pr5c-transfer
          path: /tmp/pr5c-transfer
          retention-days: 7
