name: PR5c cohort deadline workspace
on:
  push:
    branches: [work/pr5c-cohort-deadlines-20260923]
permissions:
  contents: write
  actions: read
jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 948a72be1ec7d9d463c3af21a330a0256490fde3
      - uses: actions/download-artifact@v4
        with:
          name: deepfin-pr5c-deadline-qualification
          run-id: 35919463117
          github-token: ${{ github.token }}
          path: /tmp/pr5c-qualified
      - name: Verify tested source and apply documentation only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir /tmp/pr5c-docs
          python - <<'PY'
          import base64,hashlib,json,subprocess
          from pathlib import Path
          manifest=json.loads(Path('/tmp/pr5c-qualified/source-manifest.json').read_text())
          assert len(manifest)==13
          for path,digest in manifest.items():
              assert hashlib.sha256(Path(path).read_bytes()).hexdigest()==digest,path
          rec=json.loads(subprocess.check_output(['gh','api','repos/jjoshua2/DeepFin/git/blobs/8e7b3191e84109f32c856125937aaf8fc45531e5']))
          script=base64.b64decode(rec['content'])
          assert hashlib.sha256(script).hexdigest()=='6e64c54143f1749c191e3748fa72562d179adceae5661dc36fe5fe5e0cebc2c4'
          exec(compile(script,'authored-readout','exec'))
          paths=subprocess.check_output(['git','diff','--name-only']).decode().splitlines()
          expected=['docs/experiments/2026-09-23-cohort-deadlines.md','native/bend_engine/multi_root/README.md']
          assert sorted(paths)==expected,paths
          for path,digest in manifest.items():
              if path not in expected:
                  assert hashlib.sha256(Path(path).read_bytes()).hexdigest()==digest,path
          Path('/tmp/pr5c-docs/documentation.patch').write_bytes(subprocess.check_output(['git','diff','--binary']))
          Path('/tmp/pr5c-docs/source-manifest.json').write_text(json.dumps({p:hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in paths},indent=2))
          PY
          git diff --check
          git diff --stat
      - name: Fast-forward only documentation on the qualified feature branch
        run: |
          set -euo pipefail
          git add docs/experiments/2026-09-23-cohort-deadlines.md native/bend_engine/multi_root/README.md
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'docs: record per-root deadline and no-deadline model qualification'
          git push origin HEAD:refs/heads/feat/native-cohort-deadlines-20260923
          git rev-parse HEAD | tee /tmp/pr5c-docs/published-head.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deepfin-pr5c-documentation
          path: /tmp/pr5c-docs
          retention-days: 30
