name: Bend claims development
on:
  push:
    branches: [feat/bend-claim-options-dev]
    paths: ['.github/workflows/bend-claims-dev.yml']
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: |
          mkdir -p /tmp/bend-claims-source
          git archive --format=tar.gz HEAD > /tmp/bend-claims-source/deepfin.tgz
          git rev-parse HEAD > /tmp/bend-claims-source/revision.txt
          bash native/bend_engine/bitboard_probe/install_toolchain.sh
          tar -czf /tmp/bend-claims-source/compiler.tgz -C build/bend_u64_toolchain source
          cp "$(command -v bun)" /tmp/bend-claims-source/bun
          python -m pip download --no-deps --no-binary=:all: chess==1.11.2 -d /tmp/bend-claims-source
          python -m pip download --no-deps ruff==0.15.20 -d /tmp/bend-claims-source
      - uses: actions/upload-artifact@v4
        with:
          name: bend-claims-source
          path: /tmp/bend-claims-source/
          retention-days: 2
