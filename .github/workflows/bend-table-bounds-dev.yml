name: Bend table-bound source workspace
'on':
  push:
    branches: [feat/bend-table-bounds-dev-20260921]
    paths: ['.github/workflows/bend-table-bounds-dev.yml']
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  sources:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 7aad3d0dd3fe20ba1e5524ce99f3ed89b4fef2c1
          persist-credentials: false
      - name: Archive exact current source and identities
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/table-sources"
          git archive --format=tar HEAD | gzip > "$RUNNER_TEMP/table-sources/DeepFin-source.tar.gz"
          git rev-parse HEAD > "$RUNNER_TEMP/table-sources/commit.txt"
          git rev-parse 'HEAD^{tree}' > "$RUNNER_TEMP/table-sources/tree.txt"
          cd "$RUNNER_TEMP/table-sources"
          sha256sum DeepFin-source.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: bend-table-bound-sources
          path: ${{ runner.temp }}/table-sources/
          retention-days: 3
