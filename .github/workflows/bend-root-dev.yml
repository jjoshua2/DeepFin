name: Bend root advancement confirmation
on:
  push:
    branches: [feat/bend-root-advance-dev]
    paths: ['.github/workflows/bend-root-dev.yml']
permissions:
  contents: write
jobs:
  confirm:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          activate-environment: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Apply and verify locally tested source
        run: |
          echo '92b8d1b1de11d1b5566ba5c66d9335657ec56884e6e6f2e571a83f57c7931c55  .github/root-advance.patch' | sha256sum -c -
          git apply --check .github/root-advance.patch
          git apply .github/root-advance.patch
          python - <<'PY'
          from pathlib import Path
          import hashlib
          expected = {
            'main.bend': '6c5500c63b7dca0a1fdf3a916aafb907401f18a2c94c3e45b0fa494890aae6bc',
            'transport.c': '6eee7b9d3d06f3479d6cba9ea899ce5dfb56f8420f123004344ce265767ff3f8',
            'run_probe.py': 'c749942fca8def8d3629153f6981cd957cf87270d427b4cf7a26e9a320314fee',
            'root_protocol.py': 'c6edca7bdbff4a09bc728e2038adcf1e1247f78c26b23f0ba686bb326b66ea5d',
            'root_probe.py': 'fef16b506ed819e5a234a91fd01e4595292308cc386fd39e9db3053632654092',
          }
          for name, sha in expected.items():
              assert hashlib.sha256((Path('native/bend_engine/session_probe') / name).read_bytes()).hexdigest() == sha, name
          assert hashlib.sha256(Path('tests/test_bend_root_advance.py').read_bytes()).hexdigest() == 'd0af509ea5e300021b1db90e0e2a19ac21a6fec290f2239e9c5ff465068d2c52'
          PY
          git diff --check
      - name: Install CPU tools and pinned compiler
        run: |
          uv sync --locked --extra dev --extra cpu
          bash native/bend_engine/bitboard_probe/install_toolchain.sh
      - name: Static checks and cheap contracts
        run: |
          ruff check native/bend_engine/session_probe/*.py tests/test_bend_root_advance.py tests/test_bend_search_sessions.py
          basedpyright native/bend_engine/session_probe/*.py tests/test_bend_root_advance.py tests/test_bend_search_sessions.py
          python -m pytest -q tests/test_bend_root_advance.py tests/test_bend_search_sessions.py
      - name: Four-mode play and search plus original session regression
        run: |
          python -m native.bend_engine.session_probe.root_probe --report artifacts/bend-root-four-modes.json
      - name: Retained root and descendant neural history without model inference
        run: |
          python -m native.bend_engine.session_probe.root_probe --modes native --check-encoding --report artifacts/bend-root-history.json
      - name: Preserve tested non-workflow tree on a clean branch
        run: |
          git fetch --no-tags --depth=1 origin 0ff37d197eda2b389129083f7b2cdcca91872d7a
          git read-tree 0ff37d197eda2b389129083f7b2cdcca91872d7a
          git add native/bend_engine/session_probe tests/test_bend_root_advance.py docs/experiments/README.md docs/experiments/2026-09-19-bend-root-advancement.md
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          commit="$(git commit-tree "$(git write-tree)" -p 0ff37d197eda2b389129083f7b2cdcca91872d7a -m 'Advance legal Bend roots and retain host game history across searches')"
          git push origin "$commit":refs/heads/feat/bend-root-advance-reviewed
          printf '%s\n' "$commit" > artifacts/bend-root-commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bend-root-confirmation
          path: artifacts/bend-root-*
          retention-days: 30
