name: Bend neural contract development
on:
  push:
    branches: [feat/bend-neural-contract]
    paths: ['.github/workflows/bend-neural-dev.yml']
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: |
          mkdir -p /tmp/bend-neural-source
          git archive --format=tar.gz HEAD native chess_anti_engine tests scripts docs .agents AGENTS.md CLAUDE.md .github pyproject.toml .python-version uv.lock setup.py > /tmp/bend-neural-source/deepfin.tgz
          git rev-parse HEAD > /tmp/bend-neural-source/revision.txt
      - uses: actions/upload-artifact@v4
        with:
          name: bend-neural-source
          path: /tmp/bend-neural-source/
          retention-days: 2
