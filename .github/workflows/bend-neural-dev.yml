name: Bend neural contract development
on:
  push:
    branches: [feat/bend-neural-contract]
    paths: ['.github/workflows/bend-neural-dev.yml']
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          mkdir -p /tmp/bend-neural-deps
          python3 -m pip download --no-deps 'chess==1.11.2' 'ruff==0.15.20' -d /tmp/bend-neural-deps
      - uses: actions/upload-artifact@v4
        with:
          name: bend-neural-deps
          path: /tmp/bend-neural-deps/
          retention-days: 2
