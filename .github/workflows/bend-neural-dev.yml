name: Bend neural boundary confirmation
on:
  push:
    branches: [feat/bend-neural-boundary]
    paths: ['.github/workflows/bend-neural-dev.yml']
permissions:
  contents: write
jobs:
  confirm:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          activate-environment: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Apply exact locally tested history-path changes
        run: |
          echo 'a8a4823ccab6068424e4a062de8698db14a212aa07670b1bcff6512a06a617db  .github/neural-boundary.patch' | sha256sum -c -
          git apply --check .github/neural-boundary.patch
          git apply .github/neural-boundary.patch
          git diff --check
      - name: Install isolated CPU dependencies and pinned compiler
        run: |
          uv sync --locked --extra dev --extra cpu
          python -c "import torch; assert torch.version.cuda is None; print(torch.__version__)"
          bash native/bend_engine/bitboard_probe/install_toolchain.sh
      - name: Static checks and cheap boundary contracts
        run: |
          ruff check native/bend_engine/neural_probe native/bend_engine/session_probe/run_probe.py tests/test_bend_neural_boundary.py
          basedpyright native/bend_engine/neural_probe native/bend_engine/session_probe/run_probe.py tests/test_bend_neural_boundary.py
          python -m pytest -q tests/test_bend_neural_boundary.py tests/test_bend_search_sessions.py
      - name: Existing four-mode session fault and cancellation regression
        run: |
          python -m native.bend_engine.session_probe.run_probe --python-chess \
            --report artifacts/bend-neural-session-regression.json
      - name: Actual native CPU TinyNet and four-mode search integration
        run: |
          python -m native.bend_engine.neural_probe.run_probe \
            --report artifacts/bend-neural-boundary.json
      - name: Publish only validated source on a clean stacked branch
        run: |
          git fetch --no-tags --depth=1 origin c8bf8679fe68523effc7d971def5cd27ad35d4c9
          git rm .github/workflows/bend-neural-dev.yml .github/neural-boundary.patch
          git add native/bend_engine/neural_probe native/bend_engine/session_probe/main.bend native/bend_engine/session_probe/run_probe.py native/bend_engine/session_probe/README.md tests/test_bend_neural_boundary.py docs/experiments/README.md docs/experiments/2026-09-18-bend-neural-boundary.md .github/workflows/bend-neural-boundary.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          commit="$(git commit-tree "$(git write-tree)" -p c8bf8679fe68523effc7d971def5cd27ad35d4c9 -m 'Qualify Bend search paths with native CPU TinyNet and real history encoding')"
          git push origin "$commit":refs/heads/feat/bend-neural-boundary-reviewed
          printf '%s\n' "$commit" > artifacts/bend-neural-commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bend-neural-confirmation
          path: artifacts/bend-neural-*
          retention-days: 30
