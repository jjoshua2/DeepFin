name: Native CPU service profile qualification
on:
  push:
    branches: [work/native-service-profile-20260925]
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: f53c908a0af23267f61cee303944d11b878620de
      - uses: actions/download-artifact@v4
        with:
          name: deepfin-native-service-profile
          run-id: 36216701536
          github-token: ${{ github.token }}
          path: /tmp/service-evidence
      - name: Check completed run and recompute all preserved observations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/service-publication
          python3 - <<'PY'
          import base64,hashlib,json,subprocess
          from pathlib import Path
          def api(path):
              return json.loads(subprocess.check_output(['gh','api','repos/jjoshua2/DeepFin/'+path]))
          run=api('actions/runs/36216701536')
          assert run['status']=='completed' and run['conclusion']=='success'
          assert run['head_sha']=='4c98604cb737872cf4d0909672e66687bd36a2e8'
          art=api('actions/artifacts/10897737515')
          assert art['digest']=='sha256:c7ecfb78fd0223f762e959031bd3f32de69bd11a4035be2a2834752276270db8'
          readout=base64.b64decode(api('git/blobs/f2816a16b3812cdf90cdb527dd6f14b2892df95a')['content'])
          assert hashlib.sha256(readout).hexdigest()=='aa4b73f40b9b9e2edb710810e27b0ca6d9984ab6be6791a58447070851d70420'
          Path('/tmp/service-readout.md').write_bytes(readout)
          script=base64.b64decode(api('git/blobs/52c7b3abfbcff94488192a29f7dc6b1e60e77dd9')['content'])
          assert hashlib.sha256(script).hexdigest()=='01c6e068233ff65e166eafb62cb2899877beef1a47460e21438fa91f088a350e'
          exec(compile(script,'authored-service-publication','exec'))
          PY
      - name: Publish a clean feature branch without changing the parent
        run: |
          set -euo pipefail
          branch=feat/native-service-profile-20260925
          test -z "$(git ls-remote --heads origin "refs/heads/$branch")"
          git diff --cached --check
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'bench: qualify native CPU service curves and equal-work batch estimates'
          git push origin "HEAD:refs/heads/$branch"
          git rev-parse HEAD | tee /tmp/service-publication/commit.txt
          git diff --stat HEAD^ HEAD > /tmp/service-publication/diff-stat.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deepfin-service-profile-publication
          path: /tmp/service-publication
          retention-days: 30
