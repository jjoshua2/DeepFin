name: PR3b CUDA implementation qualification
on:
  push:
    branches: [work/pr3b-native-cuda-20260922]
permissions:
  contents: read
  actions: read
defaults:
  run:
    shell: bash
env:
  APPLY_AUTHORED_PATCH: |
    mkdir -p /tmp/pr3b-evidence
    git config --global --add safe.directory "$PWD"
    python - <<'PY_PATCH'
    import base64, gzip, hashlib, json, subprocess
    from pathlib import Path
    pieces = [
      ('fc85ce5a07b9b691cc161afb9f0597bb7281a85c', '0eb3c56d0157006fad05ba444c7a1a3008fccbcad2c02c4096f70d38600fcb79'),
      ('79ea97fc2ea23e9a24fea10393bdf8e0b1e8e5f7', 'e425882cf1bce841e8a0125bcb048fbe13190761d5671b96b83419fac83e7404'),
      ('66e2f36c8f9a368702b7446a37ec9644920e91cc', '4aa07bb7a7a592daf7d46ca5aedce89db86f139c5ee9d1435dc6a92969c21384'),
    ]
    compressed = b''
    for sha, digest in pieces:
        data = json.loads(subprocess.check_output(['gh', 'api', f'repos/jjoshua2/DeepFin/git/blobs/{sha}']))
        piece = base64.b64decode(data['content'])
        assert hashlib.sha256(piece).hexdigest() == digest
        compressed += piece
    assert hashlib.sha256(compressed).hexdigest() == '9b064c7e261f26cdbff6ba028b52559005329632403f42e456cc983dab09f579'
    patch = gzip.decompress(compressed)
    assert hashlib.sha256(patch).hexdigest() == '888925f36bd6c39827bcb7861a103747c1f482ff38d4c238c95fb60e4a7bedeb'
    subprocess.run(['git', 'apply', '--check', '-'], input=patch, check=True)
    subprocess.run(['git', 'apply', '-'], input=patch, check=True)
    subprocess.run(['git', 'add', '-N', '.'], check=True)
    subprocess.run(['git', 'diff', '--check'], check=True)
    paths = subprocess.check_output(['git', 'diff', '--name-only']).decode().splitlines()
    assert len(paths) == 16 and all(not p.startswith('.github/') for p in paths)
    manifest = {p: hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in paths}
    Path('/tmp/pr3b-evidence/source-manifest.json').write_text(json.dumps(manifest, indent=2)+'\n')
    Path('/tmp/pr3b-evidence/pr3b.patch').write_bytes(patch)
    PY_PATCH
    git diff --stat | tee /tmp/pr3b-evidence/diff-stat.txt
  VERIFY_COMPILER: |
    single=native/bend_engine/standalone
    revision="$(bun "$single/verify_compiler.js" --revision)"
    repository="$(bun "$single/verify_compiler.js" --repository)"
    git init -q /tmp/pr3b-compiler
    git -C /tmp/pr3b-compiler fetch -q --depth=1 "$repository" "$revision"
    git -C /tmp/pr3b-compiler checkout -q --detach FETCH_HEAD
    bun "$single/verify_compiler.js" /tmp/pr3b-compiler | tee /tmp/pr3b-evidence/compiler.txt
  PYTHONPATH: .
  CAE_TEST_THREADS: '2'
  OMP_NUM_THREADS: '2'
  MAX_JOBS: '1'
  TORCHINDUCTOR_COMPILE_THREADS: '1'
  BEND_NO_TELEMETRY: '1'
jobs:
  cpu-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 9b0f57492f7c86fdb935da7523748fc088e056b8
      - name: Apply exact authored patch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash -euo pipefail -c "$APPLY_AUTHORED_PATCH"
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@v7
        with:
          version: 0.12.10
      - name: Locked CPU dependencies
        run: |
          uv sync --locked --extra dev --extra cpu
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Static and contract gates
        run: |
          bash scripts/lint.sh 2>&1 | tee /tmp/pr3b-evidence/lint.txt
          bash scripts/lint.sh native/bend_engine/batch_backend/verify_cuda.py 2>&1 | tee /tmp/pr3b-evidence/native-lint.txt
          python -m pytest tests/test_bend_cuda_batch_backend.py tests/test_bend_native_batch_backend.py tests/test_neural_work.py tests/test_neural_search_benchmark.py tests/test_broker_served_count.py -q --junitxml=/tmp/pr3b-evidence/tests.xml 2>&1 | tee /tmp/pr3b-evidence/tests.txt
          bun test native/bend_engine/standalone/bind_model.test.js native/bend_engine/standalone/verify_compiler.test.js native/bend_engine/batch_backend/binding.test.js native/bend_engine/batch_backend/cuda_binding.test.js 2>&1 | tee /tmp/pr3b-evidence/bindings.txt
      - uses: actions/download-artifact@v4
        with:
          name: deepfin-pr1-validation
          run-id: 35759888019
          github-token: ${{ github.token }}
          path: /tmp/pr3b-prior1
      - uses: actions/download-artifact@v4
        with:
          name: deepfin-pr2-reuse-final
          run-id: 35767013700
          github-token: ${{ github.token }}
          path: /tmp/pr3b-prior2
      - name: Recover exact fixture and unchanged generated singleton source
        run: |
          tar -xzf /tmp/pr3b-prior1/native-build.tar.gz -C /tmp
          tar -xzf /tmp/pr3b-prior2/final-build.tar.gz -C /tmp
          echo '9654a1e334fb5f875d164b82068846bfeab3df2ef2a994737e44789c2623ee6e  /tmp/pr1-model/fixture.pt2' | sha256sum -c -
          python -c 'import torch; assert str(torch.__version__) == "2.14.0+cpu"; print(torch.__version__)' | tee /tmp/pr3b-evidence/runtime.txt
          echo '28bed3f939b8cf3d2e764043f482d545e047704adfbe5985ee79484b605d3965  /tmp/pr2-native/engine.c' | sha256sum -c - | tee /tmp/pr3b-evidence/saved-engine.txt
      - name: Verify unchanged compiler
        run: |
          bash -euo pipefail -c "$VERIFY_COMPILER"
      - name: Build CPU probe and actual ATen data-contract tests
        run: |
          single=native/bend_engine/standalone
          prefix="$(python -c 'import torch; print(torch.utils.cmake_prefix_path)')"
          bash native/bend_engine/batch_backend/build_probe.sh /tmp/pr3b-cpu /tmp/pr1-model/fixture.pt2 "$prefix" /tmp/pr3b-compiler 2>&1 | tee /tmp/pr3b-evidence/cpu-build.txt
          cmake -S "$single" -B /tmp/pr3b-cpu/build -DBEND_BATCH_TESTS=ON
          cmake --build /tmp/pr3b-cpu/build --parallel 1 --target batch-output-contract batch-bf16-staging
          /tmp/pr3b-cpu/build/batch-output-contract | tee /tmp/pr3b-evidence/output-contract.json
          /tmp/pr3b-cpu/build/batch-bf16-staging | tee /tmp/pr3b-evidence/staging.json
          if cmake -S "$single" -B /tmp/pr3b-reject-cpu -DCMAKE_PREFIX_PATH="$prefix" -DBEND_GENERATED_C=/tmp/pr3b-cpu/probe.c -DBEND_CONTRACT_DIR=/tmp/pr3b-cpu -DBEND_CUDA_MODEL=ON > /tmp/pr3b-evidence/cpu-cuda-rejection.txt 2>&1; then
            echo 'CPU LibTorch incorrectly accepted CUDA support'; exit 2
          fi
          grep -q 'requires CUDA-enabled LibTorch' /tmp/pr3b-evidence/cpu-cuda-rejection.txt
      - name: Actual CPU model and singleton search regressions
        run: |
          single=native/bend_engine/standalone
          prefix="$(python -c 'import torch; print(torch.utils.cmake_prefix_path)')"
          python -m native.bend_engine.batch_backend.verify --binary /tmp/pr3b-cpu/build/deepfin-bend-batch-probe --package /tmp/pr1-model/fixture.pt2 --checkpoint /tmp/pr1-model/fixture.pt --report /tmp/pr3b-evidence/cpu-model.json
          mkdir /tmp/pr3b-single
          bun "$single/bind_model.js" --header /tmp/pr1-model/fixture.pt2 /tmp/pr3b-single/model_contract.h > /tmp/pr3b-evidence/cpu-binding.json
          cmake -S "$single" -B /tmp/pr3b-single/build -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_PREFIX_PATH="$prefix" -DBEND_GENERATED_C=/tmp/pr2-native/engine.c -DBEND_CONTRACT_DIR=/tmp/pr3b-single
          cmake --build /tmp/pr3b-single/build --parallel 1
          clang -std=c11 -O3 -DLEGAL_ORACLE -I "$PWD" native/bend_engine/legal_probe/support.c -pthread -lm -o /tmp/pr3b-oracle
          python -m native.bend_engine.standalone.verify_neural --checkpoint /tmp/pr1-model/fixture.pt --package /tmp/pr1-model/fixture.pt2 --oracle /tmp/pr3b-oracle --report /tmp/pr3b-evidence/singleton.json --command /tmp/pr3b-single/build/deepfin-bend-neural --threads 1
          sha256sum /tmp/pr3b-cpu/build/deepfin-bend-batch-probe /tmp/pr3b-single/build/deepfin-bend-neural > /tmp/pr3b-evidence/executables.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deepfin-pr3b-cpu-regression
          path: /tmp/pr3b-evidence
          retention-days: 30
  cuda-build-only:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container:
      image: nvidia/cuda:13.0.2-devel-ubuntu24.04
    env:
      CUDA_HOME: /usr/local/cuda
      TORCH_CUDA_ARCH_LIST: '12.0'
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Install container build tools
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends git gh curl unzip python3 python-is-python3 clang cmake libssl-dev build-essential pkg-config ca-certificates
      - uses: actions/checkout@v4
        with:
          ref: 9b0f57492f7c86fdb935da7523748fc088e056b8
      - name: Apply exact authored patch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash -euo pipefail -c "$APPLY_AUTHORED_PATCH"
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@v7
        with:
          version: 0.12.10
      - name: Locked CUDA-enabled libraries without a GPU
        run: |
          uv sync --locked --extra cu130
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/download-artifact@v4
        with:
          name: deepfin-pr1-validation
          run-id: 35759888019
          github-token: ${{ github.token }}
          path: /tmp/pr3b-prior1
      - name: Create compile-only metadata canary, never a valid CUDA model
        run: |
          tar -xzf /tmp/pr3b-prior1/native-build.tar.gz -C /tmp
          python - <<'PY_CANARY'
          import hashlib, json
          from pathlib import Path
          import torch
          assert str(torch.__version__) == '2.14.0+cu130'
          assert torch.version.cuda == '13.0' and not torch.cuda.is_available()
          directory = Path('/tmp/pr3b-canary'); directory.mkdir()
          package = directory / 'not-a-model.pt2'
          package.write_bytes(b'COMPILE AND NO-DEVICE FAILURE CANARY; NOT A MODEL\n')
          manifest = json.loads(Path('/tmp/pr1-model/fixture.json').read_text())
          manifest.update(device='cuda', dtype='bfloat16', device_index=0, batch=4,
                          torch_version=str(torch.__version__), sha256=hashlib.sha256(package.read_bytes()).hexdigest())
          package.with_suffix('.json').write_text(json.dumps(manifest))
          Path('/tmp/pr3b-evidence/cuda-runtime.json').write_text(json.dumps({
              'torch':str(torch.__version__), 'cuda_build':torch.version.cuda,
              'cuda_available':False, 'cuda_model_qualified':False, 'scope':'compilation and fail-closed startup only'}))
          PY_CANARY
      - name: Verify unchanged compiler
        run: |
          bash -euo pipefail -c "$VERIFY_COMPILER"
      - name: Compile and link actual CUDA runtime implementation
        run: |
          prefix="$(python -c 'import torch; print(torch.utils.cmake_prefix_path)')"
          /usr/local/cuda/bin/nvcc --version | tee /tmp/pr3b-evidence/nvcc.txt
          bash native/bend_engine/batch_backend/build_probe.sh /tmp/pr3b-cuda /tmp/pr3b-canary/not-a-model.pt2 "$prefix" /tmp/pr3b-compiler --cuda-bf16 2>&1 | tee /tmp/pr3b-evidence/cuda-build.txt
          cp /tmp/pr3b-cuda/libraries.txt /tmp/pr3b-evidence/cuda-libraries.txt
          cp /tmp/pr3b-cuda/model-binding.json /tmp/pr3b-evidence/canary-binding.json
          cp /tmp/pr3b-cuda/build.txt /tmp/pr3b-evidence/build-identities.txt
          test -f /tmp/pr3b-cuda/build/CMakeFiles/deepfin-bend-batch-probe.dir/cuda_execution.cpp.o
      - name: No-GPU startup and qualification must fail, not skip or fall back
        run: |
          python - <<'PY_FAIL'
          import json, os, subprocess
          from pathlib import Path
          binary = '/tmp/pr3b-cuda/build/deepfin-bend-batch-probe'
          package = '/tmp/pr3b-canary/not-a-model.pt2'
          trace = '/tmp/pr3b-canary/should-not-exist.trace'
          result = subprocess.run([binary, '--threads', '1'], text=True, capture_output=True, timeout=30,
              env={**os.environ, 'DEEPFIN_BEND_MODEL_PACKAGE': package, 'DEEPFIN_BEND_MODEL_TRACE':trace})
          assert result.returncode == 2 and not result.stdout, (result.returncode, result.stdout, result.stderr)
          assert 'requested CUDA device is unavailable; no CPU fallback' in result.stderr, result.stderr
          assert not Path(trace).exists()
          Path('/tmp/pr3b-evidence/no-device-native.txt').write_text(result.stderr)
          report = '/tmp/pr3b-evidence/no-device-gate.json'
          gate = subprocess.run(['python','-m','native.bend_engine.batch_backend.verify_cuda',
              '--binary',binary,'--package',package,'--checkpoint','/tmp/pr1-model/fixture.pt',
              '--report',report,'--atol','0','--rtol','0'], text=True, capture_output=True, timeout=60)
          assert gate.returncode == 2, (gate.returncode,gate.stdout,gate.stderr)
          data = json.loads(Path(report).read_text())
          assert data['status'] == 'failed' and data['cuda_model_qualified'] is False
          assert 'no CPU fallback or qualification' in data['error'], data
          Path('/tmp/pr3b-evidence/no-device-summary.json').write_text(json.dumps({
              'status':'passed', 'scope':'compile/link and explicit failure checks only',
              'native_exit':result.returncode,'gate_exit':gate.returncode,'cuda_model_qualified':False}))
          PY_FAIL
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deepfin-pr3b-cuda-build-only
          path: /tmp/pr3b-evidence
          retention-days: 30
  publish:
    needs: [cpu-regression, cuda-build-only]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 9b0f57492f7c86fdb935da7523748fc088e056b8
      - name: Apply same exact validated source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash -euo pipefail -c "$APPLY_AUTHORED_PATCH"
      - name: Publish clean opt-in implementation branch only
        run: |
          test -z "$(git ls-remote --heads origin refs/heads/feat/native-cuda-bf16-20260922)"
          git switch -c feat/native-cuda-bf16-20260922
          git add docs/experiments native/bend_engine/batch_backend native/bend_engine/standalone tests/test_bend_cuda_batch_backend.py
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'native: add opt-in CUDA BF16 batch execution and fail-closed qualification'
          git push origin HEAD:refs/heads/feat/native-cuda-bf16-20260922
          git rev-parse HEAD | tee /tmp/pr3b-evidence/published-head.txt
      - uses: actions/upload-artifact@v4
        with:
          name: deepfin-pr3b-source-publication
          path: /tmp/pr3b-evidence
          retention-days: 30
