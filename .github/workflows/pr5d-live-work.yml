name: PR5d live qualification workspace
on:
  push:
    branches: [work/pr5d-live-qualification-20260925]
permissions:
  contents: write
  actions: read
jobs:
  readout:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 5eed9cc30f0352d5c984f53ce96a9369b2a941cf
      - uses: actions/download-artifact@v4
        with:
          name: deepfin-pr5d-live-qualification
          run-id: 36163025335
          github-token: ${{ github.token }}
          path: /tmp/pr5d-qualified
      - name: Verify all evidence and write authored readout
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64,hashlib,json,subprocess
          from pathlib import Path
          sha='88f3ea6a13ea557aae86b11cebc42b2582bce250'
          record=json.loads(subprocess.check_output(['gh','api',f'repos/jjoshua2/DeepFin/git/blobs/{sha}']))
          script=base64.b64decode(record['content'])
          assert hashlib.sha1(b'blob '+str(len(script)).encode()+b'\0'+script).hexdigest()==sha
          exec(compile(script,'authored-readout','exec'))
          original=json.loads(Path('/tmp/pr5d-qualified/source-manifest.json').read_text())
          for path,digest in original.items():
              if not path.endswith('.md') and not path.endswith('/qualify_live.sh'):
                  assert hashlib.sha256(Path(path).read_bytes()).hexdigest()==digest,path
          subprocess.run(['git','add','-N','.'],check=True)
          paths=subprocess.check_output(['git','diff','--name-only']).decode().splitlines()
          expected=['docs/experiments/2026-09-25-live-cohort-recovery.md','docs/experiments/evidence/live-cohort-recovery/summary.json','docs/experiments/evidence/live-cohort-recovery/qualified-source.json','native/bend_engine/multi_root/LIVE.md','native/bend_engine/multi_root/README.md','native/bend_engine/multi_root/qualify_live.sh']
          assert sorted(paths)==sorted(expected),paths
          old=subprocess.check_output(['git','show','HEAD:native/bend_engine/multi_root/qualify_live.sh']).decode()
          new=Path('native/bend_engine/multi_root/qualify_live.sh').read_text()
          assert [s for s in old.splitlines() if not s.startswith('#')]==[s for s in new.splitlines() if not s.startswith('#')]
          PY
          git diff --check
          git diff --stat
      - name: Fast-forward documentation and evidence only
        run: |
          set -euo pipefail
          git add docs/experiments/2026-09-25-live-cohort-recovery.md docs/experiments/evidence/live-cohort-recovery native/bend_engine/multi_root/LIVE.md native/bend_engine/multi_root/README.md native/bend_engine/multi_root/qualify_live.sh
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'docs: record completed current-stack live lifecycle qualification'
          git push origin HEAD:refs/heads/feat/native-live-cohort-20260925
          git rev-parse HEAD
