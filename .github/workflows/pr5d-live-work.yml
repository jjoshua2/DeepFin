name: PR5d live-root workspace
on:
  push:
    branches: [work/pr5d-live-reconcile-20260924]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      BEND_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 42d4c78ebfca102e146720c818f5dba9db61fd57
      - name: Apply exact runtime files and reachable-effect registration fix
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir /tmp/pr5d-built
          python3 - <<'PY'
          import base64,gzip,hashlib,json,subprocess
          from pathlib import Path
          def blob(sha):
              record=json.loads(subprocess.check_output(['gh','api',f'repos/jjoshua2/DeepFin/git/blobs/{sha}']))
              raw=base64.b64decode(record['content'])
              assert hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()==sha
              return raw
          packed=blob('80142408e178fe6b6439e6bd3f1c42200aacd035')
          assert hashlib.sha256(packed).hexdigest()=='36afa24c475053ff56b67daae9582ab1d4b75eeba7ff7419cb6c99a985faeba7'
          files=json.loads(gzip.decompress(packed))
          assert len(files)==4
          for p,text in files.items():
              assert p.startswith('native/bend_engine/multi_root/') and p.endswith('.bend') and not Path(p).exists()
              Path(p).write_text(text)
          p='native/bend_engine/batch_backend/batch_call.c'
          Path(p).write_bytes(blob('7c0ea5e8c0c511873729f7d08ad4b763544cd82d'))
          files[p]=Path(p).read_text()
          subprocess.run(['git','add','-N','.'],check=True)
          Path('/tmp/pr5d-built/runtime.patch').write_bytes(subprocess.check_output(['git','diff','--binary']))
          Path('/tmp/pr5d-built/source-manifest.json').write_text(json.dumps({p:hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in files},indent=2))
          PY
          git diff --check
          free -h > /tmp/pr5d-built/memory.txt
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Verify compiler and generate full live and reference C
        run: |
          set -euo pipefail
          single=native/bend_engine/standalone
          revision="$(bun "$single/verify_compiler.js" --revision)"
          repository="$(bun "$single/verify_compiler.js" --repository)"
          git init -q /tmp/pr5d-compiler
          git -C /tmp/pr5d-compiler fetch -q --depth=1 "$repository" "$revision"
          git -C /tmp/pr5d-compiler checkout -q --detach FETCH_HEAD
          bun "$single/verify_compiler.js" /tmp/pr5d-compiler > /tmp/pr5d-built/compiler.txt
          for entry in live main; do
            /usr/bin/time -v timeout 420 bun /tmp/pr5d-compiler/bend2/main.ts "native/bend_engine/multi_root/$entry.bend" -o "/tmp/pr5d-built/$entry.c" > "/tmp/pr5d-built/$entry-build.txt" 2>&1
            gzip -k "/tmp/pr5d-built/$entry.c"
          done
          sha256sum /tmp/pr5d-built/*.c > /tmp/pr5d-built/generated.txt
      - name: Compile both actual generated entrypoints against the existing callback
        run: |
          set -euo pipefail
          d=/tmp/pr5d-built
          printf '#define DEEPFIN_MODEL_BATCH 4\n#define DEEPFIN_MODEL_CHANNELS 175\n#define DEEPFIN_MODEL_PROFILE 4\n' > "$d/model_contract.h"
          clang -std=c11 -O1 -I "$d" -c native/bend_engine/multi_root/test_backend.c -o "$d/callback.o"
          for entry in live main; do
            clang -std=c11 -O1 -ffp-contract=off -DDEEPFIN_BEND_NATIVE_MODEL -DDEEPFIN_ASYNC_BATCH -I "$d" -c "$d/$entry.c" -o "$d/$entry.o"
            clang++ -std=c++20 -O1 -I "$d" "$d/$entry.o" "$d/callback.o" native/bend_engine/batch_backend/async_batch.cpp -pthread -lm -o "$d/$entry"
          done
          printf 'add startpos\n' | DEEPFIN_COHORT_ASYNC=1 "$d/live" --threads 1 -- 1 2 0 0 > "$d/smoke.txt"
          grep -q 'live_work' "$d/smoke.txt"
          rm "$d"/*.c "$d"/*.o "$d/live" "$d/main"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deepfin-pr5d-effect-fixed-build
          path: /tmp/pr5d-built
          retention-days: 30
