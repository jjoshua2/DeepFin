name: Qualify public castling update
'on':
  push:
    branches: [feat/bend-castling-qualification-dev-20260926]
    paths: [.github/workflows/bend-castling-public.yml]
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BEND_NO_TELEMETRY: '1'
      TERM: dumb
      SOURCE: 237c4e7b9cf9e2122ed87d1f9c6375eb621f6c83
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 237c4e7b9cf9e2122ed87d1f9c6375eb621f6c83
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: jjoshua2/bend
          ref: aaeb9bc91ff0ff0b3f58dba6a9744c6607e167ae
          path: .compiler
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Run public castling source gate
        run: |
          set -euo pipefail
          mkdir -p /tmp/castling-evidence
          test "$(git rev-parse HEAD)" = "$SOURCE"
          bun native/bend_engine/standalone/verify_compiler.js "$PWD/.compiler" | tee /tmp/castling-evidence/compiler-identity.txt
          bun native/bend_engine/standalone/proofs/castling/focused.js "$PWD/.compiler" --report /tmp/castling-evidence/focused.json 2>&1 | tee /tmp/castling-evidence/focused.log
      - name: Run public four-mode native castling verifier
        env:
          CC: /usr/bin/clang
        run: |
          set -euo pipefail
          bun native/bend_engine/standalone/proofs/castling/verify_native.js "$PWD/.compiler" --report /tmp/castling-evidence/native.json 2>&1 | tee /tmp/castling-evidence/native.log
      - name: Recheck compiler source suite and pin tests
        run: |
          set -euo pipefail
          bun test native/bend_engine/standalone/verify_compiler.test.js 2>&1 | tee /tmp/castling-evidence/pin.log
          (cd .compiler && bun tests/run/u64_proofs.js) | tee /tmp/castling-evidence/compiler-proofs.json
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.10'
          enable-cache: false
      - name: Run unchanged whole-repository lint
        run: |
          set -euo pipefail
          uv sync --locked --extra dev --extra cpu
          export PATH="$PWD/.venv/bin:$PATH"
          ./scripts/lint.sh 2>&1 | tee /tmp/castling-evidence/lint.log
          python3 - <<'PY'
          import json
          from pathlib import Path
          f=json.loads(Path('/tmp/castling-evidence/focused.json').read_text())
          n=json.loads(Path('/tmp/castling-evidence/native.json').read_text())
          assert f['focused_gate']=='PASS' and f['consumer']=='PASS' and f['controls_gate']=='PASS'
          assert f['new_law_count']==2 and len(f['negative_controls'])==17 and all(x['rejected'] for x in f['negative_controls'])
          assert n['native_gate']=='PASS' and n['new_registered_laws']==2 and len(n['modes'])==4
          assert n['board_rows_per_mode']==4360 and n['board_fields_per_mode']==82840 and n['conditional_preservation_cases']==264
          assert len(n['mutations'])==2 and all(x['rejected'] and x['compiled_and_executed'] for x in n['mutations'])
          assert n['premise_rejection']['rejected']
          assert json.loads(Path('/tmp/castling-evidence/compiler-proofs.json').read_text())['proof_gate']=='PASS'
          assert '12 pass' in Path('/tmp/castling-evidence/pin.log').read_text()
          assert Path('/tmp/castling-evidence/lint.log').read_text().strip().endswith('lint: OK')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bend-castling-public-qualification-v2
          path: /tmp/castling-evidence/
          retention-days: 14
