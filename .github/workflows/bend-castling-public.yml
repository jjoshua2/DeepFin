name: Qualify public castling update
'on':
  push:
    branches: [feat/bend-castling-qualification-dev-20260926]
    paths: [.github/workflows/bend-castling-public.yml]
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BEND_NO_TELEMETRY: '1'
      TERM: dumb
      SOURCE: e872d460983a70219394bdf51dfefc12cf06669a
    steps:
      - uses: actions/checkout@v4
        with:
          ref: e872d460983a70219394bdf51dfefc12cf06669a
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: jjoshua2/bend
          ref: aaeb9bc91ff0ff0b3f58dba6a9744c6607e167ae
          path: .compiler
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Check public castling laws
        run: |
          set -euo pipefail
          mkdir -p /tmp/castling-evidence
          test "$(git rev-parse HEAD)" = "$SOURCE"
          bun native/bend_engine/standalone/verify_compiler.js "$PWD/.compiler" | tee /tmp/castling-evidence/compiler-identity.txt
          out="$(bun .compiler/bend2/main.ts native/bend_engine/standalone/proofs/castling/consumer.bend)"
          test "$out" = "All terms check."
          printf '%s\n' "$out" > /tmp/castling-evidence/public-consumer.log
      - name: Re-run archived castling source mutations and four native modes
        env:
          CC: /usr/bin/clang
        run: |
          set -euo pipefail
          mkdir -p native/bend_engine/standalone/proofs/castling_review
          for n in Actual Fresh Preserve Route consumer probe; do cp "docs/experiments/evidence/bend-en-passant-update/castling-review/$n.bend.txt" "native/bend_engine/standalone/proofs/castling_review/$n.bend"; done
          cp docs/experiments/evidence/bend-en-passant-update/castling-review/verify_review.js.txt native/bend_engine/standalone/proofs/castling_review/verify_review.js
          python3 -c "from pathlib import Path; p=Path('native/bend_engine/standalone/proofs/castling_review/verify_review.js'); s=p.read_text(); s=s.replace(\"for(const [mode,flags] of [['generic',[]],['ubsan',['-fsanitize=undefined','-fno-sanitize-recover=all']]])\",\"for(const [mode,flags] of [['generic',[]],['portable',['-DBEND_U64_PORTABLE']],['native',['-march=native']],['ubsan',['-fsanitize=undefined','-fno-sanitize-recover=all']]])\"); p.write_text(s)"
          bun native/bend_engine/standalone/proofs/castling_review/verify_review.js "$PWD/.compiler" --report /tmp/castling-evidence/castling-review.json 2>&1 | tee /tmp/castling-evidence/castling-review.log
          rm -rf native/bend_engine/standalone/proofs/castling_review
          git diff --exit-code
          python3 -c "import json; from pathlib import Path; r=json.loads(Path('/tmp/castling-evidence/castling-review.json').read_text()); assert r['supplementary_castling']=='PASS'; assert len(r['modes'])==4; assert r['board_rows_per_mode']==4360; assert r['conditional_preservation_cases']==264; assert len(r['mutations'])==2 and all(x['rejected'] and x['compiled_and_executed'] for x in r['mutations']); assert r['premise_rejection']['rejected']"
      - name: Recheck compiler source suite and pin tests
        run: |
          set -euo pipefail
          bun test native/bend_engine/standalone/verify_compiler.test.js 2>&1 | tee /tmp/castling-evidence/pin.log
          (cd .compiler && bun tests/run/u64_proofs.js) | tee /tmp/castling-evidence/compiler-proofs.json
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.10'
          enable-cache: false
      - name: Run unchanged whole-repository lint
        run: |
          set -euo pipefail
          uv sync --locked --extra dev --extra cpu
          export PATH="$PWD/.venv/bin:$PATH"
          ./scripts/lint.sh 2>&1 | tee /tmp/castling-evidence/lint.log
          python3 -c "import json; from pathlib import Path; assert json.loads(Path('/tmp/castling-evidence/compiler-proofs.json').read_text())['proof_gate']=='PASS'; assert '12 pass' in Path('/tmp/castling-evidence/pin.log').read_text(); assert Path('/tmp/castling-evidence/lint.log').read_text().strip().endswith('lint: OK')"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bend-castling-public-qualification
          path: /tmp/castling-evidence/
          retention-days: 14
