name: Apply 474 follow-up

on:
  push:
    branches: [feat/nnue-gumbel-readout]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/nnue-gumbel-readout
          fetch-depth: 0
      - name: Apply review fixes
        run: python3 scripts/_fix_474_followup.py
      - name: Remove bootstrap files
        run: |
          rm scripts/_fix_474_followup.py
          rm .github/workflows/apply-474-followup.yml
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: close remaining Gumbel readout review gaps"
          git push origin HEAD:feat/nnue-gumbel-readout
