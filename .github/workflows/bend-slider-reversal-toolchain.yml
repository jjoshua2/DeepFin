name: Stage pinned slider proof checker
'on':
  push:
    branches: [dev/bend-slider-reversal-20260927]
    paths: [.github/workflows/bend-slider-reversal-toolchain.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BEND_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ec9997838788ea5de34c81a7f97037ef47753723
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: jjoshua2/bend
          ref: aaeb9bc91ff0ff0b3f58dba6a9744c6607e167ae
          path: .compiler
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Record exact compiler and runtime without credentials
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/checker"
          bun native/bend_engine/standalone/verify_compiler.js "$PWD/.compiler" > "$RUNNER_TEMP/checker/identity.json"
          git -C .compiler archive --format=tar HEAD | gzip > "$RUNNER_TEMP/checker/compiler.tar.gz"
          git -C .compiler cat-file commit HEAD > "$RUNNER_TEMP/checker/compiler-commit.raw"
          git -C .compiler rev-parse HEAD > "$RUNNER_TEMP/checker/compiler-commit.txt"
          cp "$(command -v bun)" "$RUNNER_TEMP/checker/bun"
          bun --version > "$RUNNER_TEMP/checker/bun-version.txt"
          cd "$RUNNER_TEMP/checker"
          sha256sum compiler.tar.gz compiler-commit.raw bun > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: pinned-slider-proof-checker
          path: ${{ runner.temp }}/checker/
          retention-days: 2
