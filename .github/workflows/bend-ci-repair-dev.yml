name: Bend CI repair confirmation
on:
  push:
    branches: [fix/bend-ci-audit-20260921]
    paths: [.github/workflows/bend-ci-repair-dev.yml]
permissions:
  contents: write
  actions: read
jobs:
  confirm:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: f1e4037b89314a1f787508d7bd0bb60a1dc6e96c
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          activate-environment: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/download-artifact@v4
        with:
          name: bend-ci-repair-confirmation
          run-id: 35643818659
          github-token: ${{ github.token }}
          path: /tmp/previous-repair
      - name: Apply exact repairs and source-verified CI compiler selection
        run: |
          echo 'cb3636d84043243b2c859c3ccca282ac85be2ff2673029e6305974f37fb67fe9  /tmp/previous-repair/bend-ci-repair.patch' | sha256sum -c -
          git apply --check /tmp/previous-repair/bend-ci-repair.patch
          git apply /tmp/previous-repair/bend-ci-repair.patch
          python - <<'PY'
          import base64,hashlib,json,urllib.request
          from pathlib import Path
          sha='46f77088a0b4073fb317fa7e60250387c811f3b5'
          with urllib.request.urlopen('https://api.github.com/repos/jjoshua2/DeepFin/git/blobs/'+sha,timeout=30) as r:
              raw=base64.b64decode(json.load(r)['content'])
          assert hashlib.sha1(f'blob {len(raw)}\0'.encode()+raw).hexdigest()==sha
          assert hashlib.sha256(raw).hexdigest()=='a5a991bd15b4354f7899545c360ab5c82e262fec9859a7eaadec5b8a6524e56e'
          Path('/tmp/source-ci.patch').write_bytes(raw)
          PY
          git apply --check /tmp/source-ci.patch
          git apply /tmp/source-ci.patch
          git add native/bend_engine/install_bend.sh native/bend_engine/install_ci_bend.sh native/bend_engine/resolve_latest.py native/bend_engine/probe/chess_call.c native/bend_engine/probe/build_probe.sh native/bend_engine/aoti_probe/aoti_call.c native/bend_engine/aoti_probe/build_probe.sh native/bend_engine/cuda_parity/cuda_call.c native/bend_engine/cuda_parity/build_probe.sh tests/test_bend_latest_manifest.py tests/test_bend_installer.py tests/test_bend_release_fallback.py tests/test_pause_window.py .github/workflows/bend-probe.yml .github/workflows/bend-aoti-probe.yml
          git diff --cached --check
          mkdir -p artifacts
          git diff --cached --binary > artifacts/bend-ci-repair.patch
          echo '26198f26bd62d50ad8e7bb81dde90f8b5a08768aa9af4e4c5df0f12d19968b26  artifacts/bend-ci-repair.patch' | sha256sum -c -
      - name: Install the exact U64 compiler for reproducible PR checks
        env:
          BEND_NO_TELEMETRY: '1'
        run: |
          native/bend_engine/install_ci_bend.sh
          build/bend_toolchain/bin/bend version | tee artifacts/bend-ci-version.txt
          # Cache validation must reject modified sources without silently resetting them.
          source=build/bend_toolchain/sources/aaeb9bc91ff0ff0b3f58dba6a9744c6607e167ae
          cp "$source/bend2/base.bend" /tmp/base.original.bend
          printf '\n# intentional validation mutation\n' >> "$source/bend2/base.bend"
          if native/bend_engine/install_ci_bend.sh > artifacts/bend-ci-tamper.txt 2>&1; then exit 1; fi
          grep 'compiler source mismatch' artifacts/bend-ci-tamper.txt
          grep 'intentional validation mutation' "$source/bend2/base.bend"
          cp /tmp/base.original.bend "$source/bend2/base.bend"
          native/bend_engine/install_ci_bend.sh
      - name: Locked environment and all static checks
        run: |
          uv sync --locked --extra dev --extra cpu
          ruff check native/bend_engine/resolve_latest.py tests/test_bend_latest_manifest.py tests/test_bend_installer.py tests/test_bend_release_fallback.py tests/test_pause_window.py
          basedpyright native/bend_engine/resolve_latest.py tests/test_bend_latest_manifest.py tests/test_bend_installer.py tests/test_bend_release_fallback.py tests/test_pause_window.py
          python scripts/validate.py lint --require-cpu-wheel
      - name: Offline installer and watchdog regression
        run: |
          pytest -q tests/test_bend_latest_manifest.py tests/test_bend_installer.py tests/test_bend_release_fallback.py tests/test_pause_window.py -k 'bend or lease_watchdog' --junitxml=artifacts/bend-ci-contracts.xml
      - name: Required actual chess and AOTI tests and CUDA-harness compilation
        env:
          BEND_NO_TELEMETRY: '1'
          CAE_REQUIRE_BEND_PROBE: '1'
          CAE_REQUIRE_BEND_AOTI_PROBE: '1'
          CAE_REQUIRE_BEND_CUDA_PARITY: '1'
        run: |
          pytest -q tests/test_bend_chess_probe.py tests/test_bend_aoti_probe.py tests/test_bend_cuda_parity_harness.py --junitxml=artifacts/bend-ci-probes.xml
      - name: Publish only the tested repair, not this workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git diff --cached --check
          git commit -m 'Repair Bend CI toolchain, native effect ABI and watchdog teardown'
          target=refs/heads/fix/bend-ci-repair-validated
          test -z "$(git ls-remote --heads origin "$target")"
          git push origin HEAD:"$target"
          git rev-parse HEAD > artifacts/bend-ci-repair-commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bend-ci-repair-confirmation
          path: artifacts/bend-ci-*
          retention-days: 14
