name: Bend CI repair audit
on:
  push:
    branches: [fix/bend-ci-audit-20260921]
    paths: [.github/workflows/bend-ci-repair-dev.yml]
permissions:
  contents: read
  actions: read
  pull-requests: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inventory all open Bend PR checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/bend-ci-inventory
          python - <<'PY'
          import json, os, urllib.request
          from pathlib import Path
          repo = 'jjoshua2/DeepFin'
          def get(path):
              req = urllib.request.Request('https://api.github.com/repos/' + repo + '/' + path, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
              with urllib.request.urlopen(req, timeout=30) as response: return json.load(response)
          prs = []
          for page in range(1, 11):
              rows = get(f'pulls?state=open&per_page=100&page={page}')
              prs.extend(p for p in rows if 'bend' in p['title'].lower())
              if len(rows) < 100: break
          report = []
          for p in sorted(prs, key=lambda p:p['number']):
              row = {'number':p['number'], 'title':p['title'], 'head':p['head']['ref'], 'sha':p['head']['sha'], 'base':p['base']['ref'], 'base_sha':p['base']['sha'], 'checks':[]}
              runs = get('actions/runs?event=pull_request&per_page=30&head_sha=' + p['head']['sha'])['workflow_runs']
              seen = set()
              for run in runs:
                  if run['name'] in seen: continue
                  seen.add(run['name'])
                  check = {k:run[k] for k in ('id','name','status','conclusion','html_url')}
                  if run['conclusion'] == 'failure':
                      jobs = get(f"actions/runs/{run['id']}/jobs?per_page=100")['jobs']
                      check['failed_jobs'] = [{'id':j['id'],'name':j['name'], 'steps':[s['name'] for s in j['steps'] if s['conclusion']=='failure']} for j in jobs if j['conclusion']=='failure']
                  row['checks'].append(check)
              report.append(row)
              Path('/tmp/bend-ci-inventory/prs.json').write_text(json.dumps(report, indent=2)+'\n')
              print(p['number'],[(c['name'],c['conclusion'],c.get('failed_jobs',[])) for c in row['checks']])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bend-ci-inventory
          path: /tmp/bend-ci-inventory/
          retention-days: 7
