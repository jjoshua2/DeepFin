name: Bend release resolution diagnostic
on:
  push:
    branches: [fix/bend-ci-audit-20260921]
    paths: [.github/workflows/bend-ci-repair-dev.yml]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Compare feed and public release availability
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error
          feed='https://bend-lang.com/dl/latest.json'
          with urllib.request.urlopen(feed,timeout=30) as r: data=json.load(r)
          print('feed',json.dumps(data))
          assert isinstance(data['ver'],str) and all(c in '0123456789.' for c in data['ver'])
          for endpoint in ('tags/v'+data['ver'],'latest'):
              url='https://api.github.com/repos/bendlang/bend/releases/'+endpoint
              for auth in (False,True):
                  headers={'Accept':'application/vnd.github+json','User-Agent':'DeepFin-CI-repair'}
                  if auth: headers['Authorization']='Bearer '+os.environ['GH_TOKEN']
                  try:
                      with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=30) as r:
                          release=json.load(r)
                          print(endpoint,'authenticated='+str(auth),r.status,release.get('tag_name'),[(a['name'],a.get('digest')) for a in release.get('assets',[])])
                  except urllib.error.HTTPError as e:
                      body=json.loads(e.read())
                      print(endpoint,'authenticated='+str(auth),e.code,body.get('message'))
          PY
