name: PR5d live-root recovery
on:
  push:
    branches: [work/pr5d-live-recovery-20260924]
permissions:
  contents: write
  actions: read
jobs:
  qualify-model:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      BEND_NO_TELEMETRY: '1'
      PYTHONPATH: .
      CAE_TEST_THREADS: '2'
      OMP_NUM_THREADS: '2'
      MAX_JOBS: '1'
      TORCHINDUCTOR_COMPILE_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 42d4c78ebfca102e146720c818f5dba9db61fd57
      - uses: actions/download-artifact@v4
        with:
          name: deepfin-pr5d-live-native-qualification
          run-id: 36067455444
          github-token: ${{ github.token }}
          path: /tmp/pr5d-prior
      - name: Recover exact qualified runtime and small test/build additions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir /tmp/pr5d-model-evidence
          python - <<'PY'
          import base64,hashlib,json,subprocess,tarfile
          from pathlib import Path
          source=Path('/tmp/pr5d-prior')
          patch=(source/'source.patch').read_bytes()
          assert hashlib.sha256(patch).hexdigest()=='7fdf7da669020da7c1cbcbfa217332f1aa405a9fcbfe001804e619622d4a49b1'
          subprocess.run(['git','apply','--check','-'],input=patch,check=True)
          subprocess.run(['git','apply','-'],input=patch,check=True)
          original=json.loads((source/'source-manifest.json').read_text())
          for path,digest in original.items():
              assert hashlib.sha256(Path(path).read_bytes()).hexdigest()==digest,path
          def blob(sha):
              rec=json.loads(subprocess.check_output(['gh','api',f'repos/jjoshua2/DeepFin/git/blobs/{sha}']))
              return base64.b64decode(rec['content'])
          tests=blob('7e247c762bd951129f2a79a48143295032d3f674')
          assert hashlib.sha256(tests).hexdigest()=='36af24a148fd5782d8926f9a3468a664b9e4e83a0e18dedc8475f8f1401ec5d2'
          subprocess.run(['git','apply','--check','-'],input=tests,check=True)
          subprocess.run(['git','apply','-'],input=tests,check=True)
          raw=blob('c6fe96e883783b18bf257fe9e315155fb0a72403')
          assert hashlib.sha256(raw).hexdigest()=='d18684e834713aa224e09656896fc1600db537c61a3a055fccc2056f821fca27'
          build=Path('native/bend_engine/multi_root/build_live.sh');build.write_bytes(raw);build.chmod(0o755)
          for path,digest in original.items():
              if path!='native/bend_engine/multi_root/verify_live.py':
                  assert hashlib.sha256(Path(path).read_bytes()).hexdigest()==digest,path
          with tarfile.open(source/'native.tar.gz') as archive:
              archive.extractall('/tmp',filter='data')
          for name,digest in [('live','1ae51341df74ef75cfadb928b46d8de1693421dc9f3ed7e1d9ec22e31ceaad0b'),('main','3a47eff51d0a08c24c22a37ac00241c5b96f10b805a262fac27196383f9bb0be')]:
              assert hashlib.sha256(Path(f'/tmp/pr5d-native/{name}.c').read_bytes()).hexdigest()==digest,name
          subprocess.run(['git','add','-N','.'],check=True)
          paths=subprocess.check_output(['git','diff','--name-only']).decode().splitlines()
          assert len(paths)==11 and not any(p.startswith('.github/') for p in paths),paths
          evidence=Path('/tmp/pr5d-model-evidence')
          (evidence/'source.patch').write_bytes(subprocess.check_output(['git','diff','--binary']))
          (evidence/'source-manifest.json').write_text(json.dumps({p:hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in paths},indent=2))
          (evidence/'plan.txt').write_text('Real-model composition scope registered before execution: reuse exact saved untrained CPU checkpoint; one batch-four export; at each fixed batch size live generations must match serial native trees and outcomes. The native reference separately passes existing independent eager/CBoard oracles. No injected live-model cancellation, trained weights, GPU, speed or Elo claim. Runtime unchanged from completed native qualification. Two Torch threads and one compiler job. No threshold relaxation.\n')
          PY
          git diff --check
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@v7
        with:
          version: 0.12.10
      - name: Locked CPU development environment
        run: |
          uv sync --locked --extra dev --extra cpu
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Whole-repository and explicit static checks plus cheap regressions
        run: |
          set -euo pipefail
          bash scripts/lint.sh > /tmp/pr5d-model-evidence/lint.txt 2>&1
          bash scripts/lint.sh native/bend_engine/multi_root/verify_live.py > /tmp/pr5d-model-evidence/native-lint.txt 2>&1
          python -m pytest tests/test_bend_live_cohort.py tests/test_bend_cohort_deadlines.py tests/test_bend_async_cohort.py tests/test_bend_multi_root.py tests/test_bend_async_search.py tests/test_neural_work.py tests/test_neural_search_benchmark.py tests/test_broker_served_count.py -q --junitxml=/tmp/pr5d-model-evidence/tests.xml > /tmp/pr5d-model-evidence/tests.txt 2>&1
          bun test native/bend_engine/standalone/bind_model.test.js native/bend_engine/standalone/verify_compiler.test.js native/bend_engine/batch_backend/binding.test.js > /tmp/pr5d-model-evidence/bindings.txt 2>&1
          bash -n native/bend_engine/multi_root/{qualify_live,qualify_live_registry,build_live}.sh
      - name: Recheck unchanged native executables with expanded arena admission controls
        run: |
          set -euo pipefail
          for mode in normal ubsan; do
            for channels in 146 175; do
              dir="/tmp/pr5d-native/$mode-c$channels-b4"
              python -m native.bend_engine.multi_root.verify_live --binary "$dir/live-test" --gate "$dir/live-control" --reference "$dir/reference" --report "/tmp/pr5d-model-evidence/controls-$mode-$channels.json"
            done
          done
      - uses: actions/download-artifact@v4
        with:
          name: deepfin-pr1-validation
          run-id: 35759888019
          github-token: ${{ github.token }}
          path: /tmp/pr5d-fixture
      - name: Recover exact saved fixture and export only batch four
        run: |
          set -euo pipefail
          tar -xzf /tmp/pr5d-fixture/native-build.tar.gz -C /tmp
          echo '9654a1e334fb5f875d164b82068846bfeab3df2ef2a994737e44789c2623ee6e  /tmp/pr1-model/fixture.pt2' | sha256sum -c -
          python - <<'PY'
          import hashlib,json,sys
          from pathlib import Path
          import torch
          from native.bend_engine.neural_probe.checkpoint import load_checkpoint,export_checkpoint
          assert str(torch.__version__)=='2.14.0+cpu'
          assert hashlib.sha256(Path('/tmp/pr1-model/fixture.pt').read_bytes()).hexdigest()=='bb9934134c0d9a39c515c10fa870122c3dfd28259bece392be026e32a9ca60d7'
          torch.set_num_threads(2)
          Path('/tmp/pr5d-model').mkdir()
          export_checkpoint(load_checkpoint(Path('/tmp/pr1-model/fixture.pt')),Path('/tmp/pr5d-model/b4.pt2'),batch=4,device='cpu',device_index=0)
          Path('/tmp/pr5d-model-evidence/runtime.json').write_text(json.dumps({'python':sys.version,'torch':str(torch.__version__),'torch_threads':torch.get_num_threads(),'untrained_fixture':True,'cuda_executed':False}))
          PY
      - name: Compile real CPU model paths and compare persistent generations to serial reference
        run: |
          set -euo pipefail
          single=native/bend_engine/standalone
          prefix="$(python -c 'import torch; print(torch.utils.cmake_prefix_path)')"
          clang -std=c11 -O3 -DLEGAL_ORACLE -I "$PWD" native/bend_engine/legal_probe/support.c -pthread -lm -o /tmp/pr5d-oracle
          for batch in 1 4; do
            package=/tmp/pr1-model/fixture.pt2
            if test "$batch" = 4; then package=/tmp/pr5d-model/b4.pt2; fi
            for entry in main live; do
              dir="/tmp/pr5d-real-$batch-$entry"; mkdir "$dir"
              bun "$single/bind_model.js" --batch-header "$package" "$dir/model_contract.h" > "/tmp/pr5d-model-evidence/binding-$batch-$entry.json"
              cmake -S "$single" -B "$dir/build" -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_PREFIX_PATH="$prefix" -DBEND_GENERATED_C="/tmp/pr5d-native/$entry.c" -DBEND_CONTRACT_DIR="$dir" -DBEND_TARGET_NAME=deepfin-live-qualification -DBEND_CUDA_MODEL=OFF -DBEND_ASYNC_BATCH=ON > "/tmp/pr5d-model-evidence/cmake-$batch-$entry.txt" 2>&1
              cmake --build "$dir/build" --parallel 1 > "/tmp/pr5d-model-evidence/build-$batch-$entry.txt" 2>&1
              ldd "$dir/build/deepfin-live-qualification" > "/tmp/pr5d-model-evidence/libraries-$batch-$entry.txt"
              if grep -qi libpython "/tmp/pr5d-model-evidence/libraries-$batch-$entry.txt"; then exit 2; fi
              sha256sum "$dir/build/deepfin-live-qualification" >> /tmp/pr5d-model-evidence/executables.txt
            done
            python -m native.bend_engine.multi_root.verify --binary "/tmp/pr5d-real-$batch-main/build/deepfin-live-qualification" --oracle /tmp/pr5d-oracle --batch "$batch" --channels 175 --package "$package" --checkpoint /tmp/pr1-model/fixture.pt --report "/tmp/pr5d-model-evidence/reference-$batch.json" > "/tmp/pr5d-model-evidence/reference-$batch.txt" 2>&1
            DEEPFIN_BEND_MODEL_PACKAGE="$package" BATCH="$batch" python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          from native.bend_engine.multi_root.verify_live import serial_reuse
          batch=int(os.environ['BATCH'])
          live=Path(f'/tmp/pr5d-real-{batch}-live/build/deepfin-live-qualification')
          reference=Path(f'/tmp/pr5d-real-{batch}-main/build/deepfin-live-qualification')
          report_path=Path(f'/tmp/pr5d-model-evidence/live-model-{batch}.json')
          try:
              report=serial_reuse(live,reference)
              report.update(scope='actual saved untrained CPU model, completed persistent replacements versus same-package serial reference',batch=batch,package_sha256=hashlib.sha256(Path(os.environ['DEEPFIN_BEND_MODEL_PACKAGE']).read_bytes()).hexdigest(),injected_cancellation=False,independent_live_logit_oracle=False,speed_or_strength_qualified=False)
          except Exception as error:
              report_path.write_text(json.dumps({'status':'failed','error':repr(error),'live_model_qualified':False}))
              raise
          report_path.write_text(json.dumps(report,indent=2)+'\n')
          PY
          done
      - name: Publish checked implementation on a clean feature branch only
        id: publish
        run: |
          set -euo pipefail
          git diff --check
          test -z "$(git ls-remote --heads origin refs/heads/feat/native-live-cohort-20260924)"
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          for path,digest in json.loads(Path('/tmp/pr5d-model-evidence/source-manifest.json').read_text()).items():
              assert hashlib.sha256(Path(path).read_bytes()).hexdigest()==digest,path
          for batch in (1,4):
              for prefix in ('reference','live-model'):
                  assert json.loads(Path(f'/tmp/pr5d-model-evidence/{prefix}-{batch}.json').read_text())['status']=='passed'
          PY
          git switch -c feat/native-live-cohort-20260924
          git add native/bend_engine/multi_root/{LiveRegistry.bend,LiveReport.bend,LiveRun.bend,live.bend,live_registry_probe.bend,verify_live.py,qualify_live.sh,qualify_live_registry.sh,build_live.sh} native/bend_engine/batch_backend/batch_call.c tests/test_bend_live_cohort.py
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'native: add generation-safe persistent live roots on bounded arena stack'
          git push origin HEAD:refs/heads/feat/native-live-cohort-20260924
          git rev-parse HEAD | tee /tmp/pr5d-model-evidence/published-head.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deepfin-pr5d-model-qualification
          path: /tmp/pr5d-model-evidence
          retention-days: 30
      - name: Require model gates and source publication
        if: always()
        env:
          PUBLISHED: ${{ steps.publish.outcome }}
        run: test "$PUBLISHED" = success
