name: Bend perft benchmark confirmation
on:
  push:
    branches: [feat/bend-perft-benchmark]
    paths: ['.github/workflows/bend-bench-dev.yml']
permissions:
  contents: write
jobs:
  confirm:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Apply hash-verified implementation and timer correction
        run: |
          cat .github/perft-patch-0.txt .github/perft-patch-1.txt .github/perft-patch-2.txt > /tmp/perft-feature.patch
          echo '94bfd7f257f15cfffbae7e60b63c3ff16e1fc90ff8469488a982ff029bf0da1d  /tmp/perft-feature.patch' | sha256sum -c -
          git apply --check /tmp/perft-feature.patch
          git apply /tmp/perft-feature.patch
          echo '481bb9ccebb841679fcc7d9d9db7042351e118fca515a47c1264baf42f70b6df  .github/perft-timer-fix.patch' | sha256sum -c -
          git apply --check .github/perft-timer-fix.patch
          git apply .github/perft-timer-fix.patch
          git diff --check
      - name: Install isolated compiler and validation tools
        run: |
          bash native/bend_engine/bitboard_probe/install_toolchain.sh
          python -m pip install 'python-chess==1.999' 'pytest==9.1.1' 'ruff==0.15.20' 'basedpyright==1.39.9'
      - name: Focused lint and cheap parser contracts
        run: |
          ruff check native/bend_engine/legal_probe/benchmark.py native/bend_engine/legal_probe/run_probe.py tests/test_bend_perft_benchmark.py
          basedpyright native/bend_engine/legal_probe/benchmark.py native/bend_engine/legal_probe/run_probe.py tests/test_bend_perft_benchmark.py
          mkdir -p /tmp/perft-parser-tests
          cp tests/test_bend_legal_probe.py tests/test_bend_u64_report.py tests/test_bend_perft_benchmark.py /tmp/perft-parser-tests/
          PYTHONPATH="$PWD" python -m pytest -q /tmp/perft-parser-tests --confcutdir=/tmp/perft-parser-tests
      - name: Four-mode chess correctness and independent oracle
        run: |
          mkdir -p artifacts
          python -m native.bend_engine.legal_probe.run_probe --python-chess --report artifacts/bend-perft-correctness.json
      - name: Paired same-core old Bend, new Bend and CBoard timings
        run: |
          git fetch --no-tags --depth=1 origin 7e33ebe5c7aeada732fad63034181c0138ed4ca4
          git show 7e33ebe5c7aeada732fad63034181c0138ed4ca4:native/bend_engine/legal_probe/Chess.bend > /tmp/Chess.baseline.bend
          python -m native.bend_engine.legal_probe.benchmark --baseline-chess /tmp/Chess.baseline.bend --samples 3 --report artifacts/bend-perft-benchmark.json
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('artifacts/bend-perft-benchmark.json').read_text())
          for case in report['results']:
              stats = case['summary']
              old = stats['bend_baseline']['median_seconds']
              new = stats['bend']['median_seconds']
              print(case['case'], 'old/new speed ratio:', old / new)
              assert new <= 0.90 * old, 'candidate failed the predeclared improvement screen'
          PY
      - name: Commit only validated feature files
        run: |
          git rm .github/perft-patch-0.txt .github/perft-patch-1.txt .github/perft-patch-2.txt .github/perft-timer-fix.patch
          git add docs/experiments/2026-09-18-bend-perft-baseline.md docs/experiments/README.md native/bend_engine/legal_probe/Chess.bend native/bend_engine/legal_probe/README.md native/bend_engine/legal_probe/bench.bend native/bend_engine/legal_probe/bench_clock.c native/bend_engine/legal_probe/bench_clock.h native/bend_engine/legal_probe/benchmark.py native/bend_engine/legal_probe/run_probe.py native/bend_engine/legal_probe/support.c tests/test_bend_perft_benchmark.py
          git diff --cached --check
          git diff --cached --exit-code -- chess_anti_engine tests/test_perft.py .github/workflows/bend-legal-perft.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Benchmark native perft and avoid non-exposing legality checks'
          git push origin HEAD:feat/bend-perft-benchmark
          git rev-parse HEAD > artifacts/bend-perft-validated-head.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bend-perft-confirmation
          path: artifacts/bend-perft-*
          retention-days: 30
