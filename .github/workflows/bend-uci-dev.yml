name: Bend UCI interface confirmation
on:
  push:
    branches: [feat/bend-uci-interface-dev]
    paths: ['.github/workflows/bend-uci-dev.yml']
permissions:
  contents: write
jobs:
  confirm:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          activate-environment: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Apply source-checked implementation and nullable-client guards
        run: |
          python - <<'PY'
          import base64, gzip, hashlib, json, urllib.request
          from pathlib import Path
          shas = ['d99878947f6943247d7e8eb15df39348dd0127ca', '8dc5626e67e6c31f3f7838d2bbaf4b476594cd09', 'df6bd6ea14ce6c7dec6d615854e0b2816c419b2a', '4fe74a598a78daab29ed7364e4047c2578729ff3', '28f652ea5c68cd52b2033df335504ca63db75d10', '108a13f796023071d483dce58c580576b8f8b887', 'da86161dbeeb36de3f0848b7a6981a9b16e6a250', '87da400090c5765b9afdbe067119710dda8a6fc3']
          parts = []
          for sha in shas:
              with urllib.request.urlopen('https://api.github.com/repos/jjoshua2/DeepFin/git/blobs/' + sha, timeout=30) as response:
                  data = json.load(response)
              part = base64.b64decode(data['content'])
              assert hashlib.sha1(f'blob {len(part)}\0'.encode() + part).hexdigest() == sha
              parts.append(part)
          patch = gzip.decompress(base64.b64decode(b''.join(parts), validate=True))
          assert hashlib.sha256(patch).hexdigest() == '3fad412bb2971d3177aab9fe3c8a8da4b1e3a61d136b321a1ec70e6e9b6eacee'
          Path('/tmp/bend-uci.patch').write_bytes(patch)
          PY
          git apply --check /tmp/bend-uci.patch
          git apply /tmp/bend-uci.patch
          python - <<'PY'
          from pathlib import Path
          import hashlib
          p = Path('native/bend_engine/uci_probe/run_probe.py')
          s = p.read_text()
          changes = [
              ('                assert (result.move in root.legal_moves) if any(root.legal_moves) else result.move == chess.Move.null()', '                assert result.move is not None\n                assert (result.move in root.legal_moves) if any(root.legal_moves) else result.move == chess.Move.null()'),
              ('            assert analysis.wait().move in chess.Board().legal_moves', '            stopped = analysis.wait()\n            assert stopped.move is not None\n            assert stopped.move in chess.Board().legal_moves'),
              ('            assert clocked.move in chess.Board().legal_moves', '            assert clocked.move is not None\n            assert clocked.move in chess.Board().legal_moves'),
          ]
          for old, new in changes:
              assert s.count(old) == 1
              s = s.replace(old, new)
          p.write_text(s)
          assert hashlib.sha256(p.read_bytes()).hexdigest() == '021e06cec08adb95d1b5c3605b2e6a81899ef526dda9ebf24abf7b3adac4adee'
          PY
          git diff --check
      - name: Install isolated CPU environment and source-pinned compiler
        run: |
          uv sync --locked --extra dev --extra cpu
          python -c "import torch; assert torch.version.cuda is None; print(torch.__version__)"
          bash native/bend_engine/bitboard_probe/install_toolchain.sh
      - name: Focused static checks and all inexpensive contracts
        run: |
          status=0
          ruff check native/bend_engine/uci_probe tests/test_bend_uci.py || status=1
          basedpyright native/bend_engine/uci_probe tests/test_bend_uci.py || status=1
          python -m pytest -q tests/test_bend_uci.py tests/test_bend_claim_options.py tests/test_bend_search_draws.py tests/test_bend_neural_play.py tests/test_bend_qualification.py tests/test_bend_checkpoint.py tests/test_bend_batching.py tests/test_bend_neural_boundary.py tests/test_bend_search_sessions.py tests/test_bend_root_advance.py || status=1
          exit "$status"
      - name: Four-mode real UCI client and interrupted-evaluator contracts
        run: |
          python -m native.bend_engine.uci_probe.run_probe --report artifacts/bend-uci-interface.json
      - name: Preserve existing saved-checkpoint qualification
        run: |
          python -m native.bend_engine.neural_probe.checkpoint_probe --fixture-checkpoint --modes native \
            --work-dir /tmp/bend-uci-model --report artifacts/bend-uci-checkpoint.json
      - name: Actual native neural UCI versus direct session with retained history
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from native.bend_engine.uci_probe.run_probe import neural_client
          root = Path('/tmp/bend-uci-model')
          result = neural_client(root / 'bend/session-native', root / 'untrained-transformer.pt', root / 'checkpoint.pt2', root / 'worker/aoti_worker')
          Path('artifacts/bend-uci-neural.json').write_text(json.dumps(result, indent=2) + '\n')
          print(json.dumps(result, indent=2))
          PY
      - name: Publish only the clean tested feature sources
        run: |
          git fetch --no-tags --depth=1 origin 10dc757b3ff06ba9b37008c3d94d61105eebc74a
          git read-tree 10dc757b3ff06ba9b37008c3d94d61105eebc74a
          git add native/bend_engine/uci_probe tests/test_bend_uci.py docs/experiments/README.md docs/experiments/2026-09-20-bend-uci-interface.md
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          commit="$(git commit-tree "$(git write-tree)" -p 10dc757b3ff06ba9b37008c3d94d61105eebc74a -m 'Add experimental UCI frontend for native Bend chess and checkpoint evaluation')"
          git push origin "$commit":refs/heads/feat/bend-uci-interface-reviewed
          printf '%s\n' "$commit" > artifacts/bend-uci-commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bend-uci-confirmation
          path: artifacts/bend-uci-*
          retention-days: 30
