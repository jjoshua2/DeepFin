name: Bend neural play confirmation
on:
  push:
    branches: [feat/bend-neural-play-dev]
    paths: ['.github/workflows/bend-neural-play-dev.yml']
permissions:
  contents: write
jobs:
  confirm:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          activate-environment: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Apply exact source and test-transport keyword correction
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, gzip, hashlib, json, urllib.request
          shas = ['e55a43f1ef487d929223f62b90cf28a6ea2eba1d', '984abecd2928856adf9b85a926d5e9be880e8fad', 'b8a5b8852d6609cf14fc5d34c960c26c710f8a36']
          parts = []
          for sha in shas:
              url = 'https://api.github.com/repos/jjoshua2/DeepFin/git/blobs/' + sha
              with urllib.request.urlopen(url, timeout=30) as response:
                  data = json.load(response)
              part = base64.b64decode(data['content'])
              assert hashlib.sha1(f'blob {len(part)}\0'.encode() + part).hexdigest() == sha
              parts.append(part)
          patch = gzip.decompress(base64.b64decode(b''.join(parts), validate=True))
          assert hashlib.sha256(patch).hexdigest() == 'a4291ce441b9ab12ca93c7d92092e899c5a52cb4e5f9f46d6f020320af3c746b'
          Path('/tmp/bend-play.patch').write_bytes(patch)
          PY
          git apply --check /tmp/bend-play.patch
          git apply /tmp/bend-play.patch
          python - <<'PY'
          from pathlib import Path
          import hashlib
          p = Path('tests/test_bend_neural_play.py')
          s = p.read_text()
          old = '    def expect(self, text: str) -> None:\n        assert self.line() == text\n'
          new = '    def expect(self, expected: str) -> None:\n        assert self.line() == expected\n'
          assert s.count(old) == 1
          p.write_text(s.replace(old, new))
          assert hashlib.sha256(p.read_bytes()).hexdigest() == 'a5da6564fb9d527ad05f92b5ee2832629fdd356e9b648950bbfa160daac684d1'
          PY
          git diff --check
      - name: Install isolated CPU environment and pinned compiler
        run: |
          uv sync --locked --extra dev --extra cpu
          python -c "import torch; assert torch.version.cuda is None; print(torch.__version__)"
          bash native/bend_engine/bitboard_probe/install_toolchain.sh
      - name: Static checks and inexpensive contracts
        run: |
          status=0
          ruff check native/bend_engine/neural_probe tests/test_bend_neural_play.py || status=1
          basedpyright native/bend_engine/neural_probe tests/test_bend_neural_play.py || status=1
          python -m pytest -q tests/test_bend_neural_play.py tests/test_bend_qualification.py tests/test_bend_checkpoint.py tests/test_bend_batching.py tests/test_bend_neural_boundary.py tests/test_bend_search_sessions.py tests/test_bend_root_advance.py || status=1
          exit "$status"
      - name: Preserve saved-checkpoint and batching qualification
        run: |
          python - <<'PY'
          from pathlib import Path
          import torch
          from native.bend_engine.neural_probe.checkpoint_probe import fixture_checkpoint
          torch.set_num_threads(2)
          fixture_checkpoint(Path('/tmp/bend-play-fixture.pt'))
          PY
          python -m native.bend_engine.neural_probe.checkpoint_probe \
            --checkpoint /tmp/bend-play-fixture.pt --modes generic portable native ubsan \
            --work-dir /tmp/bend-play-export --report artifacts/bend-play-checkpoint.json
      - name: Four-mode sustained neural play and late old-root replies
        run: |
          python -m native.bend_engine.neural_probe.play_probe \
            --checkpoint /tmp/bend-play-fixture.pt \
            --reuse-package /tmp/bend-play-export/checkpoint.pt2 --qualification-suite \
            --modes generic portable native ubsan --report artifacts/bend-play-games.json
      - name: Preserve original sessions and played-root history contracts
        run: |
          python -m native.bend_engine.session_probe.root_probe --modes native --check-encoding \
            --report artifacts/bend-play-root-regression.json
      - name: Publish clean tested non-workflow source
        run: |
          git fetch --no-tags --depth=1 origin 389cb8561599f54b98a6aa86be73218ade2ff426
          git read-tree 389cb8561599f54b98a6aa86be73218ade2ff426
          git add native/bend_engine/neural_probe/game.py native/bend_engine/neural_probe/play_probe.py native/bend_engine/neural_probe/batch_probe.py native/bend_engine/neural_probe/README.md tests/test_bend_neural_play.py docs/experiments/README.md docs/experiments/2026-09-19-bend-neural-play.md
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          commit="$(git commit-tree "$(git write-tree)" -p 389cb8561599f54b98a6aa86be73218ade2ff426 -m 'Connect native neural play, acknowledged roots and host draw policy')"
          git push origin "$commit":refs/heads/feat/bend-neural-play-reviewed
          printf '%s\n' "$commit" > artifacts/bend-play-commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bend-neural-play-confirmation
          path: artifacts/bend-play-*
          retention-days: 30
