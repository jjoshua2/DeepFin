name: Bend policy development snapshot
on:
  push:
    branches: [feat/bend-owned-policy-dev]
    paths: ['.github/workflows/bend-policy-dev.yml']
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: |
          mkdir -p /tmp/bend-policy-source
          git archive --format=tar.gz HEAD > /tmp/bend-policy-source/deepfin.tgz
          git clone --filter=blob:none --no-checkout https://github.com/jjoshua2/bend.git /tmp/bend-policy-compiler
          git -C /tmp/bend-policy-compiler checkout --detach 806b373a7a4509479054da74a82271c6a4c25014
          git -C /tmp/bend-policy-compiler archive --format=tar.gz HEAD > /tmp/bend-policy-source/compiler.tgz
          cp "$(command -v bun)" /tmp/bend-policy-source/bun
      - uses: actions/upload-artifact@v4
        with:
          name: bend-policy-source
          path: /tmp/bend-policy-source/
          retention-days: 2
