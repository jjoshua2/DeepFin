name: Bend search sessions
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/bend-search-sessions.yml'
      - 'native/bend_engine/session_probe/**'
      - 'native/bend_engine/legal_probe/Chess.bend'
      - 'native/bend_engine/legal_probe/input.c'
      - 'native/bend_engine/legal_probe/support.*'
      - 'native/bend_engine/legal_probe/run_probe.py'
      - 'native/bend_engine/bitboard_probe/**'
      - 'chess_anti_engine/encoding/_cboard_impl.h'
      - 'chess_anti_engine/encoding/_slider_attacks_impl.h'
      - 'tests/test_bend_search_sessions.py'
permissions:
  contents: read
jobs:
  sessions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Install pinned compiler and test-time tools
        run: |
          bash native/bend_engine/bitboard_probe/install_toolchain.sh
          python -m pip install 'python-chess==1.999' 'pytest==9.1.1' 'ruff==0.15.20' 'basedpyright==1.39.9'
      - name: Focused static and cheap contracts
        run: |
          ruff check native/bend_engine/session_probe/run_probe.py tests/test_bend_search_sessions.py
          basedpyright native/bend_engine/session_probe/run_probe.py tests/test_bend_search_sessions.py
          mkdir -p /tmp/session-contract-tests
          cp tests/test_bend_search_sessions.py /tmp/session-contract-tests/
          PYTHONPATH="$PWD" python -m pytest -q /tmp/session-contract-tests --confcutdir=/tmp/session-contract-tests
      - name: Persistent search, evaluator faults and reset recovery
        run: |
          python -m native.bend_engine.session_probe.run_probe \
            --python-chess --report artifacts/bend-search-sessions.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bend-search-sessions
          path: artifacts/bend-search-sessions.json
          retention-days: 30
