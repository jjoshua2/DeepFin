name: Bend whole-board roundtrip qualification
'on':
  push:
    branches: [feat/bend-whole-board-roundtrip-dev-20260924]
    paths: [.github/workflows/bend-whole-board-qualification.yml]
permissions:
  contents: write
  actions: read
defaults:
  run:
    shell: bash
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BEND_NO_TELEMETRY: '1'
      TERM: dumb
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      BASE: d8629e31a55ceda25edef836f8f34a895416dba4
      TARGET: feat/bend-whole-board-roundtrip-20260924
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d8629e31a55ceda25edef836f8f34a895416dba4
      - uses: actions/checkout@v4
        with:
          repository: jjoshua2/bend
          ref: aaeb9bc91ff0ff0b3f58dba6a9744c6607e167ae
          path: .compiler
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Recover exact candidate and verify retained parent qualification
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          export EVIDENCE="$RUNNER_TEMP/whole-board-evidence"
          mkdir -p "$EVIDENCE"
          echo "EVIDENCE=$EVIDENCE" >> "$GITHUB_ENV"
          gh api repos/jjoshua2/DeepFin/git/blobs/883682d126a71a929be0e7063499fd4f27271ac8 --jq .content | base64 --decode > "$RUNNER_TEMP/candidate.xz"
          test "$(git hash-object "$RUNNER_TEMP/candidate.xz")" = 883682d126a71a929be0e7063499fd4f27271ac8
          gh api repos/jjoshua2/DeepFin/actions/jobs/107910029481 > "$EVIDENCE/parent-job.json"
          python3 - <<'PY'
          import hashlib,json,lzma,os,subprocess
          from pathlib import Path
          t=Path(os.environ['RUNNER_TEMP']);e=Path(os.environ['EVIDENCE'])
          patch=lzma.decompress((t/'candidate.xz').read_bytes(),memlimit=256*1024*1024)
          assert len(patch)==57803 and hashlib.sha256(patch).hexdigest()=='23ccb80147a3cf530a228e561697fa6adece6cb7d705d613b70ec59cbdafa2ed'
          (e/'source.patch').write_bytes(patch)
          def git(*args):return subprocess.check_output(['git',*args],text=True).strip()
          assert git('rev-parse','HEAD')==os.environ['BASE']
          assert git('rev-parse','HEAD^{tree}')=='12a512d0866f8cd8c7f03831a5077b461fe9ffc1'
          old=Path('docs/experiments/evidence/bend-occupied-decoder')
          q=json.loads((old/'qualification.json').read_text())
          assert q['qualification']=='PASS' and q['modular_laws']==127 and q['modular_controls']==350
          p=json.loads((old/'hosted-focused.json').read_text())
          assert p['focused_gate']=='PASS' and p['consumer']=='PASS' and p['new_law_count']==4
          assert len(p['negative_controls'])==18 and all(x['rejected'] for x in p['negative_controls'])
          manifest=json.loads((old/'hosted-source-identity.json').read_text())['candidate_source_sha256s']
          assert len(manifest)==404
          for f,h in manifest.items():assert hashlib.sha256(Path(f).read_bytes()).hexdigest()==h,f
          j=json.loads((e/'parent-job.json').read_text())
          assert j['id']==107910029481 and j['run_id']==36083420058 and j['status']=='completed' and j['conclusion']=='success'
          subprocess.run(['git','apply','--check',str(e/'source.patch')],check=True)
          subprocess.run(['git','apply','--index',str(e/'source.patch')],check=True)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          assert git('write-tree')=='a88dfe56fbef013fb9e52bd68582a3212e5b9561'
          files=git('diff','--cached','--name-only').splitlines();assert len(files)==15
          allowed={'docs/experiments/2026-09-24-bend-whole-board-roundtrip.md','docs/experiments/evidence/bend-whole-board-roundtrip/lowering-probe.bend.txt','docs/experiments/evidence/bend-whole-board-roundtrip/lowering-limit.json'}
          assert all(f in allowed or f.startswith('native/bend_engine/standalone/proofs/abstraction/') for f in files)
          hashes={f:hashlib.sha256(Path(f).read_bytes()).hexdigest() for f in git('ls-files','native/bend_engine').splitlines() if Path(f).is_file()}
          assert len(hashes)==416
          r={'base':os.environ['BASE'],'source_tree':'a88dfe56fbef013fb9e52bd68582a3212e5b9561','patch_sha256':hashlib.sha256(patch).hexdigest(),'changed_files':files,'candidate_source_sha256s':hashes,'retained_parent_laws':127,'retained_parent_controls':350,'parent_manifest_matches':404,'parent_qualification_sha256':hashlib.sha256((old/'qualification.json').read_bytes()).hexdigest(),'combined_wrapper_executed':False,'independent_review':False,'saved_decode_variant_preserved':True}
          (e/'source-identity.json').write_text(json.dumps(r,indent=2)+'\n')
          PY
          bun native/bend_engine/standalone/verify_compiler.js "$PWD/.compiler" | tee "$EVIDENCE/compiler-identity.txt"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'native: prove whole-board reconstruction and abstract-square ordering'
          echo "SOURCE=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          git log -1 --format='%H%n%T' > "$EVIDENCE/source-commit.txt"
      - name: Check five public source laws and all seventeen controls
        run: |
          set -euo pipefail
          bun native/bend_engine/standalone/proofs/abstraction/focused.js "$PWD/.compiler" --report "$EVIDENCE/focused.json" 2>&1 | tee "$EVIDENCE/focused.log"
      - name: Compare actual full-board observations and reconstruction in four native modes
        env:
          CC: clang-18
        run: |
          set -euo pipefail
          bun native/bend_engine/standalone/proofs/abstraction/verify_native.js "$PWD/.compiler" --report "$EVIDENCE/native.json" 2>&1 | tee "$EVIDENCE/native.log"
      - name: Reproduce and separately record structural snapshot lowering limitation
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,subprocess,time
          from pathlib import Path
          e=Path(os.environ['EVIDENCE'])
          archived=Path('docs/experiments/evidence/bend-whole-board-roundtrip/lowering-probe.bend.txt')
          probe=Path('native/bend_engine/standalone/proofs/abstraction/lowering-probe.bend')
          assert not probe.exists()
          data=archived.read_bytes();assert hashlib.sha256(data).hexdigest()=='e3e5b55bc07b0448afd48dd3546a6eea21dbfba0bf00711f440f5fd1aa7522a7'
          probe.write_bytes(data)
          cmd=['bun','.compiler/bend2/main.ts',str(probe),'-o',str(e/'structural-snapshot.c')]
          started=time.monotonic()
          try:
              r=subprocess.run(cmd,capture_output=True,timeout=90)
              raw=r.stdout+r.stderr
              (e/'lowering.log').write_bytes(raw)
              record={'status':'UNQUALIFIED_NATIVE_LOWERING','command':cmd,'exit_code':r.returncode,'elapsed_seconds':time.monotonic()-started,'source_sha256':hashlib.sha256(data).hexdigest(),'diagnostic_sha256':hashlib.sha256(raw).hexdigest(),'raw_text':raw.decode(),'not_a_negative_control':True,'not_native_snapshot_execution':True}
              (e/'lowering-receipt.json').write_text(json.dumps(record,indent=2)+'\n')
              assert r.returncode==1 and raw.decode().strip()=='Error: an arity over 255',raw.decode()[-2000:]
          finally:
              probe.unlink()
          PY
      - name: Recheck original compiler source suite and pin contracts
        run: |
          set -euo pipefail
          bun test native/bend_engine/standalone/verify_compiler.test.js 2>&1 | tee "$EVIDENCE/pin.log"
          (cd .compiler && bun tests/run/u64_proofs.js) | tee "$EVIDENCE/compiler-proofs.json"
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.10'
          enable-cache: false
      - name: Install locked CPU development tools using the normal build compiler
        run: |
          set -euo pipefail
          uv sync --locked --extra dev --extra cpu
          .venv/bin/python -c 'import torch; assert torch.version.cuda is None'
      - name: Run unchanged whole-repository lint
        run: |
          set -euo pipefail
          export PATH="$PWD/.venv/bin:$PATH"
          ./scripts/lint.sh 2>&1 | tee "$EVIDENCE/lint.log"
      - name: Verify outcomes and publish fresh feature branch with durable records
        run: |
          set -euo pipefail
          git diff --exit-code
          test "$(git rev-parse HEAD)" = "$SOURCE"
          test "$(git ls-remote origin refs/heads/feat/bend-occupied-decoder-20260924 | cut -f1)" = "$BASE"
          set +e
          git ls-remote --exit-code --heads origin "refs/heads/$TARGET" > "$RUNNER_TEMP/target.txt"
          found=$?
          set -e
          test "$found" = 2
          bun native/bend_engine/standalone/verify_compiler.js "$PWD/.compiler"
          python3 - <<'PY'
          import collections,hashlib,json,os,shutil
          from pathlib import Path
          e=Path(os.environ['EVIDENCE'])
          def read(n):return json.loads((e/n).read_text())
          def canon(x):return hashlib.sha256(json.dumps(x,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          ident=read('source-identity.json');f=read('focused.json');n=read('native.json');limit=read('lowering-receipt.json')
          assert len(ident['candidate_source_sha256s'])==416
          for path,h in ident['candidate_source_sha256s'].items():assert hashlib.sha256(Path(path).read_bytes()).hexdigest()==h,path
          assert f['focused_gate']=='PASS' and f['controls_gate']=='PASS' and f['consumer']=='PASS' and f['new_law_count']==5
          assert len(f['negative_controls'])==17 and all(x['rejected'] for x in f['negative_controls'])
          kinds=collections.Counter(x['kind'] for x in f['negative_controls']);assert kinds['source semantic/refinement']==8 and kinds['manifest/import policy']==8
          assert canon(f['source_sha256s'])=='c7936acf1ffc23432dd4fdb3f20e301c3b569b0daa40d12e62a7251c84c286b2'
          assert canon(f['negative_controls'])=='aeac06d1a67871adeb16c53abc7cb3524d4dc8fc702d3b5836a45f902b35c9d1'
          assert n['native_gate']=='PASS' and n['boards_per_mode']==1026 and n['squares_per_mode']==65664 and n['output_fields_per_mode']==150822
          assert n['fixture_sha256']=='f1aa3223b7dbd26bf0e197349029ebc30cf85ca9a26b7dd729b396687c843cfd'
          assert len(n['modes'])==4 and all(x['invalid_rejections']==9 and x['output_sha256']=='a526c6665281eb36cd6ed1d07bccf22b96c6f8db726ee6c1789b4361b8e28a40' for x in n['modes'])
          assert canon({k:v for k,v in n.items() if k!='cc'})=='de7dfda261dc0c1e11d73ec201c32bdae8e36bb3cc8e641747c26f91c1d61fd8'
          assert len(n['mutations'])==2 and all(x['rejected'] and x['compiled_and_executed'] for x in n['mutations'])
          assert limit['status']=='UNQUALIFIED_NATIVE_LOWERING' and limit['not_a_negative_control']
          assert read('compiler-proofs.json')['proof_gate']=='PASS'
          assert '12 pass' in (e/'pin.log').read_text() and '0 fail' in (e/'pin.log').read_text()
          assert (e/'lint.log').read_text().strip().endswith('lint: OK')
          d=Path('docs/experiments/evidence/bend-whole-board-roundtrip')
          for name in ['source-identity.json','focused.json','native.json','lowering-receipt.json','compiler-proofs.json','parent-job.json']:
              shutil.copyfile(e/name,d/('hosted-'+name))
          for name in ['pin.log','lint.log','compiler-identity.txt']:
              raw=(e/name).read_bytes();(d/(name+'.json')).write_text(json.dumps({'sha256':hashlib.sha256(raw).hexdigest(),'raw_text':raw.decode()},indent=2)+'\n')
          result={'qualification':'PASS_WITH_EXPLICIT_LOWERING_LIMIT','run':os.environ['GITHUB_RUN_ID'],'source':os.environ['SOURCE'],'source_tree':'a88dfe56fbef013fb9e52bd68582a3212e5b9561','new_laws':5,'new_controls':17,'control_categories':dict(kinds),'retained_parent_laws':127,'retained_parent_controls':350,'modular_laws':132,'modular_controls':367,'combined_wrapper_executed':False,'native_source_entries':416,'structural_snapshot_native_lowering':False,'actual_board_decoder_observation_native_gate':'PASS','source_closure_and_control_records_match_local':True,'native_report_matches_local_except_cc':True,'independent_review':False}
          (d/'qualification.json').write_text(json.dumps(result,indent=2)+'\n')
          headline=f"Hosted run **{os.environ['GITHUB_RUN_ID']}** passes the five-law focused source gate and all17 controls, four native actual-observation modes and both corruption checks, original compiler source/pin tests and unchanged repository lint on source `{os.environ['SOURCE']}`. The separately reproduced structural snapshot C-lowering limitation remains unresolved."
          paragraphs=['## Completed hosted qualification and explicit lowering limit',headline,
            'All five laws are universal: complete Board reconstruction under partition consistency; exactly64 stored square observations; injectivity on consistent Boards; the saved explicit empty-square observation; and correct coordinate order for every bounded square. Metadata remains arbitrary. This is a left inverse on actual consistent Boards, not a bijection over unrestricted Snapshot lists or valid chess positions.',
            'The focused command executes its consumer and all17 controls. Eight are semantic/refinement failures at intended locations, eight enforce manifests/import safety and one is a synthetic warning-output unit, not a compiler execution. No crash, missing import, affine error or timeout counts as successful semantic rejection. The exact source closure and all control records match the final local report.',
            'Exact-source parent127/350 is retained on404 manifest entries, its completed focused/report evidence and successful hosted job. Modular coverage is132 laws/367 controls; the full132-law wrapper was not run. No old law or gate was changed. The alternate saved local decode implementation remains preserved rather than silently replaced by this decoder-based continuation.',
            'Native generic/portable/native-target/UBSan each pass1,026 actual Board cases,65,664 square observations and150,822 output fields. The driver reconstructs all eight bitboards from actual occupancy-guarded decoder output and preserves raw metadata, comparing independent square arrays and actual returned Board fields. All768 fresh square/kind/color insertions,192 random Boards,64 metadata cases,empty andinitial are included. Nine malformed requests per mode are rejected. The complete native report matches local except cc. Modes repeat fixtures, not disjoint or exhaustive board/game datasets.',
            'One actual decoder mutation returns the wrong pawn tag; one probe mutation skips observation squares. Both compile and execute before wrong-value rejection. The latter is explicitly a test-traversal mutation, not a production change. The native probe does not import or execute structural Spec.observe/restore.',
            'The archived direct structural-snapshot probe was retried with the pinned compiler and again failed C generation with Error: an arity over255. Its nonzero receipt and exact source are committed. This is an unresolved lowering limitation, not an accepted source rejection control, native execution or a passing structural-snapshot round trip. The source theorem and actual-decoder native checks are separate evidence layers.',
            'Hosted Bun1.4.2/Clang18.1.3; Clang is scoped to native probes. Locked Python3.13/uv0.12.10 CPU tools use the normal extension compiler. Unchanged Ruff/Basedpyright/Vulture passes, resolving only the local missing-tools lint gap. Original compiler16-laws/seven-controls and12 pin tests pass. No compiler source or protected checker was modified.',
            'All416 native-source entries match before evidence publication. Only documentation,index and evidence follow qualification. Earlier explicit binder/import-order construction failures, a nonunique mutation-site assertion and an interrupted outer execution remain historical; the final local streaming-to-file supervised focused run completed successfully in45.768seconds. No failed or incomplete attempt is counted as a proof pass.',
            'Self-review only, not independent review. Source/hash agreement is provenance rather than a separate reviewer. Pinned checker/Base,native lowering/storage,ABI,toolchain,OS and hardware remain trust boundaries. No production runtime, earlier accepted law, permanent workflow, routine perft, search, model/GPU, training or benchmark changes. No additional Python application responsibility moved into Bend; export,references,data/control/training and transitional C++/LibTorch/AOTI remain dependencies. No merge,force push,deployment or live-process action.',
            'Next decisive P3 work is proving actual parser traversal supplies fresh squares, then invariant-preserving removal and move/special-move operations. Snapshot validity in both directions, metadata validity, legal reachability, king safety and legal-generation soundness/completeness remain separate.'
          ]
          record=Path('docs/experiments/2026-09-24-bend-whole-board-roundtrip.md');record.write_text(record.read_text()+'\n\n'+'\n\n'.join(paragraphs)+'\n')
          index=Path('docs/experiments/README.md');text=index.read_text();anchor='| Record | Scope |\n| --- | --- |\n';assert text.count(anchor)==1
          index.write_text(text.replace(anchor,anchor+'| [Whole-board reconstruction](2026-09-24-bend-whole-board-roundtrip.md) | Five source contracts for lossless Board snapshots, coordinate order and injectivity; actual decoder native checks; structural snapshot lowering remains unqualified; modular132/367 |\n',1))
          m=Path('docs/bend_migration_proofs.md');title,rest=m.read_text().split('\n',1)
          note='## Latest P3 whole-board abstraction and ordering\n\n'+headline+'\n\nThe abstraction suite now reconstructs the complete actual consistent Board, including eight bitboards and all three metadata fields, from64 independent square observations. Equal snapshots identify equal consistent Boards; every bounded snapshot square agrees with the existing actual-square abstraction. This closes the pointwise-to-whole-Board left-inverse step, not unrestricted Snapshot bijection or legal-position validity. The explicit empty-square law from the saved alternate decode candidate is retained as a checked consequence.\n\nSource qualification is modular132/367 with the exact127/350 parent retained; the full wrapper was not executed. Native tests reconstruct actual decoder observations externally, not by running structural Spec.observe/restore. The direct structural probe still fails the pinned compiler C-lowering arity limit and is explicitly unqualified. See [the dated readout](experiments/2026-09-24-bend-whole-board-roundtrip.md). Parser freshness and removal/move invariants are the next P3 obligations; no application responsibility moved from Python.\n'
          m.write_text(title+'\n\n'+note+rest)
          PY
          git diff --check
          git diff --exit-code -- native
          git switch -c "$TARGET"
          git add docs/experiments docs/bend_migration_proofs.md
          git commit -m 'docs: qualify whole-board source reconstruction and distinguish native lowering limit'
          git push origin "HEAD:refs/heads/$TARGET"
          git log -2 --format='%H %s' > "$EVIDENCE/published-commits.txt"
          mkdir -p "$RUNNER_TEMP/final"
          cp -r "$EVIDENCE" "$RUNNER_TEMP/final/reports"
          git archive --format=tar HEAD | gzip > "$RUNNER_TEMP/final/source.tar.gz"
          git cat-file commit HEAD > "$RUNNER_TEMP/final/commit.raw"
          git rev-parse HEAD^{tree} > "$RUNNER_TEMP/final/tree.txt"
          (cd "$RUNNER_TEMP/final" && sha256sum source.tar.gz commit.raw > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bend-whole-board-qualification
          path: |
            ${{ runner.temp }}/final/
            ${{ runner.temp }}/whole-board-evidence/
          retention-days: 14
