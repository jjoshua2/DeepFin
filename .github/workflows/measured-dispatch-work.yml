name: Measured dispatch qualification workspace
on:
  push:
    branches: [work/measured-dispatch-20260926]
permissions:
  contents: read
  actions: read
env:
  PYTHONPATH: .
  PYTHONUNBUFFERED: '1'
  CAE_TEST_THREADS: '2'
  OMP_NUM_THREADS: '2'
  MKL_NUM_THREADS: '2'
  MAX_JOBS: '1'
  TORCHINDUCTOR_COMPILE_THREADS: '1'
  CUDA_VISIBLE_DEVICES: ''
  BEND_NO_TELEMETRY: '1'
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 19c9cc017be334e3330b8bf4a6c2e488db5845b6
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: deepfin-measured-dispatch-qualification
          run-id: 36218967289
          github-token: ${{ github.token }}
          path: /tmp/dispatch-authored
      - name: Recover candidate and checked annotation corrections
        run: |
          mkdir -p artifacts/dispatch
          python3 - <<'PY'
          import hashlib,json,subprocess
          from pathlib import Path
          source=Path('/tmp/dispatch-authored'); patch=(source/'candidate.patch').read_bytes()
          assert hashlib.sha256(patch).hexdigest()=='8d425c5324b94e2dca75616332112e6e32a4ebe9c2c0147a6e3c5dd0e7a0500f'
          subprocess.run(['git','apply','--check','-'],input=patch,check=True)
          subprocess.run(['git','apply','-'],input=patch,check=True)
          original=json.loads((source/'source.json').read_text()); assert len(original)==19
          for p,h in original.items():assert hashlib.sha256(Path(p).read_bytes()).hexdigest()==h,p
          p=Path('tests/test_bend_dispatch.py'); s=p.read_text()
          for old,new in [('from pathlib import Path\n','from pathlib import Path\nfrom typing import Any\n'),('def compile_policy(r: dict, batch: int = 4, **overrides) -> dict:','def compile_policy(r: dict, batch: int = 4, **overrides: Any) -> dict:'),('    args = {','    args: dict[str, Any] = {'),('def test_identity_mismatch(key: str, bad: object) -> None:','def test_identity_mismatch(key: str, bad: Any) -> None:'),('    kwargs = {key: bad}','    kwargs: dict[str, Any] = {key: bad}')]:
              assert s.count(old)==1; s=s.replace(old,new)
          p.write_text(s)
          assert hashlib.sha256(p.read_bytes()).hexdigest()=='92ab0d977b0a24b2125a72de046017fd5ff2f28bf32fd4bd43d5c95e96ffd046'
          p=Path('native/bend_engine/service_profile/dispatch.py');s=p.read_text()
          old='        manifest["batch"],\n        manifest["channels"],\n        manifest["checkpoint_sha256"],'
          new='        integer(manifest["batch"], 1, 16),\n        integer(manifest["channels"], 146, 175),\n        digest(manifest["checkpoint_sha256"]),'
          assert s.count(old)==1;p.write_text(s.replace(old,new))
          assert hashlib.sha256(p.read_bytes()).hexdigest()=='86abc3b5469e64eb02ba2a238d54ed485adce0c1ac7ab560524df3e106f33a1d'
          subprocess.run(['git','add','-N','.'],check=True)
          patch=subprocess.check_output(['git','diff','--binary'])
          assert hashlib.sha256(patch).hexdigest()=='72924feebbcdf5dfcd5295b02e00503696f39859ecb8e0300d7aeeb0da0494b0'
          Path('artifacts/dispatch/candidate.patch').write_bytes(patch)
          Path('artifacts/dispatch/source.json').write_text(json.dumps({p:hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in original},indent=2)+'\n')
          PY
          git diff --check
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@v7
        with:
          version: 0.12.10
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Locked CPU dependencies and focused static tests
        run: |
          set -euo pipefail
          uv sync --locked --extra dev --extra cpu 2>&1 | tee artifacts/dispatch/dependencies.txt
          . .venv/bin/activate
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          python -c 'import torch; assert str(torch.__version__) == "2.14.0+cpu"'
          bash scripts/lint.sh 2>&1 | tee artifacts/dispatch/lint.txt
          bash scripts/lint.sh native/bend_engine/service_profile/dispatch.py native/bend_engine/multi_root/verify_dispatch.py native/bend_engine/multi_root/verify_dispatch_model.py native/bend_engine/multi_root/verify_live_model.py tests/test_bend_dispatch.py 2>&1 | tee artifacts/dispatch/verifier-lint.txt
          python -m pytest tests/test_bend_dispatch.py tests/test_bend_service_profile.py tests/test_bend_live_model.py tests/test_bend_live_cohort.py tests/test_bend_cohort_deadlines.py tests/test_bend_async_cohort.py tests/test_bend_multi_root.py tests/test_bend_async_search.py tests/test_neural_work.py tests/test_neural_search_benchmark.py tests/test_broker_served_count.py -q --junitxml=artifacts/dispatch/tests.xml 2>&1 | tee artifacts/dispatch/tests.txt
          bash -n native/bend_engine/multi_root/qualify_dispatch.sh
      - name: Fresh pinned compiler and original full live qualification
        env:
          CC: clang-18
          CXX: clang++-18
        run: |
          set -euo pipefail
          bash native/bend_engine/install_ci_bend.sh 2>&1 | tee artifacts/dispatch/compiler-install.txt
          pin="$(python -c 'import json;print(json.load(open("native/bend_engine/standalone/toolchain.json"))["revision"])')"
          compiler="$PWD/build/bend_toolchain/sources/$pin"
          bash native/bend_engine/multi_root/qualify_live.sh "$compiler" /tmp/dispatch-live 2>&1 | tee artifacts/dispatch/live.txt
      - name: Compiled binding, table and actual policy controls
        env:
          CC: clang-18
          CXX: clang++-18
        run: |
          set -euo pipefail
          pin="$(python -c 'import json;print(json.load(open("native/bend_engine/standalone/toolchain.json"))["revision"])')"
          compiler="$PWD/build/bend_toolchain/sources/$pin"
          bash native/bend_engine/multi_root/qualify_dispatch.sh "$compiler" /tmp/dispatch-live /tmp/dispatch-gates 2>&1 | tee artifacts/dispatch/dispatch.txt
      - uses: actions/download-artifact@v4
        with:
          name: deepfin-pr1-validation
          run-id: 35759888019
          github-token: ${{ github.token }}
          path: /tmp/dispatch-fixture
      - name: Recover exact checkpoint and export batch four once
        run: |
          set -euo pipefail
          tar -xzf /tmp/dispatch-fixture/native-build.tar.gz -C /tmp
          echo '9654a1e334fb5f875d164b82068846bfeab3df2ef2a994737e44789c2623ee6e  /tmp/pr1-model/fixture.pt2' | sha256sum -c -
          echo 'bb9934134c0d9a39c515c10fa870122c3dfd28259bece392be026e32a9ca60d7  /tmp/pr1-model/fixture.pt' | sha256sum -c -
          python - <<'PY'
          from pathlib import Path
          import torch
          from native.bend_engine.neural_probe.checkpoint import load_checkpoint,export_checkpoint
          torch.set_num_threads(2)
          Path('/tmp/dispatch-model').mkdir()
          export_checkpoint(load_checkpoint(Path('/tmp/pr1-model/fixture.pt')),Path('/tmp/dispatch-model/b4.pt2'),batch=4,device='cpu',device_index=0)
          PY
      - name: Actual CPU model with synthetic gather controls
        run: |
          set -euo pipefail
          out=/tmp/dispatch-model; single=native/bend_engine/standalone
          prefix="$(python -c 'import torch;print(torch.utils.cmake_prefix_path)')"
          bun "$single/bind_model.js" --batch-header "$out/b4.pt2" "$out/model_contract.h" > artifacts/dispatch/binding.json
          cmake -S "$single" -B "$out/build" -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang-18 -DCMAKE_CXX_COMPILER=clang++-18 -DCMAKE_PREFIX_PATH="$prefix" -DBEND_GENERATED_C=/tmp/dispatch-live/live.c -DBEND_CONTRACT_DIR="$out" -DBEND_CUDA_MODEL=OFF -DBEND_ASYNC_BATCH=ON -DBEND_TARGET_NAME=deepfin-bend-live 2>&1 | tee artifacts/dispatch/model-configure.txt
          cmake --build "$out/build" --parallel 1 2>&1 | tee artifacts/dispatch/model-build.txt
          clang-18 -std=c11 -O3 -DLEGAL_ORACLE -I "$PWD" native/bend_engine/legal_probe/support.c -pthread -lm -o /tmp/dispatch-oracle
          python -m native.bend_engine.multi_root.verify_dispatch_model --binary "$out/build/deepfin-bend-live" --package "$out/b4.pt2" --checkpoint /tmp/pr1-model/fixture.pt --oracle /tmp/dispatch-oracle --report artifacts/dispatch/model.json
          sha256sum "$out/build/deepfin-bend-live" > artifacts/dispatch/model-executable.txt
          ldd "$out/build/deepfin-bend-live" > artifacts/dispatch/model-libraries.txt
      - name: Retain exact tested source and compact native evidence
        if: always()
        run: |
          mkdir -p artifacts/dispatch/native
          for d in /tmp/dispatch-live /tmp/dispatch-gates; do
            if test -d "$d"; then
              find "$d" -type f \( -name '*.json' -o -name '*.txt' -o -name '*.err' \) | while read -r f; do dest="artifacts/dispatch/native/${f#/tmp/}"; mkdir -p "$(dirname "$dest")"; cp "$f" "$dest"; done
            fi
          done
          for entry in main live; do
            f="/tmp/dispatch-live/$entry.c"
            if test -f "$f"; then sha256sum "$f" >> artifacts/dispatch/generated.txt; gzip -c "$f" > "artifacts/dispatch/$entry.c.gz"; fi
          done
          git rev-parse HEAD > artifacts/dispatch/base-commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deepfin-measured-dispatch-qualification
          path: artifacts/dispatch
          retention-days: 30
