name: Measured dispatch qualification workspace
on:
  push:
    branches: [work/measured-dispatch-20260926]
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      QUALIFIED_RUN: '36219555685'
      QUALIFIED_ARTIFACT: '10898666782'
      QUALIFIED_ZIP_SHA: 3bef768eefcf79124319abb4c1c9d95e67e64160d9537f5686516f0e3c82dc10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 19c9cc017be334e3330b8bf4a6c2e488db5845b6
      - uses: actions/download-artifact@v4
        with:
          name: deepfin-measured-dispatch-qualification
          run-id: 36219555685
          github-token: ${{ github.token }}
          path: /tmp/dispatch-qualified
      - name: Verify completed gates and source-identical publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/dispatch-publication
          python3 - <<'PY'
          import base64,hashlib,json,subprocess
          from pathlib import Path
          def api(path):
              return json.loads(subprocess.check_output(['gh','api','repos/jjoshua2/DeepFin/'+path]))
          run=api('actions/runs/36219555685')
          assert run['status']=='completed' and run['conclusion']=='success'
          assert run['head_sha']=='aa6d541732dfaff61c6adc4df015e5e721360d29'
          artifact=api('actions/artifacts/10898666782')
          assert artifact['digest']=='sha256:3bef768eefcf79124319abb4c1c9d95e67e64160d9537f5686516f0e3c82dc10'
          readout=base64.b64decode(api('git/blobs/cadcf2bf933b19760a7ca943f92344432b38588b')['content'])
          assert hashlib.sha256(readout).hexdigest()=='e39db373b0ea09e25655c85c9e3cd10a08734b3581c67013cdfc87f8971cda90'
          Path('/tmp/dispatch-readout.md').write_bytes(readout)
          script=base64.b64decode(api('git/blobs/bedcd90ee2292c6efcfa999aca5b50d5332f0d1c')['content'])
          assert hashlib.sha256(script).hexdigest()=='2f79519859346ee888703026ff7ee5864b5286e9f81acd63f3a9bf4cc7b5732f'
          exec(compile(script,'authored-checked-dispatch-publication','exec'))
          # The Actions app cannot write workflows. Preserve the checked workflow
          # for a separate authorized connector write, without altering runtime.
          workflow='.github/workflows/bend-live.yml'
          Path('/tmp/dispatch-publication/bend-live.yml').write_bytes(Path(workflow).read_bytes())
          subprocess.run(['git','restore','--source=HEAD','--staged','--worktree',workflow],check=True)
          remaining=subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          assert len(remaining)==37 and not any(p.startswith('.github/') for p in remaining)
          p=Path('docs/experiments/2026-09-26-measured-live-dispatch.md')
          p.write_text(p.read_text()+'\n### Publication transport follow-up\n\nInitial publication-only run 36220648002 verified all source/report gates but\nGitHub rejected its push because the Actions app lacks workflow-write permission.\nNo branch or runtime source was published by that failed push. The corrected\npublication separates the source/evidence commit from the authorized connector\nupdate of `bend-live.yml`; neither step reruns inference or changes the qualified\nruntime. The preserved workflow bytes must match the qualification manifest.\n')
          subprocess.run(['git','add',str(p)],check=True)
          PY
      - name: Publish isolated source branch without workflow or parent changes
        run: |
          set -euo pipefail
          branch=feat/native-measured-dispatch-20260926
          test -z "$(git ls-remote --heads origin "refs/heads/$branch")"
          git diff --cached --check
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'native: add opt-in package-bound gather policies to live cohorts'
          git push origin "HEAD:refs/heads/$branch"
          git rev-parse HEAD > /tmp/dispatch-publication/commit.txt
          git diff --stat HEAD^ HEAD > /tmp/dispatch-publication/diff-stat.txt
          git show --format=fuller --no-patch HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deepfin-measured-dispatch-publication
          path: /tmp/dispatch-publication
          retention-days: 30
