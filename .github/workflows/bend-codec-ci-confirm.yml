name: Bend CI codec-test repair confirmation
on:
  push:
    branches: [fix/bend-ci-followup-audit-20260921]
    paths: [.github/workflows/bend-codec-ci-confirm.yml]
permissions:
  contents: read
  pull-requests: read
jobs:
  confirm:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c800fbb0c14622f311ca9a2bf7799adc18942ad9
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          activate-environment: true
      - name: Prepare existing main fix and deterministic reproduction
        run: |
          mkdir -p artifacts /tmp/codec-regression
          git fetch --no-tags --depth=1 https://github.com/jjoshua2/DeepFin.git b939d7d6acc3bfe3b4610248527790fb24d29bfe
          test "$(git hash-object tests/test_derive_parallel.py)" = a00c704c253cb833dafed983f00d1d7a7efb729a
          git show b939d7d6acc3bfe3b4610248527790fb24d29bfe:tests/test_derive_parallel.py > /tmp/codec-regression/fixed.py
          test "$(git hash-object /tmp/codec-regression/fixed.py)" = 573ec7e9b544375df0e1234e37651271490b3e2a
          cat > /tmp/codec-regression/codec_repro_plugin.py <<'PY'
          import numcodecs.blosc
          import pytest
          @pytest.fixture(autouse=True)
          def known_valid_observation(request, monkeypatch):
              if request.node.name == 'test_whether_the_shard_files_are_byte_reproducible_is_measured':
                  # Reproduce the observed combination without relying on chance:
                  # real writes are repeatable, while the independent larger-buffer
                  # probe reports a negative observation. No output/data is mocked.
                  monkeypatch.setattr(numcodecs.blosc, 'use_threads', False)
                  monkeypatch.setattr(request.module, 'probe_roles', lambda: (False, False))
          PY
          uv sync --locked --extra dev --extra cpu
      - name: Require the original test to fail for the observed false implication
        run: |
          set +e
          PYTHONPATH="/tmp/codec-regression:$PWD" python -m pytest -q -p codec_repro_plugin tests/test_derive_parallel.py::test_whether_the_shard_files_are_byte_reproducible_is_measured --junitxml=artifacts/codec-before.xml > artifacts/codec-before.log 2>&1
          code=$?
          set -e
          test "$code" = 1
          grep 'assert False != False' artifacts/codec-before.log
          grep 'wrote identical files' artifacts/codec-before.log
      - name: Apply only the already-reviewed main test file
        run: |
          cp /tmp/codec-regression/fixed.py tests/test_derive_parallel.py
          test "$(git hash-object tests/test_derive_parallel.py)" = 573ec7e9b544375df0e1234e37651271490b3e2a
          test "$(git diff --name-only)" = tests/test_derive_parallel.py
          git diff --check
          git diff -- tests/test_derive_parallel.py > artifacts/codec-main-fix.patch
      - name: Same deterministic case now passes with real corpus data
        run: |
          PYTHONPATH="/tmp/codec-regression:$PWD" python -m pytest -q -p codec_repro_plugin tests/test_derive_parallel.py::test_whether_the_shard_files_are_byte_reproducible_is_measured --junitxml=artifacts/codec-after.xml
      - name: Complete parallel derivation and corpus-target tests with normal runtime behavior
        run: |
          python -m pytest -q tests/test_derive_parallel.py tests/test_derive_corpus_targets.py --junitxml=artifacts/codec-focused.xml
      - name: Whole-repository static validation on the repaired proof-PR tree
        run: |
          python scripts/validate.py lint --require-cpu-wheel
      - name: Inventory matching open PR heads without changing any branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import datetime, json, os, subprocess, urllib.request
          from pathlib import Path
          def get(path):
              req = urllib.request.Request('https://api.github.com/repos/jjoshua2/DeepFin/' + path, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(req, timeout=20) as response:
                  return json.load(response)
          assert subprocess.check_output(['git','diff','--name-only'],text=True).strip() == 'tests/test_derive_parallel.py'
          report = {'as_of': datetime.datetime.now(datetime.timezone.utc).isoformat(), 'tested_base': 'c800fbb0c14622f311ca9a2bf7799adc18942ad9', 'source_main_commit': 'b939d7d6acc3bfe3b4610248527790fb24d29bfe', 'old_blob': 'a00c704c253cb833dafed983f00d1d7a7efb729a', 'fixed_blob': '573ec7e9b544375df0e1234e37651271490b3e2a', 'prs': []}
          for page in range(1, 11):
              rows = get(f'pulls?state=open&per_page=100&page={page}')
              for p in rows:
                  if 'bend' not in p['title'].lower() and 'bend' not in p['head']['ref'].lower():
                      continue
                  sha = p['head']['sha']
                  blob = get('contents/tests/test_derive_parallel.py?ref=' + sha)['sha']
                  tree = get('git/commits/' + sha)['tree']['sha']
                  row = {'number':p['number'], 'head':sha, 'branch':p['head']['ref'], 'tree':tree, 'test_blob':blob, 'action':'already_fixed' if blob==report['fixed_blob'] else 'eligible' if blob==report['old_blob'] else 'inspect_separately'}
                  report['prs'].append(row)
              if len(rows)<100:
                  break
          else:
              raise RuntimeError('Open-PR pagination incomplete')
          Path('artifacts/codec-publication-plan.json').write_text(json.dumps(report,indent=2)+'\n')
          print(json.dumps(report,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bend-codec-repair-confirmation
          path: artifacts/codec-*
          retention-days: 14
