name: Bend chess probe

on:
  pull_request:
    paths:
      - "native/bend_engine/**"
      - "tests/test_bend_chess_probe.py"
      - "tests/test_bend_latest_manifest.py"
      - "tests/test_bend_installer.py"
      - "tests/test_bend_release_fallback.py"
      - ".github/workflows/bend-probe.yml"
      - "chess_anti_engine/encoding/_cboard_impl.h"
      - "chess_anti_engine/encoding/_lc0_ext.c"
      - "chess_anti_engine/encoding/_bitboard_planes_impl.h"
      - "chess_anti_engine/encoding/_slider_attacks_impl.h"
  workflow_dispatch:
    inputs:
      compiler:
        description: "PR checks use the pinned U64 fork; upstream latest is opt-in compatibility testing"
        type: choice
        default: pinned-fork
        options: [pinned-fork, upstream-latest]

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          activate-environment: true

      - name: Install DeepFin CPU test environment
        run: uv sync --locked --extra dev --extra cpu

      - name: Verify installer and metadata without network
        run: pytest -q tests/test_bend_latest_manifest.py tests/test_bend_installer.py tests/test_bend_release_fallback.py

      # PR checks are reproducible even when the upstream download feed changes.
      # Explicit manual upstream-latest runs still check the latest release.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Install explicitly selected Bend compiler
        env:
          BEND_NO_TELEMETRY: "1"
          GITHUB_TOKEN: ${{ github.token }}
          BEND_COMPILER: ${{ inputs.compiler || 'pinned-fork' }}
        run: |
          case "$BEND_COMPILER" in
            pinned-fork) native/bend_engine/install_ci_bend.sh ;;
            upstream-latest) native/bend_engine/install_bend.sh ;;
            *) echo "error: unsupported compiler selection" >&2; exit 2 ;;
          esac

      - name: Build and verify Bend/CBoard parity probe
        env:
          BEND_NO_TELEMETRY: "1"
          CAE_REQUIRE_BEND_PROBE: "1"
        run: pytest -q tests/test_bend_chess_probe.py
