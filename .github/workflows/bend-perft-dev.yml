name: Bend perft development snapshot
on:
  push:
    branches: [feat/bend-legal-perft]
    paths: ['.github/workflows/bend-perft-dev.yml']
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Export source without credentials
        run: |
          mkdir -p /tmp/bend-perft-source
          git archive --format=tar.gz HEAD native chess_anti_engine tests scripts docs .agents AGENTS.md CLAUDE.md .github pyproject.toml > /tmp/bend-perft-source/deepfin.tgz
          git rev-parse HEAD > /tmp/bend-perft-source/revision.txt
      - uses: actions/upload-artifact@v4
        with:
          name: bend-perft-source
          path: /tmp/bend-perft-source/
          retention-days: 2
