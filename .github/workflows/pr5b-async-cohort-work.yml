name: PR5b async cohort workspace
on:
  push:
    branches: [work/pr5b-async-cohort-20260922]
permissions:
  contents: write
  actions: read
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONPATH: .
      CAE_TEST_THREADS: '2'
      OMP_NUM_THREADS: '2'
      MAX_JOBS: '1'
      TORCHINDUCTOR_COMPILE_THREADS: '1'
      BEND_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dbe12bd862bbe04573f0e4d3aeb26c910406f74c
      - name: Reconstruct exact authored UTF-8 patch and verify every blob
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/pr5b-evidence
          python - <<'PY'
          import base64,hashlib,json,subprocess
          from pathlib import Path
          shas=['df72fae19750708f36e2308853c22873d003937c','f75709fb731a36d33067b6307dfe6f79bba7069d','32bf87aa2c9d2413e1b7a125a452bce43f92aa96','b61b290a045ff36f2e6d20d17a6ad568c12dfd85','a9da6284dedc14e8257ddf6c6b735df39b1ef2da','fc03ba04409d3dc4381d3511e0cbabab6829cdcd','4c8c9c0bda35277e34fd0be38c9893115a47f4ce','89a3186633ccc1d09b2227dcdcb9edcbe85c2274','fa4036a69af7f1d274de8856b8d93b7e60e7e4c0']
          patch=b''
          for sha in shas:
              record=json.loads(subprocess.check_output(['gh','api',f'repos/jjoshua2/DeepFin/git/blobs/{sha}']))
              data=base64.b64decode(record['content'])
              assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()==sha
              patch+=data
          assert hashlib.sha256(patch).hexdigest()=='c81b8839860ab0f345d5c0ad930a5b6a505affa8b057567ccc35175834cac908'
          subprocess.run(['git','apply','--check','-'],input=patch,check=True)
          subprocess.run(['git','apply','-'],input=patch,check=True)
          subprocess.run(['git','add','-N','.'],check=True)
          subprocess.run(['git','diff','--check'],check=True)
          paths=subprocess.check_output(['git','diff','--name-only']).decode().splitlines()
          assert len(paths)==15 and not any(p.startswith('.github/') for p in paths)
          Path('/tmp/pr5b-evidence/qualified.patch').write_bytes(patch)
          Path('/tmp/pr5b-evidence/source-manifest.json').write_text(json.dumps({p:hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in paths},indent=2))
          PY
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@v7
        with:
          version: 0.12.10
      - name: Locked CPU environment
        run: |
          set -euo pipefail
          uv sync --locked --extra dev --extra cpu
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Static and inexpensive accounting/report regressions
        run: |
          set -euo pipefail
          bash scripts/lint.sh 2>&1 | tee /tmp/pr5b-evidence/lint.txt
          bash scripts/lint.sh native/bend_engine/multi_root/verify.py native/bend_engine/multi_root/verify_cancel.py 2>&1 | tee /tmp/pr5b-evidence/native-lint.txt
          python -m pytest tests/test_bend_async_cohort.py tests/test_bend_multi_root.py tests/test_bend_async_search.py tests/test_neural_work.py tests/test_neural_search_benchmark.py tests/test_broker_served_count.py -q --junitxml=/tmp/pr5b-evidence/tests.xml | tee /tmp/pr5b-evidence/tests.txt
          bash -n native/bend_engine/multi_root/{build,qualify_async}.sh
      - name: Verify unchanged compiler and generate the composed Bend cohort runner
        run: |
          set -euo pipefail
          single=native/bend_engine/standalone
          revision="$(bun "$single/verify_compiler.js" --revision)"
          repository="$(bun "$single/verify_compiler.js" --repository)"
          git init -q /tmp/pr5b-compiler
          git -C /tmp/pr5b-compiler fetch -q --depth=1 "$repository" "$revision"
          git -C /tmp/pr5b-compiler checkout -q --detach FETCH_HEAD
          bun "$single/verify_compiler.js" /tmp/pr5b-compiler | tee /tmp/pr5b-evidence/compiler.txt
          bun /tmp/pr5b-compiler/bend2/main.ts native/bend_engine/multi_root/main.bend -o /tmp/pr5b-runner.c 2>&1 | tee /tmp/pr5b-evidence/bend-build.txt
          sha256sum /tmp/pr5b-runner.c > /tmp/pr5b-evidence/generated.txt
      - name: Serial parity, batch worker and blocked-cancellation normal/sanitized matrix
        run: |
          set -euo pipefail
          clang -std=c11 -O3 -DLEGAL_ORACLE -I "$PWD" native/bend_engine/legal_probe/support.c -pthread -lm -o /tmp/pr5b-oracle
          bash native/bend_engine/multi_root/qualify_async.sh /tmp/pr5b-runner.c /tmp/pr5b-oracle /tmp/pr5b-matrix 2>&1 | tee /tmp/pr5b-evidence/matrix.txt
      - name: Original singleton Bend interface with generalized worker
        run: |
          set -euo pipefail
          bash native/bend_engine/async_probe/qualify.sh /tmp/pr5b-compiler /tmp/pr5b-singleton 2>&1 | tee /tmp/pr5b-evidence/singleton-lifecycle.txt
          mkdir /tmp/pr5b-evidence/singleton
          cp /tmp/pr5b-singleton/{normal.json,sanitized.json,compiler.txt,build.txt,bend-check.txt} /tmp/pr5b-evidence/singleton/
      - uses: actions/download-artifact@v4
        with:
          name: deepfin-pr1-validation
          run-id: 35759888019
          github-token: ${{ github.token }}
          path: /tmp/pr5b-prior
      - name: Recover exact saved untrained fixture and export batch four once
        run: |
          set -euo pipefail
          tar -xzf /tmp/pr5b-prior/native-build.tar.gz -C /tmp
          echo '9654a1e334fb5f875d164b82068846bfeab3df2ef2a994737e44789c2623ee6e  /tmp/pr1-model/fixture.pt2' | sha256sum -c -
          python - <<'PY'
          from pathlib import Path
          import torch
          from native.bend_engine.neural_probe.checkpoint import load_checkpoint,export_checkpoint
          assert str(torch.__version__)=='2.14.0+cpu'
          torch.set_num_threads(2)
          Path('/tmp/pr5b-model').mkdir()
          loaded=load_checkpoint(Path('/tmp/pr1-model/fixture.pt'))
          export_checkpoint(loaded,Path('/tmp/pr5b-model/b4.pt2'),batch=4,device='cpu',device_index=0)
          Path('/tmp/pr5b-evidence/runtime.txt').write_text(str(torch.__version__)+'\n')
          PY
      - name: Actual selected-leaf CPU model through synchronous and asynchronous cohorts
        run: |
          set -euo pipefail
          single=native/bend_engine/standalone
          prefix="$(python -c 'import torch; print(torch.utils.cmake_prefix_path)')"
          for batch in 1 4; do
            package=/tmp/pr1-model/fixture.pt2
            if test "$batch" = 4; then package=/tmp/pr5b-model/b4.pt2; fi
            output=/tmp/pr5b-real-$batch; mkdir "$output"
            bun "$single/bind_model.js" --batch-header "$package" "$output/model_contract.h" > /tmp/pr5b-evidence/binding-$batch.json
            cmake -S "$single" -B "$output/build" -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_PREFIX_PATH="$prefix" -DBEND_GENERATED_C=/tmp/pr5b-runner.c -DBEND_CONTRACT_DIR="$output" -DBEND_TARGET_NAME=deepfin-bend-multi-root -DBEND_ASYNC_BATCH=ON -DBEND_CUDA_MODEL=OFF
            cmake --build "$output/build" --parallel 1
            for mode in sync async; do
              flag=(); if test "$mode" = async; then flag=(--asynchronous); fi
              python -m native.bend_engine.multi_root.verify --binary "$output/build/deepfin-bend-multi-root" --oracle /tmp/pr5b-oracle --batch "$batch" --channels 175 --package "$package" --checkpoint /tmp/pr1-model/fixture.pt --report "/tmp/pr5b-evidence/real-$batch-$mode.json" "${flag[@]}"
            done
            ldd "$output/build/deepfin-bend-multi-root" > /tmp/pr5b-evidence/libraries-$batch.txt
            if grep -qi libpython /tmp/pr5b-evidence/libraries-$batch.txt; then exit 2; fi
            sha256sum "$output/build/deepfin-bend-multi-root" >> /tmp/pr5b-evidence/executables.txt
          done
          python - <<'PY'
          import json
          from pathlib import Path
          results=[]
          for batch in (1,4):
              a=json.loads(Path(f'/tmp/pr5b-evidence/real-{batch}-sync.json').read_text())
              b=json.loads(Path(f'/tmp/pr5b-evidence/real-{batch}-async.json').read_text())
              assert a['root_results']==b['root_results']
              assert a['counters']==b['counters']
              results.append({'batch':batch,'root_results_equal':True,'work_counts_equal':True,'complete_tree_bits_equal':a['complete_tree_sha256']==b['complete_tree_sha256']})
          Path('/tmp/pr5b-evidence/real-parity.json').write_text(json.dumps({'status':'passed','same_package_sync_async':results,'speed_or_strength_qualified':False}))
          PY
      - name: Publish clean qualified feature source
        id: publish
        run: |
          set -euo pipefail
          git diff --check
          test -z "$(git ls-remote --heads origin refs/heads/feat/native-async-cohort-20260922)"
          git switch -c feat/native-async-cohort-20260922
          git add native/bend_engine/multi_root native/bend_engine/standalone/{async_slot.h,CMakeLists.txt} tests/test_bend_async_cohort.py docs/experiments/2026-09-22-native-async-cohort.md
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'native: add asynchronous fixed cohorts with per-root cancellation'
          git push origin HEAD:refs/heads/feat/native-async-cohort-20260922
          git rev-parse HEAD | tee /tmp/pr5b-evidence/published-head.txt
      - name: Preserve reports and generated source for bounded diagnosis
        if: always()
        run: |
          if test -f /tmp/pr5b-runner.c; then gzip -c /tmp/pr5b-runner.c > /tmp/pr5b-evidence/runner.c.gz; fi
          if test -d /tmp/pr5b-matrix; then
            mkdir -p /tmp/pr5b-evidence/matrix
            find /tmp/pr5b-matrix -name '*.json' -o -name '*.txt' | while read -r f; do cp "$f" "/tmp/pr5b-evidence/matrix/$(basename "$(dirname "$f")")-$(basename "$f")"; done
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deepfin-pr5b-cohort-qualification
          path: /tmp/pr5b-evidence
          retention-days: 30
      - name: Require completed qualification and publication
        if: always()
        env:
          PUBLISHED: ${{ steps.publish.outcome }}
        run: test "$PUBLISHED" = success
