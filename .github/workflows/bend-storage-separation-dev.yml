name: Bend storage separation workspace
'on':
  push:
    branches: [feat/bend-storage-separation-dev-20260922]
    paths: [.github/workflows/bend-storage-separation-dev.yml]
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2c807135a17a8abcf478f9b142ac9a860b6111ed
          persist-credentials: false
      - name: Archive the complete pinned source tree
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/source"
          git archive --format=tar HEAD | gzip > "$RUNNER_TEMP/source/DeepFin.tar.gz"
          git cat-file commit HEAD > "$RUNNER_TEMP/source/commit.raw"
          git rev-parse HEAD^{tree} > "$RUNNER_TEMP/source/tree.txt"
          cd "$RUNNER_TEMP/source"
          sha256sum DeepFin.tar.gz commit.raw > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: bend-storage-separation-source
          path: ${{ runner.temp }}/source/
          retention-days: 3
