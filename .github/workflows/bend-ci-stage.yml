name: Inspect Bend stack conflict
on:
  push:
    branches: [fix/bend-ci-audit-20260921]
    paths: [.github/workflows/bend-ci-stage.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 6eaeab31233316fc012226ee25696e0806271d5b
          fetch-depth: 0
          persist-credentials: false
      - name: Inspect parent integration without changing any branches
        run: |
          git fetch --no-tags https://github.com/jjoshua2/DeepFin.git df768c90897beb01b98f4b0bdf5f58e5a928c96d
          mkdir -p /tmp/stack-conflict
          python - <<'PY'
          import subprocess
          from pathlib import Path
          root=Path('/tmp/stack-conflict')
          result=subprocess.run(['git','merge-tree','--write-tree','--messages','6eaeab31233316fc012226ee25696e0806271d5b','df768c90897beb01b98f4b0bdf5f58e5a928c96d'],text=True,capture_output=True,check=False)
          (root/'merge.txt').write_text(result.stdout+'\nSTDERR\n'+result.stderr)
          print(result.returncode,result.stdout,result.stderr)
          assert result.returncode in (0,1)
          tree=result.stdout.splitlines()[0]
          assert len(tree)==40
          patch=subprocess.check_output(['git','diff','6eaeab31233316fc012226ee25696e0806271d5b',tree])
          (root/'merge.patch').write_bytes(patch)
          subprocess.run(['git','diff','--stat','6eaeab31233316fc012226ee25696e0806271d5b',tree],check=True)
          for line in result.stdout.splitlines():
              fields=line.split('\t',1)
              if len(fields)!=2 or len(fields[0].split())!=3:continue
              mode,sha,stage=fields[0].split();path=fields[1]
              if mode not in ('100644','100755'):continue
              (root/f'{stage}-{Path(path).name}').write_bytes(subprocess.check_output(['git','cat-file','blob',sha]))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bend-stack-conflict
          path: /tmp/stack-conflict/
          retention-days: 7
