name: PR5b async cohort workspace
on:
  push:
    branches: [work/pr5b-async-cohort-20260923]
permissions:
  contents: write
  actions: read
jobs:
  documentation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ccfd616f4d7508b4f195366c9eb5ccdcf92e02a9
      - uses: actions/download-artifact@v4
        with:
          name: deepfin-pr5b-qualification
          run-id: 35888265043
          github-token: ${{ github.token }}
          path: /tmp/pr5b-verified
      - name: Reconcile qualified files and apply documentation only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/pr5b-publication
          python - <<'PY'
          import base64, hashlib, json, subprocess
          from pathlib import Path
          source = json.loads(Path('/tmp/pr5b-verified/source-manifest.json').read_text())
          assert len(source) == 17
          for path, digest in source.items():
              assert hashlib.sha256(Path(path).read_bytes()).hexdigest() == digest, path
          payload = json.loads(subprocess.check_output(['gh','api','repos/jjoshua2/DeepFin/git/blobs/060df5d0ae7caca9bb6e8cc49abb8180f351be08']))
          script = base64.b64decode(payload['content'])
          assert hashlib.sha1(b'blob '+str(len(script)).encode()+b'\0'+script).hexdigest() == '060df5d0ae7caca9bb6e8cc49abb8180f351be08'
          exec(compile(script, 'authored-pr5b-documentation', 'exec'))
          changed = subprocess.check_output(['git','diff','--name-only']).decode().splitlines()
          expected = ['docs/experiments/2026-09-23-async-cohort.md', 'docs/experiments/README.md', 'native/bend_engine/multi_root/README.md']
          assert sorted(changed) == sorted(expected), changed
          for path, digest in source.items():
              if not path.endswith('.md'):
                  assert hashlib.sha256(Path(path).read_bytes()).hexdigest() == digest, path
          Path('/tmp/pr5b-publication/documentation.patch').write_bytes(subprocess.check_output(['git','diff','--binary']))
          Path('/tmp/pr5b-publication/documentation-manifest.json').write_text(json.dumps({p:hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in changed},indent=2)+'\n')
          Path('/tmp/pr5b-publication/runtime-integrity.json').write_text(json.dumps({'status':'passed','qualified_commit':'ccfd616f4d7508b4f195366c9eb5ccdcf92e02a9','qualified_paths':len(source),'runtime_source_unchanged':True,'runtime_tests_rerun':False})+'\n')
          PY
          git diff --check
          git diff --stat
      - name: Fast-forward only the recovered feature documentation
        run: |
          set -euo pipefail
          git add docs/experiments/2026-09-23-async-cohort.md docs/experiments/README.md native/bend_engine/multi_root/README.md
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'docs: record async cohort cancellation, model parity and remaining scheduler work'
          git push origin HEAD:refs/heads/feat/native-async-cohort-20260923
          git rev-parse HEAD | tee /tmp/pr5b-publication/published-head.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deepfin-pr5b-publication
          path: /tmp/pr5b-publication
          retention-days: 30
