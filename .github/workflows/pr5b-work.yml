name: PR5b async cohort workspace
on:
  push:
    branches: [work/pr5b-async-cohort-20260923]
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      BEND_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dbe12bd862bbe04573f0e4d3aeb26c910406f74c
      - uses: actions/download-artifact@v4
        with:
          name: deepfin-pr5b-first-build
          run-id: 35886528769
          github-token: ${{ github.token }}
          path: /tmp/pr5b-prior
      - name: Recover candidate and correct literal command parsing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/pr5b-evidence
          python - <<'PY'
          import base64,hashlib,json,subprocess
          from pathlib import Path
          patch=Path('/tmp/pr5b-prior/initial.patch').read_bytes()
          assert hashlib.sha256(patch).hexdigest()=='7f51003d51da7fbaa131cea860191a39fac3041cad5d0f873c08be8f041a260b'
          subprocess.run(['git','apply','--check','-'],input=patch,check=True)
          subprocess.run(['git','apply','-'],input=patch,check=True)
          data=json.loads(subprocess.check_output(['gh','api','repos/jjoshua2/DeepFin/git/blobs/f0237d0310494c3f41d56cea77cc51d9f9f94465']))
          code=base64.b64decode(data['content'])
          assert hashlib.sha256(code).hexdigest()=='ee55073ce82ab4987815864ca0131200554adc15606e53bf76a064b4de4f7b58'
          Path('native/bend_engine/multi_root/Control.bend').write_bytes(code)
          subprocess.run(['git','add','-N','.'],check=True)
          subprocess.run(['git','diff','--check'],check=True)
          paths=subprocess.check_output(['git','diff','--name-only']).decode().splitlines()
          assert len(paths)==11
          Path('/tmp/pr5b-evidence/candidate.patch').write_bytes(subprocess.check_output(['git','diff','--binary']))
          Path('/tmp/pr5b-evidence/source-manifest.json').write_text(json.dumps({p:hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in paths},indent=2))
          PY
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Verify pinned compiler and generate full application
        run: |
          set -euo pipefail
          single=native/bend_engine/standalone
          revision="$(bun "$single/verify_compiler.js" --revision)"
          repository="$(bun "$single/verify_compiler.js" --repository)"
          git init -q /tmp/pr5b-compiler
          git -C /tmp/pr5b-compiler fetch -q --depth=1 "$repository" "$revision"
          git -C /tmp/pr5b-compiler checkout -q --detach FETCH_HEAD
          bun "$single/verify_compiler.js" /tmp/pr5b-compiler | tee /tmp/pr5b-evidence/compiler.txt
          bun /tmp/pr5b-compiler/bend2/main.ts native/bend_engine/multi_root/main.bend -o /tmp/pr5b-runner.c 2>&1 | tee /tmp/pr5b-evidence/build.txt
          mkdir /tmp/pr5b-contract
          printf '#define DEEPFIN_MODEL_BATCH 4\n#define DEEPFIN_MODEL_CHANNELS 175\n#define DEEPFIN_MODEL_PROFILE 4\n' > /tmp/pr5b-contract/model_contract.h
          clang -std=c11 -O1 -ffp-contract=off -DDEEPFIN_BEND_NATIVE_MODEL -DDEEPFIN_ASYNC_BATCH -I /tmp/pr5b-contract -c /tmp/pr5b-runner.c -o /tmp/pr5b-contract/runner.o
          sha256sum /tmp/pr5b-runner.c > /tmp/pr5b-evidence/generated.txt
      - name: Preserve generated source if present
        if: always()
        run: |
          if test -f /tmp/pr5b-runner.c; then gzip -c /tmp/pr5b-runner.c > /tmp/pr5b-evidence/runner.c.gz; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deepfin-pr5b-corrected-build
          path: /tmp/pr5b-evidence
          retention-days: 30
