name: Bend-owned standalone confirmation
on:
  push:
    branches: [feat/bend-owned-standalone-dev]
    paths: ['.github/workflows/bend-owned-standalone-confirm.yml']
permissions:
  contents: write
jobs:
  confirm:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply exact locally tested Bend-owned source
        run: |
          python - <<'PY'
          import base64, gzip, hashlib, json, urllib.request
          from pathlib import Path
          shas = ['0715cdae440fd9e8445f14dcb716990018975450', 'e156e282ca0b8501ab7d171aadf0d78f16c05534', 'e42fadeefb21bb3791f24fd454d4f97a3a6d4269', '3f3c88da52461cd025548e9d4707a98adcc0fac8', '1f934f7912e73f00ef31c6a6a8c860b627e7d283', 'fc251caeddb608b6f38badacb31b922fdbc4225d', '8f8aa969ce7b1122898553637822232710dbc066', '7aaee7d9aff8641a73812606862f6caf1eeeb827', '85fab3ab3914e3f0afa6a7f81216987a2a4aea54', '5eec7d921985c570875ef5ebf75cd21c4e28f5c6', 'd7b6fedd60f362ae4c6eb2206107122da8e5da92', '3455dce63eaa0da59b00eb06e3864eb9c7fcc8be']
          parts = []
          for sha in shas:
              with urllib.request.urlopen('https://api.github.com/repos/jjoshua2/DeepFin/git/blobs/' + sha, timeout=30) as response:
                  data = json.load(response)
              part = base64.b64decode(data['content'])
              assert hashlib.sha1(f'blob {len(part)}\0'.encode() + part).hexdigest() == sha
              parts.append(part)
          patch = gzip.decompress(base64.b64decode(b''.join(parts), validate=True))
          assert hashlib.sha256(patch).hexdigest() == '310304478be342294a7dd98ed0854632e561bebcdd710aaf56df1c44feb2a1dd'
          Path('/tmp/bend-owned.patch').write_bytes(patch)
          PY
          git apply --check /tmp/bend-owned.patch
          git apply /tmp/bend-owned.patch
          python - <<'PY'
          from pathlib import Path
          p = Path('docs/experiments/README.md')
          text = p.read_text()
          old = '| Record | Scope |\n| --- | --- |\n'
          assert text.count(old) == 1
          p.write_text(text.replace(old, old + '| [Bend-owned standalone](2026-09-20-bend-standalone.md) | Bend UCI/FEN/history/table/evaluator ownership; static interpreter-free runtime, diagnostic only |\n'))
          PY
          git diff --check
      - name: External verifier dependencies only
        run: |
          python -m pip install 'python-chess==1.999' 'ruff==0.15.20' 'basedpyright==1.39.9'
          ruff check native/bend_engine/standalone/verify.py
          basedpyright native/bend_engine/standalone/verify.py
      - name: Build with the separately pinned widening fix
        run: |
          bash native/bend_engine/standalone/build.sh /tmp/bend-owned /tmp/bend-owned-compiler generic
          mkdir -p artifacts
          cp /tmp/bend-owned/build.txt artifacts/bend-owned-build.txt
      - name: Generic portable native and UBSan executable checks
        run: |
          python native/bend_engine/standalone/verify.py --report artifacts/bend-owned-generic.json --command /tmp/bend-owned/deepfin-bend --threads 1
          for mode in portable native ubsan; do
            case "$mode" in
              portable) flags=(-DBEND_U64_PORTABLE) ;;
              native) flags=(-march=native) ;;
              ubsan) flags=(-fsanitize=undefined -fno-sanitize-recover=all) ;;
            esac
            clang -std=c11 -O1 -ffp-contract=off -Werror=shift-count-overflow "${flags[@]}" /tmp/bend-owned/engine.c -pthread -lm -o "/tmp/bend-owned/$mode"
            python native/bend_engine/standalone/verify.py --report "artifacts/bend-owned-$mode.json" --command "/tmp/bend-owned/$mode" --threads 1
          done
      - name: Same tests inside an empty runtime with only one static executable
        run: |
          clang -std=c11 -O1 -ffp-contract=off -Werror=shift-count-overflow -static /tmp/bend-owned/engine.c -pthread -lm -o /tmp/bend-owned/static
          if readelf -l /tmp/bend-owned/static | grep -q INTERP; then echo 'dynamic loader remains'; exit 1; fi
          runtime="$(mktemp -d /tmp/bend-runtime.XXXXXX)"
          cp /tmp/bend-owned/static "$runtime/deepfin-bend"
          test "$(find "$runtime" -mindepth 1 | wc -l)" = 1
          python native/bend_engine/standalone/verify.py --report artifacts/bend-owned-isolated.json --command sudo chroot "$runtime" /deepfin-bend --threads 1
          {
            file "$runtime/deepfin-bend"
            find "$runtime" -mindepth 1 -printf '%P\n'
            sha256sum "$runtime/deepfin-bend"
            printf 'No interpreter, shell, library, data file or repository copied into engine root.\n'
          } > artifacts/bend-owned-isolation.txt
      - name: Compare every Bend-built attack-table entry with separately linked C oracle
        run: |
          bun /tmp/bend-owned-compiler/bend2/main.ts native/bend_engine/standalone/table_dump.bend -o /tmp/bend-owned/table.c
          clang -std=c11 -O1 -Werror=shift-count-overflow /tmp/bend-owned/table.c -pthread -lm -o /tmp/bend-owned/table-bend
          clang -O1 -I. native/bend_engine/standalone/table_reference.c native/bend_engine/legal_probe/support.c -lm -o /tmp/bend-owned/table-reference
          /tmp/bend-owned/table-bend --threads 1 > /tmp/bend-owned/table-bend.txt
          /tmp/bend-owned/table-reference > /tmp/bend-owned/table-reference.txt
          cmp /tmp/bend-owned/table-bend.txt /tmp/bend-owned/table-reference.txt
          test "$(wc -l < /tmp/bend-owned/table-bend.txt)" = 108160
          sha256sum /tmp/bend-owned/table-bend.txt /tmp/bend-owned/table-reference.txt > artifacts/bend-owned-tables.txt
      - name: Publish only the tested new application and records
        run: |
          git fetch --no-tags --depth=1 origin 3b6047ddfc08d9aed43da37aff8f2db218f84d98
          git read-tree 3b6047ddfc08d9aed43da37aff8f2db218f84d98
          git add native/bend_engine/standalone docs/experiments/README.md docs/experiments/2026-09-20-bend-standalone.md
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          commit="$(git commit-tree "$(git write-tree)" -p 3b6047ddfc08d9aed43da37aff8f2db218f84d98 -m 'Add Bend-owned standalone diagnostic UCI engine without Python runtime')"
          git push origin "$commit":refs/heads/feat/bend-owned-standalone
          printf '%s\n' "$commit" > artifacts/bend-owned-commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bend-owned-standalone-confirmation
          path: artifacts/bend-owned-*
          retention-days: 30
