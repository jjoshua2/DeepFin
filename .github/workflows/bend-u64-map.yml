name: Bend numeric map
on:
  pull_request:
    paths:
      - '.github/workflows/bend-u64-map.yml'
      - 'native/bend_engine/u64_map_probe/**'
      - 'native/bend_engine/install_ci_bend.sh'
      - 'native/bend_engine/standalone/verify_compiler.js'
      - 'native/bend_engine/standalone/toolchain.json'
      - 'chess_anti_engine/encoding/**'
      - 'chess_anti_engine/mcts/_position_dag.h'
      - 'tests/test_bend_*map*.py'
      - 'pyproject.toml'
      - 'uv.lock'
  push:
    branches: [main]
    paths:
      - '.github/workflows/bend-u64-map.yml'
      - 'native/bend_engine/u64_map_probe/**'
      - 'native/bend_engine/install_ci_bend.sh'
      - 'native/bend_engine/standalone/verify_compiler.js'
      - 'native/bend_engine/standalone/toolchain.json'
      - 'chess_anti_engine/encoding/**'
      - 'chess_anti_engine/mcts/_position_dag.h'
      - 'tests/test_bend_*map*.py'
      - 'pyproject.toml'
      - 'uv.lock'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bend-u64-map-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      BEND_NO_TELEMETRY: '1'
      CAE_TEST_THREADS: '2'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      MAX_JOBS: '1'
      CUDA_VISIBLE_DEVICES: ''
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: astral-sh/setup-uv@v6
        with:
          version: 0.12.10
      - name: Locked environment and unchanged source compiler
        run: |
          uv sync --locked --extra dev --extra cpu
          bash native/bend_engine/install_ci_bend.sh
      - name: Explicit static and all map Python contracts
        run: |
          . .venv/bin/activate
          ruff check native/bend_engine/u64_map_probe/*.py tests/test_bend_u64_map.py tests/test_bend_map*.py
          basedpyright native/bend_engine/u64_map_probe/*.py tests/test_bend_u64_map.py tests/test_bend_map*.py
          python -m pytest -q tests/test_bend_u64_map.py tests/test_bend_map*.py --junitxml=artifacts/u64-map-python.xml
      - name: Native map and executed negative controls
        run: |
          . .venv/bin/activate
          python -m native.bend_engine.u64_map_probe.run_probe --compiler-root build/bend_toolchain/sources/aaeb9bc91ff0ff0b3f58dba6a9744c6607e167ae --bun bun --cc clang-18 --output artifacts/u64-map
      - name: Both map implementations and benchmark driver correctness, no timing panel
        run: |
          . .venv/bin/activate
          python -m native.bend_engine.u64_map_probe.benchmark --compiler-root build/bend_toolchain/sources/aaeb9bc91ff0ff0b3f58dba6a9744c6607e167ae --bun bun --cc clang-18 --output artifacts/u64-map-benchmark
      - name: Actual CBoard key replay and identity boundaries, no timing panel
        run: |
          . .venv/bin/activate
          python -m native.bend_engine.u64_map_probe.benchmark --compiler-root build/bend_toolchain/sources/aaeb9bc91ff0ff0b3f58dba6a9744c6607e167ae --bun bun --cc clang-18 --output artifacts/u64-map-chess --chess
      - name: Single-search insert-once and stable CBoard-key bindings
        run: |
          . .venv/bin/activate
          python -m native.bend_engine.u64_map_probe.insert_once --compiler-root build/bend_toolchain/sources/aaeb9bc91ff0ff0b3f58dba6a9744c6607e167ae --bun bun --cc clang-18 --output artifacts/u64-map-insert-once --chess
      - name: Whole-repository static gate
        run: |
          . .venv/bin/activate
          ./scripts/lint.sh
          git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bend-u64-map
          path: |
            artifacts/u64-map-python.xml
            artifacts/u64-map/summary.json
            artifacts/u64-map/*.stdout
            artifacts/u64-map/*.stderr
            artifacts/u64-map-benchmark/report.json
            artifacts/u64-map-benchmark/*.stdout
            artifacts/u64-map-benchmark/*.stderr
            artifacts/u64-map-chess/report.json
            artifacts/u64-map-chess/*.stdout
            artifacts/u64-map-chess/*.stderr
            artifacts/u64-map-insert-once/summary.json
            artifacts/u64-map-insert-once/*.stdout
            artifacts/u64-map-insert-once/*.stderr
          retention-days: 30
