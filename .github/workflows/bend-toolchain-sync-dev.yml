name: Bend compiler adoption readout
on:
  push:
    branches: [feat/bend-20200920-toolchain-dev]
    paths: ['.github/workflows/bend-toolchain-sync-dev.yml']
permissions:
  contents: write
jobs:
  document:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 379154a2598a5d18edd85d123b1fc3c33cd7e75a
      - name: Apply exact documentation and a single index row
        run: |
          python - <<'PY'
          import base64, hashlib, json, urllib.request
          from pathlib import Path
          blobs = {
            'native/bend_engine/standalone/README.md': 'eac6330d4ebc2fea676cfb10183c0533e38683d0',
            'docs/experiments/2026-09-20-bend-compiler-adoption.md': 'ee0d004b8c511ee68c7207954a30328717ed7abf',
          }
          for name, sha in blobs.items():
              with urllib.request.urlopen('https://api.github.com/repos/jjoshua2/DeepFin/git/blobs/' + sha, timeout=30) as response:
                  content = base64.b64decode(json.load(response)['content'])
              assert hashlib.sha1(f'blob {len(content)}\0'.encode() + content).hexdigest() == sha
              Path(name).write_bytes(content)
          p = Path('docs/experiments/README.md')
          original = p.read_text()
          marker = '| Record | Scope |\n| --- | --- |\n'
          row = '| [September 20 standalone compiler adoption](2026-09-20-bend-compiler-adoption.md) | Pin the Bend-owned engine to upstream-synced U64 2.0.20; immutable source/cache contract and runtime requalification |\n'
          assert original.count(marker) == 1 and row not in original
          updated = original.replace(marker, marker + row).encode()
          assert hashlib.sha1(f'blob {len(updated)}\0'.encode() + updated).hexdigest() == 'f2891010102300fe110a81ffcdec6283d0e258f6'
          p.write_bytes(updated)
          PY
          git add native/bend_engine/standalone/README.md docs/experiments/README.md docs/experiments/2026-09-20-bend-compiler-adoption.md
          git diff --cached --check
          python - <<'PY'
          import subprocess
          changed = subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines()
          assert set(changed) == {'native/bend_engine/standalone/README.md', 'docs/experiments/README.md', 'docs/experiments/2026-09-20-bend-compiler-adoption.md'}
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Record current-fork adoption results and distinguish historical toolchain pins'
          git push origin HEAD:refs/heads/feat/bend-2.0.20-standalone
          mkdir -p /tmp/bend-adoption-readout
          git rev-parse HEAD > /tmp/bend-adoption-readout/commit.txt
          git diff HEAD^ --stat > /tmp/bend-adoption-readout/diff.txt
      - uses: actions/upload-artifact@v4
        with:
          name: bend-compiler-adoption-readout
          path: /tmp/bend-adoption-readout/
          retention-days: 30
