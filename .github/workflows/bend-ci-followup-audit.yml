name: Bend CI follow-up audit
on:
  push:
    branches: [fix/bend-ci-followup-audit-20260921]
    paths: [.github/workflows/bend-ci-followup-audit.yml]
permissions:
  contents: read
  actions: read
  pull-requests: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Audit current heads, not historical red runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/bend-ci-followup
          python - <<'PY'
          import datetime, json, os, subprocess, urllib.request
          from pathlib import Path
          out = Path('/tmp/bend-ci-followup')
          def get(path):
              url = 'https://api.github.com/repos/jjoshua2/DeepFin/' + path
              req = urllib.request.Request(url, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.load(r)
          prs = []
          for page in range(1, 11):
              batch = get(f'pulls?state=open&per_page=100&page={page}')
              prs.extend(p for p in batch if 'bend' in p['title'].lower() or 'bend' in p['head']['ref'].lower())
              if len(batch) < 100:
                  break
          else:
              raise RuntimeError('Open PR listing exceeded explicit audit bound')
          main = get('git/ref/heads/main')['object']['sha']
          report = {'as_of': datetime.datetime.now(datetime.timezone.utc).isoformat(), 'main': main, 'prs': []}
          refs = {'refs/audit/main': main}
          for item in sorted(prs, key=lambda p: p['number']):
              n = item['number']
              p = get(f'pulls/{n}')
              row = {k: p[k] for k in ('number','title','state','merged','mergeable','mergeable_state','merge_commit_sha')}
              row.update(head=p['head']['sha'], branch=p['head']['ref'], base=p['base']['ref'], base_sha=p['base']['sha'], checks=[])
              seen = set()
              for run in get('actions/runs?event=pull_request&per_page=100&head_sha=' + row['head'])['workflow_runs']:
                  if run['workflow_id'] in seen:
                      continue
                  seen.add(run['workflow_id'])
                  check = {k: run[k] for k in ('id','name','status','conclusion','html_url','head_sha','run_attempt')}
                  jobs = get(f"actions/runs/{run['id']}/jobs?per_page=100")['jobs']
                  check['jobs'] = [{'id': j['id'], 'name': j['name'], 'status': j['status'], 'conclusion': j['conclusion'], 'failed_steps': [s['name'] for s in j['steps'] if s['conclusion'] == 'failure']} for j in jobs]
                  row['checks'].append(check)
              refs[f'refs/audit/pr{n}'] = row['head']
              refs[f'refs/audit/base{n}'] = row['base_sha']
              report['prs'].append(row)
              (out/'status.json').write_text(json.dumps(report, indent=2) + '\n')
              print(n, row['head'][:12], row['base'], row['mergeable'], [(c['name'], c['conclusion'], [(j['id'], j['failed_steps']) for j in c['jobs'] if j['conclusion']=='failure']) for c in row['checks']], flush=True)
          # Git objects only: no checkout configuration, credentials, binaries or model data.
          subprocess.run(['git','fetch','--no-tags','https://github.com/jjoshua2/DeepFin.git', *sorted(set(refs.values()))], check=True)
          for ref, sha in refs.items():
              subprocess.run(['git','update-ref',ref,sha],check=True)
          subprocess.run(['git','bundle','create',str(out/'review.bundle'),*refs],check=True)
          for row in report['prs']:
              merged = subprocess.run(['git','merge-tree','--write-tree','--messages',row['head'],row['base_sha']], capture_output=True, text=True, check=False)
              if merged.returncode not in (0,1):
                  raise RuntimeError(merged.stderr)
              row['local_merge_clean'] = merged.returncode == 0
              if merged.returncode:
                  (out/f"conflict-{row['number']}.txt").write_text(merged.stdout + '\n' + merged.stderr)
          (out/'status.json').write_text(json.dumps(report,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bend-ci-followup-review
          path: /tmp/bend-ci-followup/
          retention-days: 7
