name: PR1 accounting workspace
on:
  push:
    branches: [work/pr1-neural-accounting-20260922]
permissions:
  contents: write
  actions: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: .
      CAE_TEST_THREADS: '2'
      OMP_NUM_THREADS: '2'
      MAX_JOBS: '1'
      TORCHINDUCTOR_COMPILE_THREADS: '1'
      BEND_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c78ca8aaab8982bd8ca234928c61c6225ad91580
      - name: Apply exact patch and held-result correction
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/pr1-evidence /tmp/pr1-previous
          gh api repos/jjoshua2/DeepFin/actions/artifacts/10709686312/zip > /tmp/pr1-previous.zip
          unzip -q /tmp/pr1-previous.zip -d /tmp/pr1-previous
          python - <<'PY'
          import base64, hashlib, json, subprocess
          from pathlib import Path
          data = Path('/tmp/pr1-previous/pr1.patch').read_bytes()
          assert hashlib.sha256(data).hexdigest() == '35472bde6a95b787ee1e8ecb187a437092740accc79747c3d4faa738e0f6c246'
          subprocess.run(['git','apply','--check','-'], input=data, check=True)
          subprocess.run(['git','apply','-'], input=data, check=True)
          blob = json.loads(subprocess.check_output(['gh','api','repos/jjoshua2/DeepFin/git/blobs/3b667d15aeeb5d66c95c6d27765c9202d2b3f214']))
          correction = base64.b64decode(blob['content'])
          assert hashlib.sha256(correction).hexdigest() == 'a94b0a2cc96f74cf7594242074ee4239f3852722174673738f75d077988d2d00'
          subprocess.run(['git','apply','--check','-'], input=correction, check=True)
          subprocess.run(['git','apply','-'], input=correction, check=True)
          subprocess.run(['git','add','-N','.'], check=True)
          final = subprocess.check_output(['git','diff','--binary'])
          assert hashlib.sha256(final).hexdigest() == 'fab03fb1861a17b4371dbcb8d7f7fbdb8730d018d895540d3935f2e2eafa9306'
          Path('/tmp/pr1-evidence/pr1.patch').write_bytes(final)
          PY
          git diff --check
          git diff --stat | tee /tmp/pr1-evidence/diff-stat.txt
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@v7
        with:
          version: 0.12.10
          enable-cache: true
      - run: |
          uv sync --locked --extra dev --extra cpu
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Static and regression gates
        run: |
          set -o pipefail
          bash scripts/lint.sh 2>&1 | tee /tmp/pr1-evidence/lint.txt
          bash scripts/lint.sh native/bend_engine/standalone/verify_work.py native/bend_engine/standalone/verify_neural.py 2>&1 | tee /tmp/pr1-evidence/native-lint.txt
          python -m pytest tests/test_neural_work.py tests/test_neural_search_benchmark.py tests/test_broker_served_count.py tests/test_inference_slot_protocol.py tests/test_inference_broker.py tests/test_aot_broker_integration.py -q --junitxml=/tmp/pr1-evidence/tests.xml 2>&1 | tee /tmp/pr1-evidence/tests.txt
      - name: Build and run native material regressions
        run: |
          set -o pipefail
          bash native/bend_engine/standalone/build.sh /tmp/pr1-native /tmp/pr1-compiler 2>&1 | tee /tmp/pr1-evidence/native-build.txt
          cp /tmp/pr1-native/build.txt /tmp/pr1-evidence/build.txt
          bun /tmp/pr1-compiler/bend2/main.ts native/bend_engine/standalone/work_probe.bend -o /tmp/pr1-work.c
          clang -std=c11 -O1 -ffp-contract=off /tmp/pr1-work.c -pthread -lm -o /tmp/pr1-work
          python native/bend_engine/standalone/verify_work.py --probe /tmp/pr1-work --command /tmp/pr1-native/deepfin-bend --threads 1 | tee /tmp/pr1-evidence/native-work.json
          python -m native.bend_engine.standalone.verify --report /tmp/pr1-evidence/material.json --command /tmp/pr1-native/deepfin-bend --threads 1 | tee /tmp/pr1-evidence/material.txt
      - name: Native neural execution and exact-budget controls
        run: |
          set -o pipefail
          mkdir /tmp/pr1-model
          python - <<'PY'
          from pathlib import Path
          import torch
          from native.bend_engine.neural_probe.checkpoint_probe import fixture_checkpoint
          from native.bend_engine.neural_probe.checkpoint import load_checkpoint, export_checkpoint
          torch.set_num_threads(2)
          checkpoint = Path('/tmp/pr1-model/fixture.pt')
          fixture_checkpoint(checkpoint)
          export_checkpoint(load_checkpoint(checkpoint), Path('/tmp/pr1-model/fixture.pt2'), batch=1, device='cpu')
          PY
          bun native/bend_engine/standalone/bind_model.js --header /tmp/pr1-model/fixture.pt2 /tmp/pr1-native/model_contract.h > /tmp/pr1-evidence/binding.json
          cmake -S native/bend_engine/standalone -B /tmp/pr1-native/neural -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_PREFIX_PATH="$(python -c 'import torch; print(torch.utils.cmake_prefix_path)')" -DBEND_GENERATED_C=/tmp/pr1-native/engine.c -DBEND_CONTRACT_DIR=/tmp/pr1-native
          cmake --build /tmp/pr1-native/neural --parallel 1
          clang -std=c11 -O3 -DLEGAL_ORACLE -I . native/bend_engine/legal_probe/support.c -pthread -lm -o /tmp/cboard-reference
          python -m native.bend_engine.standalone.verify_neural --checkpoint /tmp/pr1-model/fixture.pt --package /tmp/pr1-model/fixture.pt2 --oracle /tmp/cboard-reference --report /tmp/pr1-evidence/neural.json --command /tmp/pr1-native/neural/deepfin-bend-neural --threads 1 | tee /tmp/pr1-evidence/neural.txt
          python - <<'PY'
          import json, os
          from pathlib import Path
          from native.bend_engine.standalone.verify import Client
          from scripts.bench_neural_search import search
          os.environ['DEEPFIN_BEND_MODEL_PACKAGE'] = '/tmp/pr1-model/fixture.pt2'
          client = Client(['/tmp/pr1-native/neural/deepfin-bend-neural','--threads','1'])
          results = []
          try:
              for profile in (False, True):
                  for budget in (1, 3):
                      row = search(client, 'position startpos', kind='evals', budget=budget, profile=profile, timeout=30, wall_tolerance_ms=10)
                      assert row['comparable'], row
                      assert row['counters']['accepted_neural_rows'] == budget
                      assert (row['counters']['phase_seconds']['encoding'] is not None) == profile
                      results.append(row)
              # Time controls are measured, not presumed preemptible or fair.
              row = search(client, 'position startpos', kind='movetime', budget=10, profile=False, timeout=30, wall_tolerance_ms=10)
              assert row['budget_reached'], row
              results.append(row)
          finally:
              client.close()
          Path('/tmp/pr1-evidence/native-budgets.json').write_text(json.dumps(results, indent=2)+'\n')
          PY
      - name: Publish clean feature branch after all gates
        run: |
          git diff --check
          git switch -c feat/neural-work-accounting-20260922
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add chess_anti_engine/inference.py chess_anti_engine/neural_work.py docs/neural_work.md native/bend_engine/standalone/NativeEvaluation.bend native/bend_engine/standalone/NeuralWork.bend native/bend_engine/standalone/Protocol.bend native/bend_engine/standalone/README.md native/bend_engine/standalone/main.bend native/bend_engine/standalone/verify_neural.py native/bend_engine/standalone/verify_work.py native/bend_engine/standalone/work_probe.bend scripts/bench_neural_search.py tests/test_broker_served_count.py tests/test_neural_search_benchmark.py tests/test_neural_work.py
          git commit -m 'bench: unify neural-work accounting and fixed-budget search comparisons'
          git push origin HEAD:refs/heads/feat/neural-work-accounting-20260922
          git rev-parse HEAD | tee /tmp/pr1-evidence/published-head.txt
      - name: Preserve build and qualification inputs
        if: always()
        run: |
          mkdir -p /tmp/pr1-native /tmp/pr1-model
          tar -C /tmp -czf /tmp/pr1-evidence/native-build.tar.gz pr1-native pr1-model
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deepfin-pr1-validation
          path: /tmp/pr1-evidence
          retention-days: 30
