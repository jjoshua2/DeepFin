name: Bend CI closeout audit
on:
  push:
    branches: [fix/bend-ci-followup-audit-20260921]
    paths: [.github/workflows/bend-ci-closeout-audit.yml]
permissions:
  contents: read
  actions: read
  pull-requests: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Read current PR heads and completed workflow evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/bend-ci-closeout
          python3 - <<'PY'
          import datetime, json, os, urllib.parse, urllib.request
          from pathlib import Path
          root = Path('/tmp/bend-ci-closeout')
          repo = 'jjoshua2/DeepFin'
          def get(path):
              url = 'https://api.github.com/repos/' + repo + '/' + path
              req = urllib.request.Request(url, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
              with urllib.request.urlopen(req, timeout=20) as response:
                  return json.load(response)
          def pages(path, key=None):
              values = []
              for page in range(1, 11):
                  payload = get(path + ('&' if '?' in path else '?') + f'per_page=100&page={page}')
                  rows = payload[key] if key else payload
                  values.extend(rows)
                  if len(rows) < 100:
                      return values
              raise RuntimeError('Pagination bound exceeded: ' + path)
          def selected_prs():
              return [p for p in pages('pulls?state=open')
                      if 'bend' in p['title'].lower() or 'bend' in p['head']['ref'].lower()]
          initial = selected_prs()
          report = {'started_at': datetime.datetime.now(datetime.timezone.utc).isoformat(),
                    'repository': repo, 'scope': 'Current-head PR Actions; not formal-proof execution or merge approval', 'prs': []}
          for item in sorted(initial, key=lambda p: p['number']):
              n = item['number']
              p = get(f'pulls/{n}')
              sha = p['head']['sha']
              row = {'number': n, 'title': p['title'], 'url': p['html_url'], 'state': p['state'],
                     'head': sha, 'branch': p['head']['ref'], 'base': p['base']['ref'],
                     'base_sha': p['base']['sha'], 'mergeable': p['mergeable'], 'checks': []}
              seen = set()
              for run in pages('actions/runs?event=pull_request&head_sha=' + sha, 'workflow_runs'):
                  if run['workflow_id'] in seen:
                      continue
                  seen.add(run['workflow_id'])
                  assert run['head_sha'] == sha
                  check = {k: run[k] for k in ('id', 'workflow_id', 'name', 'path', 'status', 'conclusion', 'run_attempt', 'html_url', 'created_at', 'updated_at')}
                  check['jobs'] = [{k: j[k] for k in ('id', 'name', 'status', 'conclusion', 'started_at', 'completed_at')}
                                   for j in pages(f"actions/runs/{run['id']}/jobs?filter=latest", 'jobs')]
                  if run['name'] == 'CI' and n in (785, 805, 806, 807):
                      check['artifacts'] = [{k: a[k] for k in ('id', 'name', 'size_in_bytes', 'digest', 'expired')}
                                            for a in pages(f"actions/runs/{run['id']}/artifacts", 'artifacts')]
                  row['checks'].append(check)
              # Missing normal CI/chess evidence is not a green result.
              names = {c['name'] for c in row['checks']}
              row['core_workflows_present'] = {'CI', 'Bend chess probe'} <= names
              row['all_current_head_actions_green'] = row['core_workflows_present'] and all(
                  c['status'] == 'completed' and c['conclusion'] == 'success'
                  and c['jobs'] and all(j['status'] == 'completed' and j['conclusion'] == 'success' for j in c['jobs'])
                  for c in row['checks'])
              report['prs'].append(row)
              (root / 'status.json').write_text(json.dumps(report, indent=2) + '\n')
              print(n, sha, [(c['name'], c['conclusion']) for c in row['checks']], flush=True)
          final = selected_prs()
          report['same_open_heads_at_end'] = {p['number']: p['head']['sha'] for p in initial} == {p['number']: p['head']['sha'] for p in final}
          report['finished_at'] = datetime.datetime.now(datetime.timezone.utc).isoformat()
          report['all_green'] = bool(report['prs']) and report['same_open_heads_at_end'] and all(p['all_current_head_actions_green'] for p in report['prs'])
          report['counts'] = {'open_bend_prs': len(report['prs']), 'green_prs': sum(p['all_current_head_actions_green'] for p in report['prs']),
                              'workflows': sum(len(p['checks']) for p in report['prs'])}
          (root / 'status.json').write_text(json.dumps(report, indent=2) + '\n')
          lines = ['# Bend CI closeout', '', report['finished_at'], '',
                   'This audit reads existing runs only. It does not rerun tests, modify PR heads, or approve merges.', '',
                   '| PR | Head | Current-head workflows |', '| --- | --- | --- |']
          for p in report['prs']:
              results = '; '.join(c['name'] + ': ' + (c['conclusion'] or c['status']) for c in p['checks'])
              lines.append(f"| #{p['number']} | {p['head']} | {results} |")
          lines += ['', 'Stable open-PR head set: ' + str(report['same_open_heads_at_end']), 'All core and observed current-head Actions green: ' + str(report['all_green'])]
          (root / 'summary.md').write_text('\n'.join(lines) + '\n')
          print(json.dumps(report['counts']), 'all_green=', report['all_green'], flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bend-ci-closeout
          path: /tmp/bend-ci-closeout/
          retention-days: 14
