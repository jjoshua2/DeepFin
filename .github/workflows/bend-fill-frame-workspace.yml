name: Bend fill frame workspace
'on':
  push:
    branches: [feat/bend-fill-frame-dev-20260923]
    paths: [.github/workflows/bend-fill-frame-workspace.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d8de6e46fd04c4b34385d754224df37722a6a118
          persist-credentials: false
      - name: Archive exact baseline without executing candidate code
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/source"
          git archive --format=tar HEAD | gzip > "$RUNNER_TEMP/source/DeepFin.tar.gz"
          git cat-file commit HEAD > "$RUNNER_TEMP/source/commit.raw"
          git rev-parse HEAD^{tree} > "$RUNNER_TEMP/source/tree.txt"
          cd "$RUNNER_TEMP/source"
          sha256sum DeepFin.tar.gz commit.raw > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: bend-fill-frame-source
          path: ${{ runner.temp }}/source/
          retention-days: 3
