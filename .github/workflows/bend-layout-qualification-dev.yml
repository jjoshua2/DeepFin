name: Bend layout source recovery
'on':
  push:
    branches: [feat/bend-layout-qualification-dev-20260921]
    paths: ['.github/workflows/bend-layout-qualification-dev.yml']
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 33c363ba6715956fd9323a6032b1a6c4a2b916fe
          persist-credentials: false
      - name: Archive immutable complete source without executing engine or training
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/layout-source"
          git archive --format=tar HEAD | gzip > "$RUNNER_TEMP/layout-source/DeepFin-source.tar.gz"
          git rev-parse HEAD > "$RUNNER_TEMP/layout-source/commit.txt"
          git ls-tree -r HEAD native/bend_engine/standalone native/bend_engine/bitboard_probe/Sliders.bend > "$RUNNER_TEMP/layout-source/source-blobs.txt"
          (cd "$RUNNER_TEMP/layout-source" && sha256sum DeepFin-source.tar.gz > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: bend-layout-source
          path: ${{ runner.temp }}/layout-source/
          retention-days: 3
