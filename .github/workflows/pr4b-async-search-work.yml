name: PR4b async search workspace
on:
  push:
    branches: [work/pr4b-async-search-20260922]
permissions:
  contents: write
  actions: read
jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 552ab2646a0772e33b5690b9d79494e6ed5e48d2
      - uses: actions/download-artifact@v4
        with:
          name: deepfin-pr4b-qualification
          run-id: 35801782528
          github-token: ${{ github.token }}
          path: /tmp/pr4b-qualified
      - name: Verify qualified source and apply authored documentation only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/pr4b-docs
          python - <<'PY'
          import base64, hashlib, json, subprocess
          from pathlib import Path
          manifest=json.loads(Path('/tmp/pr4b-qualified/source-manifest.json').read_text())
          for path,digest in manifest.items():
              assert hashlib.sha256(Path(path).read_bytes()).hexdigest()==digest, path
          data=json.loads(subprocess.check_output(['gh','api','repos/jjoshua2/DeepFin/git/blobs/d3b0a7470ca3986aaba63982851babe4020e62dd']))
          script=base64.b64decode(data['content'])
          assert hashlib.sha1(b'blob '+str(len(script)).encode()+b'\0'+script).hexdigest()=='d3b0a7470ca3986aaba63982851babe4020e62dd'
          exec(compile(script,'authored-documentation','exec'))
          paths=subprocess.check_output(['git','diff','--name-only']).decode().splitlines()
          expected=['docs/experiments/2026-09-22-native-async-search.md','docs/experiments/README.md','native/bend_engine/async_probe/README.md','native/bend_engine/standalone/README.md']
          assert sorted(paths)==sorted(expected),paths
          for path,digest in manifest.items():
              if not path.endswith('.md'):
                  assert hashlib.sha256(Path(path).read_bytes()).hexdigest()==digest,path
          Path('/tmp/pr4b-docs/doc-manifest.json').write_text(json.dumps({p:hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in paths},indent=2))
          Path('/tmp/pr4b-docs/documentation.patch').write_bytes(subprocess.check_output(['git','diff','--binary']))
          PY
          git diff --check
          git diff --stat
      - name: Fast-forward documentation on qualified feature branch
        run: |
          set -euo pipefail
          git add docs/experiments/2026-09-22-native-async-search.md docs/experiments/README.md native/bend_engine/async_probe/README.md native/bend_engine/standalone/README.md
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'docs: record composed async engine qualification and lifecycle usage'
          git push origin HEAD:refs/heads/feat/native-async-search-20260922
          git rev-parse HEAD | tee /tmp/pr4b-docs/published-head.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deepfin-pr4b-documentation
          path: /tmp/pr4b-docs
          retention-days: 30
