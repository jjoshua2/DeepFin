name: Bend checkpoint confirmation
on:
  push:
    branches: [feat/bend-checkpoint-qualification]
    paths: ['.github/workflows/bend-checkpoint-dev.yml']
permissions:
  contents: write
jobs:
  confirm:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          activate-environment: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Apply exact shared evaluator and reviewed bucket/type fixes
        run: |
          echo '9c57874f110a141d8b14e58927083330ccea73ee19ea06e988ce1b33e9725e42  .github/checkpoint-changes.patch' | sha256sum -c -
          echo '2cbb123f68f96d33b327302233f16d4e5199cb5c4472cf73c4c2248b3da79639  .github/checkpoint-refinements.patch' | sha256sum -c -
          git apply --check .github/checkpoint-changes.patch
          git apply .github/checkpoint-changes.patch
          git apply --check .github/checkpoint-refinements.patch
          git apply .github/checkpoint-refinements.patch
          python - <<'PY'
          from pathlib import Path
          import hashlib
          expected = {
            'native/bend_engine/neural_probe/checkpoint.py': '3c9a9e7238e3668d14374a9fd02be8208b9edd0dc85aeffcaad73508e684d9c6',
            'native/bend_engine/neural_probe/checkpoint_probe.py': '035b5c448ca492e8c0585463e7b3450d8b74bda3bf7d9bc3be70161ca32c56b1',
            'tests/test_bend_checkpoint.py': 'd314858539f18043fa6ba89b19629232a4b64de100fd4e25f520efee1920a30f',
          }
          for name, wanted in expected.items():
              assert hashlib.sha256(Path(name).read_bytes()).hexdigest() == wanted, name
          PY
          git diff --check
      - name: Install locked CPU tools and source-pinned Bend
        run: |
          uv sync --locked --extra dev --extra cpu
          python -c "import torch; assert torch.version.cuda is None; print(torch.__version__)"
          bash native/bend_engine/bitboard_probe/install_toolchain.sh
      - name: Static checks and cheap checkpoint contracts
        run: |
          status=0
          ruff check native/bend_engine/neural_probe tests/test_bend_checkpoint.py || status=1
          basedpyright native/bend_engine/neural_probe tests/test_bend_checkpoint.py || status=1
          python -m pytest -q tests/test_bend_checkpoint.py tests/test_bend_batching.py tests/test_bend_neural_boundary.py tests/test_bend_search_sessions.py || status=1
          exit "$status"
      - name: Strict saved transformer checkpoint and batched search
        run: |
          python -m native.bend_engine.neural_probe.checkpoint_probe --fixture-checkpoint \
            --modes generic portable native ubsan --report artifacts/bend-checkpoint-transformer.json
          python -m native.bend_engine.neural_probe.checkpoint_probe --fixture-checkpoint --batch 1 \
            --report artifacts/bend-checkpoint-batch1.json
      - name: Preserve earlier session and neural contracts
        run: |
          python -m native.bend_engine.session_probe.run_probe --python-chess --report artifacts/bend-checkpoint-sessions.json
          python -m native.bend_engine.neural_probe.run_probe --report artifacts/bend-checkpoint-single.json
          python -m native.bend_engine.neural_probe.batch_probe --report artifacts/bend-checkpoint-batch.json
      - name: Reject missing CUDA instead of claiming fallback qualification
        run: |
          if python -m native.bend_engine.neural_probe.checkpoint_probe --fixture-checkpoint \
            --device cuda --atol 0 --rtol 0 --report artifacts/bend-checkpoint-cuda-unavailable.json; then
            exit 1
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('artifacts/bend-checkpoint-cuda-unavailable.json').read_text())
          assert result['status'] == 'failed' and result['failed_stage'] == 'preflight'
          assert 'no CPU fallback' in result['error']
          PY
      - name: Preserve tested source commit (workflow published separately)
        run: |
          git add native/bend_engine/neural_probe tests/test_bend_checkpoint.py docs/experiments
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Validate saved transformer checkpoints with native evaluator targets'
          git push origin HEAD:refs/heads/feat/bend-checkpoint-qualification
          git rev-parse HEAD > artifacts/bend-checkpoint-commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bend-checkpoint-confirmation
          path: artifacts/bend-checkpoint-*
          retention-days: 30
