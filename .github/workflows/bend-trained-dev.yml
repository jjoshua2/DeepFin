name: Bend checkpoint contract confirmation
on:
  push:
    branches: [feat/bend-trained-model-contract]
    paths: ['.github/workflows/bend-trained-dev.yml']
permissions:
  contents: write
jobs:
  confirm:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          activate-environment: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Apply reviewed patches and verify exact final sources
        run: |
          echo 'b5e19ed528a8212beee3d0a14fb43e89a7e1754deca0797774f7856f70c35ea7  .github/checkpoint-code.patch' | sha256sum -c -
          echo '906b095aba6c39ce1cd0f7de21f5b7ed6bbbe8f204edf6356d6a10857cbf4adc  .github/checkpoint-cleanup.patch' | sha256sum -c -
          git apply --check .github/checkpoint-code.patch
          git apply .github/checkpoint-code.patch
          git apply --check .github/checkpoint-docs.patch
          git apply .github/checkpoint-docs.patch
          git apply --check .github/checkpoint-cleanup.patch
          git apply .github/checkpoint-cleanup.patch
          python - <<'PY'
          import hashlib
          from pathlib import Path
          expected = {
            'native/bend_engine/neural_probe/checkpoint.py': '644acc4b3bb859be4dbfb4d170ae424f7353b69ce353067faf4b184d700a0a24',
            'native/bend_engine/neural_probe/checkpoint_probe.py': '0212afc93617df5f044d25b5591b589afe8b3569ba7e0e788a870937d21f6ebc',
            'native/bend_engine/neural_probe/checkpoint_smoke.py': '77894f27697d815c0bc97813cf8fb75f59ca5483543810f93744e0e07efa7bab',
            'native/bend_engine/neural_probe/backend.py': 'a7bebcd829b4021bde4454a143792cae72149acf61ee513dc4241cf256d8bbe9',
            'native/bend_engine/neural_probe/aoti_worker.cpp': 'f41c8bac08016eeb4eb1bec7ee08772791860da4c50f878b7fd5f649733777bb',
            'native/bend_engine/neural_probe/batch_probe.py': 'a785da72b90837d1c635e8028e1d11fc94f288e172e1daa5cf64ef87388b3b79',
            'native/bend_engine/neural_probe/CHECKPOINTS.md': '086094d7955cb9fc77183ed2e860ffe652593a3f3306fadb42bd7924384d37ab',
            'native/bend_engine/neural_probe/README.md': '98bc2822b58524f0b149340792e099d5c75dbe458ad5a83b07012164f13d0de2',
            'tests/test_bend_checkpoint_contract.py': '101652074a86d73d34271c32304e3bc7dae70db988559ab45c1940340a4d6705',
            'docs/experiments/README.md': 'e22f7e9d185ce2ded6bdb125ef5d7d5ff1027d0bf1491d36f6f74c16262b73a2',
            'docs/experiments/2026-09-18-bend-checkpoint-contract.md': '642505803aca9617b25c5e2b17103f64c37a8cd94d6fb23835629db2958b0420',
          }
          for name, expected_sha in expected.items():
              actual = hashlib.sha256(Path(name).read_bytes()).hexdigest()
              assert actual == expected_sha, (name, actual, expected_sha)
          print('All 11 feature files match the final reviewed source bytes')
          PY
          git diff --check
      - name: Install isolated CPU environment and pinned compiler
        run: |
          uv sync --locked --extra dev --extra cpu
          python -c "import torch; assert torch.version.cuda is None; print(torch.__version__)"
          bash native/bend_engine/bitboard_probe/install_toolchain.sh
      - name: Static checks and inexpensive checkpoint contracts
        run: |
          status=0
          ruff check native/bend_engine/neural_probe tests/test_bend_checkpoint_contract.py || status=1
          basedpyright native/bend_engine/neural_probe tests/test_bend_checkpoint_contract.py || status=1
          python -m pytest -q tests/test_bend_checkpoint_contract.py tests/test_bend_batching.py tests/test_bend_neural_boundary.py tests/test_bend_search_sessions.py || status=1
          exit "$status"
      - name: Preserve four-mode persistent session behavior
        run: |
          python -m native.bend_engine.session_probe.run_probe --python-chess \
            --report artifacts/bend-checkpoint-session.json
      - name: Preserve batch-one native neural behavior
        run: |
          python -m native.bend_engine.neural_probe.run_probe \
            --report artifacts/bend-checkpoint-single.json
      - name: Preserve bounded batch-four native neural behavior
        run: |
          python -m native.bend_engine.neural_probe.batch_probe \
            --report artifacts/bend-checkpoint-batch.json
      - name: Four-mode checkpoint-backed reduced transformer
        run: |
          python -m native.bend_engine.neural_probe.checkpoint_smoke \
            --modes generic portable native ubsan \
            --report artifacts/bend-checkpoint-transformer.json
      - name: Publish only the tested feature on a clean branch
        run: |
          git fetch --no-tags --depth=1 origin 4ab0836c69f7d60ae41c84fa069527a8c731f047
          git rm .github/workflows/bend-trained-dev.yml .github/checkpoint-part-0.txt .github/checkpoint-code.patch .github/checkpoint-docs.patch .github/checkpoint-cleanup.patch
          git add native/bend_engine/neural_probe tests/test_bend_checkpoint_contract.py docs/experiments/README.md docs/experiments/2026-09-18-bend-checkpoint-contract.md
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          commit="$(git commit-tree "$(git write-tree)" -p 4ab0836c69f7d60ae41c84fa069527a8c731f047 -m 'Qualify checkpoint-owned Bend evaluator with explicit CPU and CUDA contracts')"
          git push origin "$commit":refs/heads/feat/bend-checkpoint-contract-reviewed
          printf '%s\n' "$commit" > artifacts/bend-checkpoint-commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bend-checkpoint-confirmation
          path: artifacts/bend-checkpoint-*
          retention-days: 30
