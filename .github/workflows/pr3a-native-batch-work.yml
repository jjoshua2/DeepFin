name: PR3a native batch qualification
on:
  push:
    branches: [work/pr3a-native-batch-20260922]
permissions:
  contents: write
  actions: read
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: .
      CAE_TEST_THREADS: '2'
      OMP_NUM_THREADS: '2'
      MAX_JOBS: '1'
      TORCHINDUCTOR_COMPILE_THREADS: '1'
      BEND_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 4bf90fed14b3ad0a192a4e93cc978b8f102a7b3c
      - name: Apply exact authored source patch
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/pr3a-evidence
          python - <<'PY'
          import base64, hashlib, json, subprocess, zlib
          from pathlib import Path
          chunks = []
          for sha in ['48d49db3e135de95cf2e810617c77ba7474b2bf0', '3aa327141d6a03d3a1d912df4f6ede68e29870a8', 'f87690161bb9034cddf82ac402b4015ac11194eb']:
              obj = json.loads(subprocess.check_output(['gh','api',f'repos/jjoshua2/DeepFin/git/blobs/{sha}']))
              chunks.append(base64.b64decode(obj['content']))
          patch = zlib.decompress(base64.b64decode(b''.join(chunks), validate=True))
          assert hashlib.sha256(patch).hexdigest() == 'f47e2ed3b2974d9fb82f10c9c61e6d7ebd164d778e73c0dcf97dd150b06f72f6'
          Path('/tmp/pr3a-evidence/pr3a.patch').write_bytes(patch)
          subprocess.run(['git','apply','--check','-'], input=patch, check=True)
          subprocess.run(['git','apply','-'], input=patch, check=True)
          subprocess.run(['git','add','-N','.'], check=True)
          paths = subprocess.check_output(['git','diff','--name-only']).decode().splitlines()
          assert len(paths) == 16
          assert not any(p.startswith('.github/') for p in paths)
          manifest = {p: hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in paths}
          Path('/tmp/pr3a-evidence/source-manifest.json').write_text(json.dumps(manifest, indent=2)+'\n')
          PY
          git diff --check
          git diff --stat | tee /tmp/pr3a-evidence/diff-stat.txt
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@v7
        with:
          version: 0.12.10
      - name: Locked CPU environment
        run: |
          uv sync --locked --extra dev --extra cpu
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Static gates and inexpensive behavior tests
        run: |
          set -o pipefail
          bash scripts/lint.sh 2>&1 | tee /tmp/pr3a-evidence/lint.txt
          bash scripts/lint.sh native/bend_engine/batch_backend/verify.py 2>&1 | tee /tmp/pr3a-evidence/native-lint.txt
          bun test native/bend_engine/standalone/bind_model.test.js native/bend_engine/standalone/verify_compiler.test.js native/bend_engine/batch_backend/binding.test.js 2>&1 | tee /tmp/pr3a-evidence/binding.txt
          python -m pytest tests/test_bend_native_batch_backend.py tests/test_neural_work.py tests/test_neural_search_benchmark.py tests/test_broker_served_count.py -q --junitxml=/tmp/pr3a-evidence/tests.xml 2>&1 | tee /tmp/pr3a-evidence/tests.txt
      - uses: actions/download-artifact@v4
        with:
          name: deepfin-pr1-validation
          run-id: 35759888019
          github-token: ${{ github.token }}
          path: /tmp/pr3a-pr1
      - uses: actions/download-artifact@v4
        with:
          name: deepfin-pr2-reuse-final
          run-id: 35767013700
          github-token: ${{ github.token }}
          path: /tmp/pr3a-pr2
      - name: Recover exact saved fixture and unchanged singleton generated source
        run: |
          tar -xzf /tmp/pr3a-pr1/native-build.tar.gz -C /tmp
          tar -xzf /tmp/pr3a-pr2/final-build.tar.gz -C /tmp
          echo '9654a1e334fb5f875d164b82068846bfeab3df2ef2a994737e44789c2623ee6e  /tmp/pr1-model/fixture.pt2' | sha256sum -c -
          echo 'bb9934134c0d9a39c515c10fa870122c3dfd28259bece392be026e32a9ca60d7  /tmp/pr1-model/fixture.pt' | sha256sum -c -
          echo '28bed3f939b8cf3d2e764043f482d545e047704adfbe5985ee79484b605d3965  /tmp/pr2-native/engine.c' | sha256sum -c -
          python -c 'import sys,torch; print(sys.version, torch.__version__); assert torch.__version__ == "2.14.0+cpu"' | tee /tmp/pr3a-evidence/runtime.txt
          git init /tmp/pr3a-compiler
          git -C /tmp/pr3a-compiler remote add origin https://github.com/jjoshua2/bend.git
          git -C /tmp/pr3a-compiler fetch --depth 1 origin aaeb9bc91ff0ff0b3f58dba6a9744c6607e167ae
          git -C /tmp/pr3a-compiler checkout --detach FETCH_HEAD
          bun native/bend_engine/standalone/verify_compiler.js /tmp/pr3a-compiler | tee /tmp/pr3a-evidence/compiler.txt
      - name: All packed transport buckets and input widths
        run: |
          set -o pipefail
          here=native/bend_engine/batch_backend
          bun /tmp/pr3a-compiler/bend2/main.ts "$here/main.bend" -o /tmp/pr3a-probe.c
          for b in 1 2 4 8 16; do for c in 146 175; do
            d=/tmp/pr3a-transport-$b-$c
            mkdir "$d"
            printf '#define DEEPFIN_MODEL_BATCH %s\n#define DEEPFIN_MODEL_CHANNELS %s\n#define DEEPFIN_MODEL_PROFILE 4\n' "$b" "$c" > "$d/model_contract.h"
            for mode in normal ubsan; do
              flags=()
              if test "$mode" = ubsan; then flags=(-fsanitize=undefined -fno-sanitize-recover=all); fi
              clang -std=c11 -O1 -ffp-contract=off "${flags[@]}" -I "$d" /tmp/pr3a-probe.c "$here/test_backend.c" -pthread -lm -o "$d/probe-$mode"
              python -m native.bend_engine.batch_backend.verify --transport-only --binary "$d/probe-$mode" --batch "$b" --channels "$c" --report "/tmp/pr3a-evidence/transport-$b-$c-$mode.json"
            done
          done; done
      - name: Export only the saved untrained fixture at fixed batch four
        run: |
          set -o pipefail
          mkdir /tmp/pr3a-model
          python - <<'PY' 2>&1 | tee /tmp/pr3a-evidence/export.txt
          from pathlib import Path
          import torch
          from native.bend_engine.neural_probe.checkpoint import load_checkpoint, export_checkpoint
          torch.set_num_threads(2)
          loaded = load_checkpoint(Path('/tmp/pr1-model/fixture.pt'))
          export_checkpoint(loaded, Path('/tmp/pr3a-model/batch4.pt2'), batch=4, device='cpu')
          PY
          cp /tmp/pr3a-model/batch4.json /tmp/pr3a-evidence/batch4-manifest.json
      - name: Build and execute real batch-one and batch-four probes
        run: |
          set -o pipefail
          prefix="$(python -c 'import torch; print(torch.utils.cmake_prefix_path)')"
          for b in 1 4; do
            package=/tmp/pr1-model/fixture.pt2
            if test "$b" = 4; then package=/tmp/pr3a-model/batch4.pt2; fi
            bash native/bend_engine/batch_backend/build_probe.sh "/tmp/pr3a-b$b" "$package" "$prefix" /tmp/pr3a-compiler 2>&1 | tee "/tmp/pr3a-evidence/build-b$b.txt"
            python -m native.bend_engine.batch_backend.verify --binary "/tmp/pr3a-b$b/build/deepfin-bend-batch-probe" --package "$package" --checkpoint /tmp/pr1-model/fixture.pt --report "/tmp/pr3a-evidence/model-b$b.json"
          done
          cmake -S native/bend_engine/standalone -B /tmp/pr3a-b4/build -DBEND_BATCH_TESTS=ON
          cmake --build /tmp/pr3a-b4/build --target batch-output-contract --parallel 1
          /tmp/pr3a-b4/build/batch-output-contract | tee /tmp/pr3a-evidence/output-contract.json
      - name: Unchanged singleton application with the final modified bridge
        run: |
          set -o pipefail
          mkdir /tmp/pr3a-single
          bun native/bend_engine/standalone/bind_model.js --header /tmp/pr1-model/fixture.pt2 /tmp/pr3a-single/model_contract.h > /tmp/pr3a-evidence/singleton-binding.json
          prefix="$(python -c 'import torch; print(torch.utils.cmake_prefix_path)')"
          cmake -S native/bend_engine/standalone -B /tmp/pr3a-single/build -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_PREFIX_PATH="$prefix" -DBEND_GENERATED_C=/tmp/pr2-native/engine.c -DBEND_CONTRACT_DIR=/tmp/pr3a-single
          cmake --build /tmp/pr3a-single/build --parallel 1
          clang -std=c11 -O3 -DLEGAL_ORACLE -I "$PWD" native/bend_engine/legal_probe/support.c -pthread -lm -o /tmp/pr3a-oracle
          python -m native.bend_engine.standalone.verify_neural --checkpoint /tmp/pr1-model/fixture.pt --package /tmp/pr1-model/fixture.pt2 --oracle /tmp/pr3a-oracle --report /tmp/pr3a-evidence/singleton-neural.json --command /tmp/pr3a-single/build/deepfin-bend-neural --threads 1 | tee /tmp/pr3a-evidence/singleton-neural.txt
          sha256sum /tmp/pr3a-single/build/deepfin-bend-neural /tmp/pr3a-probe.c | tee /tmp/pr3a-evidence/build-identities.txt
      - name: Publish only the qualified feature source
        id: publish
        run: |
          git diff --check
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          manifest=json.loads(Path('/tmp/pr3a-evidence/source-manifest.json').read_text())
          for name,digest in manifest.items():
              assert hashlib.sha256(Path(name).read_bytes()).hexdigest()==digest,name
          PY
          git switch -c feat/native-batch-boundary-20260922
          git add docs/experiments/2026-09-22-native-batch-boundary.md docs/experiments/README.md native/bend_engine/batch_backend native/bend_engine/standalone/CMakeLists.txt native/bend_engine/standalone/batch_outputs.h native/bend_engine/standalone/bind_model.js native/bend_engine/standalone/model_bridge.cpp tests/test_bend_native_batch_backend.py
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'native: add a bounded fixed-batch inference boundary'
          git push origin HEAD:refs/heads/feat/native-batch-boundary-20260922
          git rev-parse HEAD | tee /tmp/pr3a-evidence/published-head.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deepfin-pr3a-batch-qualification
          path: /tmp/pr3a-evidence
          retention-days: 30
      - name: Require all qualifications and publication
        if: always()
        env:
          PUBLISHED: ${{ steps.publish.outcome }}
        run: test "$PUBLISHED" = success
