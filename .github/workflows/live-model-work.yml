name: Live CPU model composition qualification
on:
  push:
    branches: [work/live-model-composition-20260925]
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 52175f1bf2cb53732e774ed1e5ad32f8c3703748
      - uses: actions/download-artifact@v4
        with:
          name: deepfin-live-model-composition
          run-id: 36170337509
          github-token: ${{ github.token }}
          path: /tmp/live-model-evidence
      - name: Verify completed run and apply source-identical tests with evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/live-model-publication
          python3 - <<'PY'
          import base64,hashlib,json,subprocess
          def api(path):
              return json.loads(subprocess.check_output(['gh','api','repos/jjoshua2/DeepFin/'+path]))
          run=api('actions/runs/36170337509')
          assert run['status']=='completed' and run['conclusion']=='success'
          assert run['head_sha']=='b15626b14843b727836c67a2152c46a25635d378'
          artifact=api('actions/artifacts/10879714453')
          assert artifact['digest']=='sha256:6109b78bafa187af65b04fe58c417740e7d0dcbfe5e2c8e2e02b6a0cdb8c2479'
          script=base64.b64decode(api('git/blobs/05c75fb94005780e11923714c44dba36b609741c')['content'])
          assert hashlib.sha256(script).hexdigest()=='7d681463271c4bcd3d9c9ce3f59eab33fddfa5b5cbd202487f85592347adc901'
          exec(compile(script,'authored-completed-live-model-readout','exec'))
          PY
      - name: Publish only the clean follow-up commit to an isolated branch
        run: |
          set -euo pipefail
          branch=work/live-model-publication-20260925
          test -z "$(git ls-remote --heads origin "refs/heads/$branch")"
          git diff --cached --check
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'test: qualify persistent live roots with actual CPU model execution'
          git push origin "HEAD:refs/heads/$branch"
          git rev-parse HEAD > /tmp/live-model-publication/commit.txt
          git diff --stat HEAD^ HEAD > /tmp/live-model-publication/diff-stat.txt
          git show --format=fuller --no-patch HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deepfin-live-model-publication
          path: /tmp/live-model-publication
          retention-days: 30
