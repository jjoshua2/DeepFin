name: Parser prefix source recovery
'on':
  push:
    branches: [feat/bend-parser-prefix-dev-20260925]
    paths: [.github/workflows/bend-parser-source.yml]
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 0aa3794344f3cd2fcb683251d9cb905809bd1560
          persist-credentials: false
      - name: Archive the final documentation-only parent change
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/parser-parent"
          git archive --format=tar HEAD docs/experiments/evidence/bend-whole-board-roundtrip/publication-review.md | gzip > "$RUNNER_TEMP/parser-parent/review.tar.gz"
          git cat-file commit HEAD > "$RUNNER_TEMP/parser-parent/commit.raw"
          git rev-parse HEAD^{tree} > "$RUNNER_TEMP/parser-parent/tree.txt"
          (cd "$RUNNER_TEMP/parser-parent" && sha256sum review.tar.gz commit.raw > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: parser-prefix-parent
          path: ${{ runner.temp }}/parser-parent/
          retention-days: 7
