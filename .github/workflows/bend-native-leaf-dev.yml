name: Bend native leaf source publication
on:
  push:
    branches: [feat/bend-native-leaf-evaluation-dev]
    paths: ['.github/workflows/bend-native-leaf-dev.yml']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dfa0cda0498d45494e1c52e8271fbf20ebf37871
      - name: Reconstruct only the exact sources validated in run 35621703547
        run: |
          python - <<'PY'
          import base64, gzip, hashlib, json, urllib.request
          from pathlib import Path
          def blob(sha):
              with urllib.request.urlopen('https://api.github.com/repos/jjoshua2/DeepFin/git/blobs/' + sha, timeout=30) as response:
                  data = json.load(response)
              raw = base64.b64decode(data['content'])
              assert hashlib.sha1(f'blob {len(raw)}\0'.encode() + raw).hexdigest() == sha
              return raw
          parts = [blob(sha) for sha in ['bcf24d6d61c6633dbdb081674e2eaf7778087b61', '7cfe2cdacc3e4d908757347e8275afd3645a25b0', '33773a9b6bd84dcc609c9bf81d011118cf7b6b6f']]
          patch = gzip.decompress(base64.b64decode(b''.join(parts), validate=True))
          assert hashlib.sha256(patch).hexdigest() == '5c29099945999351f1cacb20eb653e2df7e69a506d1da493081126cdfb4a9e55'
          Path('/tmp/bend-leaf.patch').write_bytes(patch)
          correction = blob('68fc83d560203da3c0ac3607483e7acb0fcc6bc1')
          assert hashlib.sha256(correction).hexdigest() == '16d26dd93e6f8065bcb005d6dcb9869fd2941fb4d9191b4042627b4b9a646b53'
          Path('/tmp/bend-leaf-correction.patch').write_bytes(correction)
          docs = blob('95c32ee8486b732a0f8e762b426bc95807a2d8eb')
          assert hashlib.sha256(docs).hexdigest() == '0ce4d921b51418592b1c0fbcd11d68e72f8ed163b940eddcaa40f701bd9a0284'
          Path('/tmp/bend-leaf-docs.patch').write_bytes(docs)
          PY
          git apply --check /tmp/bend-leaf.patch
          git apply /tmp/bend-leaf.patch
          git apply --check /tmp/bend-leaf-correction.patch
          git apply /tmp/bend-leaf-correction.patch
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, subprocess
          root = Path('native/bend_engine/standalone')
          p = root / 'verify_neural.py'
          s = p.read_text()
          assert s.count('import chess.engine\n') == 1
          p.write_text(s.replace('import chess.engine\n', ''))
          expected = {
            'CMakeLists.txt': '9b2ba47ac3fe68ee96fd8f48f963741918013121',
            'LogitReply.bend': '3e829e73fd5297650a6653aa9e8349e3a029fb89',
            'NativeEvaluation.bend': '7ae574fa28f80aa04b94f6da0d0a715f3e30df58',
            'bind_model.js': '3a1c536ecf72ed7c0f058cc2769bef0392f4fd0c',
            'bind_model.test.js': 'f17a63691e63db6b8b97fbb4e39f234cff8c7f56',
            'build_neural.sh': '317aec72bebf8cc7b0a9fec8f68b446fc7a946c1',
            'isolate_neural.py': '0cc48b5836488c7b58f7d35f6f3f84cd1875d9c5',
            'logit_probe.bend': '627ddf5807eec3c9a7b8185d43d31420c1629bb9',
            'main.bend': '4ccec365057cfd02dd49a235c345b85b8ed66de6',
            'model_bridge.cpp': 'd61ca7288aea5d53279646c493cad5b2b14a94bc',
            'model_call.c': 'bd2ab378c719d2f3529e6c5f4134bc9867eaed57',
            'verify_logits.py': 'b1b5b5c00117d86b46f2dd01dd5f3633926f5966',
            'verify_neural.py': 'f18dd56706e70c62ed32c91f37839fd901f996e5',
          }
          expected = {str(root / name): sha for name, sha in expected.items()}
          expected['docs/experiments/2026-09-21-bend-native-leaf.md'] = '626d52e3cd1976734dfa74696dea296f8be4a0a5'
          for path, sha in expected.items():
              raw = Path(path).read_bytes()
              assert hashlib.sha1(f'blob {len(raw)}\0'.encode() + raw).hexdigest() == sha, path
          subprocess.run(['git', 'add', '--', *expected], check=True)
          changed = subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines()
          assert set(changed) == set(expected), changed
          assert subprocess.check_output(['git', 'ls-files', '-s', str(root / 'build_neural.sh')], text=True).startswith('100755 ')
          Path('/tmp/bend-leaf-source-blobs.json').write_text(json.dumps(expected, indent=2) + '\n')
          PY
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Connect Bend-owned search leaves to bound native model execution'
          git rev-parse HEAD > /tmp/bend-leaf-source-commit.txt
      - name: Add usage documentation without changing executable sources
        run: |
          git apply --check /tmp/bend-leaf-docs.patch
          git apply /tmp/bend-leaf-docs.patch
          python - <<'PY'
          from pathlib import Path
          import subprocess
          p = Path('native/bend_engine/standalone/README.md')
          s = p.read_text()
          old = 'The build checks package hash, checkpoint identity and manifest consistency;\n`model_contract.h` records the immutable model contract.'
          new = 'The build checks package hash and manifest consistency and records the checkpoint\nidentity declared by the trusted sidecar; it does not load the original checkpoint.\n`model_contract.h` records this immutable model contract.'
          assert s.count(old) == 1
          p.write_text(s.replace(old, new))
          expected = {'native/bend_engine/standalone/README.md': '5c8ecdb784f292e3688bec615c576e53482d6fa8',
                      'docs/experiments/README.md': 'bd35c9393ce127e0a89ae1c9288ef5d707a4ecfd'}
          assert set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines()) == set(expected)
          for path, sha in expected.items():
              assert subprocess.check_output(['git', 'hash-object', path], text=True).strip() == sha, path
          PY
          git diff --check
          git add native/bend_engine/standalone/README.md docs/experiments/README.md
          git commit -m 'Document the Python-free neural runtime and native model boundary'
          # Never force or replace the independently existing feat/bend-native-leaf-evaluation.
          target=refs/heads/feat/bend-bound-native-leaf-20260921
          test -z "$(git ls-remote --heads origin "$target")"
          git push origin HEAD:"$target"
          git rev-parse HEAD > /tmp/bend-leaf-doc-commit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: bend-native-leaf-publication
          path: /tmp/bend-leaf-*.json
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: bend-native-leaf-publication-commits
          path: /tmp/bend-leaf-*-commit.txt
          retention-days: 30
