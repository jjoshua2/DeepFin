name: Bend native leaf development snapshot
on:
  push:
    branches: [feat/bend-native-leaf-evaluation-dev]
    paths: ['.github/workflows/bend-native-leaf-dev.yml']
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: |
          mkdir -p /tmp/bend-native-leaf-source
          git archive --format=tar.gz HEAD > /tmp/bend-native-leaf-source/deepfin.tgz
          git rev-parse HEAD > /tmp/bend-native-leaf-source/revision.txt
          git clone --filter=blob:none --no-checkout https://github.com/jjoshua2/bend.git /tmp/bend-leaf-compiler
          git -C /tmp/bend-leaf-compiler checkout --detach aaeb9bc91ff0ff0b3f58dba6a9744c6607e167ae
          git -C /tmp/bend-leaf-compiler archive --format=tar.gz HEAD > /tmp/bend-native-leaf-source/compiler.tgz
          cp "$(command -v bun)" /tmp/bend-native-leaf-source/bun
      - uses: actions/upload-artifact@v4
        with:
          name: bend-native-leaf-source
          path: /tmp/bend-native-leaf-source/
          retention-days: 2
