name: Qualify published castle chain and safety proofs
'on':
  push:
    branches: [feat/publish-castle-chain-safety-dev-20260926]
    paths: [.github/workflows/publish-castle-chain-safety.yml]
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      BEND_NO_TELEMETRY: '1'
      TERM: dumb
      SOURCE: 991e4937bbeeedbf9e9a3ddb40a15417c86a4cd6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 991e4937bbeeedbf9e9a3ddb40a15417c86a4cd6
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: jjoshua2/bend
          ref: aaeb9bc91ff0ff0b3f58dba6a9744c6607e167ae
          path: .compiler
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Verify exact published tree
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/evidence"
          echo "EVIDENCE=$RUNNER_TEMP/evidence" >> "$GITHUB_ENV"
          test "$(git rev-parse HEAD)" = "$SOURCE"
          test "$(git rev-parse HEAD^{tree})" = abae23517afaef0efa93fbaf6b7b47e20389aacf
          bun native/bend_engine/standalone/verify_compiler.js "$PWD/.compiler" | tee "$RUNNER_TEMP/evidence/compiler-identity.txt"
      - name: Re-run full-generator provenance source gate
        run: |
          set -euo pipefail
          bun native/bend_engine/standalone/proofs/castle_chain/focused.js "$PWD/.compiler" --report "$EVIDENCE/chain-focused.json" 2>&1 | tee "$EVIDENCE/chain-focused.log"
      - name: Re-run mandatory-check source gate
        run: |
          set -euo pipefail
          bun native/bend_engine/standalone/proofs/castle_safety/focused.js "$PWD/.compiler" --report "$EVIDENCE/safety-focused.json" 2>&1 | tee "$EVIDENCE/safety-focused.log"
      - name: Re-run full-generator native provenance in four modes
        env:
          CC: /usr/bin/clang
        run: |
          set -euo pipefail
          bun native/bend_engine/standalone/proofs/castle_chain/verify_native.js "$PWD/.compiler" --report "$EVIDENCE/chain-native.json" 2>&1 | tee "$EVIDENCE/chain-native.log"
      - name: Re-run optimized-step mandatory-check native gate in four modes
        env:
          CC: /usr/bin/clang
        run: |
          set -euo pipefail
          bun native/bend_engine/standalone/proofs/castle_safety/verify_native.js "$PWD/.compiler" --report "$EVIDENCE/safety-native.json" 2>&1 | tee "$EVIDENCE/safety-native.log"
      - name: Re-run complete actual versus forced generator audit in four modes
        env:
          CC: /usr/bin/clang
        run: |
          set -euo pipefail
          bun native/bend_engine/standalone/proofs/castle_safety/verify_forced.js "$PWD/.compiler" --report "$EVIDENCE/forced-native.json" 2>&1 | tee "$EVIDENCE/forced-native.log"
      - name: Recheck compiler source suite and pin contracts
        run: |
          set -euo pipefail
          bun test native/bend_engine/standalone/verify_compiler.test.js 2>&1 | tee "$EVIDENCE/pin.log"
          (cd .compiler && bun tests/run/u64_proofs.js) | tee "$EVIDENCE/compiler-proofs.json"
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.10'
          enable-cache: false
      - name: Run unchanged repository lint in locked CPU environment
        run: |
          set -euo pipefail
          uv sync --locked --extra dev --extra cpu
          .venv/bin/python -c 'import torch; assert torch.version.cuda is None'
          export PATH="$PWD/.venv/bin:$PATH"
          ./scripts/lint.sh 2>&1 | tee "$EVIDENCE/lint.log"
      - name: Validate fresh receipts
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          e=Path(os.environ['EVIDENCE'])
          def r(n): return json.loads((e/n).read_text())
          cf,sf,cn,sn,fn=map(r,['chain-focused.json','safety-focused.json','chain-native.json','safety-native.json','forced-native.json'])
          assert cf['focused_gate']=='PASS' and cf['new_law_count']==5 and len(cf['negative_controls'])==18
          assert sf['focused_gate']=='PASS' and sf['new_law_count']==6 and len(sf['negative_controls'])==19
          assert all(x['rejected'] for x in cf['negative_controls']+sf['negative_controls'])
          assert cn['native_gate']=='PASS' and cn['fixture_count']==1062 and cn['complete_child_boards_per_mode']==9241 and len(cn['modes'])==4
          assert sn['native_gate']=='PASS' and sn['fixture_count']==1360 and sn['owned_king_cases']==1216 and sn['complete_child_boards_per_mode']==4184 and len(sn['modes'])==4
          assert fn['native_audit_gate']=='PASS' and fn['fixture_count']==1062 and fn['complete_child_boards_per_program_per_mode']==9241 and len(fn['modes'])==4
          assert r('compiler-proofs.json')['proof_gate']=='PASS'
          assert '12 pass' in (e/'pin.log').read_text() and '0 fail' in (e/'pin.log').read_text()
          assert (e/'lint.log').read_text().strip().endswith('lint: OK')
          out={'qualification':'PASS','run':os.environ['GITHUB_RUN_ID'],'source':os.environ['SOURCE'],'source_tree':'abae23517afaef0efa93fbaf6b7b47e20389aacf','chain_laws':5,'chain_controls':18,'safety_laws':6,'safety_controls':19,'retained_parent_laws':166,'retained_parent_controls':487,'modular_laws':177,'modular_controls':524,'combined_wrapper_executed':False,'native_modes':['generic','portable','native','ubsan'],'repository_lint':'PASS','independent_review':False}
          (e/'qualification.json').write_text(json.dumps(out,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bend-castle-chain-safety-fresh-qualification
          path: ${{ runner.temp }}/evidence/
          retention-days: 14
