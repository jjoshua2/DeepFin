name: Bend subset-law publication recovery
on:
  push:
    branches: [feat/bend-subset-laws-dev-20260921]
    paths: ['.github/workflows/bend-subset-laws-dev.yml']
permissions:
  contents: write
  actions: read
defaults:
  run:
    shell: bash
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BEND_NO_TELEMETRY: '1'
      TARGET_BRANCH: feat/bend-subset-source-laws-20260921
    steps:
      - uses: actions/checkout@v4
        with:
          ref: f1e4037b89314a1f787508d7bd0bb60a1dc6e96c
      - uses: actions/checkout@v4
        with:
          repository: jjoshua2/bend
          ref: aaeb9bc91ff0ff0b3f58dba6a9744c6607e167ae
          path: .compiler
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Recover exact qualification evidence and tested patch without rebuilding
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          export EVIDENCE="$RUNNER_TEMP/subset-publication"
          export QUALIFICATION="$RUNNER_TEMP/qualification"
          mkdir -p "$EVIDENCE" "$QUALIFICATION"
          echo "EVIDENCE=$EVIDENCE" >> "$GITHUB_ENV"
          echo "QUALIFICATION=$QUALIFICATION" >> "$GITHUB_ENV"
          curl --fail --silent --show-error --location -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' https://api.github.com/repos/jjoshua2/DeepFin/actions/artifacts/10652088703/zip -o "$RUNNER_TEMP/qualification.zip"
          echo "8a0f3be1a16c9a1f4e5197c0a7578b061304e00fb359cebba13bd6fdbe12f7ac  $RUNNER_TEMP/qualification.zip" | sha256sum --check
          python3 -c 'import zipfile,os; z=zipfile.ZipFile(os.environ["RUNNER_TEMP"]+"/qualification.zip"); assert all("/" not in n and ".." not in n for n in z.namelist()); z.extractall(os.environ["QUALIFICATION"])'
          gh api repos/jjoshua2/DeepFin/actions/jobs/106422981932 > "$EVIDENCE/qualification-job.json"
          : > "$RUNNER_TEMP/patch.b64"
          for blob in f835573590335ce2c59ba4e28d4e5fb0393a91c0 f0a4c3b5fb6fa17ed47ac6e53b8acb4666b7c80d ba411bc9545672c8dfa444bd167e5689418a3d7d; do
            gh api "repos/jjoshua2/DeepFin/git/blobs/$blob" --jq .content | base64 --decode >> "$RUNNER_TEMP/patch.b64"
          done
          base64 --decode "$RUNNER_TEMP/patch.b64" | gzip -d > "$RUNNER_TEMP/subset.patch"
          echo "630f5e7d0158cc77ef5a38769559fda2835b9882600eefad742cdf8b5b948c72  $RUNNER_TEMP/subset.patch" | sha256sum --check
          test "$(git rev-parse HEAD)" = f1e4037b89314a1f787508d7bd0bb60a1dc6e96c
          git apply --check "$RUNNER_TEMP/subset.patch"
          git apply --index "$RUNNER_TEMP/subset.patch"
          git diff --cached --check
          test "$(git diff --cached --name-only | wc -l)" = 20
          sha256sum --check "$QUALIFICATION/candidate-source-sha256.txt"
          gh api repos/jjoshua2/DeepFin/git/blobs/d5d69e7e3f0675a724e4aedf4ace4c3988ff7adb --jq .content | base64 --decode > "$RUNNER_TEMP/publish_record.py"
          echo "3f752760d30c597ab3af8466e47a47f87c2560ce522e186561ff09eb3d52c177  $RUNNER_TEMP/publish_record.py" | sha256sum --check
          bun native/bend_engine/standalone/verify_compiler.js "$PWD/.compiler"
      - name: Recheck all eight source laws and eleven negative controls
        run: |
          set -euo pipefail
          bun native/bend_engine/standalone/proofs/verify.js "$PWD/.compiler" --report "$EVIDENCE/rechecked-source-proofs.json"
          cmp "$EVIDENCE/rechecked-source-proofs.json" "$QUALIFICATION/subset-proofs.json"
          sha256sum --check "$QUALIFICATION/candidate-source-sha256.txt"
          git diff --exit-code
      - name: Check behavioral reports and publish clean source on a fresh branch only
        run: |
          set -euo pipefail
          set +e
          git ls-remote --exit-code --heads origin "refs/heads/$TARGET_BRANCH" > "$RUNNER_TEMP/target-ref.txt"
          found=$?
          set -e
          test "$found" = 2
          git switch -c "$TARGET_BRANCH"
          python3 "$RUNNER_TEMP/publish_record.py"
          python3 - <<'PYFIX'
          import hashlib, json
          from pathlib import Path
          p = Path('docs/experiments/evidence/bend-subset-source-laws/hosted-material-build-identity.txt')
          data = p.read_bytes()
          p.with_suffix('.json').write_text(json.dumps({'original_filename': p.name, 'original_sha256': hashlib.sha256(data).hexdigest(), 'raw_text': data.decode()}, indent=2) + '\n')
          p.unlink()
          r = Path('docs/experiments/2026-09-21-bend-subset-source-laws.md')
          r.write_text(r.read_text() + '\nPublication attempt 35627954139 passed evidence validation and source rechecks but stopped before committing because the copied raw build-identity log contains trailing whitespace. The build-identity record is now stored as a JSON string with its original SHA-256, preserving every original byte while leaving the normal Git whitespace check enabled. No implementation, proof, compiler or qualification result was changed.\n')
          PYFIX
          git add docs/experiments/2026-09-21-bend-subset-source-laws.md docs/bend_migration_proofs.md docs/experiments/evidence/bend-subset-source-laws
          git diff --cached --check
          sha256sum --check "$QUALIFICATION/candidate-source-sha256.txt"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'native: prove initial production subset laws and qualify table refinement tests'
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          git log -1 --format='%H%n%s' | tee "$EVIDENCE/published-commit.txt"
          printf '%s\n' "$TARGET_BRANCH" > "$EVIDENCE/published-branch.txt"
          git ls-tree -r HEAD native/bend_engine/standalone > "$EVIDENCE/published-source-blobs.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bend-subset-laws-publication
          path: ${{ runner.temp }}/subset-publication/
          retention-days: 30
