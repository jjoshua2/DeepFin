name: Verify final Bend stack
on:
  push:
    branches: [fix/bend-pr792-reconcile-audit-20260921]
    paths: [.github/workflows/bend-pr792-reconcile-audit.yml]
permissions:
  contents: read
  actions: read
  pull-requests: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 00087945cae1e1634c921b8e88b4e020a8c28a81
          fetch-depth: 0
          persist-credentials: false
      - name: Inspect exact source preservation and the current dependency graph
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/bend-stack-final
          python - <<'PY'
          import datetime, json, os, subprocess, urllib.parse, urllib.request
          from pathlib import Path
          out = Path('/tmp/bend-stack-final')
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          def get(path):
              req = urllib.request.Request('https://api.github.com/repos/jjoshua2/DeepFin/' + path,
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.load(r)
          def entries(ref):
              result = {}
              for line in git('ls-tree', '-r', ref).splitlines():
                  attrs, path = line.split('\t', 1)
                  result[path] = attrs.split()
              return result
          head = '00087945cae1e1634c921b8e88b4e020a8c28a81'
          old = '018d2e2938c8dac617df430cfdf5057c55c0784f'
          base = '8b4baa1e5cc5eaf7d97389c4ca0158faa7cd0988'
          assert git('show', '-s', '--format=%P', head).split() == [old, base]
          assert git('rev-parse', head+'^{tree}') == '74d8d736248defce537b726c549a435f6d7b7e56'
          features = set(git('diff','--name-only','10dc757b3ff06ba9b37008c3d94d61105eebc74a','3b6047ddfc08d9aed43da37aff8f2db218f84d98').splitlines())
          assert len(features) == 9
          actual, prior, parent = entries(head), entries(old), entries(base)
          assert set(actual) == set(parent) | features
          assert set(git('diff','--name-only',base,head).splitlines()) == features
          for p,row in actual.items():
              assert row == (prior if p in features else parent)[p], p
          subprocess.run(['git','diff','--check',old,head],check=True)
          (out/'uci-publication.json').write_text(json.dumps({'head':head,'parents':[old,base],
              'tree':git('rev-parse',head+'^{tree}'),'feature_paths':sorted(features),
              'all_feature_blobs_preserved':True,'all_other_entries_equal_parent':True},indent=2)+'\n')
          prs = []
          for page in range(1,11):
              batch = get(f'pulls?state=open&per_page=100&page={page}')
              prs.extend(p for p in batch if 'bend' in p['title'].lower() or 'bend' in p['head']['ref'].lower())
              if len(batch)<100: break
          else: raise RuntimeError('incomplete PR listing')
          report = {'as_of':datetime.datetime.now(datetime.timezone.utc).isoformat(),'prs':[]}
          for item in sorted(prs,key=lambda p:p['number']):
              p = get(f"pulls/{item['number']}")
              h = p['head']['sha']
              b = get('git/ref/heads/'+urllib.parse.quote(p['base']['ref'],safe='/'))['object']['sha']
              row = {'number':p['number'],'head':h,'branch':p['head']['ref'],'base':p['base']['ref'],
                  'base_ref_sha':b,'github_mergeable':p['mergeable'],'checks':[]}
              subprocess.run(['git','fetch','--no-tags','https://github.com/jjoshua2/DeepFin.git',h,b],check=True)
              merge = subprocess.run(['git','merge-tree','--write-tree','--messages',h,b],text=True,capture_output=True,check=False)
              assert merge.returncode in (0,1),merge.stderr
              row['local_merge_clean'] = merge.returncode == 0
              if merge.returncode:
                  (out/f"conflict-{p['number']}.txt").write_text(merge.stdout+'\n'+merge.stderr)
              seen = set()
              runs = get('actions/runs?event=pull_request&per_page=100&head_sha='+h)['workflow_runs']
              for run in sorted(runs,key=lambda r:r['id'],reverse=True):
                  if run['workflow_id'] in seen:continue
                  seen.add(run['workflow_id'])
                  check = {k:run[k] for k in ('id','name','status','conclusion','run_attempt')}
                  if run['conclusion']=='failure':
                      jobs = get(f"actions/runs/{run['id']}/jobs?per_page=100")['jobs']
                      check['failures'] = [{'id':j['id'],'name':j['name'],'steps':[s['name'] for s in j['steps'] if s['conclusion']=='failure']} for j in jobs if j['conclusion']=='failure']
                  row['checks'].append(check)
              row['all_observed_workflows_green'] = bool(row['checks']) and all(c['status']=='completed' and c['conclusion']=='success' for c in row['checks'])
              report['prs'].append(row)
              (out/'status.json').write_text(json.dumps(report,indent=2)+'\n')
              print(row['number'],h,row['local_merge_clean'],[(c['name'],c['status'],c['conclusion'],c.get('failures')) for c in row['checks']],flush=True)
          report['finished_at'] = datetime.datetime.now(datetime.timezone.utc).isoformat()
          report['all_open_bend_merges_clean'] = bool(report['prs']) and all(p['local_merge_clean'] for p in report['prs'])
          (out/'status.json').write_text(json.dumps(report,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bend-stack-final-status
          path: /tmp/bend-stack-final/
          retention-days: 14
