name: Apply S1 lazy eval

on:
  push:
    branches: [perf/nnue-lazy-eval]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/nnue-lazy-eval
          fetch-depth: 0
      - name: Disambiguate the one repeated allocator fragment
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/_apply_nnue_lazy_pr.py')
          s = p.read_text()
          helper = '''\n\ndef replace_first(path: str, old: str, new: str) -> None:\n    text = read(path)\n    if old not in text:\n        raise RuntimeError(f"{path}: first-match fragment not found: {old[:80]!r}")\n    write(path, text.replace(old, new, 1))\n'''
          s = s.replace('\n\ndef replace_function(path: str, marker: str, new_func: str) -> None:\n', helper + '\n\ndef replace_function(path: str, marker: str, new_func: str) -> None:\n', 1)
          lines = s.splitlines()
          # Original guarded failure identifies this call exactly. It is the release()
          # block; the later identical free block is the grow/reallocation path and is
          # patched separately with its assignment tail as part of the match.
          target = 117
          if not lines[target].strip().startswith('replace_once('):
              raise RuntimeError(f'unexpected transformer line {target + 1}: {lines[target]!r}')
          lines[target] = lines[target].replace('replace_once(', 'replace_first(', 1)
          p.write_text('\n'.join(lines) + '\n')
          PY
      - name: Apply guarded patch
        run: python3 scripts/_apply_nnue_lazy_pr.py
      - name: Remove bootstrap files
        run: |
          rm scripts/_apply_nnue_lazy_pr.py
          rm .github/workflows/apply-nnue-lazy.yml
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "nnue: add default-off S1 lazy DAG evaluation"
          git push origin HEAD:perf/nnue-lazy-eval
