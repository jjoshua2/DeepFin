name: Apply S1 lazy eval

on:
  push:
    branches: [perf/nnue-lazy-eval]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/nnue-lazy-eval
          fetch-depth: 0
      - name: Normalize guarded patch anchors
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/_apply_nnue_lazy_pr.py')
          s = p.read_text()

          helper = '''\n\ndef replace_first(path: str, old: str, new: str) -> None:\n    text = read(path)\n    if old not in text:\n        raise RuntimeError(f"{path}: first-match fragment not found: {old[:80]!r}")\n    write(path, text.replace(old, new, 1))\n'''
          anchor = '\n\ndef replace_function(path: str, marker: str, new_func: str) -> None:\n'
          if anchor not in s:
              raise RuntimeError('replace_function anchor missing')
          s = s.replace(anchor, helper + anchor, 1)

          call_prefix = '''replace_once(\n    store_h,\n    """    free(h->states);\\n    free(h->values);\\n    free(h->value_valid);\\n    free(h->quiet_bits);\\n""",'''
          if s.count(call_prefix) != 1:
              raise RuntimeError(f'expected one transformer call, got {s.count(call_prefix)}')
          idx = s.find(call_prefix)
          s = s[:idx] + s[idx:].replace('replace_once(', 'replace_first(', 1)

          old_anchor = '''static int g_arm_dag_node_cap         = CAE_QSEARCH_DEFAULT_DAG_NODE_CAP;\\n\\n/* FastQ's §6 knobs.\\n'''
          new_anchor = '''static int g_arm_dag_node_cap         = CAE_QSEARCH_DEFAULT_DAG_NODE_CAP;\\n\\n/* FastQ's §6 knobs.'''
          if s.count(old_anchor) != 1:
              raise RuntimeError(f'expected one arm old anchor, got {s.count(old_anchor)}')
          s = s.replace(old_anchor, new_anchor, 1)
          old_tail = '''\\n\\n/* FastQ's §6 knobs.\\n""",\n)'''
          new_tail = '''\\n\\n/* FastQ's §6 knobs.""",\n)'''
          if s.count(old_tail) != 1:
              raise RuntimeError(f'expected one arm replacement tail, got {s.count(old_tail)}')
          s = s.replace(old_tail, new_tail, 1)

          old_marker = '"static void cae_qsearch_note_intern(\\n",'
          new_marker = '"static void cae_qsearch_note_intern(",'
          if s.count(old_marker) != 1:
              raise RuntimeError(f'expected one qsearch note marker, got {s.count(old_marker)}')
          s = s.replace(old_marker, new_marker, 1)

          p.write_text(s)
          PY
      - name: Apply guarded patch
        run: python3 scripts/_apply_nnue_lazy_pr.py
      - name: Remove bootstrap files
        run: |
          rm scripts/_apply_nnue_lazy_pr.py
          rm .github/workflows/apply-nnue-lazy.yml
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "nnue: add default-off S1 lazy DAG evaluation"
          git push origin HEAD:perf/nnue-lazy-eval
