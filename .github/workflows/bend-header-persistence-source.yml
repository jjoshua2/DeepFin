name: Recover header persistence baseline
'on':
  push:
    branches: [feat/bend-header-persistence-dev-20260923]
    paths: [.github/workflows/bend-header-persistence-source.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a2bb4ddd10868adadea9c7cd39c79030f5263940
          persist-credentials: false
      - name: Archive exact source and commit without running the engine
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/header-source"
          git archive --format=tar HEAD | gzip > "$RUNNER_TEMP/header-source/source.tar.gz"
          git cat-file commit HEAD > "$RUNNER_TEMP/header-source/commit.raw"
          git rev-parse HEAD^{tree} > "$RUNNER_TEMP/header-source/tree.txt"
          cd "$RUNNER_TEMP/header-source"
          sha256sum source.tar.gz commit.raw > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: bend-header-persistence-baseline
          path: ${{ runner.temp }}/header-source/
          retention-days: 3
