name: Generator followup and saved-proof reconciliation
'on':
  push:
    branches: [dev/bend-generator-followup-qualification-20260927]
    paths: [.github/workflows/generator-followup-qualification.yml]
permissions:
  contents: write
  actions: read
defaults:
  run:
    shell: bash
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      BEND_NO_TELEMETRY: '1'
      TERM: dumb
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      BASE: 83045b38c499ecaf945d6df56da68dd1b8ee2e80
      TARGET: feat/bend-generator-table-preservation-20260927
      BUN: bun
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 83045b38c499ecaf945d6df56da68dd1b8ee2e80
      - uses: actions/checkout@v4
        with:
          repository: jjoshua2/bend
          ref: aaeb9bc91ff0ff0b3f58dba6a9744c6607e167ae
          path: .compiler
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Recover exact candidate and verify active and archived identities
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          export EVIDENCE="$RUNNER_TEMP/followup-evidence"
          mkdir -p "$EVIDENCE"
          echo "EVIDENCE=$EVIDENCE" >> "$GITHUB_ENV"
          test "$(git rev-parse HEAD)" = "$BASE"
          test "$(git ls-remote origin refs/heads/$TARGET | cut -f1)" = "$BASE"
          : > "$RUNNER_TEMP/payload.xz"
          for sha in 4d6035704d001161716b98895ae31f063a3b2a6a 83604e84100d0a1260ac61024eb0a75202b97645 8f5a3afe4a4e490c88d0c7d8b1eecbcc03211f18 050a98ced08a96246d655867a653f59fdcbb3d6f 498bb62c0fa24652e033926c9d7c900b10454053 341fd9dc0fb4854663ffce0819f1a7bd1f8db30b 143877d25a2bdf4af5844c6d067e552f7c4e8612 697581aa21735e75ce24f6c5a7a5442621ea04cb; do
            gh api "repos/jjoshua2/DeepFin/git/blobs/$sha" --jq .content | base64 --decode > "$RUNNER_TEMP/$sha"
            test "$(git hash-object "$RUNNER_TEMP/$sha")" = "$sha"
            cat "$RUNNER_TEMP/$sha" >> "$RUNNER_TEMP/payload.xz"
          done
          test "$(git hash-object "$RUNNER_TEMP/payload.xz")" = 76141d8022c5f8f014fba3d78ea121b95a2cd425
          gh api repos/jjoshua2/DeepFin/actions/jobs/108644742370 > "$EVIDENCE/parent-job.json"
          python3 - <<'PY'
          import hashlib,json,lzma,os,subprocess
          from pathlib import Path
          e=Path(os.environ['EVIDENCE']);t=Path(os.environ['RUNNER_TEMP'])
          def git(*a):return subprocess.check_output(['git',*a],text=True).strip()
          def digest(p):return hashlib.sha256(p.read_bytes()).hexdigest()
          assert git('rev-parse','HEAD^{tree}')=='6ca4c984377e9c3c3cc73b05f12ba33bb89568b7'
          parent=Path('docs/experiments/evidence/bend-generator-table-preservation')
          inherited=json.loads((parent/'hosted-source-identity.json').read_text())['candidate_source_sha256s']
          assert len(inherited)==634
          for p,h in inherited.items():assert digest(Path(p))==h,p
          j=json.loads((e/'parent-job.json').read_text())
          assert j['id']==108644742370 and j['run_id']==36328129634 and j['status']=='completed' and j['conclusion']=='success'
          raw=lzma.decompress((t/'payload.xz').read_bytes(),memlimit=256*1024*1024)
          assert len(raw)==181487 and hashlib.sha256(raw).hexdigest()=='5ee944bf417de2f759a137e8a4e59623d5c8563671b793329236f528bdb91670'
          data=json.loads(raw)
          patch=t/'docs.patch';patch.write_text(data['modified_docs_patch'])
          subprocess.run(['git','apply','--check',str(patch)],check=True)
          subprocess.run(['git','apply','--index',str(patch)],check=True)
          archive=Path('docs/experiments/evidence/bend-table-preservation-continuation/saved-a67267f9')
          for name,text in data['new_files'].items():
              p=Path(name);assert not p.is_absolute() and '..' not in p.parts and not p.exists(),name
              assert name.startswith('native/bend_engine/standalone/proofs/generator_followup/') or name.startswith('docs/experiments/evidence/bend-table-preservation-continuation/') or name=='docs/experiments/2026-09-27-bend-generator-followup.md',name
              p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(text.encode())
          for name,item in data['derived'].items():
              p=Path(name);assert p.parent==archive and p.name in {'original-source-identity.json','original-local-focused.json'} and not p.exists()
              obj=item['object'];key=item['key'];names=obj[key];assert isinstance(names,list) and len(names)==len(set(names))
              hashes={}
              for f in names:
                  full=item['prefix']+f
                  target=archive/'source'/(Path(full).name+'.txt') if full.startswith('native/bend_engine/standalone/proofs/table_preservation/') else Path(full)
                  hashes[f]=digest(target)
              obj[key]=hashes
              restored=(json.dumps(obj,indent=2)+'\n').encode();assert hashlib.sha256(restored).hexdigest()==item['expected_sha256']
              p.write_bytes(restored)
          manifest=json.loads((archive/'archive-manifest.json').read_text())
          assert manifest['primary_files']==14 and manifest['new_active_laws_from_archive']==0
          for name,item in manifest['entries'].items():assert digest(archive/name)==item['sha256'],name
          paths=[*data['new_files'],*data['derived']]
          subprocess.run(['git','add','-f','--',*paths],check=True)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          assert git('write-tree')=='4b4e9b2729822b2bb91f05ff691985ddf333fcb1'
          changed=git('diff','--cached','--name-only').splitlines();assert len(changed)==41
          for p,h in inherited.items():assert digest(Path(p))==h,p
          hashes={p:digest(Path(p)) for p in git('ls-files','native/bend_engine').splitlines() if Path(p).is_file()};assert len(hashes)==643
          identity={'base':os.environ['BASE'],'source_tree':git('write-tree'),'changed_files':changed,'candidate_source_sha256s':hashes,'inherited_source_entries':634,'new_primary_files':9,'archived_primary_files':14,'saved_commit':'a67267f9832abb843e1230fc619533122833e718','saved_implementation_replaces_active':False,'payload_sha256':hashlib.sha256(raw).hexdigest()}
          (e/'source-identity.json').write_text(json.dumps(identity,indent=2)+'\n')
          PY
          bun native/bend_engine/standalone/verify_compiler.js "$PWD/.compiler" | tee "$EVIDENCE/compiler-identity.txt"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'proof: compose post-generation geometric checks and preserve saved alternative'
          echo "SOURCE=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          git cat-file commit HEAD > "$EVIDENCE/source-commit.raw"
      - name: Check complete new two-law composition and all fifteen controls
        run: |
          set -euo pipefail
          python3 native/bend_engine/standalone/proofs/generator_followup/focused.py "$PWD/.compiler" --report "$EVIDENCE/focused.json" 2>&1 | tee "$EVIDENCE/focused.log"
      - name: Restore and recheck the saved three-law source suite separately
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,shutil,subprocess,tempfile
          from pathlib import Path
          root=Path.cwd();e=Path(os.environ['EVIDENCE'])
          archive=root/'docs/experiments/evidence/bend-table-preservation-continuation/saved-a67267f9'
          with tempfile.TemporaryDirectory(prefix='saved-preservation-',dir=os.environ['RUNNER_TEMP']) as td:
              engine=Path(td)/'engine';shutil.copytree(root/'native/bend_engine',engine,symlinks=True)
              suite=engine/'standalone/proofs/table_preservation';shutil.rmtree(suite);suite.mkdir()
              for p in (archive/'source').iterdir():
                  assert p.is_file() and p.name.endswith('.txt')
                  (suite/p.name[:-4]).write_bytes(p.read_bytes())
              report=e/'saved-restored-focused.json'
              result=subprocess.run(['python3',str(suite/'focused.py'),str(root/'.compiler'),'--report',str(report)],capture_output=True,timeout=480,check=False)
              (e/'saved-restored-focused.log').write_bytes(result.stdout+result.stderr)
              assert result.returncode==0,(result.returncode,result.stderr[-3000:])
              checked=json.loads(report.read_text());old=json.loads((archive/'original-local-focused.json').read_text())
              assert checked['focused_gate']=='PASS' and checked['new_laws']==3 and checked['new_controls']==17
              assert checked['source_sha256s']==old['source_sha256s']
              assert len(checked['negative_controls'])==17 and all(x['rejected'] for x in checked['negative_controls'])
          PY
      - name: Compare follow-up checks and exact generated lists in four native modes
        env:
          CC: /usr/bin/clang
        run: |
          set -euo pipefail
          python3 native/bend_engine/standalone/proofs/generator_followup/verify_native.py "$PWD/.compiler" --report "$EVIDENCE/native.json" 2>&1 | tee "$EVIDENCE/native.log"
      - name: Recheck compiler source and pin tests
        run: |
          set -euo pipefail
          bun test native/bend_engine/standalone/verify_compiler.test.js 2>&1 | tee "$EVIDENCE/pin.log"
          (cd .compiler && bun tests/run/u64_proofs.js) | tee "$EVIDENCE/compiler-proofs.json"
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.10'
          enable-cache: false
      - name: Install locked CPU tools and run configured whole-repository lint
        run: |
          set -euo pipefail
          uv sync --locked --extra dev --extra cpu
          .venv/bin/python -c 'import torch; assert torch.version.cuda is None'
          export PATH="$PWD/.venv/bin:$PATH"
          ./scripts/lint.sh 2>&1 | tee "$EVIDENCE/lint.log"
      - name: Verify results and fast-forward the existing PR branch
        run: |
          set -euo pipefail
          git diff --exit-code
          test "$(git rev-parse HEAD)" = "$SOURCE"
          test "$(git ls-remote origin refs/heads/$TARGET | cut -f1)" = "$BASE"
          python3 - <<'PY'
          from collections import Counter
          import hashlib,json,os,shutil
          from pathlib import Path
          e=Path(os.environ['EVIDENCE']);d=Path('docs/experiments/evidence/bend-table-preservation-continuation')
          def read(p):return json.loads(p.read_text())
          ident=read(e/'source-identity.json');f=read(e/'focused.json');n=read(e/'native.json');saved=read(e/'saved-restored-focused.json')
          for p,h in ident['candidate_source_sha256s'].items():assert hashlib.sha256(Path(p).read_bytes()).hexdigest()==h,p
          assert f['focused_gate']=='PASS' and f['controls_gate']=='PASS' and f['new_law_count']==2 and f['new_control_count']==15
          assert f['consumer']['exit_code']==0 and f['consumer']['raw_text'].strip()=='All terms check.'
          assert len(f['negative_controls'])==15 and all(c['rejected'] for c in f['negative_controls'])
          kinds=Counter(c['kind'] for c in f['negative_controls']);assert kinds=={'source semantic/refinement':6,'manifest/import policy':8,'synthetic output-wrapper unit':1}
          assert n['native_gate']=='PASS' and n['base_requests']==184 and n['initialization_contexts']==2 and n['requests_per_mode']==368
          assert len(n['modes'])==4 and all(m['invalid_rejections']==8 and m['marker_reads']==6 for m in n['modes'])
          assert len(n['mutations'])==4 and all(m['compiled_and_executed'] and m['rejected'] for m in n['mutations'])
          local=read(d/'local-followup-native.json')
          assert {k:v for k,v in n.items() if k!='cc'}=={k:v for k,v in local.items() if k!='cc'}
          assert saved['focused_gate']=='PASS' and saved['new_laws']==3 and saved['new_controls']==17
          assert read(e/'compiler-proofs.json')['proof_gate']=='PASS'
          assert '12 pass' in (e/'pin.log').read_text() and '0 fail' in (e/'pin.log').read_text()
          assert (e/'lint.log').read_text().strip().endswith('lint: OK')
          for name in ['source-identity.json','focused.json','native.json','saved-restored-focused.json','compiler-proofs.json','parent-job.json']:
              dst=d/('hosted-'+name);assert not dst.exists();shutil.copyfile(e/name,dst)
          for name in ['pin.log','lint.log','compiler-identity.txt']:
              raw=(e/name).read_bytes();(d/('hosted-'+name+'.json')).write_text(json.dumps({'sha256':hashlib.sha256(raw).hexdigest(),'raw_text':raw.decode()},indent=2)+'\n')
          q={'qualification':'PASS','run':os.environ['GITHUB_RUN_ID'],'source':os.environ['SOURCE'],'source_tree':ident['source_tree'],'new_laws':2,'new_controls':15,'control_categories':dict(kinds),'retained_active_parent_laws':198,'retained_active_parent_controls':640,'modular_laws':200,'modular_controls':655,'combined_wrapper_executed':False,'saved_alternative_laws_counted_again':0,'saved_alternative_source_rerun':True,'saved_alternative_native_rerun':False,'native_source_entries':643,'independent_review':False,'full_accepted_castling_safety_claimed':False}
          (d/'hosted-qualification.json').write_text(json.dumps(q,indent=2)+'\n')
          summary=f"Hosted run **{os.environ['GITHUB_RUN_ID']}** passed the complete two-law consumer and15 controls, separately restored saved3-law/17-control gate, four native modes and four executable adapter corruptions, original compiler/pin gates and unchanged configured repository lint on source `{os.environ['SOURCE']}`."
          text=[
            '## Completed hosted qualification',summary,
            'The generic result transports an actual subsequent in_check through full legal_moves table preservation while retaining the exact generated list. The initialized law gives the complete initialized array, that same generated list and an independent target-centred geometric check at a separately selected singleton king. It does not certify the generated move set or the generator internal safety decisions.',
            'The query Board and generation Board are independent. Source generation accepts arbitrary Board/Array values; the initialized follow-up adds only the documented table-construction and query-king/side/bounds premises. Native fixtures use bounded complete arrays and selected singleton query kings. Native safety for arbitrary ragged arrays or malformed generation Boards is not implied.',
            'Each of four native modes passes368 requests (184 base tuples times two initialization contexts), comparing an actual follow-up check independently and the complete ordered move list differentially. Each request deliberately executes a baseline generator and a second generator inside the adapter; counts are not distinct legal games. All query Boards differ from the generation Board and raw query turn is opposite the explicitly selected check side. Six unused-slot reads per mode observe retained state; they are not full-buffer/lifetime qualification.',
            'Actual adapter corruptions discard its returned table, invert the check side, discard generated moves or query the generation Board. All four compile/execute under generic flags before incorrect observations reject them. No production bug is claimed. Six source refinements exercise the small transport proof, eight controls protect inventories/imports and one synthetic warning-output check is not a compiler execution. Crashes,timeouts,missing imports and ownership errors do not count as semantic rejection.',
            'All14 primary files from saved alternative a67267f9832abb843e1230fc619533122833e718 remain byte-identical in the inactive archive. Its exact three-law source suite and all17 controls were restored and rerun in isolation; the complete47-entry focused manifest matches the original. Its original native run is retained, not rerun. The active five-law suite is unchanged and no saved laws/controls are added again to active totals.',
            'Two large archived source-hash manifests were restored from original metadata/key order and original source bytes, then their full original file SHA256 values were checked. The selected archive does not claim to reproduce the entire saved28-file commit or replace the user review ZIP/bundle. All634 active parent source entries and643 candidate entries match. The native report matches the local completed report except compiler identity.',
            'The first local consumer was intentionally stopped after an incorrect Equal.apply reference was identified; the corrected invocation was later killed with no result during overlapping native work. Both records remain failures/unqualified. Hosted heavy checks ran serially on unchanged source; no prior theorem or compiler was weakened. The original saved missing-tools lint receipt remains unchanged; hosted configured lint is a separate current-source result.',
            'Active coverage is modular200 laws/655 controls, retaining198/640 from #910 plus2/15. The full aggregate wrapper was not executed. Existing active parent source/native qualification was retained by exact source and successful parent job, not relabeled as a fresh full parent rerun. This evidence successor changes documentation only.',
            'Self-review only, not independent review. No production function, previous law, compiler input, permanent workflow, Python responsibility, model/GPU, training, search, benchmark, perft increase, merge,force push or deployment. Pinned checker/Base,native lowering/storage,ABI,toolchain,OS and hardware remain trust boundaries. Full accepted-castling safety and universal attack-direction correspondence remain separate.'
          ]
          rec=Path('docs/experiments/2026-09-27-bend-generator-followup.md');rec.write_text(rec.read_text()+'\n\n'+'\n\n'.join(text)+'\n')
          m=Path('docs/bend_migration_proofs.md');s=m.read_text();anchor='## Post-generation query composition candidate\n\n';assert s.count(anchor)==1
          m.write_text(s.replace(anchor,'## Qualified post-generation query composition\n\n'+summary+'\n\nActive modular coverage is200/655; no full aggregate execution or duplicate alternative-suite count.\n\n',1))
          PY
          git diff --check
          git diff --exit-code -- native
          git add docs/experiments docs/bend_migration_proofs.md
          git commit -m 'docs: qualify post-generation check composition and saved-source reconciliation'
          git push origin "HEAD:refs/heads/$TARGET"
      - name: Archive exact source and all available receipts
        if: always()
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/followup-final"
          git archive --format=tar HEAD | gzip > "$RUNNER_TEMP/followup-final/source.tar.gz"
          git cat-file commit HEAD > "$RUNNER_TEMP/followup-final/commit.raw"
          git rev-parse HEAD > "$RUNNER_TEMP/followup-final/commit.txt"
          git rev-parse HEAD^{tree} > "$RUNNER_TEMP/followup-final/tree.txt"
          if test -d "$RUNNER_TEMP/followup-evidence"; then cp -r "$RUNNER_TEMP/followup-evidence" "$RUNNER_TEMP/followup-final/reports"; fi
          git diff --binary "$BASE" HEAD > "$RUNNER_TEMP/followup-final/continuation.patch"
          cd "$RUNNER_TEMP/followup-final"
          sha256sum source.tar.gz commit.raw continuation.patch > SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: generator-followup-qualification
          path: ${{ runner.temp }}/followup-final/
          retention-days: 14
