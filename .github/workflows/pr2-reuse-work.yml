name: PR2 native reuse qualification
on:
  push:
    branches: [work/pr2-native-reuse-20260922]
permissions:
  contents: write
  actions: read
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: .
      CAE_TEST_THREADS: '2'
      OMP_NUM_THREADS: '2'
      MAX_JOBS: '1'
      TORCHINDUCTOR_COMPILE_THREADS: '1'
      BEND_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ba18279fffdb13beb894e1d4f49cd60601f38583
      - uses: actions/download-artifact@v4
        with:
          name: deepfin-pr2-reuse-validation
          run-id: 35765779079
          github-token: ${{ github.token }}
          path: /tmp/pr2-first
      - uses: actions/download-artifact@v4
        with:
          name: deepfin-pr1-validation
          run-id: 35759888019
          github-token: ${{ github.token }}
          path: /tmp/pr2-prior
      - name: Recover verified source and apply two bounded corrections
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/pr2-final-evidence
          python - <<'PY'
          import base64, hashlib, json, subprocess
          from pathlib import Path
          prior = Path('/tmp/pr2-first')
          evidence = Path('/tmp/pr2-final-evidence')
          data = (prior / 'pr2.patch').read_bytes()
          assert hashlib.sha256(data).hexdigest() == 'ab256f0e21f931667cc92c150b17cf2d6564d8030d9c4d1a8f3fff934aba0b36'
          subprocess.run(['git','apply','--check','-'],input=data,check=True)
          subprocess.run(['git','apply','-'],input=data,check=True)
          expected = json.loads((prior/'source-manifest.json').read_text())
          for name, digest in expected.items():
              assert hashlib.sha256(Path(name).read_bytes()).hexdigest() == digest, name
          def get(sha, digest):
              blob = json.loads(subprocess.check_output(['gh','api',f'repos/jjoshua2/DeepFin/git/blobs/{sha}']))
              code = base64.b64decode(blob['content'])
              assert hashlib.sha256(code).hexdigest() == digest
              return code
          ns = {'p': Path('native/bend_engine/standalone'), 'hashlib': hashlib}
          for sha, digest in [
              ('bb6c5edbf968faf61766cf99fdfc3609a4cbbd59','7cc0643090976485ae08b4cae35135c25ed78958ac5cf9b2cf5e2342b4826f04'),
              ('5b86ba57c1afcbe00b5e5e073c761c79110c2458','eeed9788f452a5a6bb103922089e2b23c4e0f3ce302b636f412899d59b063a6f'),
          ]:
              exec(compile(get(sha, digest), sha, 'exec'), ns)
          expected['native/bend_engine/standalone/verify_reuse.py'] = '562dbb5cc43003ca86fd9de232a45826ff3e4f2a4a8ba73b160ef8b5b8fa6ecb'
          expected['native/bend_engine/standalone/model_bridge.cpp'] = '4483823a620acaf16f48ee6d8aaf84e15e8bc9205c122a69d0a458d74381be75'
          for name, digest in expected.items():
              assert hashlib.sha256(Path(name).read_bytes()).hexdigest() == digest, name
          (evidence/'source-manifest.json').write_text(json.dumps(expected,indent=2)+'\n')
          subprocess.run(['git','add','-N','.'],check=True)
          patch = subprocess.check_output(['git','diff','--binary'])
          assert hashlib.sha256(patch).hexdigest() == '09d4530bb931265aa9585eab7098d5149602a513edea32fb9441e4dfb9a931af'
          (evidence/'pr2.patch').write_bytes(patch)
          (evidence/'screen.py').write_bytes(get('0240837c1c37a1c13841f8c2c779a3bb6eef5eb5','bcb00ae7817be63b2d6224cb25b9839e499b91c599c1ab5af5af43ba09c38eac'))
          PY
          git diff --check
          git diff --stat | tee /tmp/pr2-final-evidence/diff-stat.txt
          tar -xzf /tmp/pr2-first/native-build.tar.gz -C /tmp
          tar -xzf /tmp/pr2-prior/native-build.tar.gz -C /tmp
          sha256sum -c /tmp/pr2-first/neural-build.txt
          echo '9654a1e334fb5f875d164b82068846bfeab3df2ef2a994737e44789c2623ee6e  /tmp/pr1-model/fixture.pt2' | sha256sum -c -
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@v7
        with:
          version: 0.12.10
      - name: Locked CPU dependencies
        run: |
          uv sync --locked --extra dev --extra cpu
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Final static gates and audit failure controls
        run: |
          set -o pipefail
          bash scripts/lint.sh 2>&1 | tee /tmp/pr2-final-evidence/lint.txt
          bash scripts/lint.sh native/bend_engine/standalone/verify_reuse.py native/bend_engine/standalone/verify_buffers.py native/bend_engine/standalone/verify_neural.py 2>&1 | tee /tmp/pr2-final-evidence/native-lint.txt
          python - <<'PY'
          import json
          from pathlib import Path
          from types import SimpleNamespace
          from unittest.mock import patch
          from native.bend_engine.standalone.verify_reuse import AuditClient, Client
          good='native-buffer-audit calls=42 input_changes=0 output_changes=0 input_tensor_allocations=1\n'
          cases=[(0,[good],True),(2,[good],False),(0,[good,'error\n'],False),(0,[],False),(0,['bad\n'],False),(0,[good,good],False)]
          for status, errors, allowed in cases:
              obj=object.__new__(AuditClient)
              obj.proc=SimpleNamespace(returncode=status)
              obj.errors=errors
              with patch.object(Client,'close',side_effect=AssertionError('original shutdown guard')):
                  try:
                      obj.close()
                  except AssertionError:
                      assert not allowed
                  else:
                      assert allowed
          Path('/tmp/pr2-final-evidence/audit-controls.json').write_text(json.dumps({'status':'passed','cases':len(cases)})+'\n')
          PY
      - name: Rebuild final bridge without regenerating unchanged Bend C
        run: |
          set -o pipefail
          python -c 'import sys,torch; print(sys.version,torch.__version__); assert torch.__version__=="2.14.0+cpu"' | tee /tmp/pr2-final-evidence/runtime.txt
          lscpu > /tmp/pr2-final-evidence/cpu.txt
          prefix="$(python -c 'import torch; print(torch.utils.cmake_prefix_path)')"
          cmake -S native/bend_engine/standalone -B /tmp/pr2-final-native -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_PREFIX_PATH="$prefix" -DBEND_GENERATED_C=/tmp/pr2-native/engine.c -DBEND_CONTRACT_DIR=/tmp/pr2-native
          cmake --build /tmp/pr2-final-native --parallel 1 2>&1 | tee /tmp/pr2-final-evidence/build.txt
          sha256sum /tmp/pr2-native/engine.c /tmp/pr2-final-native/deepfin-bend-neural > /tmp/pr2-final-evidence/neural-build.txt
          ldd /tmp/pr2-final-native/deepfin-bend-neural > /tmp/pr2-final-evidence/libraries.txt
          if grep -qi libpython /tmp/pr2-final-evidence/libraries.txt; then exit 2; fi
      - name: Actual final neural parity and repeated-buffer qualification
        run: |
          set -o pipefail
          clang -std=c11 -O3 -DLEGAL_ORACLE -I "$PWD" native/bend_engine/legal_probe/support.c -pthread -lm -o /tmp/pr2-oracle
          python -m native.bend_engine.standalone.verify_neural --checkpoint /tmp/pr1-model/fixture.pt --package /tmp/pr1-model/fixture.pt2 --oracle /tmp/pr2-oracle --report /tmp/pr2-final-evidence/neural.json --command /tmp/pr2-final-native/deepfin-bend-neural --threads 1 | tee /tmp/pr2-final-evidence/neural.txt
          python -m native.bend_engine.standalone.verify_reuse --package /tmp/pr1-model/fixture.pt2 --reference /tmp/pr2-final-evidence/neural.json --report /tmp/pr2-final-evidence/reuse.json --command /tmp/pr2-final-native/deepfin-bend-neural --threads 1 | tee /tmp/pr2-final-evidence/reuse.txt
      - name: Bounded fixed-evaluation and wall-time descriptive screen
        run: |
          set -o pipefail
          python /tmp/pr2-final-evidence/screen.py | tee /tmp/pr2-final-evidence/screen.txt
      - name: Publish clean feature branch
        id: publish
        run: |
          git diff --check
          git switch -c feat/native-buffer-reuse-20260922
          git add docs/experiments/2026-09-22-native-buffer-reuse.md docs/experiments/README.md native/bend_engine/standalone
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'native: reuse policy maps and bounded inference buffers'
          git push origin HEAD:refs/heads/feat/native-buffer-reuse-20260922
          git rev-parse HEAD | tee /tmp/pr2-final-evidence/published-head.txt
      - name: Preserve final generated executable for bounded reproduction
        if: always()
        run: |
          if test -f /tmp/pr2-final-native/deepfin-bend-neural; then
            tar -C /tmp -czf /tmp/pr2-final-evidence/final-build.tar.gz pr2-native/engine.c pr2-native/model_contract.h pr2-native/model-binding.json pr2-final-native/deepfin-bend-neural
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deepfin-pr2-reuse-final
          path: /tmp/pr2-final-evidence
          retention-days: 30
      - name: Require successful qualification and publication
        if: always()
        env:
          PUBLISHED: ${{ steps.publish.outcome }}
        run: test "$PUBLISHED" = success
