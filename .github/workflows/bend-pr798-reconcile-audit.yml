name: Bend downstream reconciliation audit
on:
  push:
    branches: [fix/bend-pr798-ci-reconcile-20260921]
    paths: [.github/workflows/bend-pr798-reconcile-audit.yml]
permissions:
  contents: read
  pull-requests: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cb2f23d4d8732c868c8db02704c8025df087d9b1
          fetch-depth: 0
          persist-credentials: false
      - name: Snapshot exact downstream heads without mutating them
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/bend-downstream-review
          python - <<'PY'
          import datetime, json, os, subprocess, urllib.parse, urllib.request
          from pathlib import Path
          out=Path('/tmp/bend-downstream-review')
          def get(path):
              req=urllib.request.Request('https://api.github.com/repos/jjoshua2/DeepFin/'+path,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(req,timeout=30) as r:return json.load(r)
          rows=[];refs={'refs/audit/reconciled798':'cb2f23d4d8732c868c8db02704c8025df087d9b1'}
          for n in range(799,808):
              p=get(f'pulls/{n}')
              base=get('git/ref/heads/'+urllib.parse.quote(p['base']['ref'],safe='/'))['object']['sha']
              assert p['state']=='open' and p['head']['repo']['full_name']=='jjoshua2/DeepFin',(n,p['state'])
              rows.append({'number':n,'branch':p['head']['ref'],'head':p['head']['sha'],'base_branch':p['base']['ref'],'base':base,'github_mergeable':p['mergeable']})
              refs[f'refs/audit/pr{n}']=p['head']['sha'];refs[f'refs/audit/base{n}']=base
          subprocess.run(['git','fetch','--no-tags','https://github.com/jjoshua2/DeepFin.git',*sorted(set(refs.values()))],check=True)
          for ref,sha in refs.items():subprocess.run(['git','update-ref',ref,sha],check=True)
          subprocess.run(['git','bundle','create',str(out/'review.bundle'),*refs],check=True)
          for p in rows:
              m=subprocess.run(['git','merge-tree','--write-tree','--messages',p['head'],p['base']],text=True,capture_output=True,check=False)
              assert m.returncode in (0,1),m.stderr
              p['merge_clean']=m.returncode==0
              (out/f"merge-{p['number']}.txt").write_text(m.stdout+'\n'+m.stderr)
          report={'as_of':datetime.datetime.now(datetime.timezone.utc).isoformat(),'prs':rows}
          (out/'status.json').write_text(json.dumps(report,indent=2)+'\n')
          print(json.dumps(report,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bend-downstream-reconcile-review
          path: /tmp/bend-downstream-review/
          retention-days: 7
