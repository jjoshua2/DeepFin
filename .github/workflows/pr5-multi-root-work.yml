name: PR5 multi-root workspace
on:
  push:
    branches: [work/pr5-multi-root-20260922]
permissions:
  contents: write
  actions: read
jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: f4fa959be5aa628ebb65fb878100b3e616b98659
      - uses: actions/download-artifact@v4
        with:
          name: deepfin-pr5-cohort-qualification
          run-id: 35805850476
          github-token: ${{ github.token }}
          path: /tmp/pr5-qualified
      - name: Verify qualified source and apply authored readout only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/pr5-docs
          python - <<'PY'
          import base64,hashlib,json,subprocess
          from pathlib import Path
          manifest=json.loads(Path('/tmp/pr5-qualified/source-manifest.json').read_text())
          assert len(manifest)==10
          for path,digest in manifest.items():
              assert hashlib.sha256(Path(path).read_bytes()).hexdigest()==digest,path
          data=json.loads(subprocess.check_output(['gh','api','repos/jjoshua2/DeepFin/git/blobs/c09acc36d96fae40133dc92e1003137c7e48ecad']))
          script=base64.b64decode(data['content'])
          assert hashlib.sha1(b'blob '+str(len(script)).encode()+b'\0'+script).hexdigest()=='c09acc36d96fae40133dc92e1003137c7e48ecad'
          exec(compile(script,'authored-documentation','exec'))
          paths=subprocess.check_output(['git','diff','--name-only']).decode().splitlines()
          expected=['docs/experiments/2026-09-22-native-multi-root.md','docs/experiments/README.md','native/bend_engine/multi_root/README.md']
          assert sorted(paths)==sorted(expected),paths
          for path,digest in manifest.items():
              if not path.endswith('.md'):
                  assert hashlib.sha256(Path(path).read_bytes()).hexdigest()==digest,path
          Path('/tmp/pr5-docs/documentation.patch').write_bytes(subprocess.check_output(['git','diff','--binary']))
          Path('/tmp/pr5-docs/documentation-manifest.json').write_text(json.dumps({p:hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in paths},indent=2))
          PY
          git diff --check
          git diff --stat
      - name: Fast-forward documentation only on the qualified feature branch
        run: |
          set -euo pipefail
          git add docs/experiments/2026-09-22-native-multi-root.md docs/experiments/README.md native/bend_engine/multi_root/README.md
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'docs: record multi-root serial parity and actual CPU batch qualification'
          git push origin HEAD:refs/heads/feat/native-multi-root-20260922
          git rev-parse HEAD | tee /tmp/pr5-docs/published-head.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deepfin-pr5-documentation
          path: /tmp/pr5-docs
          retention-days: 30
