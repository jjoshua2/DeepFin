name: Bend automatic draw confirmation
on:
  push:
    branches: [feat/bend-automatic-draw-leaves-dev]
    paths: ['.github/workflows/bend-draw-confirm.yml']
permissions:
  contents: write
jobs:
  confirm:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          activate-environment: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Apply source-checked draw semantics and typed test peer
        run: |
          echo 'bb0a8b14660548f0e737da95346419cae5ca394f8b2e7c83c7585522f467f56d  .github/draw-core.patch' | sha256sum -c -
          git apply --check .github/draw-core.patch
          git apply .github/draw-core.patch
          python - <<'PY'
          import hashlib
          from pathlib import Path
          expected = {
            'native/bend_engine/session_probe/search_draws.py': 'd0b14786593f172065559337d46a3d463f755e4671cd5e3bb43faa753cf2f0a5',
            'native/bend_engine/session_probe/draw_probe.py': '808a14a3bd50d2defc7f31ee0f4917d33ca5ef1575d9d061d8292273d1e0bee1',
            'tests/test_bend_search_draws.py': '581f4314aa7539601883af72b1536498804105cae7b6f7701e4b95251d0f1bd1',
          }
          for path, sha in expected.items():
              assert hashlib.sha256(Path(path).read_bytes()).hexdigest() == sha, path
          p = Path('tests/test_bend_search_draws.py')
          s = p.read_text()
          for old, new in [('from typing import cast\n', ''), ('    class Peer:\n', '    class Peer(sessions.Peer):\n'), ('Actor(cast(sessions.Peer, peer),', 'Actor(peer,')]:
              assert s.count(old) == 1, old
              s = s.replace(old, new)
          p.write_text(s)
          assert hashlib.sha256(p.read_bytes()).hexdigest() == '0ea7c0cfd5608ba826d6334e5246f13c9d7f3114405406e4c8078e6c0dc0b66f'
          PY
          git diff --check
      - name: Install isolated CPU environment and pinned compiler
        run: |
          uv sync --locked --extra dev --extra cpu
          python -c "import torch; assert torch.version.cuda is None; print(torch.__version__)"
          bash native/bend_engine/bitboard_probe/install_toolchain.sh
      - name: Static and inexpensive regression contracts
        run: |
          status=0
          ruff check native/bend_engine/session_probe/*.py native/bend_engine/neural_probe tests/test_bend_search_draws.py || status=1
          basedpyright native/bend_engine/session_probe/*.py native/bend_engine/neural_probe tests/test_bend_search_draws.py || status=1
          python -m pytest -q tests/test_bend_search_draws.py tests/test_bend_neural_play.py tests/test_bend_qualification.py tests/test_bend_checkpoint.py tests/test_bend_batching.py tests/test_bend_neural_boundary.py tests/test_bend_search_sessions.py tests/test_bend_root_advance.py || status=1
          exit "$status"
      - name: Four-mode terminal draw and original session validation
        run: |
          python -m native.bend_engine.session_probe.draw_probe --report artifacts/bend-draw-leaves.json
      - name: Retained root history regression
        run: |
          python -m native.bend_engine.session_probe.root_probe --modes native --check-encoding --report artifacts/bend-draw-roots.json
      - name: Saved native model and sustained neural play regression
        run: |
          python -m native.bend_engine.neural_probe.checkpoint_probe --fixture-checkpoint --modes native \
            --work-dir /tmp/bend-draw-model --report artifacts/bend-draw-checkpoint.json
          python -m native.bend_engine.neural_probe.play_probe \
            --checkpoint /tmp/bend-draw-model/untrained-transformer.pt \
            --reuse-package /tmp/bend-draw-model/checkpoint.pt2 --qualification-suite --modes native \
            --report artifacts/bend-draw-play.json
      - name: Publish only the clean tested feature tree
        run: |
          git fetch --no-tags --depth=1 origin 322c5064c2d977cba0ab7f47b791b6871130262a
          git read-tree 322c5064c2d977cba0ab7f47b791b6871130262a
          git add native/bend_engine/session_probe native/bend_engine/neural_probe tests/test_bend_search_draws.py docs/experiments/README.md docs/experiments/2026-09-19-bend-search-draws.md
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          commit="$(git commit-tree "$(git write-tree)" -p 322c5064c2d977cba0ab7f47b791b6871130262a -m 'Cache automatic history draws as terminal leaves in Bend search')"
          git push origin "$commit":refs/heads/feat/bend-automatic-draw-leaves-reviewed
          printf '%s\n' "$commit" > artifacts/bend-draw-commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bend-draw-confirmation
          path: artifacts/bend-draw-*
          retention-days: 30
