name: Bend checkpoint readiness confirmation
on:
  push:
    branches: [feat/bend-checkpoint-preflight]
    paths: ['.github/workflows/bend-preflight-dev.yml']
permissions:
  contents: write
jobs:
  confirm:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          activate-environment: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Apply exact locally tested readiness changes
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, gzip, hashlib
          parts = []
          expected = ['35cb51f3765e6096c2d3ca60127282c6f3d51169a152ed891fafe702672a6c0f', '6c08c7a22e6f2b279dcaac01ff629797562de7b9eda0f2def396f73ab47eff46']
          for i, wanted in enumerate(expected):
              part = Path(f'.github/preflight-part{i}.txt').read_text().strip()
              assert hashlib.sha256(part.encode()).hexdigest() == wanted, i
              parts.append(part)
          patch = gzip.decompress(base64.b64decode(''.join(parts), validate=True))
          assert hashlib.sha256(patch).hexdigest() == '3b6bb8564de81c33fded27368557003c44f05af7195ab9a5ce95fdeda12fb049'
          Path('/tmp/bend-readiness.patch').write_bytes(patch)
          PY
          git apply --check /tmp/bend-readiness.patch
          git apply /tmp/bend-readiness.patch
          git diff --check
      - name: Install locked CPU tools and source-pinned Bend
        run: |
          uv sync --locked --extra dev --extra cpu
          python -c "import torch; assert torch.version.cuda is None; print(torch.__version__)"
          bash native/bend_engine/bitboard_probe/install_toolchain.sh
      - name: Static checks and cheap contracts
        run: |
          status=0
          ruff check native/bend_engine/neural_probe tests/test_bend_qualification.py || status=1
          basedpyright native/bend_engine/neural_probe tests/test_bend_qualification.py || status=1
          python -m pytest -q tests/test_bend_qualification.py tests/test_bend_checkpoint.py tests/test_bend_batching.py tests/test_bend_neural_boundary.py tests/test_bend_search_sessions.py || status=1
          exit "$status"
      - name: Create immutable untrained fixture and check readiness without inference
        run: |
          mkdir -p artifacts
          python - <<'PY'
          from pathlib import Path
          from native.bend_engine.neural_probe.checkpoint_probe import fixture_checkpoint
          fixture_checkpoint(Path('/tmp/bend-ready-fixture.pt'))
          PY
          python -m native.bend_engine.neural_probe.checkpoint_probe \
            --checkpoint /tmp/bend-ready-fixture.pt --preflight-only \
            --report artifacts/bend-ready-preflight.json
          python - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path('artifacts/bend-ready-preflight.json').read_text())
          assert r['status'] == 'preflight_passed' and r['qualification'] == 'not_run'
          assert not r['results'] and 'export' not in r['stage_seconds'] and 'native_calls' not in r
          PY
      - name: Full four-mode qualification retaining package and diagnostic evidence
        run: |
          python -m native.bend_engine.neural_probe.checkpoint_probe \
            --checkpoint /tmp/bend-ready-fixture.pt --modes generic portable native ubsan \
            --work-dir /tmp/bend-ready-fresh --report artifacts/bend-ready-fresh.json
      - name: Reuse exact package and rerun native numerical and search checks
        run: |
          python -m native.bend_engine.neural_probe.checkpoint_probe \
            --checkpoint /tmp/bend-ready-fixture.pt --reuse-package /tmp/bend-ready-fresh/checkpoint.pt2 \
            --work-dir /tmp/bend-ready-reuse --report artifacts/bend-ready-reuse.json
          python - <<'PY'
          import json
          from pathlib import Path
          old = json.loads(Path('artifacts/bend-ready-fresh.json').read_text())
          new = json.loads(Path('artifacts/bend-ready-reuse.json').read_text())
          assert old['status'] == new['status'] == 'passed'
          assert old['qualification'] == new['qualification'] == 'passed'
          assert old['package']['sha256'] == new['package']['sha256']
          assert not old['reused_package'] and new['reused_package']
          assert 'export' in old['stage_seconds'] and 'export' not in new['stage_seconds']
          assert [r['epochs'] for r in old['results'] if r['mode'] == 'native'] == [r['epochs'] for r in new['results']]
          assert Path(old['package_path']).is_file()
          PY
      - name: Reject mismatched identity and unavailable CUDA before execution
        run: |
          python - <<'PY'
          import torch
          p = torch.load('/tmp/bend-ready-fixture.pt', map_location='cpu', weights_only=True)
          p['step'] = 1
          torch.save(p, '/tmp/bend-ready-other.pt')
          PY
          if python -m native.bend_engine.neural_probe.checkpoint_probe \
            --checkpoint /tmp/bend-ready-other.pt --reuse-package /tmp/bend-ready-fresh/checkpoint.pt2 \
            --preflight-only --report artifacts/bend-ready-mismatch.json; then exit 1; fi
          if python -m native.bend_engine.neural_probe.checkpoint_probe \
            --checkpoint /tmp/bend-ready-fixture.pt --device cuda --atol 0 --rtol 0 \
            --preflight-only --report artifacts/bend-ready-no-cuda.json; then exit 1; fi
          python - <<'PY'
          import json
          from pathlib import Path
          mismatch = json.loads(Path('artifacts/bend-ready-mismatch.json').read_text())
          cuda = json.loads(Path('artifacts/bend-ready-no-cuda.json').read_text())
          assert mismatch['status'] == 'failed' and mismatch['failed_stage'] == 'package-verification'
          assert 'checkpoint identity' in mismatch['error']
          assert cuda['status'] == 'failed' and cuda['failed_stage'] == 'preflight'
          assert 'no CPU fallback' in cuda['error']
          for r in (mismatch, cuda):
              assert r['qualification'] == 'not_run' and not r['results']
          PY
      - name: Preserve exact tested non-workflow sources
        run: |
          git add native/bend_engine/neural_probe tests/test_bend_qualification.py docs/experiments
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Qualify checkpoint readiness and reusable native artifacts'
          git push origin HEAD:refs/heads/feat/bend-checkpoint-preflight
          git rev-parse HEAD > artifacts/bend-ready-commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bend-readiness-confirmation
          path: artifacts/bend-ready-*
          retention-days: 30
