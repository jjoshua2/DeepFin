name: Bend batching confirmation
on:
  push:
    branches: [feat/bend-evaluator-batching]
    paths: ['.github/workflows/bend-batch-dev.yml']
permissions:
  contents: write
jobs:
  confirm:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          activate-environment: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Apply exact locally tested batching patch
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, gzip, hashlib
          names = ['batch-patch-0.txt', 'batch-part-10.txt', 'batch-part-11.txt', 'batch-part-12.txt', 'batch-part-13.txt', 'batch-part-20.txt', 'batch-part-21.txt']
          encoded = ''
          for name in names:
              part = (Path('.github') / name).read_text().strip()
              print(name, len(part), hashlib.sha256(part.encode()).hexdigest(), flush=True)
              encoded += part
          patch = gzip.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == '43c25e5ee45e35d39210baaca494605a8527ca50e08041aabdbe10b673fef045'
          Path('/tmp/bend-batching.patch').write_bytes(patch)
          PY
          git apply --check /tmp/bend-batching.patch
          git apply /tmp/bend-batching.patch
          git diff --check
      - name: Install isolated CPU environment and pinned compiler
        run: |
          uv sync --locked --extra dev --extra cpu
          python -c "import torch; assert torch.version.cuda is None; print(torch.__version__)"
          bash native/bend_engine/bitboard_probe/install_toolchain.sh
      - name: Static checks and cheap boundary contracts
        run: |
          status=0
          ruff check native/bend_engine/neural_probe tests/test_bend_batching.py || status=1
          basedpyright native/bend_engine/neural_probe tests/test_bend_batching.py || status=1
          python -m pytest -q tests/test_bend_batching.py tests/test_bend_neural_boundary.py tests/test_bend_search_sessions.py || status=1
          exit "$status"
      - name: Preserve four-mode search session regression
        run: |
          python -m native.bend_engine.session_probe.run_probe --python-chess \
            --report artifacts/bend-neural-session-regression.json
      - name: Preserve single-row native inference qualification
        run: |
          python -m native.bend_engine.neural_probe.run_probe \
            --report artifacts/bend-neural-single-regression.json
      - name: Batched native inference across independent searches
        run: |
          python -m native.bend_engine.neural_probe.batch_probe \
            --report artifacts/bend-neural-batching.json
      - name: Publish clean tested feature branch
        run: |
          git fetch --no-tags --depth=1 origin 4d5285eb016dec3f36f9eb0a1842c27d770eea97
          git rm .github/workflows/bend-batch-dev.yml .github/batch-patch-0.txt .github/batch-patch-1.txt .github/batch-part-10.txt .github/batch-part-11.txt .github/batch-part-12.txt .github/batch-part-13.txt .github/batch-part-20.txt .github/batch-part-21.txt
          git add .github/workflows/bend-neural-boundary.yml docs/experiments/2026-09-18-bend-evaluator-batching.md docs/experiments/README.md native/bend_engine/neural_probe tests/test_bend_batching.py
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          commit="$(git commit-tree "$(git write-tree)" -p 4d5285eb016dec3f36f9eb0a1842c27d770eea97 -m 'Qualify bounded native evaluator batching across Bend searches')"
          git push origin "$commit":refs/heads/feat/bend-evaluator-batching-reviewed
          printf '%s\n' "$commit" > artifacts/bend-neural-batch-commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bend-batching-confirmation
          path: artifacts/bend-neural-*
          retention-days: 30
