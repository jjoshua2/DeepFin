name: Validate 478 final staging

on:
  push:
    branches: [fix/478-final-staging]

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/478-final-staging
          fetch-depth: 0
      - name: Apply guarded final repairs
        run: python3 scripts/_fix_478_final.py
      - name: Remove bootstrap files
        run: |
          rm scripts/_fix_478_final.py
          rm .github/workflows/fix-478-final-staging.yml
      - name: Static sanity
        run: |
          python3 -m py_compile scripts/nnue_gumbel_readout.py scripts/gen_random_selfplay_shards.py tests/test_nnue_gumbel_readout.py
          git diff --check
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CPU torch
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install package + dev deps
        run: pip install -e ".[dev]"
      - name: Targeted lint and type gate
        run: |
          ruff check scripts/nnue_gumbel_readout.py scripts/gen_random_selfplay_shards.py tests/test_nnue_gumbel_readout.py
          basedpyright scripts/nnue_gumbel_readout.py scripts/gen_random_selfplay_shards.py tests/test_nnue_gumbel_readout.py
      - name: Readout regression suite
        env:
          CAE_TEST_THREADS: auto
          CAE_EXPECT_SLIDER_BACKEND: magic
        run: python -m pytest tests/test_nnue_gumbel_readout.py -q
      - name: Commit validated repairs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "readout: harden final provenance and non-vacuity gates"
          git push origin HEAD:fix/478-final-staging
