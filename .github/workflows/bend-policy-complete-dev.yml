name: Bend policy composition documentation
on:
  push:
    branches: [feat/bend-policy-complete-input-dev]
    paths: ['.github/workflows/bend-policy-complete-dev.yml']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cda2745391d9cdaf636c2ae0aea7557751aa26c3
      - name: Append only the reviewed usage and index text
        run: |
          python - <<'PY'
          import base64, hashlib, json, urllib.request
          from pathlib import Path
          sha = '4d4eb0c67776a20ccc6e8f6a96ea399fb4ac0a83'
          with urllib.request.urlopen('https://api.github.com/repos/jjoshua2/DeepFin/git/blobs/' + sha, timeout=30) as response:
              data = json.load(response)
          patch = base64.b64decode(data['content'])
          assert hashlib.sha1(f'blob {len(patch)}\0'.encode() + patch).hexdigest() == sha
          assert hashlib.sha256(patch).hexdigest() == '090f08d281e6dbf9d1f4c3e80fb65b73f2cbed9cebed418df7f561ab98bfb218'
          Path('/tmp/policy-docs.patch').write_bytes(patch)
          PY
          git apply --check /tmp/policy-docs.patch
          git apply /tmp/policy-docs.patch
          python - <<'PY'
          import subprocess
          expected = {
              'docs/experiments/README.md': 'cd0fc8d520fd181af3ae3dd0dfe49e55f5f79716',
              'native/bend_engine/standalone/README.md': '5bb33d9577d06995fa0f1ba51dfef428617a26f7',
          }
          changed = subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines()
          assert set(changed) == set(expected), changed
          for path, sha in expected.items():
              assert subprocess.check_output(['git', 'hash-object', path], text=True).strip() == sha
          PY
          git diff --check
          git add docs/experiments/README.md native/bend_engine/standalone/README.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Document the paired Bend input and legal-policy boundary'
          git push origin HEAD:refs/heads/feat/bend-policy-complete-input
          git rev-parse HEAD
