name: Bend policy and complete-input confirmation
on:
  push:
    branches: [feat/bend-policy-complete-input-dev]
    paths: ['.github/workflows/bend-policy-complete-dev.yml']
permissions:
  contents: write
jobs:
  confirm:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply integration and verify reviewed source identities
        run: |
          echo 'a58b9dc4c0e36ec1c350113416dac3c31d2cb893c48de3142cd4aaf82920d455  .github/policy-compose.patch' | sha256sum -c -
          git apply --check .github/policy-compose.patch
          git apply .github/policy-compose.patch
          python - <<'PY'
          import subprocess
          from pathlib import Path
          expected = {
              'Policy.bend': '4314c44e2da6c0bd41096aea91121cb3885c1234',
              'PolicyDiagnostic.bend': 'ebeb2114122df789ec3e4dc77987079cecdf0a64',
              'verify_policy.py': '5c853f667bf3199b50f68d09bbe342e95c5b0682',
              'EvaluationInput.bend': '602857450bcad74188b56822654649482ebefce4',
              'EvaluationDiagnostic.bend': 'e957ea5a9ae65aea3439c8353d401b8ef91b2d39',
              'verify_request.py': 'b198a2aa09e301038861479c513e3a294139536f',
              'Protocol.bend': '7125cfa4e7203917ef5514bf4539358ee63c21b0',
              'main.bend': '2f4d2835633c22ac102f1cbb43f2080b25d0f4cb',
          }
          for name, sha in expected.items():
              p = Path('native/bend_engine/standalone') / name
              assert subprocess.check_output(['git', 'hash-object', str(p)], text=True).strip() == sha, name
          PY
          git diff --check
      - name: External references and static tools only
        run: |
          python -m pip install 'python-chess==1.999' 'numpy==2.2.6' 'ruff==0.15.20' 'basedpyright==1.39.9'
          python - <<'PY'
          import ast, subprocess, sysconfig
          from pathlib import Path
          import numpy
          module = ast.parse(Path('setup.py').read_text())
          macros = next(ast.literal_eval(n.value) for n in module.body
                        if isinstance(n, ast.AnnAssign) and isinstance(n.target, ast.Name)
                        and n.target.id == '_CBOARD_FAST_SLIDER_MACROS')
          subprocess.run(['cc', '-shared', '-fPIC', '-O1', '-I' + sysconfig.get_paths()['include'],
                          '-I' + numpy.get_include(), *[f'-D{k}={v}' for k, v in macros],
                          'chess_anti_engine/encoding/_lc0_ext.c', '-pthread', '-lm', '-o',
                          'chess_anti_engine/encoding/_lc0_ext' + sysconfig.get_config_var('EXT_SUFFIX')], check=True)
          PY
          ruff check native/bend_engine/standalone/verify_policy.py native/bend_engine/standalone/verify_request.py
          basedpyright native/bend_engine/standalone/verify_policy.py native/bend_engine/standalone/verify_request.py
          bun test native/bend_engine/standalone/verify_compiler.test.js
      - name: Compile the combined engine with the unchanged current U64 pin
        run: |
          mkdir -p artifacts
          /usr/bin/time -v -o artifacts/bend-policy-build-resource.txt timeout 180s bash native/bend_engine/standalone/build.sh /tmp/bend-policy-composed
          cp /tmp/bend-policy-composed/build.txt artifacts/bend-policy-build.txt
          grep 'compiler_revision=aaeb9bc91ff0ff0b3f58dba6a9744c6607e167ae' artifacts/bend-policy-build.txt
      - name: Generic policy, paired requests and inherited contracts
        run: |
          exe=/tmp/bend-policy-composed/deepfin-bend
          python -m native.bend_engine.standalone.verify_policy --require-c --report artifacts/bend-policy-generic.json --command "$exe" --threads 1
          python -m native.bend_engine.standalone.verify_request --require-c --report artifacts/bend-request-generic.json --command "$exe" --threads 1
          python -m native.bend_engine.standalone.verify_classical --require-c --report artifacts/bend-input-generic.json --command "$exe" --threads 1
          python -m native.bend_engine.standalone.verify_encoding --require-c --report artifacts/bend-history-generic.json --command "$exe" --threads 1
          python -m native.bend_engine.standalone.verify_rules --report artifacts/bend-rules-generic.json --command "$exe" --threads 1
          python native/bend_engine/standalone/verify.py --report artifacts/bend-original-generic.json --command "$exe" --threads 1
      - name: Portable native and UBSan composition and original regressions
        run: |
          for mode in portable native ubsan; do
            case "$mode" in
              portable) flags=(-DBEND_U64_PORTABLE) ;;
              native) flags=(-march=native) ;;
              ubsan) flags=(-fsanitize=undefined -fno-sanitize-recover=all) ;;
            esac
            exe="/tmp/bend-policy-composed/$mode"
            clang -std=c11 -O1 -ffp-contract=off -Werror=shift-count-overflow "${flags[@]}" /tmp/bend-policy-composed/engine.c -pthread -lm -o "$exe"
            python -m native.bend_engine.standalone.verify_policy --require-c --report "artifacts/bend-policy-$mode.json" --command "$exe" --threads 1
            python -m native.bend_engine.standalone.verify_request --require-c --report "artifacts/bend-request-$mode.json" --command "$exe" --threads 1
            python -m native.bend_engine.standalone.verify_classical --require-c --report "artifacts/bend-input-$mode.json" --command "$exe" --threads 1
            python -m native.bend_engine.standalone.verify_encoding --require-c --report "artifacts/bend-history-$mode.json" --command "$exe" --threads 1
            python -m native.bend_engine.standalone.verify_rules --report "artifacts/bend-rules-$mode.json" --command "$exe" --threads 1
            python native/bend_engine/standalone/verify.py --report "artifacts/bend-original-$mode.json" --command "$exe" --threads 1
          done
      - name: Repeat with only a static executable inside the engine runtime
        run: |
          clang -std=c11 -O1 -ffp-contract=off -Werror=shift-count-overflow -static /tmp/bend-policy-composed/engine.c -pthread -lm -o /tmp/bend-policy-composed/static
          if readelf -l /tmp/bend-policy-composed/static | grep -q INTERP; then exit 1; fi
          runtime="$(mktemp -d /tmp/bend-policy-runtime.XXXXXX)"
          cp /tmp/bend-policy-composed/static "$runtime/deepfin-bend"
          test "$(find "$runtime" -mindepth 1 | wc -l)" = 1
          for suite in policy request classical encoding rules; do
            python -m "native.bend_engine.standalone.verify_$suite" $([ "$suite" = rules ] || echo --require-c) --report "artifacts/bend-$suite-isolated.json" --command sudo chroot "$runtime" /deepfin-bend --threads 1
          done
          python native/bend_engine/standalone/verify.py --report artifacts/bend-original-isolated.json --command sudo chroot "$runtime" /deepfin-bend --threads 1
          {
            file "$runtime/deepfin-bend"
            find "$runtime" -mindepth 1 -printf '%P\n'
            sha256sum "$runtime/deepfin-bend" /tmp/bend-policy-composed/engine.c
          } > artifacts/bend-policy-isolation.txt
          python - <<'PY'
          import json
          from pathlib import Path
          for suite in ('policy', 'request'):
              reports = [json.loads(Path(f'artifacts/bend-{suite}-{mode}.json').read_text())
                         for mode in ('generic', 'portable', 'native', 'ubsan', 'isolated')]
              assert all(r == reports[0] and r['status'] == 'passed' for r in reports)
          p = json.loads(Path('artifacts/bend-policy-generic.json').read_text())
          assert p['legal_move_comparisons'] == p['c_legal_move_comparisons'] == 2963
          assert p['distinct_promotion_moves'] == 176
          assert p['table_sha256'] == '2f4c0524e2b7d3a2c81d6c53b770f97c07dc246dc2c776a937b1e6d05f82f618'
          r = json.loads(Path('artifacts/bend-request-generic.json').read_text())
          assert r['c_cross_checks'] == r['composed_requests']
          assert r['terminal_empty_requests'] > 0 and r['invalid_requests'] == 9
          PY
      - name: Publish only the tested application and experiment plan
        run: |
          git fetch --no-tags --depth=1 origin 5032ba20d5c6e45630300d409a063de590f2ac21
          git read-tree 5032ba20d5c6e45630300d409a063de590f2ac21
          git add native/bend_engine/standalone/Policy.bend native/bend_engine/standalone/PolicyDiagnostic.bend native/bend_engine/standalone/EvaluationInput.bend native/bend_engine/standalone/EvaluationDiagnostic.bend native/bend_engine/standalone/Protocol.bend native/bend_engine/standalone/main.bend native/bend_engine/standalone/verify_policy.py native/bend_engine/standalone/verify_request.py docs/experiments/2026-09-21-bend-policy-composition.md
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          commit="$(git commit-tree "$(git write-tree)" -p 5032ba20d5c6e45630300d409a063de590f2ac21 -m 'Compose Bend policy mappings with complete neural input tensors')"
          git push origin "$commit":refs/heads/feat/bend-policy-complete-input
          printf '%s\n' "$commit" > artifacts/bend-policy-commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bend-policy-composition-confirmation
          path: artifacts/bend-*
          retention-days: 30
