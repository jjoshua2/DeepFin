name: PR5d root lifecycle workspace
on:
  push:
    branches: [work/pr5d-root-lifecycle-20260923]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bb1847d2d7f3c4e8b94e5dfb9f64bfc87e0c3390
      - name: Preserve exact source and pinned compiler
        run: |
          mkdir /tmp/pr5d-source
          git archive HEAD | gzip > /tmp/pr5d-source/source.tar.gz
          git rev-parse HEAD > /tmp/pr5d-source/revision.txt
          python - <<'PY'
          import json,subprocess
          from pathlib import Path
          pin=json.loads(Path('native/bend_engine/standalone/toolchain.json').read_text())
          print(pin)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: deepfin-pr5d-source
          path: /tmp/pr5d-source
          retention-days: 7
