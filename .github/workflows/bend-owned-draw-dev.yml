name: Bend-owned draw development
on:
  push:
    branches: [feat/bend-owned-draw-rules-dev]
    paths: ['.github/workflows/bend-owned-draw-dev.yml']
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: |
          mkdir -p /tmp/bend-draw-source
          git archive --format=tar.gz HEAD > /tmp/bend-draw-source/deepfin.tgz
          git clone --filter=blob:none --no-checkout https://github.com/jjoshua2/bend.git /tmp/bend-compiler
          git -C /tmp/bend-compiler checkout --detach fd1df81707fd758f749a9570ccb5b12b1bb2fea3
          git -C /tmp/bend-compiler archive --format=tar.gz HEAD > /tmp/bend-draw-source/compiler.tgz
          cp "$(command -v bun)" /tmp/bend-draw-source/bun
          python -m pip download --no-deps --no-binary=:all: chess==1.11.2 -d /tmp/bend-draw-source
      - uses: actions/upload-artifact@v4
        with:
          name: bend-owned-draw-source
          path: /tmp/bend-draw-source/
          retention-days: 2
