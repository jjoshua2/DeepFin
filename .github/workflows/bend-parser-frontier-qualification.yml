name: Bend parser frontier qualification
'on':
  push:
    branches: [feat/bend-parser-frontier-dev-20260925]
    paths: [.github/workflows/bend-parser-frontier-qualification.yml]
permissions:
  contents: write
  actions: read
defaults:
  run:
    shell: bash
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BEND_NO_TELEMETRY: '1'
      TERM: dumb
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      BASE: c3f9dd30cf58c90f91dbac6a7f74ec0d8ee18241
      TARGET: feat/bend-parser-frontier-20260925
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c3f9dd30cf58c90f91dbac6a7f74ec0d8ee18241
      - uses: actions/checkout@v4
        with:
          repository: jjoshua2/bend
          ref: aaeb9bc91ff0ff0b3f58dba6a9744c6607e167ae
          path: .compiler
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Recover exact candidate and retain qualified parent sources
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          export EVIDENCE="$RUNNER_TEMP/frontier-evidence"
          mkdir -p "$EVIDENCE"
          echo "EVIDENCE=$EVIDENCE" >> "$GITHUB_ENV"
          : > "$RUNNER_TEMP/source.xz"
          for blob in facb5257e14f87b0eb07828789e8595b7cd8c592 ef1eebc3a9ccbb9c4288687cee813fa3489a9691 8e67b3af1445f7ddf15e7f534d310a165c8e4855 55f7b5508c532cdb319d16ab56d9c94630ba67b8 6092649aa77495482d1613fe9117f3b433c849e7 f6f329e00bdb41fecaf879bb4730f77f86468a03 251b9986d79479edd2d8e27c4ab0f4599d6d914c 24946c3ffb8ee5b58a64d8cc9900c06a94bbbc6b e27c5e7feef162489e18d9e6bf2c5345e02f6103; do
            gh api "repos/jjoshua2/DeepFin/git/blobs/$blob" --jq .content | base64 --decode > "$RUNNER_TEMP/$blob"
            test "$(git hash-object "$RUNNER_TEMP/$blob")" = "$blob"
            cat "$RUNNER_TEMP/$blob" >> "$RUNNER_TEMP/source.xz"
          done
          gh api repos/jjoshua2/DeepFin/actions/jobs/108102300933 > "$EVIDENCE/parent-job.json"
          python3 - <<'PY'
          import hashlib,json,lzma,os,subprocess
          from pathlib import Path
          t=Path(os.environ['RUNNER_TEMP']);e=Path(os.environ['EVIDENCE'])
          packed=(t/'source.xz').read_bytes();assert len(packed)==18572
          patch=lzma.decompress(packed,memlimit=256*1024*1024)
          assert len(patch)==120461 and hashlib.sha256(patch).hexdigest()=='d7c124b631758bf5ee68ba39a3be2ff9bb193d1cb27478dd93e7f60af004272f'
          (e/'source.patch').write_bytes(patch)
          def git(*args):return subprocess.check_output(['git',*args],text=True).strip()
          assert git('rev-parse','HEAD')==os.environ['BASE']
          assert git('rev-parse','HEAD^{tree}')=='2bacec89fa8f1eefbe6b743529a9dffd4f20ff56'
          old=Path('docs/experiments/evidence/bend-parser-prefix-safety')
          q=json.loads((old/'qualification.json').read_text());assert q['qualification']=='PASS' and q['modular_laws']==137 and q['modular_controls']==384
          f=json.loads((old/'hosted-focused.json').read_text());assert f['focused_gate']=='PASS' and f['consumer']=='PASS' and f['new_law_count']==5
          assert len(f['negative_controls'])==17 and all(x['rejected'] for x in f['negative_controls'])
          manifest=json.loads((old/'hosted-source-identity.json').read_text())['candidate_source_sha256s'];assert len(manifest)==429
          for p,h in manifest.items():assert hashlib.sha256(Path(p).read_bytes()).hexdigest()==h,p
          j=json.loads((e/'parent-job.json').read_text());assert j['id']==108102300933 and j['run_id']==36144541680 and j['status']=='completed' and j['conclusion']=='success'
          subprocess.run(['git','apply','--check',str(e/'source.patch')],check=True)
          subprocess.run(['git','apply','--index',str(e/'source.patch')],check=True)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          assert git('write-tree')=='efa431703a1d47208655595f816a3008d0c4a27a'
          files=git('diff','--cached','--name-only').splitlines();assert len(files)==16
          assert all(p.startswith('native/bend_engine/standalone/proofs/frontier/') or p=='docs/experiments/2026-09-25-bend-parser-frontier.md' for p in files)
          hashes={p:hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in git('ls-files','native/bend_engine').splitlines() if Path(p).is_file()}
          assert len(hashes)==444
          r={'base':os.environ['BASE'],'source_tree':'efa431703a1d47208655595f816a3008d0c4a27a','patch_sha256':hashlib.sha256(patch).hexdigest(),'changed_files':files,'candidate_source_sha256s':hashes,'retained_parent_laws':137,'retained_parent_controls':384,'parent_manifest_matches':429,'parent_qualification_sha256':hashlib.sha256((old/'qualification.json').read_bytes()).hexdigest(),'combined_wrapper_executed':False,'saved_rejection_variant_preserved':True,'independent_review':False}
          (e/'source-identity.json').write_text(json.dumps(r,indent=2)+'\n')
          PY
          bun native/bend_engine/standalone/verify_compiler.js "$PWD/.compiler" | tee "$EVIDENCE/compiler-identity.txt"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'native: prove accepted parser frontiers and fresh piece insertion'
          echo "SOURCE=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          git log -1 --format='%H%n%T' > "$EVIDENCE/source-commit.txt"
      - name: Check four public laws and seventeen controls on actual parser dependencies
        run: |
          set -euo pipefail
          bun native/bend_engine/standalone/proofs/frontier/focused.js "$PWD/.compiler" --report "$EVIDENCE/focused.json" 2>&1 | tee "$EVIDENCE/focused.log"
      - name: Verify every character boundary in four native modes and reject cursor corruptions
        env:
          CC: clang-18
        run: |
          set -euo pipefail
          bun native/bend_engine/standalone/proofs/frontier/verify_native.js "$PWD/.compiler" --report "$EVIDENCE/native.json" 2>&1 | tee "$EVIDENCE/native.log"
      - name: Recheck original compiler source suite and pin tests
        run: |
          set -euo pipefail
          bun test native/bend_engine/standalone/verify_compiler.test.js 2>&1 | tee "$EVIDENCE/pin.log"
          (cd .compiler && bun tests/run/u64_proofs.js) | tee "$EVIDENCE/compiler-proofs.json"
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.10'
          enable-cache: false
      - name: Install locked CPU development tools with the normal build compiler
        run: |
          set -euo pipefail
          uv sync --locked --extra dev --extra cpu
          .venv/bin/python -c 'import torch; assert torch.version.cuda is None'
      - name: Run unchanged whole-repository lint
        run: |
          set -euo pipefail
          export PATH="$PWD/.venv/bin:$PATH"
          ./scripts/lint.sh 2>&1 | tee "$EVIDENCE/lint.log"
      - name: Verify complete evidence and publish a fresh feature branch
        run: |
          set -euo pipefail
          git diff --exit-code
          test "$(git rev-parse HEAD)" = "$SOURCE"
          test "$(git ls-remote origin refs/heads/feat/bend-parser-prefix-safety-20260925 | cut -f1)" = "$BASE"
          set +e
          git ls-remote --exit-code --heads origin "refs/heads/$TARGET" > "$RUNNER_TEMP/target.txt"
          found=$?
          set -e
          test "$found" = 2
          bun native/bend_engine/standalone/verify_compiler.js "$PWD/.compiler"
          python3 - <<'PY'
          import collections,hashlib,json,os,shutil
          from pathlib import Path
          e=Path(os.environ['EVIDENCE'])
          def read(n):return json.loads((e/n).read_text())
          def canon(x):return hashlib.sha256(json.dumps(x,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          ident=read('source-identity.json');f=read('focused.json');n=read('native.json')
          assert len(ident['candidate_source_sha256s'])==444
          for p,h in ident['candidate_source_sha256s'].items():assert hashlib.sha256(Path(p).read_bytes()).hexdigest()==h,p
          assert f['focused_gate']=='PASS' and f['controls_gate']=='PASS' and f['consumer']=='PASS' and f['new_law_count']==4 and f['universal_laws']==4
          assert len(f['negative_controls'])==17 and all(x['rejected'] for x in f['negative_controls'])
          kinds=collections.Counter(x['kind'] for x in f['negative_controls']);assert kinds['source semantic/refinement']==8 and kinds['manifest/import policy']==8
          assert canon(f['source_sha256s'])=='3d4b31c8be4154a6fe3154d63185d50baf020a34c7f8cf0f40e5dbe130920964'
          assert canon(f['negative_controls'])=='d8b95b60cbf5238eecd62ac3f215698073eef0007d6a417585cc1db6b8f71eac'
          assert n['native_gate']=='PASS' and n['placement_strings']==1614 and n['distinct_strings']==1614
          assert n['prefix_states']==29526 and n['fields_per_mode']==679098
          assert n['live_prefix_states']==26879 and n['invalid_prefix_states']==2647 and n['accepted_final_strings']==899 and n['live_piece_transitions']==7197
          assert len(n['modes'])==4 and all(x['invalid_rejections']==2 and x['output_sha256']=='cc12b044ec805bec1984979a11c9cbcda52cad76d91d457f096b918d9bb6349f' for x in n['modes'])
          assert len(n['mutations'])==2 and all(x['rejected'] and x['compiled_and_executed'] for x in n['mutations'])
          assert canon({k:v for k,v in n.items() if k!='cc'})=='dcd6e414dc01f68ac5f144ba8f8baf18dcf2ee7439596f881d5a7093be9c5d11'
          assert read('compiler-proofs.json')['proof_gate']=='PASS'
          assert '12 pass' in (e/'pin.log').read_text() and '0 fail' in (e/'pin.log').read_text()
          assert (e/'lint.log').read_text().strip().endswith('lint: OK')
          d=Path('docs/experiments/evidence/bend-parser-frontier');d.mkdir(exist_ok=False)
          for name in ['source-identity.json','focused.json','native.json','compiler-proofs.json','parent-job.json']:
              shutil.copyfile(e/name,d/('hosted-'+name))
          for name in ['pin.log','lint.log','compiler-identity.txt']:
              raw=(e/name).read_bytes();(d/(name+'.json')).write_text(json.dumps({'sha256':hashlib.sha256(raw).hexdigest(),'raw_text':raw.decode()},indent=2)+'\n')
          result={'qualification':'PASS','run':os.environ['GITHUB_RUN_ID'],'source':os.environ['SOURCE'],'source_tree':'efa431703a1d47208655595f816a3008d0c4a27a','new_laws':4,'new_controls':17,'control_categories':dict(kinds),'retained_parent_laws':137,'retained_parent_controls':384,'modular_laws':141,'modular_controls':401,'combined_wrapper_executed':False,'native_source_entries':444,'accepted_initialized_placement_consistency_proved':True,'live_typed_target_freshness_proved':True,'full_six_field_FEN_semantics_proved':False,'raw_rejected_layout_rollback_proved':False,'source_closure_and_controls_match_local':True,'native_report_matches_local_except_cc':True,'independent_review':False}
          (d/'qualification.json').write_text(json.dumps(result,indent=2)+'\n')
          headline=f"Hosted run **{os.environ['GITHUB_RUN_ID']}** passes all four public frontier contracts, importing consumer, seventeen controls, four native character-boundary modes, both actual cursor-corruption checks, original compiler source/pin gates and unchanged repository lint on source `{os.environ['SOURCE']}`."
          paragraphs=['## Completed hosted qualification',headline,
            'The source invariant now follows actual initialized parser paths. While live, the cursor is bounded, the Board satisfies the independent partition, and all lower-rank/current-unvisited squares are empty. The valid flag alone is not taken as a boundedness or freshness certificate. Every live typed piece transition derives a target below64 and fresh with respect to the actual pre-step Board. The optional placement finalizer returns a consistent Board whenever it returns Some.',
            'The invariant deliberately permits arbitrary temporary Boards once a path is invalid, and None is an explicit result case. No claim is made that all strings succeed, raw invalid mutations roll back, accepted strings describe reachable legal positions, or all six FEN fields satisfy their semantics. The accepted nonempty complete placement and full native acceptance checks prevent a vacuous always-rejected interpretation.',
            'The focused command executed all four public laws, its importing consumer and all17 controls. Eight are ordinary source/refinement rejections, eight enforce manifest/import safety and one is synthetic warning-output handling, not an extra compiler execution. Two actual cursor mutations reject in existing transition bridges and are labeled as implementation dependencies rather than isolated new mathematical failures. Crashes, missing names/imports, affine errors and timeouts do not count as semantic rejection.',
            'Exact-source137-law/384-control parent evidence was retained after checking all429 inherited manifest entries and its successful hosted job. Modular coverage is141 laws/401 controls, not a newly executed full141-law wrapper. No prior law, gate or routine test budget changed.',
            'Each native mode checks1,614 distinct initialized placement strings and every character boundary:29,526 complete Layout states,679,098 fields,26,879 live states,2,647 invalid states,899 accepted final strings and7,197 live typed insertions. All768 single-piece combinations are included. Both wrong cursor updates compile and execute before incorrect-state rejection. Two malformed probe-budget requests are rejected per mode. These repeated fixtures are not exhaustive Strings, Boards or legal-game coverage. The probe executes real layout_char/layout_result; source String induction connects that traversal to actual layout.',
            'The exact source closure and all control records match the cleaned final local report. The full native report matches local except the C compiler identity. Hosted Bun1.4.2/Clang18.1.3; Clang is scoped to native probes. Python3.13/uv0.12.10 locked CPU tools use the normal build compiler. Unchanged Ruff/Basedpyright/Vulture passes and resolves the recorded local missing-tools gap. Original compiler16-laws/seven-controls and12 pin tests pass.',
            'All444 candidate native-source entries match before evidence publication. Only documentation,index and evidence follow qualification. A trailing blank line in Finite.bend was removed before a fresh full local focused rerun and hosted checking. Earlier proof-binder, pattern-order, False/Nat mismatch and native do-block parsing failures remain recorded; none was counted as an accepted proof rejection. Two transport-chunk identity mismatches were discarded before source application; corrected exact chunks reproduce the complete expected tree.',
            'The saved local parser-rejection variant remains preserved. This new frontier proof builds on qualified #881 rather than silently overwriting or conflating the two variants. Self-review only. No production function, earlier proof, compiler input, permanent workflow, routine perft, search, model/GPU, training or benchmark change. No additional Python application responsibility moved into Bend. No merge, force push, deployment or live-process action.',
            'Next decisive P3 work is invariant-preserving removal and move application, while exact abstract placement contents and six-field FEN/metadata semantics remain separately scoped. King safety, special moves, legal reachability and move-generation soundness/completeness are not consequences of partition preservation. The pinned checker/Base, native lowering/storage, ABI, toolchain, OS and hardware remain trust boundaries; previous snapshot-lowering and closed-builder limitations remain unresolved.'
          ]
          record=Path('docs/experiments/2026-09-25-bend-parser-frontier.md');record.write_text(record.read_text()+'\n\n'+'\n\n'.join(paragraphs)+'\n')
          index=Path('docs/experiments/README.md');text=index.read_text();anchor='| Record | Scope |\n| --- | --- |\n';assert text.count(anchor)==1
          index.write_text(text.replace(anchor,anchor+'| [Accepted parser frontiers](2026-09-25-bend-parser-frontier.md) | Four source laws derive bounded fresh insertion and partition consistency from actual initialized placement traversal; modular141/401; six-field FEN semantics and moves remain separate |\n',1))
          m=Path('docs/bend_migration_proofs.md');title,rest=m.read_text().split('\n',1)
          note='## Latest P3 parser freshness and accepted-placement consistency\n\n'+headline+'\n\nThe frontier suite now derives bounded cursors, empty unvisited squares and representation consistency along actual initialized accepted placement paths. Live typed piece steps have fresh actual targets below64. The actual optional placement result contains a consistent Board whenever Some is returned. Caller premises do not assume those target or output properties. Raw true flags on arbitrary initial states are not sufficient, and rejected temporary Boards need not remain consistent.\n\nModular141/401 retains exact parent137/384, rather than a newly executed full wrapper. Every character boundary is native-checked on1,614 distinct strings, separately from the universal proofs. Historical notes that initialized parser freshness/placement partition preservation are wholly unproved are superseded within this scope. Full six-field FEN semantics, exact intended parsed contents, metadata legality, reachability and move application remain separate. See [the dated readout](experiments/2026-09-25-bend-parser-frontier.md). No application responsibility moved from Python.\n'
          m.write_text(title+'\n\n'+note+rest)
          PY
          git diff --check
          git diff --exit-code -- native
          git switch -c "$TARGET"
          git add docs/experiments docs/bend_migration_proofs.md
          git commit -m 'docs: qualify initialized parser frontier and accepted placement invariants'
          git push origin "HEAD:refs/heads/$TARGET"
          git log -2 --format='%H %s' > "$EVIDENCE/published-commits.txt"
          mkdir -p "$RUNNER_TEMP/final"
          cp -r "$EVIDENCE" "$RUNNER_TEMP/final/reports"
          git archive --format=tar HEAD | gzip > "$RUNNER_TEMP/final/source.tar.gz"
          git cat-file commit HEAD > "$RUNNER_TEMP/final/commit.raw"
          git rev-parse HEAD^{tree} > "$RUNNER_TEMP/final/tree.txt"
          (cd "$RUNNER_TEMP/final" && sha256sum source.tar.gz commit.raw > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bend-parser-frontier-qualification
          path: |
            ${{ runner.temp }}/final/
            ${{ runner.temp }}/frontier-evidence/
          retention-days: 14
