[project]
name = "chess-anti-engine"
version = "0.0.3"  # 0.0.3: the seed-dole claim moved to an authenticated POST. This bump IS
                   # the rollout mechanism and is not cosmetic: PROTOCOL_VERSION could not
                   # be used, because `_check_worker_compat` requires EXACT protocol
                   # equality and so breaks both deploy orders. `min_worker_version` is a
                   # `>=` comparison, so it can exclude stale workers without breaking the
                   # transition — but ONLY IF the versions actually differ. Left at 0.0.2,
                   # a stale worker and a new-code worker are indistinguishable, the stale
                   # one is admitted, and it reads `dole_fen_seeds: false` forever and is
                   # SILENTLY NEVER SEEDED. Same two activation steps as 0.0.2 below.
                   #
                   # 0.0.2: blind-spot FEN seeding. The min_worker_version gate that keeps
                   # pre-change (0.0.1) workers from mixing non-seeded shards into an
                   # activated seeding run only fires AFTER `pip install -e .` regenerates
                   # this into the INSTALLED metadata (version.py reads importlib.metadata,
                   # not this file) AND the worker wheel is rebuilt at 0.0.2 — a bare
                   # `train.sh restart` does neither. Activation checklist in
                   # docs/experiment_ledger.md carries both steps (Codex review, PR #108).
description = "Chess anti-engine training framework (Phase 1: Python pipeline)"
requires-python = ">=3.10.12"
# Core deps are the LITE baseline — exactly what the selfplay client needs
# (worker.py import graph: chess, numpy, torch, yaml, zarr; requests comes
# from the [worker] extra). Anything training- or server-side goes in an
# extra; keep this list as small as possible.
dependencies = [
  "python-chess>=1.10",
  "numpy>=1.24",
  "torch>=2.0",
  "pyyaml>=6.0",
  # zarr 3 removed the v2 Group.create_dataset(data=...) API used by
  # replay/shard.py — keep the v2 series until the shard I/O is ported.
  "zarr>=2.18,<3",
]

[project.scripts]
deepfin = "chess_anti_engine.uci.__main__:main"

[build-system]
requires = ["setuptools>=70", "wheel", "numpy>=1.24"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["chess_anti_engine*"]
exclude = ["runs*", "tests*"]

[project.optional-dependencies]
train = [
  "tensorboard>=2.0",
  # Unconditional import in train/trainer.py (gradient z-clip).
  "zclip>=1.0",
  # SOAP optimizer backend (trainer also accepts a local soap.py module).
  "pytorch-optimizer>=3.0",
]

# Full test/server environment: the suite hard-requires its dependencies
# (no optional-dep skips), so dev pulls in every extra the tests exercise.
# The lite client install is `pip install -e ".[worker]"`.
dev = [
  "chess-anti-engine[server,train,tune,onnx]",
  # tests/test_harness_sync_exclude.py drives pyarrow.fs directly (also a
  # transitive ray dep, pinned here because the test imports it itself).
  "pyarrow>=14.0",
  "pytest>=7.0",
  "pytest-cov>=5.0",
  "diff-cover>=8.0",
  # Static analysis — EXACT pins so lint results are deterministic across
  # local and CI (a floating basedpyright/ruff/numpy release can flip a green
  # repo red with zero code changes; numpy 1.26-vs-2.2 stub drift did exactly
  # that on PR #101). Bump deliberately: upgrade local, run scripts/lint.sh,
  # then commit the new pins. The weekly lint-canary workflow runs latest
  # tools non-blocking to surface upcoming breakage early.
  "ruff==0.15.20",
  "basedpyright==1.39.9",
  "skylos==4.27.0",
  "vulture==2.16",
  # numpy pinned in dev only (core keeps the loose floor for workers): the
  # numpy version decides which stubs basedpyright type-checks against, and
  # 1.26 vs 2.2 give different verdicts on the same code.
  "numpy==2.2.6",
  # torch pinned for the same reason: torch ships its own stubs and they drift
  # between releases (e.g. torch.device.index verdicts). Local CUDA builds
  # (2.12.1+cu130) satisfy the bare pin, so this doesn't fight the cu130 wheel.
  "torch==2.12.1",
  # C extension static analysis (pip-installable, no sudo required)
  "cppcheck>=1.5",     # general C static analyzer (bundles cppcheck binary)
  # For deeper interprocedural analysis, install Facebook infer separately:
  #   curl -L https://github.com/facebook/infer/releases/download/v1.2.0/infer-linux-x86_64-v1.2.0.tar.xz | tar -C ~/.local -xJ
  #   ~/.local/infer-linux-x86_64-v1.2.0/bin/infer run -- python3 setup.py build_ext --inplace
]

tune = [
  "ray[tune]>=2.9",
  "optuna>=3.0",
]

onnx = [
  "onnx>=1.15",
  "onnxruntime>=1.17",
  "onnxscript>=0.1.0",
]

server = [
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "python-multipart>=0.0.9",
  "httpx>=0.26",
]

worker = [
  "requests>=2.31",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning:torch.jit",
    "ignore::FutureWarning:copyreg",
]
markers = [
    "slow: stress / long-running tests (e.g. mcts thread-safety hammer); not in the default run",
]

[tool.coverage.run]
source = ["chess_anti_engine"]
branch = true
omit = [
    "chess_anti_engine/uci/__main__.py",
    "chess_anti_engine/server/run_server.py",
    "chess_anti_engine/version.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    'if __name__ == "__main__":',
]
show_missing = true
skip_covered = false

[tool.ruff.lint]
# Gate = ruff defaults (pyflakes + core pycodestyle) plus the zero-cost
# semantic rules that replaced the old narrow pylint config (2026-07-02; each
# group had 0 findings at adoption or was fixed in the same commit):
#   ARG    unused arguments        (was pylint unused-argument)
#   B006   mutable default arg     (was pylint dangerous-default-value)
#   G004   f-string in logging     (was pylint logging-fstring-interpolation)
#   SIM115 open() without with     (was pylint consider-using-with)
#   ISC    implicit str-concat bugs
#   PLE    pylint error-class rules (ruff's port)
# pylint's two flow checks live in basedpyright's active gate:
# reportPossiblyUnboundVariable and reportUnreachable. F541 (default set)
# covers f-string-without-interpolation. The occasional-cleanup groups run
# ADVISORY via `scripts/lint.sh --deep` — promote a group here only at zero
# findings. Promoted 2026-07-02 (first pass): PIE, UP, C4, B023. Promoted
# 2026-07-02 (second pass, backlog burned to zero): SIM, PERF, RUF, PT, PLW
# (whole groups, with the documented ignores below) and B007/B904. Still
# ADVISORY-ONLY: B905/B008 (semantics per site) and NPY002 (legacy np.random
# -> Generator CHANGES RNG STREAMS — never mechanical).
# WON'T-GATE: B009/B010 — getattr/setattr-with-constant is this codebase's
# deliberate idiom for dynamic attributes on torch Modules / Popen tagging /
# duck-typed buffers; rewriting to direct attribute access trades an
# Any-launder for 21 basedpyright errors (tried and reverted).
select = [
  "E4", "E7", "E9", "F", "ARG", "B006", "B007", "B023", "B904", "G004",
  "ISC", "PLE", "PIE", "UP", "C4", "SIM", "PERF", "RUF", "PT", "PLW",
]
# E741: allow single-letter `l` — we use `w/d/l` for win/draw/loss counters
#       throughout the stats code, and renaming to `losses` would collide with
#       loss-function variables.
# ARG005: lambdas take interface-shaped args they often ignore; the old pylint
#       gate never checked lambdas either (parity).
# SIM105: try/except/pass in hot worker loops; contextlib.suppress adds
#       per-iteration overhead and hides intent no better.
# PERF203: try/except-in-loop is deliberate robustness in game loops.
# RUF001/2/3: em-dashes/unicode in strings+comments are house style.
# PLW2901: loop-var reassignment (line = line.strip()) is idiom here.
# PLW0603: module-singleton globals (warn-once flags) are deliberate.
ignore = [
  "E741", "ARG005", "SIM105", "PERF203", "RUF001", "RUF002", "RUF003",
  "PLW2901", "PLW0603",
]

[tool.vulture]
# Names that vulture can't see being used. Keep this list small and
# annotated — the goal is that every entry is a FP we've verified, not
# a convenience suppression.
#   AsyncBatchEvaluator     — used via stringified cast in gumbel_c.py
#   pairwise_lr/_momentum   — accepted as legacy kwargs in gpbt.py
#   n_walkers               — keyword-only param in the RebuildEvaluator
#                             Protocol __call__ (uci/engine.py); vulture
#                             can't see Protocol signatures being "used"
ignore_names = [
  "AsyncBatchEvaluator",
  "pairwise_lr",
  "pairwise_momentum",
  "n_walkers",
]

